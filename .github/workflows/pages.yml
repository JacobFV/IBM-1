# deploys site/ to github pages.  enable once in the repository settings
# (settings -> pages -> source: github actions), or:
#   gh api -X POST repos/JacobFV/IBM-1/pages -f build_type=workflow
name: pages
on:
  push:
    branches: [site, main, ibm-1-implementation]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
