id: ocmr
title: OCMR -- open-access multi-coil k-space dataset for cardiovascular MRI
provider: Ohio State University
citation: Chen et al., OCMR (v1.0) -- Open-Access Multi-Coil k-Space Dataset for Cardiovascular Magnetic
  Resonance Imaging. arXiv 2020.
urls:
- https://ocmr.info/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved. §49.2 records that the predecessor's attribution generator tracked each source's
    known bias and licence rather than treating atlas availability as correctness; that practice is preserved
    by leaving this unresolved and counting it.
binding: unbound
population:
  n: null
frames:
- scanner
- kspace
- coil_array
- cardiac_cycle
- respiratory_cycle
streams:
- name: moving_organ_kspace
  kind: measured
  via: null
  systematic_bias: '§52.12 asks for OCMR as a MOVING-ORGAN/RAW-K-SPACE STRESS TEST, and the reason is
    structural: when the object moves during sampling, the assumption that all k-space samples describe
    the same object fails. That is the general case -- brain imaging merely pretends otherwise -- and
    an acquisition model that cannot represent it is not modelling acquisition, it is modelling a still
    life.'
  notes: cardiac and respiratory motion give two nested physiological clocks that the acquisition must
    be binned against, which is exactly §33's native-clock problem in a domain where it cannot be ignored
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: free-breathing and gated cardiac cine raw k-space -- a MOVING ORGAN sampled continuously,
    so the object changes during the acquisition rather than being static
- name: gating_and_binning
  kind: measured
  via: null
  systematic_bias: retrospective binning against a physiological signal is a clock relation between the
    acquisition clock and the cardiac clock, fitted rather than triggered
  band_hz:
  - null
  - null
absent:
- brain_content
- biological_annotation
use:
- calibrate
