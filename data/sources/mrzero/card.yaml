streams:
- name: differentiable_bloch_simulation
  kind: measured
  via: null
  systematic_bias: 'THE closest existing thing to what §19 and §23 describe: a forward measurement physics
    that is differentiable end to end, so an internal representation can be learned THROUGH the acquisition
    rather than against a reconstructed image. §32''s no-universal-differentiability rule cuts the other
    way here -- differentiability is not required everywhere, and where a module already has it, that
    is a capability to exploit.'
  notes: the virtual phantom is a simplified spin system; diffusion, flow, motion and off-resonance are
    included only to the extent the simulator models them
  band_hz:
  - null
  - null
  temporal_support: the sequence timeline, differentiably
  spatial_support: a DIFFERENTIABLE Bloch simulation over a virtual phantom, so gradients flow from the
    reconstructed image back to the RF and gradient events that produced it
- name: pulseq_interoperability
  kind: measured
  via: null
  systematic_bias: it exports Pulseq, so a discovered sequence can be executed on hardware -- the simulated
    and the real acquisition are the same object
  band_hz:
  - null
  - null
