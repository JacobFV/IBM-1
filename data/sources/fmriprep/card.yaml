# ibm-1 source card. schema: data/schema/source.schema.json
id: fmriprep
title: fMRIPrep -- robust preprocessing pipeline for functional MRI
provider: Poldrack lab / NiPreps
citation: 'Esteban et al., fMRIPrep: a robust preprocessing pipeline for functional MRI. Nature Methods
  2019.'
urls:
- https://fmriprep.org/
access: reference
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved pending inspection of the distributed licence file. Code licence and bundled-data
    licence frequently differ and must be resolved separately.
binding: unbound
population:
  n: null
frames:
- subject_native
- fsaverage
- MNI152
- fs_LR
streams:
- name: preprocessing_pipeline
  kind: measured
  via: null
  systematic_bias: 'The de-facto standard, which makes its CHOICES the field''s defaults: susceptibility
    distortion correction method, registration cost function, confound definitions. §57''s preprocessing_lineage
    field exists so those choices are recoverable from a product rather than assumed. fMRIPrep writes
    a boilerplate methods description, which is the best-behaved instance of that requirement in the ecosystem.'
  notes: normalisation to a template is a coordinate-frame-graph edge with a residual that fMRIPrep computes
    and does not propagate into downstream uncertainty
  band_hz:
  - null
  - null
  temporal_support: preserves the input TR; every step RESAMPLES, and resampling is applied once at the
    end in fMRIPrep's design, which is a deliberate and unusual choice worth noting
  spatial_support: 'BIDS in, BIDS-derivatives out: motion-corrected, distortion-corrected, optionally
    normalised BOLD with a confound table, in subject and template spaces'
- name: confound_regressors
  kind: measured
  via: null
  systematic_bias: 'A CONFOUND TABLE IS NOT A DENOISING DECISION. fMRIPrep deliberately computes confounds
    and does not apply them, which is the right shape: regressing out physiological fluctuation would
    remove exactly the vascular state §16-17 want modelled. Which confounds are applied is the user''s
    choice and must be recorded.'
  band_hz:
  - null
  - null
- name: spatial_transforms
  kind: measured
  via: null
  systematic_bias: the transform chain is emitted explicitly and composably, which is what a coordinate-frame
    graph needs from a preprocessing tool
  band_hz:
  - null
  - null
absent:
- uncertainty_propagation
- raw_kspace
- biological_content
use:
- calibrate
- surrogate
forbidden:
- fmriprep/* -> runtime dependency in a WIN query
split:
  group_by:
  - participant
