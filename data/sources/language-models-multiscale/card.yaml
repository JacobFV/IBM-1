# ibm-1 source card. schema: data/schema/source.schema.json
id: language-models-multiscale
title: Language models at token, syntactic, semantic and discourse scales
provider: multiple -- the language model family and structured linguistic annotators
citation: PROMPT.md §53.3, 'language models at token, syntactic, semantic, and discourse scales'.
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Model weights, code and training data commonly carry THREE different licences, and a permissive
    code licence says nothing about the weights. Unresolved.
binding: unbound
population:
  n: null
frames:
- token_sequence
- parse_structure
- discourse_graph
streams:
- name: multiscale_linguistic_structure
  kind: measured
  via: null
  systematic_bias: '§48 and registry/README: TEACHER IS NOT OBSERVATION. This model''s representations
    are a discrepancy-aware forcing CANDIDATE, never automatically a subject likelihood. §29: influence
    starts low and is earned through held-out prediction. §53.3: the required output is NOT one flat embedding.
    A model must expose MULTISCALE, SPATIAL, TEMPORAL and EVENT-STRUCTURED state suitable for interaction
    with SPECIFICALLY ADDRESSED cortical supports. A single pooled vector cannot address a support. §58.4
    asks explicitly for SEPARATE phonetic, acoustic, lexical, semantic and discourse forcing interactions
    -- not one language head. That separation is only possible if the linguistic representation itself
    is separated by scale, which is what this card records as a requirement on any language model entering
    the system. §29 keeps all of it at low authority until held-out prediction earns more.'
  notes: 'syntactic and discourse annotations are theory-laden: a dependency parse presupposes a grammatical
    framework, and a discourse relation presupposes a taxonomy'
  band_hz:
  - null
  - null
  temporal_support: tokens and clause boundaries are not time; alignment to a neural time series requires
    word onsets from a separate source and carries that alignment's error
  spatial_support: 'FOUR DIFFERENT LEVELS OF STRUCTURE over the same text: sub-word tokens, syntactic
    constituency or dependency, propositional semantics, and discourse-level relations spanning sentences.
    §53.3 lists them separately because they are separate, and a single embedding conflates them'
- name: discourse_and_coreference
  kind: measured
  via: null
  systematic_bias: discourse structure spans minutes, which is the timescale at which temporal-receptive-window-maps
    says higher cortex integrates -- so it is the linguistic variable that could in principle explain
    long-timescale responses that word-level variables cannot
  band_hz:
  - null
  - null
absent:
- uncertainty
- time_alignment
- theory_neutrality
