# ibm-1 source card. schema: data/schema/source.schema.json
id: sleep-edfx
title: Sleep-EDF Expanded (Sleep-EDFx) -- polysomnography with expert sleep staging
provider: PhysioNet
citation: Kemp et al., Analysis of a sleep-dependent neuronal feedback loop. IEEE TBME 2000; PhysioNet
  Sleep-EDF Expanded.
urls:
- https://physionet.org/content/sleep-edfx/1.0.0/
access: held
licence:
  name: ODbL 1.0 (PhysioNet states an open licence)
  redistribution: unresolved
  commercial: permitted
  notes: 'PhysioNet states an open database licence; share-alike implications not independently verified
    here. Resolved from the named licence''s own terms: ODbL 1.0 PERMITS COMMERCIAL USE and requires share-alike,
    which was already recorded. The share-alike is the operative term for us -- a released derivative
    of this database carries it. dua_required false because this is an open-access PhysioNet database,
    not a credentialed one, and it is held here from an anonymous fetch.'
binding: bound
population:
  n: 78
  hierarchy:
  - participant
  - session
  notes: 'HELD: the sleep-cassette arm only -- 153 PSG recordings from 78 participants, 3,470.20 h, measured
    2026-08-15 from the EDF headers (records x record duration). That re-derives the predecessor''s 3,470.24
    h from the files themselves. By hours it is the largest held source in the store by two orders of
    magnitude.'
frames:
- eeg_electrode_pair
- head
- torso
streams:
- name: eeg_2ch
  kind: measured
  via: &id001
  - em_generation
  - em_coupling
  - device_coupling
  observation_chain: oriented cortical current-source state -> quasi-static volume conduction through
    brain, CSF, skull and scalp -> electrode contact geometry and impedance -> reference montage -> amplified,
    filtered, sampled voltage
  confounds:
  - 'ocular: blink and saccade corneo-retinal potentials'
  - 'cardiac: ECG contamination and pulse artifact'
  - 'muscle: temporalis, frontalis and neck EMG'
  - electrode impedance drift, motion and bridging
  - line noise and amplifier drift
  - reference-electrode activity, which is never inactive
  - sweat artifact and electrode drift over a full night
  - sleep-position changes altering electrode contact
  systematic_bias: Two channels give essentially no spatial information. What this source supplies is
    very long, slowly-varying STATE trajectories -- the slow axis §52.15 cares about.
  notes: Fpz-Cz and Pz-Oz only.  two bipolar derivations cannot localise anything; what they constrain
    is the spectrum of whatever generators project onto those axes, which is exactly what an aperiodic-plus-peak
    prior is about.
  band_hz:
  - 0.5
  - 45.0
  temporal_support: EEG at 100 Hz; sleep stages annotated in 30-second epochs. The 30 s epoch is a SCORING
    convention, not a property of sleep, and it discretises a continuous process
  spatial_support: TWO EEG channels only (Fpz-Cz and Pz-Oz). The spatial support is essentially nil --
    this source constrains state, not location
  constrains:
  - device.contact_potential
  rate_hz: 100.0
  frame: eeg_cap
  units: V
  support: sensor_array
- name: expert_hypnograms
  kind: context
  via: null
  systematic_bias: human expert scoring with known inter-rater agreement around 80-90 percent. The hypnogram
    is a LABEL produced by a person applying a rulebook, not a measurement, and it is the ceiling of any
    model fitted to it
  band_hz:
  - 0.0
  - 0.005
  constrains: []
  notes: 30 s expert stage labels.  a label is not brain state -- it is a human annotation of one -- so
    it binds to no component and is carried as a stratifier, which is how a state-dependent parameter
    gets fitted at all.
- name: respiration_and_temperature
  kind: measured
  via:
  - thermal_diffusion
  observation_chain: thoracic/abdominal circumference or airflow -> transducer -> sampled waveform
  confounds:
  - sensor placement and contact quality
  - motion artifact
  - respiratory-cardiac cross-coupling that makes the two streams non-independent
  systematic_bias: Slow physiological state across a whole night, which pairs with §52.15.
  band_hz:
  - 0.0
  - 0.02
  constrains:
  - thermal.temperature
  frame: body
  notes: 'narrowed to temperature alone.  the archive bundles oro-nasal airflow with rectal temperature,
    but they are two components with bandwidths two decades apart, and the airflow half is already carried
    by the `respiration` stream -- binding both here would double-count the same measurement against blood.oxygenation.  rectal
    temperature is also a poor proxy for brain temperature: it lags by tens of minutes and misses selective
    brain cooling entirely, so this constrains the slow drift and nothing faster.'
- name: eog_emg
  kind: measured
  via:
  - em_generation
  - em_coupling
  - device_coupling
  band_hz:
  - 0.5
  - 45.0
  constrains:
  - device.contact_potential
  frame: eeg_cap
  notes: 'reclassified from imposed: these are recorded potentials, not anything the experimenter set.  the
    migration inherited ''imposed'' from a role tag, which is exactly the conflation the measured/imposed
    split exists to prevent.'
- name: eog
  kind: measured
  via: *id001
  band_hz:
  - 0.5
  - 45.0
  constrains:
  - device.contact_potential
  rate_hz: 100.0
  frame: eeg_cap
  notes: the dominant confound for the frontal derivation, bound to the same component so it can be modelled
    rather than regressed away silently.
- name: emg_chin
  kind: measured
  via:
  - effector_activation
  band_hz:
  - 10.0
  - 45.0
  constrains:
  - effector.activation
  rate_hz: 100.0
  frame: body
- name: respiration
  kind: measured
  via:
  - tissue_exchange
  band_hz:
  - 0.0
  - 0.5
  constrains:
  - blood.oxygenation
  frame: body
- name: body_temperature
  kind: measured
  via:
  - thermal_diffusion
  band_hz:
  - 0.0
  - 0.02
  constrains:
  - thermal.temperature
  frame: body
- name: event_markers
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.005
  constrains: []
  notes: lights-off/lights-on markers.  they bound the recording rather than constraining state, so they
    bind to nothing deliberately.
absent:
- fmri
- meg
- high_density_eeg
- individual_anatomy
- ecg_in_all_records
- world_stimulus
use:
- evaluate
- fit
forbidden:
- sleep-edfx/* -> any spatially resolved cortical state
- sleep-edfx/expert_hypnograms -> a ground-truth state label
- sleep-edfx/* -> world-model forcing parameters
split:
  group_by:
  - participant
  - session
provenance:
  imported_from: win-registry
  card: sleep-edfx
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
