id: dundee
title: Dundee Corpus -- eye-tracking during newspaper-text reading
provider: University of Dundee
citation: Kennedy and Pynte, Parafoveal-on-foveal effects in normal reading. Vision Research 2005.
access: priority
licence:
  name: unresolved
  redistribution: prohibited
  commercial: unresolved
  notes: Historically distributed by request rather than open download; the newspaper texts are third-party
    copyright. Redistribution not available; other terms unresolved.
binding: unbound
population:
  n: 20
  hierarchy:
  - participant
  notes: '10 English and 10 French readers of newspaper editorials. An old corpus and a heavily reused
    benchmark, which is itself a leakage concern: many published language-model reading-time results are
    fitted on it.'
frames:
- eye
- display
- text_layout
streams:
- name: fixation_measures
  kind: imposed
  via: null
  systematic_bias: 20 readers, older instrumentation, and so widely used as a benchmark that its independence
    from any modern language model's training or tuning is not assured
  band_hz:
  - null
  - null
  temporal_support: self-paced reading
  spatial_support: early-generation eye tracker; multi-line newspaper text
- name: text_materials
  kind: measured
  via: null
  band_hz:
  - null
  - null
absent:
- any_neural_measurement
- audio
- modern_calibration_records
requires:
- geometry: retinal-world-geometry
  severity: blocking
  without_it: A screen-coordinate gaze trace is not retinal input. Without the per-episode display, eye
    and gaze geometry there is no map from what was on the screen to what fell on the retina, and treating
    the stimulus as the input is exactly the modelling error retinalisation exists to prevent.
use:
- fit
forbidden:
- dundee/* -> any cortical state directly
- dundee/* -> a clean held-out evaluation claim
split:
  group_by:
  - participant
  - stimulus
provenance:
  imported_from: win-registry
  card: dundee
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
origin_kind: sourced
release: unresolved
provenance_note: provider identified; a direct url is not recorded
provenance_traced_from: a peer programme's card for the same corpus, which read the origin off the held
  dataset_description. the ORIGIN is recorded here; the peer is not cited, because a courier is not a
  source
