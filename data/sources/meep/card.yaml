  systematic_bias: The head-modelling literature assumes quasi-statics throughout. A full-wave solver
    is the control that could show the assumption failing -- at the frequencies and dimensions involved
    it is expected to hold, and an expected result from a method that COULD have disagreed is worth more
    than the assumption alone.
  notes: dispersive tissue models and grid staircasing dominate the difference at tissue boundaries, which
    is where the interesting fields are
  band_hz:
  - null
  - null
  temporal_support: explicit FULL-WAVE time stepping at the Courant limit -- the regime where the quasi-static
    approximation used by every TMS/tES solver can be checked rather than assumed
  spatial_support: Yee-grid finite differences over a rectilinear volume; staircased tissue boundaries
    unless subpixel averaging is used
