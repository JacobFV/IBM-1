requires:
- geometry: vascular-products
  severity: blocking
  without_it: These are images of vasculature, not vasculature. Segmentation, centreline extraction and
    graph construction are the manufacturing step, and until the vascular product performs it with its
    assumptions and uncertainty recorded, there is no vessel geometry here that anything can be addressed
    to.
use:
- fit
- prior
forbidden:
- vessap/* -> a human vascular measurement
- vessap/* -> a commercial artifact (non-commercial term)
- vessap/* -> a segmented radius treated as a perfused lumen diameter
