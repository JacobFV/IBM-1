streams:
- name: tms_eeg
  kind: measured
  via:
  - em_generation
  - em_coupling
  - device_coupling
  observation_chain: oriented cortical current-source state -> quasi-static volume conduction through
    brain, CSF, skull and scalp -> electrode contact geometry and impedance -> reference montage -> amplified,
    filtered, sampled voltage
  confounds:
  - 'ocular: blink and saccade corneo-retinal potentials'
  - 'cardiac: ECG contamination and pulse artifact'
  - 'muscle: temporalis, frontalis and neck EMG'
  - electrode impedance drift, motion and bridging
  - line noise and amplifier drift
  - reference-electrode activity, which is never inactive
  - 'THE AUDITORY AND SOMATOSENSORY CO-STIMULATION IS NOT A SMALL CORRECTION: sham studies show much of
    a conventional TEP after ~60 ms is explicable by click and scalp sensation alone'
  - amplifier saturation and recharge artifact in the first milliseconds
  - cranial muscle artifact lasting tens of milliseconds at lateral sites
  systematic_bias: '§52.13: REQUESTED SETTINGS, DELIVERED PHYSICAL FIELD, PERIPHERAL CO-STIMULATION and
    CANDIDATE NEURAL RESPONSE are four different things. Collapsing them is how a coil position becomes
    a claim about cortex. Without a sham arm, the TEP here is a response to a multisensory event that
    includes a magnetic pulse.'
  notes: 'scalp EEG at kHz with TMS pulses at millisecond precision, and MRI in a SEPARATE session.  the
    rate is given only as ''kHz'' and the bytes are not held, so 250 Hz is a conservative ceiling to be
    re-read from the deposit.  FOUR DIFFERENT THINGS MUST NOT BE COLLAPSED here: the requested settings,
    the delivered physical field, the peripheral co-stimulation, and the candidate neural response.  collapsing
    them is how a coil position becomes a claim about cortex, and without a sham arm the response recorded
    here is to a multi-modal event rather than to an induced field.'
  band_hz:
  - 0.0
  - 250.0
  temporal_support: TMS pulses at millisecond precision; EEG/EMG at kHz; MRI in a separate session
  spatial_support: TMS coil pose relative to the head, and the induced electric field it produces in the
    brain -- which is a FIELD over the whole head, not a point at the coil's centre
  constrains:
  - device.contact_potential
  frame: eeg_cap
  support: sensor_array
  units: V
- name: emg_mep
  kind: measured
  via:
  - effector_activation
  observation_chain: motor-unit action potentials -> muscle and subcutaneous volume conduction -> surface
    or intramuscular electrode -> sampled voltage
  confounds:
  - background muscle activation, which changes MEP amplitude several-fold
  - spinal excitability, which the MEP includes and the cortex does not control alone
  - coil drift between trials
  systematic_bias: The MEP is the one TMS readout with an unambiguous physical endpoint -- a muscle contracted
    -- which is why motor threshold is the field's dosing unit. It is a CORTICOSPINAL measure, not a cortical
    one.
  band_hz:
  - 10.0
  - 100.0
  constrains:
  - effector.activation
  notes: 'THE MEP IS THE ONE TMS READOUT WITH AN UNAMBIGUOUS PHYSICAL ENDPOINT -- a muscle contracted
    -- which is why motor threshold is the field''s dosing unit.  bound to `effector.activation` through
    `effector_activation`, as sleep-edfx binds its chin EMG; the 10 Hz floor is where a surface EMG stops
    being movement artifact and the 100 Hz ceiling is where the component is declared meaningful.  IT
    IS A CORTICOSPINAL MEASURE, NOT A CORTICAL ONE: everything between motor cortex and the muscle is
    in it.'
- name: coil_positions
  kind: context
  via: null
  systematic_bias: §56.4 asks for TMS winding/current geometry as a constructed object; a navigated coil
    pose is the boundary condition that object needs
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry, not evidence.  it supplies a support that a materialization is indexed over
    and constrains no ibm component; letting it update biology would turn a reconstruction into a measurement.  a
    NAVIGATED coil pose, which is the boundary condition a constructed TMS winding/current object would
    need -- this is the geometry, not the field.  it is context rather than imposed because a pose is
    where the coil was, and the quantity a materialization conditions on is the field that pose and that
    current produced, which is MODELLED and never measured.  the model''s discrepancy is exactly the difference
    between a coil-position claim and a cortical-dose claim.'
- name: t1w
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry.  the anatomical volume the supports are indexed over.  as ds004024''s card
    records, a T1 would genuinely bind to `material.conductivity` and `material.mass_density` once a head
    model exists to put the values into -- but a material value asserted for a conductor nobody can address
    is not evidence, so it stays context until the support bank exists.  acquired in a separate session,
    which is what makes the coil pose referable to anatomy at all.'
- name: stimulation_parameters
  kind: context
  via: null
  band_hz:
  - null
  - null
  constrains: []
  notes: context, and this is the ds004024 rule.  the trigger times mark a real intervention, so `imposed`
    is the obvious reading -- but an imposed stream is CONDITIONED ON, and what a materialization would
    condition on is the DELIVERED FIELD, not a machine setting.  binding a pulse mark to `device.coil_current`
    without a recorded coil pose, winding and waveform would hand the model an amplitude and a location
    nobody measured, dressed as a boundary condition.  intensity and timing are recorded; the winding
    geometry and the delivered field are not.
absent:
- delivered_field_measurement
- sham_arm
- auditory_masking_verification
- fmri
