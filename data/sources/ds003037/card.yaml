requires:
- geometry: device-geometry
  severity: blocking
  without_it: 'The delivered quantity is an induced electric field throughout the head, set by the coil''s
    winding geometry and its pose relative to the anatomy. This card is the best case in the corpus for
    the pose half -- it is NAVIGATED and an individual T1 exists -- and the winding half is still missing,
    so the field remains modelled rather than known. KEPT BLOCKING and scoped to no streams, the corpus
    idiom for a requirement nothing currently claims against: `tms_eeg` binds to `device.contact_potential`
    on `sensor_array`, `emg_mep` to `effector.activation` on `motor_units`, and every stimulation stream
    is context precisely because the delivered field is not recorded. Re-scope it the moment a stream
    here attributes anything to `electromagnetic.efield`.'
  for_streams: []
  substitute: A manufacturer winding model with the navigated pose. That is a datasheet geometry rather
    than this coil's, and its error propagates directly into every predicted cortical dose.
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
use:
- calibrate
- fit
forbidden:
- ds003037/* -> a delivered cortical field or dose (the field is modelled, never measured)
- ds003037/tms_eeg -> a purely transcranial evoked response (no sham arm; the response is to a multi-modal
  event)
- 'ds003037/emg_mep -> a cortical measure (an MEP is corticospinal: everything between motor cortex and
  the muscle is in it)'
