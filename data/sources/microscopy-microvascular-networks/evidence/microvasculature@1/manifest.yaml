# what this recipe produced, from which raw source.  committed.
recipe: microvasculature
version: 1
produced_at: '2026-09-05'
from_raw:
  vesselgraph-mouse: nine whole mouse brains, three strains x three animals, every edge and
    node table read in full -- 41.8 million segments over 2.4 GiB of csv.  the three C57BL_6-K
    graphs and the five synthetic graphs in the same download table were deliberately excluded
  microscopy-microvascular-networks: three cortical blocks (NW1-3, Zenodo 269650) with vessel-type
    labels, per-segment centreline polylines and a solved pressure and flow field; 45,742
    segments over 4.3 mm^3.  the MVN networks of Zenodo 1306230 are held and not used -- they
    are the same geometry with a different rheology and would not be an independent animal
  venat: 'the complete figshare release at 0.5 mm in MNI: mean AND standard-deviation maps
    for vein diameter, curvature and torsion on a 12,427-voxel population skeleton, plus the
    partial-volume maps'
checksums: deferred -- each raw root records its own
outputs:
- measured.json
