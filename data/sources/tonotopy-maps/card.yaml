streams:
- name: best_frequency_maps
  kind: measured
  via: null
  systematic_bias: 'The auditory analogue of retinotopy, and much less well determined: the number and
    orientation of tonotopic gradients in human auditory cortex is genuinely CONTESTED between laboratories,
    with different studies reporting different gradient layouts from comparable data. That disagreement
    is the honest state of the field and must not be resolved by picking one map.'
  notes: frequency preference measured with tones differs from that measured with natural sounds; the
    stimulus determines the map
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: cortical maps of preferred sound frequency in auditory cortex, from fMRI responses
    to tone or noise stimuli sweeping frequency
- name: frequency_axis_as_support_coordinate
  kind: measured
  via: null
  systematic_bias: "a continuous frequency coordinate over cortex is the auditory counterpart of retinotopic\
    \ coordinates and is what \xA756.1's tonotopic overlay needs"
  band_hz:
  - null
  - null
