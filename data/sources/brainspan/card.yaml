# ibm-1 source card. schema: data/schema/source.schema.json
id: brainspan
title: BrainSpan -- Atlas of the Developing Human Brain
provider: Allen Institute for Brain Science, with Yale, USC, Harvard Medical School/MIT, UCLA and UT Southwestern;
  funded by NIMH
citation: Governed by the Allen Institute Citation Policy, which requires citation of the primary publication
  where one exists. A single canonical dataset citation string is unresolved.
urls:
- https://www.brainspan.org/
- https://alleninstitute.org/citation-policy/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: prohibited
  notes: 'No SPDX identifier. Allen Institute Terms of Use, verbatim: you may use, copy, distribute, publicly
    perform, publicly display, or create derivative works of the Content for research or other noncommercial
    purposes; you may not redistribute the Content or Improvements for commercial purposes without written
    permission. NON-COMMERCIAL IS ESTABLISHED. No registration for the open web resource. A CONTROLLED-ACCESS
    counterpart exists at EGA and dbGaP (phs000755) whose terms were not verified.'
binding: bound
population:
  n: null
  hierarchy:
  - participant
  notes: The developmental transcriptome is reported in secondary sources as 196 tissue samples from 13
    donors; that figure was NOT confirmed on a fetched Allen page and is not recorded as fact. The prenatal
    LMD microarray covers 4 brain specimens at 15-21 post-conceptual weeks across about 300 structures.
    Fibre-tract annotations cover 22 major tracts across 8 developmental stages (14, 17, 19 and 37 post-conceptual
    weeks, then 3, 8, 15 and 32 years). DONOR COUNTS ARE TINY AND THE DEVELOPMENTAL AXIS IS SAMPLED, NOT
    TRACKED.
frames:
- structure_ontology
- specimen_native
- developmental_reference_atlas
streams:
- name: developmental_regional_transcriptome
  kind: context
  via: null
  systematic_bias: Regional and developmental expression constrains which molecular machinery -- and therefore
    which interaction classes -- is available where and when. With roughly a dozen donors, between-donor
    variance is essentially unestimable and any regional difference is confounded with donor. Post-mortem
    interval, agonal state and RNA integrity vary and all affect measured expression.
  notes: 'context, and an ONTOLOGY GAP rather than an undecided stream.  transcript abundance, protein
    score and cell-type proportion are not registered components and none of the nearest names fits: `extracellular.*`
    are neurotransmitter concentrations in the interstitium, `structural.*` are densities of synapses,
    dendrites, axons and myelin.  molecular composition constrains WHICH interaction classes are plausible
    where, which is a `prior` over model class, and it is never evidence about a state.'
  band_hz:
  - 0.0
  - 0.001
  temporal_support: 'DEVELOPMENTAL STAGE IS THE ONLY TIME AXIS and it is cross-sectional: each donor contributes
    one point, so a developmental trajectory here is assembled from different individuals'
  spatial_support: structure-level sampling by laser microdissection and by dissection, plus in situ hybridisation
    images, MRI and DTI, and 3D fibre-tract annotations. THE SAMPLING UNIT IS A DISSECTED STRUCTURE, so
    expression is an average over whatever tissue the dissection captured
  constrains: []
- name: developmental_fibre_tract_annotations
  kind: context
  via: null
  systematic_bias: Hand-annotated tract geometry at eight developmental stages is a rare constraint on
    when a pathway exists at all. It is DERIVED GEOMETRY from a handful of specimens and is labelled derived
    forever.
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: context, and this is the case the schema singles out.  a connectome matrix is a TOPOLOGY ASSERTION
    -- which supports are taken to interact -- produced by somebody's reconstruction pipeline.  ARCHITECTURE.md
    §3 makes interaction topologies a separate primitive from state, and binding a matrix as `measured`
    would let one pipeline's tractography contribute a likelihood about tissue.  hand-annotated tract
    geometry at eight developmental stages is a rare constraint on WHEN a pathway exists at all, and it
    is derived geometry from a handful of specimens.
