streams:
- name: t1w
  kind: measured
  via: null
  observation_chain: tissue proton density and T1 -> sequence-specific contrast -> k-space acquisition
    -> reconstruction -> voxel intensity; intensity is not a tissue parameter until an explicit relaxometry
    model is applied
  confounds:
  - B1+ transmit inhomogeneity
  - B0 off-resonance
  - the fitted signal model's own misspecification
  - motion between the volumes that enter one fit
  - scanner vendor differences that survive harmonisation
  systematic_bias: Vendor and site effects are comparable in size to developmental effects at this age
    range.
  band_hz:
  - null
  - null
  temporal_support: TR 0.8 s BOLD; annual longitudinal follow-up
  spatial_support: 1 mm structural; 1.7 mm diffusion; 2.4 mm BOLD; harmonised across 21 sites and 3 vendors
