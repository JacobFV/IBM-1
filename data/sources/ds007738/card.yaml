streams:
- name: fnirs_whole_head
  kind: measured
  via: null
  observation_chain: neural activity -> haemodynamics -> HbO/HbR concentration change -> wavelength-dependent
    attenuation along a curved, partial-volume-weighted photon path through scalp, skull, CSF and cortex
    -> source-detector channel intensity -> modified Beer-Lambert concentration estimate
  confounds:
  - extracerebral scalp haemodynamics, which dominate the short channels and leak into long ones
  - systemic blood pressure, heart rate and Mayer waves
  - optode-scalp coupling and hair-induced attenuation
  - differential pathlength factor assumed rather than measured
  systematic_bias: Whole-head coverage makes the extracerebral component estimable across the scalp rather
    than assumed constant.
  notes: channel sensitivity depends on individual head geometry and hair; without a photon-transport
    model over the individual head, channel-to-cortex mapping is nominal
  band_hz:
  - null
  - null
  temporal_support: fNIRS at ~10 Hz; eye tracker at its own rate; continuous multi-talker audio
  spatial_support: whole-head optode array; each channel's sensitivity is a banana-shaped volume between
    one source and one detector, not a point
