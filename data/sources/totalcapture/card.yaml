id: totalcapture
title: TotalCapture -- synchronised multi-view video, IMU and mocap
provider: University of Surrey
citation: 'Trumble et al., Total Capture: 3D Human Pose Estimation Fusing Video and Inertial Sensors.
  BMVC 2017.'
urls:
- https://cvssp.org/data/totalcapture/
