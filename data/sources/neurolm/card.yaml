# ibm-1 source card. schema: data/schema/source.schema.json
id: neurolm
title: NeuroLM -- universal multi-task foundation model for EEG with language
provider: Shanghai Jiao Tong University and collaborators
citation: 'Jiang et al., NeuroLM: A Universal Multi-task Foundation Model for Bridging the Gap between
  Language and EEG Signals. ICLR 2025.'
urls:
- https://github.com/935963004/NeuroLM
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Model weights, code and training data commonly carry THREE different licences, and a permissive
    code licence says nothing about the weights. Unresolved.
binding: unbound
population:
  n: null
frames:
- eeg_cap
streams:
- name: eeg_as_language_tokens
  kind: measured
  via: null
  systematic_bias: '§48 and registry/README: TEACHER IS NOT OBSERVATION. This model''s representations
    are a discrepancy-aware forcing CANDIDATE, never automatically a subject likelihood. §29: influence
    starts low and is earned through held-out prediction. §53.2: the test is NOT leaderboard accuracy.
    It is whether a representation survives new montages, devices, subjects, tasks and physically different
    observation supports WITHOUT SILENTLY LEARNING CHANNEL IDENTITY AS ANATOMY. Casting EEG as tokens
    in a language model is an architectural convenience, not a claim that brain signals have linguistic
    structure. The risk specific to this design is that a language model''s PRIOR fills in what the EEG
    does not determine, producing fluent outputs that are underdetermined by the data -- and §29''s rule
    that abstract-cognition claims start at low authority is the relevant guard.'
  notes: a generative language decoder can produce plausible text from an uninformative neural input;
    distinguishing that from decoding requires a control that could fail
  band_hz:
  - null
  - null
  temporal_support: resampled and patched
  spatial_support: EEG tokenised into a discrete vocabulary and fed to a LANGUAGE MODEL alongside text
    -- EEG is treated as a foreign language
absent:
- electrode_geometry
- forward_model
- uncertainty
- hallucination_controls
requires:
- geometry: device-geometry
  severity: degrading
  without_it: This model's channel axis is a set of names, not a set of positions -- the channel-identity
    problem exactly. Its representation can be computed without any geometry, but relating it to a cortical
    support, or transferring it to a montage it was not trained on, requires the electrode or sensor geometry
    that the name stands in for.
  substitute: Channel-name matching, which silently asserts that two electrodes sharing a label sat in
    the same place on two different heads.
use:
- distil
forbidden:
- neurolm/* -> decoded-content claims without a control for the language prior
- neurolm/* -> observation-role likelihoods
- neurolm/* -> B-WIN's state ontology or support definitions
split:
  group_by:
  - participant
  - stimulus
provenance:
  imported_from: win-registry
  card: neurolm
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
distillation:
  reported_accuracy:
    metric: unresolved
    value: null
    on_streams:
    - eeg_as_language_tokens
    source: not yet extracted from the paper
    verified: false
  precision_model:
    form: unresolved
    ood_inflation_prior: unset -- must be a prior, not a constant
    error_rank: unresolved -- a teacher's residuals covary across everything it writes
    notes: distilled values enter as evidence and must carry calibrated precision; see ARCHITECTURE.md,
      distillation precision
    correlated_fraction: null
    effective_constraints: null
