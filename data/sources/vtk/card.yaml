streams:
- name: attributed_geometry_data_model
  kind: measured
  via: null
  systematic_bias: §4 requires support primitives that carry ORIENTATION, EXTENT and a kernel that need
    NOT be gaussian, and §4a requires every derived geometry to carry its provenance. VTK's model -- geometry
    plus arbitrary named per-element arrays -- accommodates that without forcing a fixed schema, which
    is why it is the interchange layer §54.4 recommends rather than a mesh format.
  notes: a general container imposes no semantics; what an array MEANS is the card's problem, not the
    format's
  band_hz:
  - null
  - null
  temporal_support: supports time-varying data as a sequence of datasets
  spatial_support: meshes, point clouds, volumes and fields with ARBITRARY NAMED ARRAYS attached to points
    or cells -- which is the data model a g-splat with per-element orientation, extent and state actually
    needs
- name: geometric_filters
  kind: measured
  via: null
  systematic_bias: decimation, smoothing and resampling all CHANGE the geometry; §4a requires the change
    to be recorded as a derivation step rather than applied silently
  band_hz:
  - null
  - null
