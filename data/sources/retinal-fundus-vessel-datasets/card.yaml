  - null
- name: optic_disc_annotations_partial
  kind: measured
  via: null
  band_hz:
  - null
  - null
- name: image_quality_labels_partial
  kind: measured
  via: null
  band_hz:
  - null
  - null
absent:
- fov_masks_for_stare_and_chase_db1
- drive_test_annotations_on_the_canonical_host
- drive_second_observer_masks_on_the_canonical_host
- flow
- depth
- photometric_calibration
- artery_vein_labels_in_most_sets
requires:
- geometry: vascular-products
  for_streams:
  - annotated_retinal_vasculature
  severity: blocking
  without_it: These are images of vasculature, not vasculature. Segmentation, centreline extraction and
    graph construction are the manufacturing step, and until the vascular product performs it with its
    assumptions and uncertainty recorded, there is no vessel geometry here that anything can be addressed
    to.
use:
- evaluate
- fit
forbidden:
- retinal-fundus-vessel-datasets/* -> an artifact, before the specific dataset's terms are resolved
- retinal-fundus-vessel-datasets/* -> a segmentation score reported above the measured inter-observer
  ceiling
- retinal-fundus-vessel-datasets/* -> a three-dimensional vascular claim from a projection
split:
  group_by:
  - participant
  - device
  - site
provenance:
