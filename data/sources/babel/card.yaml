  systematic_bias: ACTION LABELS ARE A THEORY OF THE MOVEMENT, assigned by annotators after the fact.
    Where one action ends and the next begins is an annotator judgement, and §29's rule that abstract
    structure enters at low authority applies directly. The frame-level granularity makes the boundaries
    look more precise than they are.
  band_hz:
  - null
  - null
  temporal_support: annotation intervals at sub-second resolution over the parent motion's clock
  spatial_support: temporal intervals over AMASS motion sequences, with FRAME-LEVEL as well as sequence-level
    labels
- name: action_taxonomy
  kind: measured
  via: null
  systematic_bias: a 250-category action vocabulary is a useful shared language and is not a claim about
    how movement is organised
  band_hz:
  - null
  - null
