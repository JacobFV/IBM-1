    this a perturbational source as well as a pharmacological one.
frames:
- channel_label
streams:
- name: sedation_eeg_with_awakening_report
  kind: measured
  via: null
  observation_chain: post-synaptic currents in spatially aligned pyramidal populations -> volume conduction
    through brain, CSF, skull and scalp -> potential difference between an electrode and a reference ->
    amplifier gain, filtering and group delay -> sampled voltage. The label of interest -- whether the
    participant was experiencing anything -- comes from a RETROSPECTIVE VERBAL REPORT after awakening
    from sedation, which is the weakest link in the chain and is several inferential steps from the recorded
    signal
  confounds:
  - ocular and blink artefact
  - muscle (EMG) contamination
  - cardiac field and pulse artefact
  - electrode impedance drift and movement artefact
  - the reference choice, which is a montage operator and not a property of the brain
  - line noise and its harmonics
  - report failure under sedation is not the same as absence of experience, and the design cannot distinguish
    them
  - memory consolidation is itself impaired by propofol, so a no-report trial may be an amnesia trial
  - the awakening procedure changes state before the report is given
  - propofol's direct effects on EEG spectra dominate any content-related difference
  systematic_bias: 'This is the sharpest instance of the abstract-cognition authority problem in the registry:
    the label is a report about a state the reporter could not observe, obtained after the state ended,
    from a drug condition that impairs the reporting mechanism.'
  band_hz:
  - null
  - null
  temporal_support: sedation epochs punctuated by SCHEDULED AWAKENINGS, each followed by a verbal report.
    The report's clock is the participant's recollection of a period they were not able to timestamp,
    which is a fitted and very uncertain relation to the recorded epoch
  spatial_support: scalp EEG; montage per channels.tsv
- name: tms_evoked_eeg_under_sedation
  kind: measured
  via: null
  observation_chain: coil current -> induced electric field, computed rather than measured and not computed
    here -> cortical activation -> post-synaptic currents -> volume conduction -> scalp potential recorded
    through the amplifier's post-pulse recovery transient
  confounds:
  - amplifier saturation and recovery in the first tens of milliseconds
  - auditory evoked potential from the coil click, which sedation itself attenuates -- so a sedation effect
    on the TEP is partly a sedation effect on hearing
  - somatosensory evoked potential from scalp afferents
  - muscle artefact
  systematic_bias: A perturbational measure under graded pharmacological state change is exactly the design
    obj-acq-wave4-perturbational wants; the release carries no coil pose, no head model and no intensity,
    so nothing here constrains a field.
  band_hz:
  - null
  - null
