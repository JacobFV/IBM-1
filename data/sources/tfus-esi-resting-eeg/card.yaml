  hierarchy:
  - participant
  - session
  - run
  notes: 'n unresolved. §51.4 item 30: tFUS AND transcranial electrical stimulation in the same framework,
    which makes CROSS-INTERVENTION comparison possible -- two physically different perturbations with
    the same readout.'
frames:
- transducer_frame
- eeg_cap
- head
- subject_native
- MNI152
streams:
- name: cross_intervention_comparison
  kind: measured
  via: null
  systematic_bias: TWO PHYSICALLY DIFFERENT PERTURBATIONS, ONE READOUT, ONE PARTICIPANT SET. A focal acoustic
    perturbation and a diffuse electrical one should produce different response patterns if the response
    reflects the delivered field, and similar ones if it reflects a shared nonspecific pathway (auditory,
    somatosensory, arousal). That contrast is a real test of §52.13's four-stage separation rather than
    an assertion of it.
  notes: the two modalities also differ in their peripheral co-stimulation, so a difference in response
    is not automatically a difference in delivered field
  band_hz:
  - null
  - null
  temporal_support: EEG at kHz; resting-state recording with sonication or stimulation blocks
  spatial_support: acoustic focal volume for tFUS and a whole-head current density field for electrical
    stimulation -- two completely different spatial supports for the same nominal 'target'
- name: eeg
  kind: measured
  via: null
  observation_chain: oriented cortical current-source state -> quasi-static volume conduction through
    brain, CSF, skull and scalp -> electrode contact geometry and impedance -> reference montage -> amplified,
    filtered, sampled voltage
  confounds:
  - 'ocular: blink and saccade corneo-retinal potentials'
  - 'cardiac: ECG contamination and pulse artifact'
  - 'muscle: temporalis, frontalis and neck EMG'
  - electrode impedance drift, motion and bridging
  - line noise and amplifier drift
  - reference-electrode activity, which is never inactive
  - stimulation artifacts differing entirely between the two modalities
  - auditory confound for tFUS
  systematic_bias: Resting-state readout means no task confound and also no behavioural anchor.
  band_hz:
  - null
  - null
