access: held
licence:
  name: BSD-3-Clause (toolbox); CC-BY-NC-SA-4.0 (the cached data, and that is what we hold)
  redistribution: unresolved
  commercial: prohibited
  notes: 'Read from data/assets/MANIFEST.json, which is explicit that the BSD-3 covers the code and the
    cached data are ''as released with the cited papers'' -- Griffa et al. (2019) Zenodo and Betzel and
    Bassett (2018) PNAS. Rule 6: unresolved is a value. A permissive code licence on a fetch tool says
    nothing about what it fetched, and this is the most likely place in the store for the two to be confused.
    RESOLVED FROM THE HELD BYTES, NOT FROM THE PROJECT PAGE. The card already said the toolbox is BSD-3-Clause
    and the cached data carries the terms of the papers that released it; enumerating every licence file
    under the cache says WHICH terms. Both datasets in it ship their own licence and both are CC-BY-NC-SA-4.0:
    atl-voneconomo_koskinas/LICENSE and ds-hansen_receptors/LICENSE.md. Rule 7 computes the licence per
    artifact from contributing sources by taking the MOST RESTRICTIVE term, so what we hold under this
    id is non-commercial AND share-alike, regardless of the toolbox''s BSD. The BSD covers code we are
    not redistributing. This is the third and fourth non-commercial holding to surface from inside something
    that looked permissive at the top level.


    CORRECTION TO THE PARAGRAPH ABOVE, AND IT MATTERS FOR THE REASON THAT PARAGRAPH GIVES. It says ''both
    datasets in it ship their own licence and both are CC-BY-NC-SA-4.0''. THE CACHE HOLDS SEVEN SOURCE
    DIRECTORIES, NOT TWO. The enumeration behind that sentence searched for files named LICENSE, LICENCE
    or COPYING and found two -- so ''both datasets'' was really ''both LICENCE FILES'', and a search that
    answers a narrower question than the one asked reads exactly like an answer to the asked one. The
    seven, measured: ds-hansen_receptors 358 files/588.60 MB, ds-famous_gmat 72/20.27, tpl-conte69 8/4.32,
    atl-cammoun2012 6/2.00, atl-voneconomo_koskinas 6/44.39, atl-mmpall 2/0.10, ds-vazquez_rodriguez2019
    1/0.02.


    THE RECORDED VALUES SURVIVE THE CORRECTION, and that is luck rather than method: the join takes the
    most restrictive contributing term, the two CC-BY-NC-SA-4.0 sources are in the cache whatever else
    is, so non-commercial and share-alike are a FLOOR that five unknown sources can only tighten. Had
    the two licence files been the permissive ones, the same reasoning would have produced a confident
    wrong answer.


    Four of the seven are now declared as parents so the licence computes from them. THREE ARE NOT CARDED
    AT ALL -- atl-cammoun2012 (6 files, the Cammoun 2012 Lausanne parcellation), ds-famous_gmat (72 files)
    and ds-vazquez_rodriguez2019 (1 file). Their edges cannot be declared, so this lineage is INCOMPLETE
    BY 79 FILES and says so; carding those three discharges it.'
