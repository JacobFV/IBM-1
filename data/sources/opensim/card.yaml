# ibm-1 source card. schema: data/schema/source.schema.json
id: opensim
title: OpenSim -- musculoskeletal modelling and simulation
provider: Stanford / Mobilize Center
citation: 'Seth et al., OpenSim: Simulating musculoskeletal dynamics and neuromuscular control to study
  human and animal movement. PLoS Computational Biology 2018.'
urls:
- https://mobilize.stanford.edu/software/opensim/
- https://simtk.org/projects/opensim
access: reference
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved pending inspection of the distributed licence file. Code licence and bundled-data
    licence frequently differ and must be resolved separately.
binding: unbound
population:
  n: null
frames:
- skeletal_frame
- muscle_path
- ground
streams:
- name: musculoskeletal_geometry
  kind: measured
  via: null
  systematic_bias: §52.14 singles OpenSim out for MUSCLE/TENDON GEOMETRY and inverse/forward movement
    analyses, and the reason is that it is the only body representation in the registry with anatomy inside
    it. Moment arms and muscle paths come from cadaver measurements in small samples, scaled to individuals
    by a linear scaling that is known to be crude.
  notes: generic models scaled to a subject's segment lengths misestimate moment arms; subject-specific
    musculoskeletal geometry from imaging is rare and better
  band_hz:
  - null
  - null
  temporal_support: forward and inverse dynamics over a movement trajectory; the model has no clock of
    its own and adopts the input kinematics'
  spatial_support: 'an ANATOMICAL musculoskeletal model: bones with measured inertial properties, joints
    with anatomical axes, and muscle-tendon paths with measured origins, insertions and via-points. The
    spatial support is the skeleton and the muscle path, not a surface'
- name: inverse_dynamics_and_static_optimisation
  kind: measured
  via: null
  systematic_bias: 'MUSCLE REDUNDANCY IS FUNDAMENTAL: more muscles than degrees of freedom means the force
    distribution is UNDERDETERMINED by the kinematics, and static optimisation resolves it by minimising
    an assumed cost. The estimated muscle forces are therefore a consequence of the assumed objective,
    not a measurement -- which is exactly the kind of thing §39 says must be recorded as model uncertainty
    rather than reported as a value'
  band_hz:
  - null
  - null
- name: hill_type_muscle_model
  kind: measured
  via: null
  systematic_bias: Hill-type muscle dynamics are one model family among several; §53.4's argument that
    model classes compete applies to the periphery too
  band_hz:
  - null
  - null
absent:
- subject_specific_muscle_geometry
- measured_muscle_forces
- neural_input
use:
- prior
- surrogate
forbidden:
- opensim/* -> measured muscle force claims
- opensim/* -> runtime dependency in a WIN query
split:
