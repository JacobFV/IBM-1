id: vesselgraph-mouse
title: VesselGraph -- mouse whole-brain microvascular graph dataset
provider: TU Munich / VesselGraph
citation: 'Paetzold et al., Whole Brain Vessel Graphs: A Dataset and Benchmark for Graph Learning and
  Neuroscience. NeurIPS Datasets and Benchmarks 2021.'
urls:
- https://github.com/jocpae/VesselGraph
access: held
licence:
  name: CC BY-NC 4.0 (stated in the project README for the DATA; the code is MIT)
  redistribution: unresolved
  commercial: prohibited
  notes: 'The README states "The data is licensed under a Creative Commons Namensnennung-Nicht kommerziell
    4.0 International Lizenz" and links the CC BY-NC 4.0 deed, so the non-commercial term is resolved
    from the licence''s own public text rather than by judgement. Redistribution is left unresolved: BY-NC
    permits it with attribution, but the underlying VesSAP imagery carries its own terms and this card
    does not assert them.'
binding: bound
population:
  n: 9
  species: Mus musculus
  hierarchy:
  - strain
  - participant
  notes: 'HELD: nine whole brains, three strains x three animals -- BALBc_no1..3, C57BL_6_no1..3, CD1-E_no1..3.
    Measured 2026-09-05 by reading every edge table: 2.18 to 5.90 million segments per animal, 4.64 million
    on average, and 2.3 to 3.5 million nodes. The three C57BL_6-K graphs and the five synthetic graphs
    in the same download table were deliberately NOT taken -- the K graphs come from a different pipeline
    the README says is still being verified, so pooling them would mix two skeletonisations into one between-animal
    spread, and the synthetic graphs are not measurements.'
frames:
- mouse_brain_native
- allen_mouse_ccf
streams:
- name: microvascular_graph_statistics
  kind: measured
  constrains:
  - structural.lumen_radius
  - structural.segment_length
  - structural.capillary_density
  via:
    structural.lumen_radius:
    - vascular_flow
    structural.segment_length:
    - vascular_flow
    structural.capillary_density:
    - tissue_exchange
  observation_chain: 'vascular endothelium labelled in a cleared fixed brain -> light-sheet volume ->
    machine segmentation -> Voreen skeletonisation into a centreline graph -> per-segment arc length,
    chord distance and a maximal-inscribed-sphere radius.  EVERY FEATURE IS A MODEL OUTPUT: the radius
    is a distance transform''s estimate on a 3 um voxel grid of a fixed, shrunken vessel, and the graph
    is a skeleton''s opinion about which voxels form one segment'
  confounds:
  - clearing shrinkage, which scales every length and radius by a factor the release does not report per
    specimen
  - fixation collapses the lumen, so a radius here is not a perfused calibre
  - the 3 um voxel is comparable to a capillary diameter, so thin vessels are radius-overestimated by
    the segmentation and the radius distribution is compressed -- measured here as a Murray exponent of
    3.8-4.1 against 2.8 on a source with real calibres
  - segmentation false negatives correlate with calibre, and capillaries are both the thinnest and the
    most numerous, so the density is a lower bound
  - light-sheet attenuation with depth makes both of the above worse in the middle of the brain
  - the release documents no units; they are inferred here, and the inference is recorded
  systematic_bias: MOUSE, EX VIVO, and its errors are SHARED. Nine animals from three inbred strains through
    one clearing protocol, one segmentation network and one skeletonisation are worth 4.1 independent
    animals with a ceiling of 6.6, measured as a strain-level ICC of 0.151. The cross-species step is
    an explicit assumption with an uncertainty and is carded wherever it is used.
  notes: 'UNITS ARE INFERRED, not documented.  length, distance and volume are counted in VOXELS of 3
    um and avgRadiusAvg is in MICRONS -- a mixed convention, established by three independent checks in
    scripts/measure_microvasculature.py: length over centreline-voxel count comes out at 1.4, which is
    the mean step of a 3D digital curve; the whole-brain length density lands within a factor of two of
    a direct cortical measurement; and the alternative reading puts the cerebral blood volume at 10-14%
    of tissue, three times any measured value.  every density and every resistance depends on this and
    a reader who disagrees knows exactly what to change.'
  band_hz:
  - 0.0
  - 0.001
  temporal_support: not a time series -- this is static anatomy, and the vasculature it describes was
    not moving when it was measured, which is the gap between this source and any haemodynamic state
  spatial_support: whole-brain MOUSE microvascular networks as graphs at 3 um isotropic, 2.2-5.9 million
    segments per animal carrying radius, arc length, chord distance and curveness -- the capillary-scale
    topology no human in-vivo modality can reach
- name: graph_topology
  kind: measured
  constrains:
  - structural.branch_order
  via:
  - vascular_flow
  systematic_bias: Branch-point degree distributions and loop statistics are topological facts that may
    transfer better across species than absolute densities do. MEASURED here -- mean degree 3.04, with
    degree 3 accounting for four fifths of the nodes and a long tail of degree-1 segmentation dead ends
    that is a reconstruction artifact rather than anatomy.
  notes: 'branch order is carried as an ORDINAL QUANTITY and not a label, which is why it is a component
    at all where arterial territory is not.  what this source cannot supply is its ORIENTATION: the release
    ships no flow and no vessel-type annotation, so which end of a segment is upstream is unknown, and
    every bifurcation statistic here had to assume the widest of three branches is the parent.  microscopy-microvascular-networks
    is the control for that assumption because it ships a solved pressure field.'
  band_hz:
  - 0.0
  - 0.001
absent:
- human_correspondence
- in_vivo_geometry
- flow
- pressure
- vessel_type_labels
- flow_direction
- tissue_mask
- individual_variation
- documented_units
use:
- calibrate
- prior
forbidden:
- vesselgraph-mouse/* -> human vascular geometry without an explicit cross-species scaling assumption
- vesselgraph-mouse/* -> human observation-role likelihoods
- vesselgraph-mouse/* -> observation-role likelihoods
- vesselgraph-mouse/* -> a commercial artifact (non-commercial term)
- vesselgraph-mouse/* -> an in-vivo perfused lumen radius without a fixation and shrinkage correction
- vesselgraph-mouse/microvascular_graph_statistics -> a tissue length density without a fill-fraction
  correction; the release ships no brain mask and the density here is over a bounding box
split:
  group_by:
  - strain
  - participant
  notes: group by STRAIN and not only by animal.  the measured strain-level ICC is 0.151 over the geometric
    feature vector, so three animals of one strain are not three independent draws, and a split that put
    two BALBc brains on one side and one on the other would leak.
provenance:
  imported_from: win-registry
  card: vesselgraph-mouse
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
local_root: data/sources/vesselgraph-mouse/raw
provenance_note: moved into this repo from a sibling working directory; the origin above is the source
  of record, not the machine it was staged on
