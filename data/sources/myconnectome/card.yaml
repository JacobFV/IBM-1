  notes: OpenNeuro-hosted; terms unresolved. Single identified participant -- consent scope is itself
    a fact to resolve before use.
binding: unbound
population:
  n: 1
  hierarchy:
  - session
  - run
  notes: One person, 104 sessions over 18 months, with metabolomics, gene expression and daily behavioural
    logs alongside imaging.
frames:
- scanner
- subject_native
- fsaverage
- MNI152
- subject_native_surface
streams:
- name: bold_rest
  kind: measured
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY (PROMPT.md §17): the vascular stage is a
    modelled state, not a nuisance to be regressed away'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  - caffeine and fasting state, which are LOGGED here and therefore modellable rather than nuisance
  systematic_bias: Within-person session-to-session variability at a scale nothing else supplies.
  band_hz:
  - null
  - null
  temporal_support: sessions on a near-daily cadence over 18 months; the SLOW axis is the point
  spatial_support: single subject across 104 sessions; individual surfaces
- name: metabolomics
  kind: measured
  via: null
  systematic_bias: peripheral blood metabolites are not cerebral metabolic state
