id: myconnectome
title: MyConnectome -- longitudinal single-subject multimodal study
provider: Poldrack lab / OpenNeuro ds000031
citation: Poldrack et al., Long-term neural and physiological phenotyping of a single human. Nature Communications
  2015.
urls:
- https://openneuro.org/datasets/ds000031
access: priority
