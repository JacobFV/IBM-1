# ibm-1 source card. schema: data/schema/source.schema.json
id: myconnectome
title: MyConnectome -- longitudinal single-subject multimodal study
provider: Poldrack lab / OpenNeuro ds000031
citation: Poldrack et al., Long-term neural and physiological phenotyping of a single human. Nature Communications
  2015.
urls:
- https://openneuro.org/datasets/ds000031
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: OpenNeuro-hosted; terms unresolved. Single identified participant -- consent scope is itself
    a fact to resolve before use.
binding: bound
population:
  n: 1
  hierarchy:
  - session
  - run
  notes: One person, 104 sessions over 18 months, with metabolomics, gene expression and daily behavioural
    logs alongside imaging.
frames:
- scanner
- subject_native
- fsaverage
- MNI152
- subject_native_surface
streams:
- name: bold_rest
  kind: measured
  via:
  - em_generation
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY (PROMPT.md §17): the vascular stage is a
    modelled state, not a nuisance to be regressed away'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  - caffeine and fasting state, which are LOGGED here and therefore modellable rather than nuisance
  systematic_bias: Within-person session-to-session variability at a scale nothing else supplies.
  band_hz:
  - 0.0
  - 0.25
  temporal_support: sessions on a near-daily cadence over 18 months; the SLOW axis is the point
  spatial_support: single subject across 104 sessions; individual surfaces
  constrains:
  - electromagnetic.bfield
  notes: 'ONE SUBJECT, 104 SESSIONS ON A NEAR-DAILY CADENCE OVER 18 MONTHS, and THE SLOW AXIS IS THE POINT:
    within-person session-to-session variability at a scale nothing else supplies.  there are two clocks
    here and they must not be confused -- the within-run BOLD clock, whose ceiling is set conservatively
    at 0.25 Hz because the per-session TR is not recorded on this card and the bytes are not held, and
    the BETWEEN-SESSION clock at roughly one sample per day, which is where the interesting variance lives
    and which no `band_hz` field can express.  BOLD IS NOT NEURAL ACTIVITY, and the four-step chain is
    what says so: neurovascular coupling, then flow, then tissue exchange, then the susceptibility change
    deoxyhaemoglobin makes -- which is why the component is `electromagnetic.bfield` and not a neural
    one.  the vascular stages are modelled state, not nuisance to be regressed away.  em_generation is
    what produces the magnetic field from source currents; the previous chain named vascular_flow, which
    is unrelated.'
  frame: subject_native
- name: metabolomics
  kind: context
  via: null
  systematic_bias: peripheral blood metabolites are not cerebral metabolic state
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context, and an ONTOLOGY GAP rather than an undecided stream.  transcript abundance and metabolite
    concentration are not registered components: `extracellular.*` are neurotransmitter concentrations
    in brain interstitium and `metabolic.*` are per-tissue quantities in the brain.  molecular composition
    constrains WHICH interaction classes are plausible where, which is a prior over model class, and is
    never evidence about a state.  and one more reason here: PERIPHERAL BLOOD METABOLITES ARE NOT CEREBRAL
    METABOLIC STATE.  `metabolic.*` are per-tissue-element quantities in the brain, and a plasma concentration
    is a different compartment; binding them would assert brain metabolism from a blood draw.'
- name: behaviour_diary
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context.  a behavioural score, rating or questionnaire response is a report ABOUT a state, produced
    by a person rather than by a process the model represents, and often minutes later.  no registered
    component is a score, and treating one as a measurement would let a self-report update tissue state
    directly.  A CORRECTION: the migration marked it `imposed`, and it is not -- nobody set the participant''s
    mood, sleep or caffeine intake; he reported them.  an imposed stream is state an experimenter clamped.'
- name: bold_task
  kind: measured
  via:
  - em_generation
  band_hz:
  - 0.0
  - 0.25
  constrains:
  - electromagnetic.bfield
  notes: 'separate runs from the resting sessions.  same two-clock caveat.  BOLD IS NOT NEURAL ACTIVITY,
    and the four-step chain is what says so: neurovascular coupling, then flow, then tissue exchange,
    then the susceptibility change deoxyhaemoglobin makes -- which is why the component is `electromagnetic.bfield`
    and not a neural one.  the vascular stages are modelled state, not nuisance to be regressed away.  em_generation
    is what produces the magnetic field from source currents; the previous chain named vascular_flow,
    which is unrelated.'
  frame: subject_native
- name: dwi
  kind: measured
  via:
    structural.fiber_orientation:
    - tract_propagation
    structural.axonal_density: &id001
    - plasticity
    structural.myelination: *id001
  band_hz:
  - 0.0
  - 0.001
  constrains:
  - structural.fiber_orientation
  - structural.axonal_density
  - structural.myelination
  notes: 'ORIENTATION EVIDENCE, and the distinction is the whole binding.  what a diffusion volume measures
    is direction-dependent attenuation of water displacement, which constrains LOCAL microstructure --
    fibre orientation, axonal density, myelination -- and does NOT observe a tract: a tractogram is a
    reconstruction laid over this field and is context wherever it appears in this corpus.  static band
    because microstructure is a tissue parameter.  the via chain follows the corpus convention set by
    tractoinferno, ds000117 and aomic-id1000: `plasticity` is named because it is the process that writes
    the structural field, though its declared outputs cover density and myelination and NOT `structural.fiber_orientation`,
    which no registered process writes.  per-component chains: this acquisition makes more than one claim
    and the routes differ.  one chain for all of them would let the component whose route is wrong borrow
    the route of the ones that are right.'
  frame: subject_native
- name: t1w
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry.  the anatomical volume the supports are indexed over.  as ds004024''s card
    records, a T1 would genuinely bind to `material.conductivity` and `material.mass_density` once a head
    model exists to put the values into -- but a material value asserted for a conductor nobody can address
    is not evidence, so it stays context until the support bank exists.'
- name: gene_expression
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context, and an ONTOLOGY GAP rather than an undecided stream.  transcript abundance and metabolite
    concentration are not registered components: `extracellular.*` are neurotransmitter concentrations
    in brain interstitium and `metabolic.*` are per-tissue quantities in the brain.  molecular composition
    constrains WHICH interaction classes are plausible where, which is a prior over model class, and is
    never evidence about a state.  and PERIPHERAL: whole-blood transcriptome, sampled on the same near-daily
    cadence.  it is a real longitudinal molecular series in a compartment that is not the brain.'
- name: food_diary
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: context.  a behavioural score, rating or questionnaire response is a report ABOUT a state, produced
    by a person rather than by a process the model represents, and often minutes later.  no registered
    component is a score, and treating one as a measurement would let a self-report update tissue state
    directly.
absent:
- eeg
- meg
- ieeg
- angiography
- intervention
- population
requires:
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
- geometry: tract-path-products
  severity: degrading
  without_it: 'A diffusion volume is a field of orientations attached to no pathway. Re-graded to degrading
    and unscoped 2026-09-05 on the entry''s own logic, which already said the source ''can constrain local
    microstructure but no interaction between supports'': local microstructure is exactly what the `dwi`
    stream binds -- `structural.fiber_orientation`, `structural.axonal_density` and `structural.myelination`
    -- so the missing product does not stand between that stream and its components. What it blocks is
    any claim of the form ''this tract transmits between these two supports'', and no stream in this card
    makes one. This is the same reading ds000117, tractoinferno and aomic-id1000 already carry.'
  for_streams: []
use:
- evaluate
- fit
- prior
forbidden:
- myconnectome/* -> any population claim (n=1)
- myconnectome/metabolomics -> cerebral metabolic state (plasma is a different compartment)
- myconnectome/gene_expression -> brain transcription (it is whole blood)
- myconnectome/behaviour_diary -> an imposed variable (it is self-report, not a manipulation)
split:
  group_by:
  - session
  - run
provenance:
  imported_from: win-registry
  card: myconnectome
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
