streams:
- name: psilocybin_multimodal
  kind: measured
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY: the vascular stage is a modelled state,
    not a nuisance to be regressed away, and in a separate session post-synaptic currents in spatially
    aligned pyramidal populations -> volume conduction through brain, CSF, skull and scalp -> potential
    difference between an electrode and a reference -> amplifier gain, filtering and group delay -> sampled
    voltage'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving a global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  - ocular and blink artefact
  - muscle (EMG) contamination
  - cardiac field and pulse artefact
  - electrode impedance drift and movement artefact
  - the reference choice, which is a montage operator and not a property of the brain
  - line noise and its harmonics
  - the meditation-training arm is a second, slow intervention interacting with the drug arm
  - the naturalistic conditions (music, movie) impose their own shared stimulus structure
  - blinding fails
  - one-year follow-up introduces every life event between the sessions as an unmodelled variable
  systematic_bias: A pharmacological state change measured with BOTH electrophysiology and haemodynamics
    on the same people, under naturalistic conditions, at a cohort size that supports between-participant
    inference -- which the precision-mapping designs cannot. The two modalities are in separate sessions,
    so nothing here supports a within-episode coupling claim.
  band_hz:
  - null
  - null
  temporal_support: conditions are rest, guided meditation, music listening and movie watching, with follow-ups
    to one year. The EEG and MRI sessions have their own clocks and there is no hardware relation between
    them
  spatial_support: multi-echo functional, structural and diffusion MRI, PLUS EEG on the same participants
    -- the electrophysiological and haemodynamic arms of the same pharmacological manipulation
