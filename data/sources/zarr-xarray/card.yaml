streams:
- name: labelled_lazy_chunked_arrays
  kind: measured
  via: null
  systematic_bias: '§55 names these for CHUNKED HETEROGENEOUS ARRAYS WHERE BIDS/NWB DO NOT DIRECTLY REPRESENT
    RUNTIME PRODUCTS, and the fit with the architecture is closer than that suggests: §2''s state is resolved
    LAZILY BY QUERY at an address, and a chunked lazy array is exactly a store that reads only what an
    address requires. Named dimensions with unit-carrying coordinates are §57''s native-units requirement
    at the storage layer.'
  notes: a storage format imposes no semantics; that a dimension is called 'time' does not make its coordinate
    a clock, and the clock GRAPH still has to be elsewhere
  band_hz:
  - null
  - null
  temporal_support: a time dimension is a labelled coordinate with its own values, so SEVERAL arrays with
    DIFFERENT time coordinates coexist without a common grid. That is §33's native heterogeneity expressed
    in a storage layer
  spatial_support: arrays whose DIMENSIONS ARE NAMED AND CARRY COORDINATE VALUES, stored in chunks that
    can be read independently and lazily -- so a query can touch a small region of a very large array
    without materialising it
- name: cloud_native_access
  kind: measured
  via: null
  systematic_bias: reading a chunk over the network without downloading the store is what makes the petabyte-scale
    sources (h01, microns, fastmri-brain) usable at all
  band_hz:
  - null
  - null
