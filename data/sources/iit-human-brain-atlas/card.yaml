streams:
- name: probabilistic_grey_and_white_matter_labels
  kind: measured
  via: null
  systematic_bias: 'Probabilistic multi-layer white-matter labels are unusual and are directly what a
    support-overlap calculation wants: they state where a bundle probably is rather than asserting where
    it is. Built from 72 volunteers aged 20-40 with Turboprop diffusion, so the population is narrow and
    the acquisition is one lab''s.'
  notes: the connectome edges come from probabilistic tractography on a TEMPLATE, so they are a property
    of the averaged brain and of the tracking algorithm, and no individual has this connectome
  band_hz:
  - null
  - null
  temporal_support: none -- static templates
  spatial_support: 'templates normalised into ICBM-152 space: a T1 template, mean and median DTI templates
    with parameter maps, a HARDI template, PROBABILISTIC grey-matter labels (Desikan-Killiany, 84 regions),
    probabilistic MULTI-LAYER white-matter labels, major fibre bundles, and an 84-region structural connectome
    with 6,972 edges. The probabilistic labelling is the valuable part: it retains the boundary uncertainty
    that a maximum-probability atlas throws away'
