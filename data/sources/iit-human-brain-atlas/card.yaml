id: iit-human-brain-atlas
title: IIT Human Brain Atlas v5.0 -- DTI/HARDI templates, probabilistic labels and connectome
provider: Illinois Institute of Technology (Zhang and Arfanakis), distributed on NITRC project iit
citation: No dataset DOI. NITRC names PMID 29414497 (diffusion resources) and PMID 33075560 (grey/white-matter
  labels and connectome); the licence additionally requires citing the regionconnect paper.
