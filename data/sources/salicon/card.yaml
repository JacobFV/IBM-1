frames:
- image_plane
- uncontrolled_display
streams:
- name: mouse_derived_saliency_maps
  kind: imposed
  via: null
  systematic_bias: A MOUSE-MOVEMENT PROXY for gaze collected in a browser. It correlates with fixation
    density but is not fixation, and the viewing distance is unknown so nothing here can be converted
    to visual angle. Using it as gaze evidence is the category error this card exists to flag.
  band_hz:
  - null
  - null
  temporal_support: mouse trace at browser event rate
  spatial_support: image plane; crowdsourced browser interface with uncontrolled screen size and viewing
    distance -- visual angle is therefore UNKNOWN
- name: saliency_as_control
  kind: measured
  via: null
  systematic_bias: 'a useful control: if a retinalization model''s predictions are matched by a bottom-up
    saliency map, the model has not demonstrated a top-down term'
  band_hz:
  - null
  - null
