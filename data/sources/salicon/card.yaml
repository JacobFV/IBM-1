id: salicon
title: SALICON -- saliency in context, mouse-tracking attention annotations on COCO
provider: National University of Singapore
citation: 'Jiang et al., SALICON: Saliency in Context. CVPR 2015.'
urls:
- http://salicon.net/
access: priority
licence:
  name: unresolved
