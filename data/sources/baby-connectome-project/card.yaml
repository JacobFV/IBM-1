streams:
- name: infant_bold_rest
  kind: measured
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY: the vascular stage is a modelled state,
    not a nuisance to be regressed away. Scans are acquired during natural sleep, so the behavioural state
    is sleep and not rest'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving a global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift and between-session hardware change
  - sleep stage, uncontrolled and unrecorded, which changes network structure more than age does over
    short intervals
  - rapid change in head size and tissue contrast across the age range, which breaks a single registration
    target
  band_hz:
  - null
  - null
  temporal_support: multiband BOLD; the developmental axis is accelerated-longitudinal, meaning the population
    curve is assembled from overlapping short individual arcs
  spatial_support: HCP-style structural, diffusion and resting BOLD adapted for natural sleep in infants
- name: accelerated_longitudinal_design
  kind: measured
  via: null
  systematic_bias: A cross-sectional slope through an accelerated-longitudinal cohort is not a within-individual
