# ibm-1 source card. schema: data/schema/source.schema.json
id: cneuromod-friends
title: cNeuroMod Friends -- long-form television fMRI
provider: Courtois NeuroMod
citation: Courtois NeuroMod Friends dataset.
urls:
- https://docs.cneuromod.ca/en/latest/DATASETS.html
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: cNeuroMod access agreement; the television series is third-party copyright and is not redistributable.
binding: unbound
population:
  n: 6
  hierarchy:
  - participant
  - session
  - run
  notes: Tens of hours per participant of the same serialised narrative -- the long-horizon world-context
    source.
frames:
- scanner
- subject_native
- display
- episode_timeline
streams:
- name: bold_movie
  kind: measured
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY (PROMPT.md §17): the vascular stage is a
    modelled state, not a nuisance to be regressed away'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  systematic_bias: Serialised narrative means context dependence extends across SESSIONS, which is the
    regime where a reconstruction-sufficient state and a transition-sufficient state come apart (§35).
  band_hz:
  - null
  - null
  temporal_support: TR 1.49 s; episodes split into runs with documented boundaries; the NARRATIVE clock
    spans sessions and is the interesting one
  spatial_support: 1.6 mm BOLD; individual surfaces
- name: video_audio_stimulus
  kind: imposed
  via: null
  band_hz:
  - null
  - null
- name: held_out_seasons
  kind: measured
  via: null
  systematic_bias: held-out episodes share characters, sets and voices with training episodes; that is
    leakage through content even under a clean episode split
  band_hz:
  - null
  - null
- name: audio
  kind: measured
  via: null
  band_hz:
  - null
  - null
- name: video
  kind: measured
  via: null
  band_hz:
