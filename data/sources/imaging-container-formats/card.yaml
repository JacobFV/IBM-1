id: imaging-container-formats
title: NIfTI, GIfTI, CIfTI, MGH/MGZ, NRRD and DICOM imaging containers
provider: multiple -- NIfTI DFWG, HCP, FreeSurfer, Kitware, NEMA
citation: PROMPT.md §55, 'NIfTI, GIfTI, CIfTI, MGH/MGZ, NRRD, and DICOM as native imaging containers'.
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
