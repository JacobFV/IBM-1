  systematic_bias: Simple geometries have ANALYTIC solutions, which makes them the rare case where a simulator
    can be checked against exact truth rather than against another simulator. The multi-code intercomparison
    exercises then measure how much transcranial predictions differ between codes -- a simulator-discrepancy
    component (§39) that is large enough to matter for dose.
  notes: grid resolution, absorbing boundary treatment and the nonlinearity model all change the answer;
    a converged solution is a claim that must be demonstrated
