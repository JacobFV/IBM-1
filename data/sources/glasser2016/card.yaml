# ibm-1 source card. schema: data/schema/source.schema.json
id: glasser2016
title: Glasser HCP-MMP1 multi-modal cortical parcellation
provider: WU-Minn HCP / Glasser et al.
citation: Glasser et al., A multi-modal parcellation of human cerebral cortex. Nature 2016.
urls:
- https://balsa.wustl.edu/study/RVVG
access: held
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved. §49.2 records that the predecessor's attribution generator tracked each source's
    known bias and licence rather than treating atlas availability as correctness; that practice is preserved
    by leaving this unresolved and counting it.
binding: unbound
population:
  n: null
frames:
- fs_LR
- MSMAll_32k_fs_LR
- fsaverage
streams:
- name: parcellation_labels
  kind: measured
  via: null
  systematic_bias: Multi-modal boundary definition is a stronger basis than any single modality, and the
    boundaries were then applied by a trained CLASSIFIER to individuals -- so an individual Glasser parcellation
    is a classifier output, not a measurement of that person's areas.
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: 180 areas per hemisphere on the fs_LR 32k surface, defined by gradients in myelin,
    thickness, function and connectivity together
- name: areal_feature_gradients
  kind: measured
  via: null
  systematic_bias: the underlying gradient maps are more informative than the thresholded areas and are
    the part §11 wants rendered
  band_hz:
  - null
  - null
absent:
- individual_boundary_uncertainty
- subcortex
- cerebellum
- classifier_confidence_in_all_releases
requires:
- geometry: cortical-support-bank
  severity: blocking
  without_it: A parcellation or a surface map is a COVER, not an element of the brain's ontology. Without
    the support bank there is nothing for these labels to be a cover OVER, and using them as if they were
    the supports themselves is precisely the canonical-parcellation commitment the architecture refuses.
use:
- calibrate
- prior
forbidden:
- glasser2016/parcellation_labels -> hard support boundaries
- glasser2016/* -> individual measured areal geometry
- glasser2016/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
provenance:
  imported_from: win-registry
  card: glasser2016
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
