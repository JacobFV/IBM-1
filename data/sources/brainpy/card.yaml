  systematic_bias: JAX-based differentiability means gradients flow through the SIMULATION, which makes
    parameter estimation in a mechanistic model tractable. §32 says B-WIN imposes NO UNIVERSAL DIFFERENTIABILITY
    REQUIREMENT -- interactions may be ODEs, solvers, lookups, event systems, discrete algorithms or networks
    -- so differentiability is a CAPABILITY to exploit where a module has it, not a constraint to impose
    everywhere.
  notes: differentiating through a stiff or chaotic system gives gradients that are numerically correct
    and practically useless
