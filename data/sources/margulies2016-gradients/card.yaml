  systematic_bias: 'A GRADIENT IS AN EMBEDDING OF A CORRELATION MATRIX. It is a compressed description
    of resting functional connectivity, three inferential steps from anatomy: BOLD, then correlation,
    then diffusion-map embedding. It is a useful low-dimensional coordinate for organising supports and
    it is not a measured axis of the cortex.'
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: low-dimensional embeddings of the resting-state functional connectivity matrix, expressed
    per vertex on a standard surface
- name: gradient_coordinate
  kind: measured
  via: null
  systematic_bias: usable as a continuous coordinate along which to interpolate priors, which is closer
    to §5's continuous-support view than a parcellation is
  band_hz:
  - null
  - null
