# ibm-1 source card. schema: data/schema/source.schema.json
id: openbmi-lee2019
title: OpenBMI large-scale EEG BCI dataset (Lee et al., 54 participants, three paradigms)
provider: Korea University, distributed via GigaDB
citation: 'Lee et al., EEG dataset and OpenBMI toolbox for three BCI paradigms: an investigation into
  BCI illiteracy. GigaScience 2019.'
urls:
- http://gigadb.org/dataset/100542
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: GigaDB datasets carry per-dataset terms; not read.
binding: unbound
population:
  n: 54
  hierarchy:
  - participant
  - session
  - run
  notes: 54 participants, each in two sessions across three paradigms -- the two-session design is what
    makes between-session variance estimable rather than assumed.
frames:
- channel_label
- 10_20_nominal_positions
streams:
- name: three_paradigm_eeg
  kind: measured
  via: null
  observation_chain: post-synaptic currents in spatially aligned pyramidal populations -> volume conduction
    through brain, CSF, skull and scalp -> potential difference between a scalp electrode and a reference
    -> amplifier gain, filtering and group delay -> sampled integer
  confounds:
  - ocular and blink artefact
  - muscle (EMG) contamination, broadband and strongest at temporal sites
  - cardiac field and pulse artefact
  - electrode impedance drift and movement artefact
  - the reference choice, which is itself a montage operator and not a property of the brain
  - line noise and its harmonics
  - SSVEP responses are driven by a flickering stimulus and the photic drive is present in the signal
    whether or not the participant attends it
  - 'EMG was recorded, which is unusual and valuable: in most motor-imagery corpora the muscle confound
    is unmeasurable'
  systematic_bias: The paper's own subject is BCI illiteracy -- a large fraction of participants produce
    no usable signal. That is a real and quantified variance component across people, and it is the control
    most single-paradigm EEG results lack.
  band_hz:
  - null
  - null
  temporal_support: 1000 Hz acquisition; a downsampled version is distributed alongside and is a derived
    view
  spatial_support: 62-channel scalp montage
