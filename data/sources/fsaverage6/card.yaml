  - 0.001
  temporal_support: not a time series -- this is static anatomy
  spatial_support: 'the fsaverage average surface subdivided to ico6: 40,962 vertices per hemisphere against
    fsaverage''s ico7 163,842. Same subject-average geometry, one-quarter the sampling.'
