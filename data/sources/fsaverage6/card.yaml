  systematic_bias: A subdivided average surface. Every vertex is an average over 40 people's folding,
    so a feature narrower than intersubject folding variability is smoothed away before anything is computed
    on it. At ico6 the vertex spacing is roughly 1.4 mm, which is coarser than the cortical features some
    queries will ask about.
  notes: 'context: geometry, not evidence.  it supplies a support that a materialization is indexed over
    and constrains no ibm component; letting it update biology would turn a reconstruction into a measurement.  an
    ico6 subdivision of the same 40-subject average surface; every vertex is an average over 40 people''s
    folding.'
  band_hz:
