id: bold5000
title: BOLD5000 -- 5000-image fMRI dataset
provider: Carnegie Mellon University
citation: Chang et al., BOLD5000, a public fMRI dataset while viewing 5000 visual images. Scientific Data
  2019.
urls:
- https://bold5000.github.io/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved; source images come from COCO, ImageNet and SUN, each with its own terms.
binding: unbound
population:
  n: 4
  hierarchy:
  - participant
  - session
  - run
  notes: Four participants, ~5000 images each across 15 sessions.
frames:
- scanner
- subject_native
- display
- MNI152
streams:
- name: bold_images
  kind: measured
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY (PROMPT.md §17): the vascular stage is a
    modelled state, not a nuisance to be regressed away'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  systematic_bias: '3T at 2 mm and TR 2 s: coarser than NSD in every axis, which makes it a useful resolution-degradation
    control rather than a redundant copy.'
  band_hz:
  - null
  - null
  temporal_support: TR 2 s; 1 s image presentation in a slow event design
  spatial_support: 2 mm 3T BOLD; individual surfaces; functional localisers
- name: source_images
  kind: imposed
  via: null
  systematic_bias: mixes COCO, ImageNet and SUN; the three have different statistics and the mixture is
    itself a design choice
  band_hz:
  - null
  - null
