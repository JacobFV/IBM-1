id: ds004514
title: 'ds004514 -- simultaneous EEG-fNIRS: a cue image, then visual, auditory, tactile and silent-naming
  imagery of the same object'
provider: OpenNeuro ds004514
citation: Rybar, M., Poli, R. and Daly, I., 2024. Using data from cue presentations results in grossly
  overestimating semantic BCI performance. Scientific Reports 14(1), p.28003. Also Rybar, Poli and Daly,
  2021, Journal of Neural Engineering 18(4), p.046035; and Rybar, 2023, doctoral dissertation, University
  of Essex. Named in PROMPT.md 52.4, 52.5 and 58.4.
urls:
- https://openneuro.org/datasets/ds004514
- https://doi.org/10.18112/openneuro.ds004514.v1.1.2
access: held
licence:
  name: CC0-1.0
  redistribution: permitted
  commercial: permitted
  notes: 'RESOLVED FROM THE HELD FILES, 2026-08-18. dataset_description.json declares "License": "CC0"
    and nothing in the tree qualifies it. The card read ''unresolved'' in all four fields until then.
    NOTE rule 7: this never gated the fetch and never could -- reading, loading and fitting are internal
    private research. What it changes is that win.licences.release_gate will pass this source at the point
    of outward publication. The STIMULI are 36 object PNGs whose provenance the deposit does not state;
    they are covered by the deposit''s own CC0 declaration as deposited, and that is the depositor''s
    claim rather than an independent one.'
binding: bound
population:
  n: 12
  hierarchy:
  - participant
  - run
  notes: 'MEASURED FROM DISK 2026-08-18, and it is PEOPLE, not directories: participants.tsv holds 12
    unique participant_id values against 12 subject directories, with NO grouping column, no repeated
    id and no note of a repeated participant. That question is asked because ds003670 answered it the
    other way -- 26 rows and 25 directories for 19 people, because a RepeatParticipants field grouped
    ids and a participant_id hold-out leaked 21 per cent of its cohort. Ages 20-57, 9 F and 3 M, all right-handed.
    The table opens with a UTF-8 BOM, so it must be read encoding="utf-8-sig"; with plain utf-8 the key
    column reads as an empty name and every lookup silently returns a default. There is ONE run per participant
    per modality and NO session level: the whole 70-minute protocol is one continuous BioSemi recording
    and one continuous NIRx recording. n=12 supports no population claim; the identifiable quantity is
    within-participant.'
frames:
- eeg_cap
- nirs_optode_array
- head
streams:
- name: eeg
  kind: measured
  via:
  - em_generation
  - em_coupling
  - device_coupling
  observation_chain: oriented cortical current-source state -> quasi-static volume conduction through
    brain, CSF, skull and scalp -> electrode contact geometry and impedance -> reference montage -> amplified,
    filtered, sampled voltage
  confounds:
  - 'ocular: blink and saccade corneo-retinal potentials -- and NO channel is labelled EOG here, so this
    floor is not subtracted the way BBBD''s six periocular electrodes allow. Eight EXG channels exist,
    of which the README names only EXG1 and EXG2 (earlobe references); the remaining six are typed MISC
    and described ''Miscellaneous'', so whether any of them faces an eye is UNKNOWN from the deposit'
  - 'cardiac: a plethysmograph channel (Plet) IS recorded, so pulse is measurable rather than assumed'
  - 'muscle: temporalis, frontalis and neck EMG'
  - electrode impedance drift, motion and bridging
  - line noise at 50 Hz and amplifier drift
  - reference-electrode activity, which is never inactive
  - the imagery cue is a WORD-free picture but the naming task is explicit, so speech-motor preparation
    is present on a fifth of trials by design
  systematic_bias: 'DEPOSITED RAW, which is rare and is worth a line of its own. eeg.json declares SoftwareFilters
    n/a and EEGReference n/a, and every one of 960 channel rows across 12 participants is status ''good''
    -- unflagged, which is not the same as verified clean. Nothing has been notched, referenced, ICA-cleaned
    or interpolated before deposit, so the CLAUDE.md hazard about a preprocessed deposit reporting a floor
    it already removed does not apply to this source: 50 Hz line noise and drift are still IN these bytes
    and a filter''s effect can be measured rather than assumed. THAT IS NOT THE SAME AS SAYING AN ENVIRONMENTAL
    FLOOR CAN BE QUOTED, and the difference is the one MEG-MASC''s floor turns on: an environmental floor
    is a variance share explained by REFERENCE CHANNELS that face the room and not the head, and this
    deposit has none -- 8 EXG, 2 GSR, a respiration belt, a plethysmograph and a temperature channel all
    face the person. So the environmental floor is absent here too, by KIND rather than by removal, which
    is the distinction notes/questions/2026-08-17-a-floor-that-was-removed-and-a-floor-that-does-not-exist.md
    draws.'
  band_hz:
  - 0.0
  - 1024.0
  temporal_support: EEG at 2048 Hz (BioSemi ActiveTwo) and fNIRS at 7.8125 Hz (NIRx NIRScoutXP continuous
    wave) -- MEASURED from the sidecars; the card said 'EEG at kHz; fNIRS at ~10 Hz' before 2026-08-18.
    Two native clocks and two physical processes with different time constants, over one ~72-minute session
    per participant. 14.60 h of EEG in total, 4232-4870 s per participant; fNIRS runs 4266-4903 s. Imagery
    periods are 3 s, cue images 0.6 s.
  spatial_support: 'co-registered EEG electrodes and fNIRS optodes on ONE NIRx NIRScap, and the two have
    DIFFERENT spatial supports -- a point contact against a banana-shaped photon path between one source
    and one detector -- so treating them as co-located is wrong. TWO POSITION FACTS MEASURED FROM DISK
    2026-08-18. (1) There is NO EEG electrode geometry in this deposit at all: zero _electrodes.tsv and
    zero EEG _coordsystem.json in 201 files, and the depositor''s own code/read_eeg.py calls mne.channels.make_standard_montage(''biosemi64'').
    So EEG positions here are a TEMPLATE supplied by the consumer, and rule 1 applies -- absent positions
    are unmeasured positions, not a default head. (2) fNIRS optode positions ARE present, in CapTrak metres
    with NAS/LPA/RPA fiducials, and they are a per-montage template rather than a per-head digitisation:
    sub-01..sub-06 share one byte-identical optodes.tsv and sub-07..sub-12 share another, so the coordinates
    do not vary between six different heads.'
  constrains:
  - device.contact_potential
  notes: 'MEASURED FROM THE HELD SIDECARS: BioSemi ActiveTwo at 2048 Hz, SoftwareFilters n/a, EEGReference
    n/a, and every one of 960 channel rows across 12 participants marked ''good'' -- unflagged, which
    is not the same as verified clean.  DEPOSITED RAW, which is rare enough to be the reason to hold it:
    nothing has been notched, referenced, ICA-cleaned or interpolated, so the full nyquist is real and
    DC-coupled rather than a claim about a filter nobody recorded.'
  rate_hz: 2048.0
  frame: eeg_cap
  support: sensor_array
  units: V
- name: fnirs
  kind: measured
  via:
  - neurovascular_coupling
  - vascular_flow
  - tissue_exchange
  observation_chain: neural activity -> haemodynamics -> HbO/HbR concentration change -> wavelength-dependent
    attenuation along a curved, partial-volume-weighted photon path through scalp, skull, CSF and cortex
    -> source-detector channel intensity at 785 and 830 nm -> DEPOSITED HERE AS RAW CONTINUOUS-WAVE AMPLITUDE
    IN VOLTS. The modified Beer-Lambert step has NOT been applied by the depositor, so the differential-pathlength
    assumption is the consumer's to make and to declare.
  confounds:
  - extracerebral scalp haemodynamics, which dominate short channels and leak into long ones -- and there
    are NO short channels here, so this cannot be separated
  - systemic blood pressure, heart rate and Mayer waves
  - optode-scalp coupling and hair-induced attenuation
  - differential pathlength factor not measured and not applied
  systematic_bias: 'Cortical haemodynamics OUTSIDE a scanner, simultaneously with electrophysiology. That
    combination is rare and is exactly the neurovascular-coupling evidence 16-17 need without the MR environment''s
    artifacts. TWO MONTAGES, NOT ONE, measured from disk 2026-08-18: sub-01..sub-06 carry 28 channels
    from 8 sources and 4 detectors, and sub-07..sub-12 carry 22 channels from 7 sources and 4 detectors.
    The fNIRS side is therefore SIX AND SIX with different spatial supports, not a cohort of twelve, and
    any statistic pooled across all twelve fNIRS participants is pooling two montages. The card declared
    one montage until 2026-08-18.'
  notes: 'MEASURED FROM THE HELD SIDECARS: NIRx NIRScoutXP continuous wave at 7.8125 Hz, two wavelengths
    (785 and 830 nm), and TWO MONTAGES rather than one -- sub-01..06 carry 28 channels from 8 sources
    and 4 detectors, sub-07..12 carry 22 from 7 and 4.  the band ceiling is 0.5 Hz and not the 3.9 Hz
    nyquist: that is where `blood.*` is declared meaningful, and above it what a CW-NIRS channel carries
    is cardiac and Mayer-wave systemic signal rather than cortical haemodynamics.  DEPOSITED AS RAW AMPLITUDE
    IN VOLTS: the modified Beer-Lambert step has NOT been applied, so the differential pathlength factor
    -- the dominant model discrepancy -- is deferred to the consumer rather than baked in, which is why
    this is worth holding.  cortical haemodynamics OUTSIDE a scanner, simultaneous with electrophysiology,
    is the neurovascular-coupling evidence the MR environment cannot give.'
  band_hz:
  - 0.0
  - 0.5
  constrains:
  - blood.deoxyhemoglobin
  - blood.oxygenation
  rate_hz: 7.8125
  frame: nirs_optode_array
- name: imagery_cues
  kind: context
  via: null
  systematic_bias: 'the cue is known, the imagined content is not observed, and there is NO vividness
    or compliance report anywhere in this deposit -- so unlike kamitani-perception-and-imagery-fmri there
    is not even a self-report that the participant complied. FOUR IMAGERY TASKS PER TRIAL, measured from
    the events 2026-08-18: visual, auditory and tactile imagery of the object plus silent naming, in that
    trial''s own randomised order, 3 s each. 1,080 animal and 1,080 tool trials, exactly 180 per task
    per participant, 12 of 12 participants, none short. The non-visual arms are the control this makes
    possible: same object, same cue, seconds apart, imagined in a modality that is not vision.'
  band_hz:
  - 0.0
  - 1.0
  constrains: []
  notes: 'context.  this is a DESIGN FACTOR -- a label naming which condition a block belonged to -- not
    a physical variable.  the same reading as eegmmidb''s `task_annotations`: it indexes the imposed stimulus
    rather than constraining any state, so it binds to nothing and that is correct, not missing.  and
    the sharper point: DURING IMAGERY THERE IS NO STIMULUS.  the four imagery tasks per trial -- visual,
    auditory, tactile and silent naming -- are instructions, and there is no vividness rating and no compliance
    report anywhere in this deposit, so not even a self-report stands behind the label.  the picture that
    was actually shown is the separate `stimulus_images` stream and that is where the imposed binding
    lives.'
- name: stimulus_images
  kind: imposed
  via:
  - transduction
  systematic_bias: 'The cue picture IS held -- 36 PNGs, 18 animals and 18 tools, named in every events
    row''s stim_file. So this deposit has a PERCEPTION event whose pixels are known, which BBBD does not.
    It is a thin perception condition and must be described as one: 0.6 s of a single masked object photograph
    on a 2560x1440 screen, not free viewing. ScreenDistance and ScreenSize are both ''n/a'' in the events
    sidecar, so THERE IS NO VISUAL-ANGLE AXIS in this deposit and a retinotopically addressed path cannot
    be entered from it without an assumed viewing distance.'
  band_hz:
  - 0.0
  - 2.0
  constrains:
  - device.display_luminance
  notes: 'imposed, and a real one: 36 PNGs are HELD -- 18 animals and 18 tools -- named in every events
    row''s stim_file, so this deposit has a perception event whose pixels are known.  describe it as the
    thin perception condition it is: 0.6 s of one masked object photograph on a 2560x1440 screen, not
    free viewing.  band to 2 Hz covers a 0.6 s presentation and its onset; the monitor''s own refresh
    is not recorded and no claim is made at it.  ScreenDistance and ScreenSize are both ''n/a'' in the
    events sidecar, which is why `retinal-world-geometry` still bites.'
  frame: display
- name: autonomic
  kind: measured
  via:
  - vascular_flow
  observation_chain: autonomic effector state -> skin conductance at two left-hand electrodes, thoracic
    circumference at a respiration belt, peripheral blood volume at a finger plethysmograph and skin temperature
    -> the SAME BioSemi ActiveTwo amplifier as the EEG, at 2048 Hz, on the same clock. These are peripheral
    measurements standing in for a systemic state, not measurements of that state.
  confounds:
  - movement of the hand moves the GSR electrodes and the plethysmograph, and the imagery tasks include
    a tactile one
  - the respiration belt measures thoracic circumference, which is posture as well as breathing
  - electrodermal response has a latency of seconds and cannot be aligned to a 3 s imagery period without
    a model
  - skin temperature drifts with room temperature over a 72-minute session and is not a brain signal
  systematic_bias: Two GSR electrodes on the left hand, a respiration belt, a plethysmograph and a temperature
    channel ride on the EEG amplifier at 2048 Hz. Not published as a modality by the depositor and found
    in channels.tsv; they are what makes the systemic component of the fNIRS signal measurable rather
    than assumed, which matters more here than usual because there are no short channels.
  band_hz:
  - 0.0
  - 0.5
  constrains:
  - blood.volume
  notes: 'FOUR SENSORS IN ONE STREAM, and only one of them maps onto a registered component.  two GSR
    electrodes on the left hand, a respiration belt, a finger plethysmograph and a skin temperature channel
    all ride on the EEG amplifier at 2048 Hz on the same clock; they are not published as a modality by
    the depositor and were found in channels.tsv.  the PLETHYSMOGRAPH is what is bound here, to `blood.volume`
    through `vascular_flow`, capped at the 0.5 Hz where that component is declared meaningful.  the other
    three are carried and constrain nothing: skin conductance has NO registered component at all (ONTOLOGY
    GAP -- there is no sudomotor or sympathetic-effector state), the belt measures thoracic circumference
    rather than any intracranial mechanical variable, and a fingertip skin temperature is not the `thermal.temperature`
    of a head volume.  this matters more here than usual because there are no short channels, so these
    are what makes the systemic component of the fNIRS signal measurable rather than assumed.'
  rate_hz: 2048.0
- name: optode_montage
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry, not evidence.  it supplies a support that a materialization is indexed over
    and constrains no ibm component; letting it update biology would turn a reconstruction into a measurement.  12
    _optodes.tsv and 12 _coordsystem.json are held, one per participant.  an EEG contact and an fNIRS
    channel have COMPLETELY DIFFERENT spatial supports -- a point against a banana-shaped photon path
    between one source and one detector -- so this geometry is what stops the two being treated as co-located,
    and `forbidden` now says so.'
absent:
- eeg_electrode_positions
- short_separation_fnirs_channels
- eog
- vividness_or_compliance_report
- screen_distance_and_size
- individual_anatomy
- fmri
- meg
- eye_tracking
requires:
- geometry: device-geometry
  for_streams:
  - eeg
  - fnirs
  severity: degrading
  without_it: 'Re-graded from blocking 2026-09-05, and the two halves have different evidence, so read
    them separately. fNIRS: SATISFIED IN THE HELD BYTES -- 12 sub-*_optodes.tsv and 12 sub-*_coordsystem.json
    are present, one per participant, so every source-detector pair is addressable and the two montages
    (28 channels for sub-01..06, 22 for sub-07..12) are distinguishable. EEG: NOT PRESENT -- there are
    zero _electrodes.tsv and zero EEG _coordsystem.json in this deposit, checked on disk. It is still
    degrading rather than blocking, following eegmmidb: `device.contact_potential` lives on `sensor_array`
    and a nominal montage addresses that support; what a missing digitisation blocks is the step from
    the cap to cortex, which is what the `cortical-support-bank` entry already blocks. The residual hazard
    is specific here and is now in `forbidden`: with template EEG positions and measured optode positions,
    the two modalities'' supports are known to different precisions and must not be treated as co-located.'
  substitute: The NIRScap's nominal 10-20 layout for the EEG electrodes, co-registered to the measured
    optode positions in the same cap. That inherits the optodes' registration and adds an unmeasured within-cap
    displacement, so the EEG's spatial uncertainty is strictly larger than the fNIRS's and must be carried
    as such.
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
use:
- fit
forbidden:
- ds004514/eeg -> a support co-located with ds004514/fnirs (a point contact and a photon path are different
  supports, and here they are known to different precisions)
- ds004514/* -> subject-specific EEG head geometry (no electrode digitisation is held)
- ds004514/imagery_cues -> verified imagined content (no vividness or compliance report exists anywhere
  in this deposit)
- ds004514/fnirs -> haemoglobin concentration without a declared pathlength factor (the deposit is raw
  amplitude and the modified Beer-Lambert step has not been applied)
split:
  group_by:
  - participant
  - stimulus
  notes: 'Stimulus is a real leakage axis: 36 images are each presented 60 times across the cohort, so
    a participant-only split still lets a model memorise the image set. fNIRS MONTAGE is a third axis
    and is not in this list because it is perfectly nested in participant -- but a fold that happens to
    put all six of one montage on one side is not a montage-balanced fold, and nothing in a participant-grouped
    split prevents that.'
