streams:
- name: distortion_correction
  kind: measured
  via: null
  systematic_bias: TOPUP and EDDY correct susceptibility and eddy-current distortion in EPI, which are
    GEOMETRIC errors of several millimetres near air cavities. Without correction, functional and structural
    images of the same brain do not align even under a perfect registration -- so this is a frame-graph
    edge whose necessity is physical (see scanner-field-maps-and-gradient-phantoms).
  band_hz:
  - null
  - null
  temporal_support: static for anatomy; the data's TR for functional processing
  spatial_support: registration, segmentation, diffusion modelling, distortion correction and statistics
    over volumetric images in the subject's or a template's space
- name: probabilistic_tissue_segmentation
  kind: measured
  via: null
  systematic_bias: FAST emits tissue PROBABILITIES rather than hard labels, which is the right form for
    a conductivity model that needs partial-volume-aware tissue assignment
  band_hz:
  - null
  - null
- name: bedpostx_and_probtrackx
  kind: measured
  via: null
  systematic_bias: see the fsl-probtrackx card
  band_hz:
  - null
  - null
- name: randomise_permutation_testing
  kind: measured
  via: null
  systematic_bias: permutation-based inference with proper family-wise error control is the statistical
    floor §46 requires, and it is what a naive cluster-forming threshold fails to provide
  band_hz:
  - null
  - null
