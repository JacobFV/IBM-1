# ibm-1 source card. schema: data/schema/source.schema.json
id: modeldb
title: ModelDB -- database of published computational neuroscience models
provider: Yale University / SenseLab
citation: McDougal et al., Twenty years of ModelDB and beyond. Journal of Computational Neuroscience 2017.
urls:
- https://modeldb.science/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved pending inspection of the distributed licence file. Code licence and bundled-data
    licence frequently differ and must be resolved separately.
binding: unbound
population:
  n: null
frames:
- arbitrary_state_space
streams:
- name: published_model_archive
  kind: measured
  via: null
  systematic_bias: Twenty-plus years of published model code with its parameters. Its indexing by MECHANISM
    -- this channel, this receptor, this phenomenon -- is what makes it usable as a source of candidate
    local interactions rather than a code dump. Models are archived as published, so they range from actively
    maintained to unrunnable, and the parameter values are frequently inherited through long citation
    chains ending in an animal preparation.
  notes: a parameter's provenance is often a citation to a citation; the original measurement and its
    conditions must be traced, not assumed
  band_hz:
  - null
  - null
  temporal_support: per-model
  spatial_support: the source code accompanying published computational neuroscience papers, indexed by
    cell type, region, channel, receptor and phenomenon
- name: mechanism_index
  kind: measured
  via: null
  systematic_bias: the mechanism-level index is the reusable structure and is directly relevant to how
    obj-interaction-classes should be organised
  band_hz:
  - null
  - null
absent:
- runnability
- human_relevance
- parameter_provenance
use:
- prior
forbidden:
- modeldb/* -> runtime dependency in a WIN query
split:
  group_by:
  - participant
provenance:
  imported_from: win-registry
  card: modeldb
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
