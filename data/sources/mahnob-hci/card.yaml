# ibm-1 source card. schema: data/schema/source.schema.json
id: mahnob-hci
title: MAHNOB-HCI -- multimodal affect and implicit tagging database
provider: Imperial College London
citation: Soleymani et al., A Multimodal Database for Affect Recognition and Implicit Tagging. IEEE Transactions
  on Affective Computing 2012.
urls:
- https://mahnob-db.eu/hci-tagging/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Academic licence; film clips are third-party copyright.
binding: unbound
population:
  n: 27
  hierarchy:
  - participant
  - session
  notes: 27 participants with 32-channel EEG, peripheral physiology, EYE TRACKING and six-camera video,
    watching film clips and tagged images.
frames:
- eeg_cap
- torso
- eye
- display
- camera
streams:
- name: eeg_32ch
  kind: measured
  via: null
  observation_chain: oriented cortical current-source state -> quasi-static volume conduction through
    brain, CSF, skull and scalp -> electrode contact geometry and impedance -> reference montage -> amplified,
    filtered, sampled voltage
  confounds:
  - 'ocular: blink and saccade corneo-retinal potentials'
  - 'cardiac: ECG contamination and pulse artifact'
  - 'muscle: temporalis, frontalis and neck EMG'
  - electrode impedance drift, motion and bridging
  - line noise and amplifier drift
  - reference-electrode activity, which is never inactive
  band_hz:
  - null
  - null
  temporal_support: EEG at 256 Hz; eye tracker at 60 Hz; video at 60 fps; all hardware-synchronised
  spatial_support: 32-channel EEG, peripheral sensors, a remote eye tracker and six synchronised cameras
    -- the most sensor-diverse affect dataset in the section
- name: eye_tracking
  kind: imposed
  via: null
  systematic_bias: gaze DURING an emotional film with simultaneous EEG and autonomic recording is the
    combination §20-22 want -- what the retina received, what the cortex did, and what the body did, at
    once
  band_hz:
  - null
  - null
- name: peripheral_physiology
  kind: measured
  via: null
  observation_chain: pulsatile arterial blood volume -> optical absorption change at the sensor site ->
    photodetector current -> sampled waveform
  confounds:
  - sensor placement and contact quality
  - motion artifact
  - respiratory-cardiac cross-coupling that makes the two streams non-independent
  band_hz:
  - null
  - null
- name: affect_ratings
  kind: imposed
  via: null
  systematic_bias: a report, not a state
  band_hz:
  - null
  - null
- name: multi_camera_video
  kind: measured
  via: null
  band_hz:
  - null
  - null
- name: audio
  kind: measured
  via: null
  band_hz:
  - null
  - null
- name: film_clip_stimuli
  kind: measured
  via: null
  band_hz:
  - null
  - null
- name: implicit_tags
  kind: measured
  via: null
  band_hz:
  - null
  - null
absent:
- any_imaging
- individual_anatomy
- large_n
requires:
- geometry: device-geometry
  for_streams:
  - eeg_32ch
  severity: degrading
  without_it: A scalp voltage is a function of where the electrode sat. Without per-participant electrode
    positions carried as a device-geometry object there is no lead field for this montage, so nothing
    recorded here can be attributed to a cortical support -- only channel-space statistics remain.
  substitute: A nominal 10-20/10-10 template montage. It displaces every electrode in a head-size-dependent,
    spatially correlated way, so the resulting source-estimate error is systematic and structured rather
    than random, and it must be carried as uncertainty in every number derived from it.
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
- geometry: retinal-world-geometry
  for_streams:
  - eye_tracking
  severity: blocking
  without_it: A screen-coordinate gaze trace is not retinal input. Without the per-episode display, eye
    and gaze geometry there is no map from what was on the screen to what fell on the retina, and treating
    the stimulus as the input is exactly the modelling error retinalisation exists to prevent.
use:
- fit
forbidden:
- mahnob-hci/* -> cortical state without an explicit carded interaction
- mahnob-hci/affect_ratings -> limbic state observation
split:
  group_by:
  - participant
  - session
provenance:
  imported_from: win-registry
  card: mahnob-hci
