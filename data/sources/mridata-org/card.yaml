streams:
- name: raw_kspace_with_trajectories
  kind: measured
  via: null
  systematic_bias: Non-Cartesian trajectories (radial, spiral) make the k-space TRAJECTORY an explicit
    object rather than an implicit grid, which is precisely the representation §56.6's MR acquisition
    objects need. Gradient imperfection means the ACTUAL trajectory differs from the nominal one, and
    whether a measured trajectory is included is a per-dataset fact.
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: raw k-space datasets including non-Cartesian trajectories, with the TRAJECTORY distributed
    alongside -- which Cartesian-only collections do not need and non-Cartesian reconstruction cannot
    do without
- name: multi_vendor_examples
  kind: measured
  via: null
  systematic_bias: vendor differences in raw data conventions are a real interoperability problem and
    the reason ISMRMRD exists
  band_hz:
  - null
  - null
