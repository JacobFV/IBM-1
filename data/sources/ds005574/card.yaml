streams:
- name: ecog_during_naturalistic_listening
  kind: measured
  via: null
  observation_chain: local post-synaptic and spiking activity within a few millimetres of a contact ->
    extracellular potential -> potential difference against a reference contact whose own activity is
    in every number -> amplifier and filter -> sampled microvolts. No skull and no inverse problem. Passive
    listening, so there is no motor confound and no behavioural response -- and equally no behavioural
    check that the participant attended
  confounds:
  - the reference contact's own activity
  - the epileptogenic zone and interictal discharges, present by definition in a clinical cohort
  - anti-epileptic medication, often being tapered during monitoring
  - electrode placement follows a surgical hypothesis, so coverage is not a sample of the brain
  - 'hospital environment: sleep, arousal and drug state uncontrolled'
  - acoustic envelope, word frequency, syntactic structure and semantic content are all correlated in
    natural speech, so an effect attributed to one level is not separated from the others
  - attention and drowsiness over 30 minutes in a hospital bed are uncontrolled and unmeasured
  - the shipped high-gamma version is a derived view whose band and smoothing are fixed
  systematic_bias: The release ships LLM EMBEDDINGS of the transcript alongside the neural data. Those
    embeddings are a TEACHER representation, never an observation of anyone's language cortex, and their
    influence has to be earned on held-out prediction. Shipping them in the same archive as the measurements
    is exactly the confusion the role vocabulary exists to prevent.
  band_hz:
  - null
  - null
  temporal_support: a 30-minute continuous story with more than 5,000 words. The word-onset annotation
    is FORCE-ALIGNED, which is a fitted clock relation with residual error, while the audio-to-recording
    relation is a hardware one
  spatial_support: mixed grid, strip and depth coverage across 9 participants -- the union is broad and
    no individual has it
- name: shared_stimulus_across_participants
  kind: measured
  via: null
  systematic_bias: One stimulus heard by nine people with different electrode coverage is a natural test
    of whether a support mapping transfers across individuals -- and the shared stimulus means a participant-only
    split leaks completely.
  band_hz:
  - null
  - null
