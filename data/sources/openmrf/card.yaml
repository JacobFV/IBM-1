id: openmrf
title: OpenMRF -- open magnetic resonance fingerprinting resources
provider: MRF community
citation: "OpenMRF (named in PROMPT.md \xA752.12); Ma et al., Magnetic resonance fingerprinting. Nature\
  \ 2013."
access: reference
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved pending inspection of the distributed licence file. Code licence and bundled-data
    licence frequently differ and must be resolved separately.
binding: unbound
population:
  n: null
frames:
- scanner
- kspace
- parameter_space
streams:
- name: fingerprint_dictionary_matching
  kind: measured
  via: null
  systematic_bias: "MRF IS THE ARCHITECTURE'S OWN ARGUMENT IN MINIATURE: parameters are estimated by simulating\
    \ the forward physics and matching, rather than by inverting a closed-form model. \xA736 wants physical\
    \ modules pretrained and validated on physical truth, and a Bloch dictionary is exactly physical truth\
    \ for the spin system it describes."
  notes: the dictionary's parameter grid bounds what can be estimated, and effects outside the simulated
    model -- diffusion, exchange, motion -- have nowhere to go
  band_hz:
  - null
  - null
  temporal_support: a time series of hundreds to thousands of highly undersampled frames, whose temporal
    pattern is the encoding rather than a nuisance
  spatial_support: MRF acquires a transient signal EVOLUTION per voxel and matches it against a simulated
    DICTIONARY of Bloch-equation solutions; the dictionary is generated physics, not data
- name: bloch_simulation_dictionary
  kind: measured
  via: null
  systematic_bias: the dictionary is generated by the same Bloch solver B-WIN would need internally, which
    makes it a direct validation target
  band_hz:
  - null
  - null
absent:
- in_vivo_ground_truth
- effects_outside_the_dictionary
requires:
- geometry: mr-acquisition-objects
  severity: blocking
  without_it: This consumes raw acquisition data and emits images or parameter maps. Run as an offline
    oracle it needs the acquisition object as its input -- trajectory, coil sensitivities, sequence timing
    -- and without it there is nothing for the reconstruction to be a reconstruction OF.
use:
- surrogate
forbidden:
- openmrf/* -> runtime dependency in a WIN query
split:
  group_by:
  - participant
provenance:
  imported_from: win-registry
  card: openmrf
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
origin_kind: sourced
release: unresolved
provenance_note: provider identified; a direct url is not recorded
provenance_traced_from: a peer programme's card for the same corpus, which read the origin off the held
  dataset_description. the ORIGIN is recorded here; the peer is not cited, because a courier is not a
  source
