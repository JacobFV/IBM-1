# ibm-1 source card. schema: data/schema/source.schema.json
id: aneurisk
title: AneuRisk -- cerebral aneurysm geometry and centreline repository
provider: AneuriskWeb / Politecnico di Milano and collaborators
citation: AneuriskWeb project repository, Emory University and Politecnico di Milano.
urls:
- http://ecm2.mathcs.emory.edu/aneuriskweb/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved.
binding: bound
population:
  n: 100
  hierarchy:
  - participant
  notes: Around a hundred cases with reconstructed surfaces AND CENTRELINES with radius along them --
    the centreline representation is the part §56.3 wants.
frames:
- mesh_native
streams:
- name: centerlines_with_radius
  kind: measured
  constrains:
  - structural.lumen_radius
  - structural.segment_length
  via:
  - vascular_flow
  systematic_bias: AneuRisk distributes VESSEL CENTRELINE GRAPHS with radius, curvature and torsion as
    functions of arc length, computed by VMTK's maximal-inscribed-sphere method -- which makes it both
    a data source and a worked example of the target representation. The radius is a maximal inscribed
    sphere, which is a DEFINITION of radius and not the only one, and it is systematically larger than
    a cross-sectional-area-equivalent radius wherever the lumen is not circular, which at an aneurysm
    neck is everywhere.
  band_hz:
  - 0.0
  - 0.001
  temporal_support: not a time series
  spatial_support: vessel surface meshes plus CENTRELINE GRAPHS carrying radius, curvature and torsion
    as functions of arc length -- a tube-chain representation in all but name
  notes: 'this stream WAS context, and the reason it was is now closed.  the note it carried said: "the
    registry has NO component for vessel geometry.  `blood.volume` and `blood.flow` are per-tissue-element
    quantities and a lumen radius is not either of them.  so this enters as a geometric prior and constrains
    no state until a vascular product exists."  `structural.lumen_radius` and `structural.segment_length`
    exist now -- on the `structural` field with a support override to `vascular_tree`, because a resting
    calibre moves over days and `structural` is the field organised by that timescale -- and this is exactly
    the shape they were declared for.

    what it is still NOT is a measurement of a healthy person: the cohort is clinical, the geometry is
    a segmentation with a threshold in it, and the vessels are of the circle of Willis, three orders of
    magnitude above the capillary bed where all of the exchange happens.  it constrains the macro tree
    and nothing below it, which is what `forbidden` says.'
- name: vessel_surfaces
  kind: context
  via: null
  observation_chain: clinical 3D rotational angiography or CTA -> segmentation -> surface reconstruction
    -> centreline extraction. Each stage is a derivation and only the first is a measurement
  confounds:
  - segmentation threshold determining apparent lumen radius
  - clinical population with altered haemodynamics
  - surface smoothing altering curvature and torsion
  systematic_bias: Derived geometry with an unusually well-documented derivation chain.
  notes: 'context: geometry, not evidence.  it supplies a support that a materialization is indexed over
    and constrains no ibm component; letting it update biology would turn a reconstruction into a measurement.  derived
    geometry with an unusually well-documented derivation chain; curvature and torsion are second derivatives
    of a smoothed surface and are highly sensitive to the smoothing.'
  band_hz:
  - 0.0
  - 0.001
  constrains: []
- name: curvature_and_torsion
  kind: context
  via: null
  systematic_bias: arc-length profiles of curvature and torsion are directly the statistics §56.3's stochastic
    microvascular ensembles must be conditioned on
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context, and a DUPLICATE carried over from the migration: it describes the same bytes as `centerlines_with_radius`,
    which is where the likelihood is written.  kept so the card still describes the archive it came from,
    bound to nothing so one measurement is not counted twice.  arc-length profiles of the same centrelines.'
- name: aneurysm_annotations
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context, and it is a decision.  a parcellation, an annotation or a label set is a COVER over
    a carrier (ARCHITECTURE.md §2): it says which points a name collects, not what value any ibm component
    takes at them.  no registered component is a region label.  it reaches a materialization as a support
    index and as a `prior`, never as a likelihood.  an expert label of where a lesion is.'
- name: clinical_metadata
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: context.  a behavioural score, rating or questionnaire response is a report ABOUT a state, produced
    by a person rather than by a process the model represents, and often minutes later.  no registered
    component is a score, and treating one as a measurement would let a self-report update tissue state
    directly.
absent:
- parent_imaging_for_all_cases
- healthy_cohort
- venous_tree
- capillary_scale
- flow_measurement
use:
- calibrate
- fit
forbidden:
- aneurisk/* -> flow or pressure state
- aneurisk/* -> an absolute lumen calibre; the segmentation threshold is free and the maximal-inscribed-sphere
  radius overestimates a non-circular lumen
- aneurisk/* -> healthy vascular geometry; the cohort is aneurysmal and the haemodynamics that shaped
  these vessels are the pathology
- aneurisk/* -> capillary-scale or microvascular geometry; the release stops at the circle of Willis
split:
  group_by:
  - participant
provenance:
  imported_from: win-registry
  card: aneurisk
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
