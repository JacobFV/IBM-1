id: depth-scene-geometry-models
title: Monocular depth and scene-geometry model family
provider: multiple -- MiDaS, Depth Anything, DUSt3R and successors
citation: "PROMPT.md \xA753.3, 'depth and scene-geometry models'."
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Model weights, code and training data commonly carry THREE different licences, and a permissive
    code licence says nothing about the weights. Unresolved.
binding: unbound
population:
  n: null
frames:
- image_plane
- camera_frame
- world
streams:
- name: estimated_scene_geometry
  kind: measured
  via: null
  systematic_bias: "\xA748 and registry/README: TEACHER IS NOT OBSERVATION. This model's representations\
    \ are a discrepancy-aware forcing CANDIDATE, never automatically a subject likelihood. \xA729: influence\
    \ starts low and is earned through held-out prediction. Relevant beyond vision: \xA756.5's retinal/world\
    \ geometry needs a WORLD to intersect gaze rays with, and for a screen-presented stimulus that world\
    \ is a flat display plane -- but for egocentric video (ego4d, project-aria, hd-epic) it is a real\
    \ 3D scene that must be estimated. HD-EPIC's scanned kitchens are the measured alternative; these\
    \ models are the estimated one, and the difference between them is measurable where both exist."
  notes: MONOCULAR DEPTH IS SCALE-AMBIGUOUS IN PRINCIPLE. Most models output relative depth and the metric
    scale is either assumed or supplied externally; a 3D reconstruction with an unknown scale factor cannot
    place a gaze ray
  band_hz:
  - null
  - null
  temporal_support: per frame
  spatial_support: per-pixel depth or 3D position, recovering a SCENE GEOMETRY from a monocular image
    -- converting a 2D stimulus into a 3D world estimate
absent:
- metric_scale
- uncertainty
- measured_geometry
use:
- distil
forbidden:
- depth-scene-geometry-models/* -> observation-role likelihoods
- depth-scene-geometry-models/* -> B-WIN's state ontology or support definitions
split:
  group_by:
  - participant
  - stimulus
provenance:
  imported_from: win-registry
  card: depth-scene-geometry-models
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
distillation:
  reported_accuracy:
    metric: unresolved
    value: null
    on_streams:
    - estimated_scene_geometry
    source: not yet extracted from the paper
    verified: false
  precision_model:
    form: unresolved
    ood_inflation_prior: unset -- must be a prior, not a constant
    error_rank: unresolved -- a teacher's residuals covary across everything it writes
    notes: distilled values enter as evidence and must carry calibrated precision; see ARCHITECTURE.md,
      distillation precision
    correlated_fraction: null
    effective_constraints: null
origin_kind: class
provenance_note: a CLASS of resource rather than one dataset; the provider field names a literature or
  model family. a single origin url would be a fiction
provenance_traced_from: a peer programme's card for the same corpus, which read the origin off the held
  dataset_description. the ORIGIN is recorded here; the peer is not cited, because a courier is not a
  source
