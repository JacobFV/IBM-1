streams:
- name: bold_movie
  kind: measured
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY (PROMPT.md §17): the vascular stage is a
    modelled state, not a nuisance to be regressed away'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  systematic_bias: 7T at 1.4 mm reaches laminar-adjacent scales in some regions; the draining-vein bias
    is correspondingly more, not less, important.
  band_hz:
  - null
  - null
  temporal_support: TR 2 s BOLD; film at 25 fps; audio at 44.1 kHz; eight run segments with known overlaps
    -- the segment boundaries are a real discontinuity in the world clock
  spatial_support: 1.4 mm 7T BOLD in the audio-movie arm; 3T for the audio-visual arm; individual surfaces;
    documented display and projector geometry
- name: film_stimulus
  kind: imposed
  via: null
  systematic_bias: '§51.1 item 3: use the same film as a cross-instrument WORLD TRAJECTORY. It does NOT
    follow that the fMRI and MEG recordings are simultaneous -- they are not, and treating them as one
    episode is the error this note exists to prevent.'
  band_hz:
  - null
  - null
- name: stimulus_narration_transcript
  kind: imposed
  via: null
  systematic_bias: 'HELD and read: stimuli/annotations/german_audio_description.csv, 573 timed segments,
    6414 words, spanning 1.3-7084.3 s of the film. Three facts a consumer needs and no publication states.
    (1) It covers 27.5% of the timeline; the other 72.5% is UN-NARRATED FILM, which is neither silence
    nor the absence of language -- it is the absence of an annotation, and bwin.audio.narration_at returns
    MISSING there rather than zero. (2) Segments carry start, end and text and NO word onsets, so anything
    at word or phoneme resolution is derived, not measured. (3) This is the audio-description narration,
    a separate speaker describing the scene; it is NOT a transcript of the film''s own dialogue, and treating
    it as one would attribute a describer''s syntax to Tom Hanks.'
  band_hz:
  - null
  - null
- name: stimulus_scene_annotation
  kind: imposed
  via: null
  systematic_bias: 'HELD and read: stimuli/annotations/scenes.csv, 198 scene onsets from 17.0 to 6944.0
    s with location, time-of-day and interior/exterior. Onsets only -- a scene''s extent is the next onset,
    which makes the final scene''s end unstated rather than equal to the film''s.'
  band_hz:
  - null
  - null
- name: angiography
  kind: measured
  via: null
  observation_chain: flow-related enhancement (TOF) or contrast bolus -> vessel-lumen intensity -> reconstruction
    -> angiographic volume; slow and in-plane flow are systematically under-represented
