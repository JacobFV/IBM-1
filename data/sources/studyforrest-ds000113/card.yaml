id: studyforrest-ds000113
title: StudyForrest core -- ds000113, audio-visual Forrest Gump fMRI
provider: StudyForrest project / OpenNeuro ds000113
citation: Hanke et al., A high-resolution 7-Tesla fMRI dataset from complex natural stimulation with an
  audio movie. Scientific Data 2014; Hanke et al., Scientific Data 2016.
urls:
- https://www.studyforrest.org/
- https://openneuro.org/datasets/ds000113
access: held
licence:
  name: PDDL-1.0
  redistribution: permitted
  commercial: permitted
  notes: 'The held dataset_description.json carries an EMPTY License field -- "License": "". That is not
    CC0: the three other OpenNeuro datasets in this store (ds000117, ds002336, ds004024) all state "CC0"
    explicitly, so the blank is a real gap in the upstream metadata and not a house style. The FILM ITSELF
    is third-party copyright and is NOT redistributable under any project licence; obj-licence-lineage
    must keep stimulus and response lineage separate. In this snapshot the point is moot in one direction
    -- the film is not held. The HELD dataset_description.json declares License as an EMPTY STRING --
    present and blank, so the deposit itself states nothing and the field cannot be read off the bytes.
    The project states the terms: studyforrest.org says the data is ''liberally licensed (PDDL)'', linking
    opendatacommons.org/licenses/pddl/1-0/. PDDL 1.0 is a public-domain dedication: redistribution permitted,
    commercial use permitted, no share-alike, no attribution condition (attribution is requested as a
    norm, not required as a term). No DUA; held here from an anonymous OpenNeuro fetch. NOTE the site''s
    own CC-BY-SA applies to the WEBSITE TEXT and not to the data -- two different licences on one page,
    and taking the more visible one would have been wrong.'
binding: unbound
population:
  n: 4
  hierarchy:
  - participant
  - session
  - run
  notes: 'HELD: 4 participants (sub-01 .. sub-04), measured 2026-08-15. The participants.tsv in the same
    directory has 37 rows and the README describes 20 for the movie arm; n_participants is the HELD number
    because that is what a slice can draw on. Audio-description version for the 3T/7T audio-movie arm;
    audio-visual version for the movie arm. They are DIFFERENT stimuli and different participant sets.
    CORRECTED 2026-08-16: of those 37 rows, ONE IS A SCANNER PHANTOM (''phantom'', n/a in every other
    column), so the table describes 36 people.'
