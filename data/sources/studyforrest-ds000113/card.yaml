requires:
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
- geometry: retinal-world-geometry
  for_streams:
  - bold_movie
  - film_stimulus
  - eye_tracking
  severity: blocking
  without_it: A screen-coordinate gaze trace is not retinal input. Without the per-episode display, eye
    and gaze geometry there is no map from what was on the screen to what fell on the retina, and treating
    the stimulus as the input is exactly the modelling error retinalisation exists to prevent.
- geometry: vascular-products
  for_streams:
  - angiography
  severity: blocking
  without_it: An angiographic volume is an image of a lumen, not a vessel. Without the vascular product
    -- a resolved graph carrying radius, topology and territory -- there is no vessel for this evidence
    to constrain and no way to say which cortical support any of it supplies.
- geometry: tract-path-products
  severity: blocking
  without_it: A diffusion volume is a field of orientations attached to no pathway. Until the tract product
    exists there is no engineered claim of the form 'this tract transmits between these two supports',
    so this source can constrain local microstructure but no interaction between supports.
use:
- fit
forbidden:
- studyforrest-ds000113/* -> millisecond cortical dynamics
- studyforrest-ds000113/film_stimulus -> retinal input without a gaze model
- studyforrest-ds000113/* -> white-matter microstructure or tract geometry (no diffusion volumes are held)
- studyforrest-ds000113/* -> any claim about the acoustic or visual stimulus (the film is not held)
- studyforrest-ds000113/angiography -> venous geometry, and studyforrest-ds000113/susceptibility_venography
  -> arterial geometry (TOF is inflow-enhanced and venography is susceptibility-weighted; each is blind
  to the other's vessels by construction, so neither may stand in for it)
split:
  group_by:
  - participant
  - stimulus
  - run
  notes: 'one film across all participants: the stimulus axis is fully shared and a participant-only split
    leaks completely'
