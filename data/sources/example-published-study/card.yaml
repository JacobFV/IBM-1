id: example-published-study
title: A worked-example coordinate table -- SYNTHETIC, no such paper exists
provider: this repository
citation: None. There is no such study. This card exists so that the lineage of the worked example that
  names it resolves, rather than dangling.
access: reference
licence:
  name: not applicable -- no third-party material
  redistribution: permitted
  commercial: permitted
  notes: Deliberately permissive and deliberately RESOLVED. A synthetic placeholder must not poison the
    licence of anything downstream of it, because it contributes no third-party material -- but it must
    also not silently look like real evidence, which is what the negative_control role and the title are
    for.
binding: unbound
population:
  n: 0
  notes: Nobody was scanned. The 'reported peak coordinates' this stands in for are numbers chosen to
    exercise the reconstruction path in bwin.geometry.literature.
frames:
- MNI152NLin2009cAsym
streams:
- name: coordinate_table
  kind: measured
  via: null
  systematic_bias: Total. These coordinates describe nobody's brain. The card exists so that `win registry
    attribution example-cortical-patch-from-coordinates` resolves to a lineage instead of refusing, and
    so that anything accidentally built on it is visibly built on a negative control.
  notes: 'Unbounded, and the question does not apply: there is no quantity this is a discrepant estimate
    of.'
  band_hz:
  - null
  - null
  temporal_support: not a time series
  spatial_support: a handful of peak coordinates with cluster extents, as a coordinate table in a paper
    would report them
absent:
- everything
use:
- control
forbidden:
- example-published-study/* -> any state of any participant
- example-published-study/* -> any parameter of any mechanism
- example-published-study/* -> any claim about a brain
split:
  group_by:
  - participant
  notes: The schema requires a grouping level and there are no participants to group, so this names the
    level that would apply if there were. If this source ever appears on either side of a real split,
    something has gone wrong upstream of the split -- it is a negative control, not evidence.
provenance:
  imported_from: win-registry
  card: example-published-study
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
origin_kind: authored
provenance_note: 'synthesized by a peer programme on this machine, not obtained from an external provider.
  credited as authorship: the artefact exists because that programme produced it'
provenance_traced_from: a peer programme's card for the same corpus, which read the origin off the held
  dataset_description. the ORIGIN is recorded here; the peer is not cited, because a courier is not a
  source
