# ibm-1 source card. schema: data/schema/source.schema.json
id: neuroquery
title: NeuroQuery -- predictive meta-analytic mapping from arbitrary text
provider: INRIA Parietal / Gael Varoquaux and collaborators
citation: Dockes et al., NeuroQuery, comprehensive meta-analysis of human brain mapping. eLife 2020.
urls:
- https://neuroquery.org/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved. §49.2 records that the predecessor's attribution generator tracked each source's
    known bias and licence rather than treating atlas availability as correctness; that practice is preserved
    by leaving this unresolved and counting it.
binding: unbound
population:
  n: null
frames:
- MNI152
streams:
- name: text_to_map_prediction
  kind: measured
  via: null
  systematic_bias: NeuroQuery PREDICTS a map from text. Its output for a query never seen in the literature
    is an EXTRAPOLATION of a regression model, not a summary of evidence, and nothing in the output distinguishes
    the two cases. That is a sharper hazard than Neurosynth's, because it always returns a plausible-looking
    map.
  notes: the model smooths over the literature; a confident-looking map may rest on no study at all
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: a PREDICTIVE model mapping arbitrary free text to a predicted whole-brain activation
    map, trained on 13,000+ full-text articles
- name: literature_coverage
  kind: measured
  via: null
  systematic_bias: querying a term with no literature and getting a map back is a useful demonstration
    of what the tool is
  band_hz:
  - null
  - null
absent:
- participant_level_data
- evidence_count_per_query
- population
requires:
- geometry: cortical-support-bank
  severity: blocking
  without_it: A parcellation or a surface map is a COVER, not an element of the brain's ontology. Without
    the support bank there is nothing for these labels to be a cover OVER, and using them as if they were
    the supports themselves is precisely the canonical-parcellation commitment the architecture refuses.
use:
- calibrate
- prior
forbidden:
- neuroquery/* -> observation-role likelihoods
- neuroquery/* -> instantaneous subject state
- neuroquery/* -> claims about queries outside the literature's coverage
- neuroquery/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
provenance:
  imported_from: win-registry
  card: neuroquery
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
