# ibm-1 source card. schema: data/schema/source.schema.json
id: biot
title: BIOT -- cross-data biosignal transformer
provider: University of Illinois and collaborators
citation: 'Yang et al., BIOT: Cross-data Biosignal Learning in the Wild. NeurIPS 2023.'
urls:
- https://github.com/ycq091044/BIOT
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Model weights, code and training data commonly carry THREE different licences, and a permissive
    code licence says nothing about the weights. Unresolved.
binding: unbound
population:
  n: null
frames:
- eeg_cap
- torso
streams:
- name: heterogeneous_channel_tokenisation
  kind: measured
  via: null
  systematic_bias: '§48 and registry/README: TEACHER IS NOT OBSERVATION. This model''s representations
    are a discrepancy-aware forcing CANDIDATE, never automatically a subject likelihood. §29: influence
    starts low and is earned through held-out prediction. §53.2: the test is NOT leaderboard accuracy.
    It is whether a representation survives new montages, devices, subjects, tasks and physically different
    observation supports WITHOUT SILENTLY LEARNING CHANNEL IDENTITY AS ANATOMY. Its architectural contribution
    is genuinely relevant: treating each channel as an independent token stream with its own rate avoids
    the common-grid resampling that §33 objects to. It still identifies channels by index and carries
    no geometry, so it addresses the CLOCK half of the problem and not the SPACE half.'
  band_hz:
  - null
  - null
  temporal_support: per-channel native rates handled by per-channel tokenisation rather than by resampling
    to a common grid -- which is closer to §33's native-clock position than most of §53.2
  spatial_support: biosignal channels tokenised INDEPENDENTLY and concatenated, so different channel counts,
    sampling rates and even different signal types (EEG, ECG) can be mixed in one sequence
- name: cross_signal_type_transfer
  kind: measured
  via: null
  systematic_bias: 'transfer between EEG and ECG is a test of generality and also a warning: a representation
    general enough to span both may be capturing something generic about biosignals rather than anything
    about cortex'
  band_hz:
  - null
  - null
absent:
- electrode_geometry
- forward_model
- uncertainty
requires:
- geometry: device-geometry
  severity: degrading
  without_it: This model's channel axis is a set of names, not a set of positions -- the channel-identity
    problem exactly. Its representation can be computed without any geometry, but relating it to a cortical
    support, or transferring it to a montage it was not trained on, requires the electrode or sensor geometry
    that the name stands in for.
  substitute: Channel-name matching, which silently asserts that two electrodes sharing a label sat in
    the same place on two different heads.
use:
- distil
- evaluate
forbidden:
- biot/* -> observation-role likelihoods
- biot/* -> B-WIN's state ontology or support definitions
split:
  group_by:
  - participant
  - stimulus
provenance:
  imported_from: win-registry
  card: biot
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
distillation:
  reported_accuracy:
    metric: unresolved
    value: null
    on_streams:
    - heterogeneous_channel_tokenisation
    - cross_signal_type_transfer
    source: not yet extracted from the paper
    verified: false
  precision_model:
    form: unresolved
    ood_inflation_prior: unset -- must be a prior, not a constant
    error_rank: unresolved -- a teacher's residuals covary across everything it writes
    notes: distilled values enter as evidence and must carry calibrated precision; see ARCHITECTURE.md,
      distillation precision
    correlated_fraction: null
    effective_constraints: null
