# ibm-1 source card. schema: data/schema/source.schema.json
id: mous
title: MOUS -- Mother Of Unification Studies, MEG and fMRI language comprehension
provider: Donders Institute
citation: Schoffelen et al., A 204-subject multimodal neuroimaging dataset to study language processing.
  Scientific Data 2019.
urls:
- https://data.ru.nl/collections/di/dccn/DSC_3011020.09_236
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Donders Repository terms with a data-use agreement. Unresolved.
binding: partial
population:
  n: 204
  hierarchy:
  - participant
  - session
  - run
  notes: 204 participants split between MEG and fMRI arms, each reading or listening to sentences and
    word lists. Different people in the two arms.
frames:
- meg_device
- head_fiducial
- scanner
- subject_native
- MNI152
streams:
- name: meg
  kind: measured
  via:
  - em_generation
  observation_chain: oriented cortical current-source state -> quasi-static magnetic field (primary current
    plus volume-current return) -> pickup-coil geometry, orientation and gradiometer configuration ->
    SQUID flux -> sampled channel
  confounds:
  - environmental magnetic interference and urban noise
  - head motion within and between runs
  - ocular and cardiac fields
  - muscle artifact at high frequency
  - SQUID jumps and sensor drift
  systematic_bias: Individual anatomy for every participant is unusual at this n and makes the forward
    model subject-specific rather than template-based.
  band_hz:
  - 0.0
  - 200.0
  temporal_support: MEG at 1200 Hz; BOLD at TR 2 s; sentences and word lists as discrete trials
  spatial_support: 275-channel CTF axial gradiometers; 3 mm BOLD; individual anatomy for all participants
  constrains:
  - electromagnetic.bfield
  notes: 'MEG at 1200 Hz on a 275-channel CTF AXIAL GRADIOMETER array, with INDIVIDUAL ANATOMY FOR EVERY
    PARTICIPANT -- unusual at n=204 and it is what makes the forward model subject-specific rather than
    template-based.  ceiling at 200 Hz rather than the 600 Hz nyquist, the same judgement meg-masc and
    hcp-meg record.  `em_generation` alone: a pickup coil has no contact interface.  em_generation is
    what produces the magnetic field from source currents; the previous chain named vascular_flow, which
    is unrelated.'
  rate_hz: 1200.0
  frame: meg_device
  units: T
- name: bold
  kind: measured
  via:
  - em_generation
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY (PROMPT.md §17): the vascular stage is a
    modelled state, not a nuisance to be regressed away'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  band_hz:
  - 0.0
  - 0.25
  constrains:
  - electromagnetic.bfield
  notes: 'TR 2 s, 3 mm, in the same participants as the MEG but NOT SIMULTANEOUSLY -- two acquisitions
    of one design, which is a within-person comparison and not one episode.  ceiling is the TR nyquist.  BOLD
    IS NOT NEURAL ACTIVITY, and the four-step chain is what says so: neurovascular coupling, then flow,
    then tissue exchange, then the susceptibility change deoxyhaemoglobin makes -- which is why the component
    is `electromagnetic.bfield` and not a neural one.  the vascular stages are modelled state, not nuisance
    to be regressed away.  em_generation is what produces the magnetic field from source currents; the
    previous chain named vascular_flow, which is unrelated.'
  rate_hz: 0.5
  frame: scanner
- name: sentence_vs_wordlist_contrast
  kind: context
  via: null
  systematic_bias: the sentence/word-list contrast is a designed manipulation of compositional structure
    holding lexical content largely constant
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context.  this is a DESIGN FACTOR -- a label naming which condition a block belonged to -- not
    a physical variable.  the same reading as eegmmidb''s `task_annotations`: it indexes the imposed stimulus
    rather than constraining any state, so it binds to nothing and that is correct, not missing.  it is
    a good design factor -- compositional structure manipulated with lexical content held largely constant
    -- and it is still a condition label rather than a physical variable.  the physical variables are
    `audio_stimuli` and `visual_sentence_stimuli`.'
- name: audio_and_visual_stimuli
  kind: context
  via: null
  systematic_bias: the same sentences presented in BOTH auditory and visual modality -- a modality crossing
    that separates acoustic from amodal linguistic responses
  band_hz:
  - null
  - null
  constrains: []
  notes: 'context, and a DUPLICATE carried over from the migration: it describes the same bytes as `audio_stimuli`
    and `visual_sentence_stimuli`, which is where the likelihood is written.  kept so the card still describes
    the archive it came from, bound to nothing so one measurement is not counted twice.  what this entry
    adds is the MODALITY CROSSING: the same sentences presented both ways, which is what separates an
    acoustic response from an amodal linguistic one.'
- name: t1w
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry.  the anatomical volume the supports are indexed over.  as ds004024''s card
    records, a T1 would genuinely bind to `material.conductivity` and `material.mass_density` once a head
    model exists to put the values into -- but a material value asserted for a conductor nobody can address
    is not evidence, so it stays context until the support bank exists.  present for every participant.'
- name: dwi
  kind: measured
  via:
    structural.fiber_orientation:
    - tract_propagation
    structural.axonal_density: &id001
    - plasticity
    structural.myelination: *id001
  band_hz:
  - 0.0
  - 0.001
  constrains:
  - structural.fiber_orientation
  - structural.axonal_density
  - structural.myelination
  notes: 'ORIENTATION EVIDENCE, and the distinction is the whole binding.  what a diffusion volume measures
    is direction-dependent attenuation of water displacement, which constrains LOCAL microstructure --
    fibre orientation, axonal density, myelination -- and does NOT observe a tract: a tractogram is a
    reconstruction laid over this field and is context wherever it appears in this corpus.  static band
    because microstructure is a tissue parameter.  the via chain follows the corpus convention set by
    tractoinferno, ds000117 and aomic-id1000: `plasticity` is named because it is the process that writes
    the structural field, though its declared outputs cover density and myelination and NOT `structural.fiber_orientation`,
    which no registered process writes.  per-component chains: this acquisition makes more than one claim
    and the routes differ.  one chain for all of them would let the component whose route is wrong borrow
    the route of the ones that are right.'
  frame: subject_native
- name: audio_stimuli
  kind: imposed
  via:
  - transduction
  band_hz:
  - 20.0
  - 8000.0
  constrains:
  - device.speaker_pressure
  notes: 'imposed, and a CORRECTION: the migration marked this `measured`, but a spoken sentence played
    to a participant is state the experimenter clamped, not a sample from the brain''s joint distribution.  bound
    on the display support through `transduction`, which is where the registry reads speaker pressure.  the
    ceiling is a conservative speech bandwidth rather than a file nyquist, because the deposit''s audio
    sampling rate is not recorded on this card and the bytes are not held.'
  frame: display
- name: visual_sentence_stimuli
  kind: imposed
  via:
  - transduction
  band_hz:
  - 0.0
  - 2.0
  constrains:
  - device.display_luminance
  notes: 'imposed, same correction: the visually presented half of the same sentences, clamped on the
    display support.  the band covers word-by-word presentation and its onsets; no monitor refresh, size
    or distance is recorded here, so nothing faster and nothing retinal is claimed.'
  frame: display
- name: behaviour
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: context.  a phenotype, a demographic field, a questionnaire score or a genotype is a property
    of a PERSON rather than a value of any state variable at any time.  the registry has no component
    for any of them and should not acquire one; they belong in `split` and in covariates, not in a likelihood.
absent:
- simultaneous_meg_and_fmri
- eye_tracking
- ieeg
- vascular
requires:
- geometry: device-geometry
  for_streams:
  - meg
  severity: blocking
  without_it: 'The MEG forward model is dominated by sensor pose relative to the head. KEPT BLOCKING,
    and the reason is that the bytes are NOT HELD (access: priority), so nothing could be checked on disk.
    A CTF .ds is documented to carry its .res4 sensor description and .hc head-coil positions, and this
    card records individual anatomy for every participant, so the expectation is that this re-grades to
    degrading the day the bytes arrive -- but re-grading now would be an assumption, which is what this
    field exists to prevent. Compare mne-spm-face, which was re-graded because the .res4 and .hc were
    read off disk.'
  substitute: None while unheld.
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
- geometry: tract-path-products
  severity: degrading
  without_it: 'A diffusion volume is a field of orientations attached to no pathway. Re-graded to degrading
    and unscoped 2026-09-05 on the entry''s own logic, which already said the source ''can constrain local
    microstructure but no interaction between supports'': local microstructure is exactly what the `dwi`
    stream binds -- `structural.fiber_orientation`, `structural.axonal_density` and `structural.myelination`
    -- so the missing product does not stand between that stream and its components. What it blocks is
    any claim of the form ''this tract transmits between these two supports'', and no stream in this card
    makes one. This is the same reading ds000117, tractoinferno and aomic-id1000 already carry.'
  for_streams: []
use:
- fit
forbidden:
- mous/meg -> a simultaneous episode with mous/bold (the two acquisitions are separate sessions of one
  design)
- mous/dwi -> a measured connection (orientation evidence is not a tract)
- mous/* -> a linguistic effect separated from an acoustic one without an explicit acoustic model
split:
  group_by:
  - participant
  - stimulus
provenance:
  imported_from: win-registry
  card: mous
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
