- name: pet_metabolic
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: context.  a parcel-level PET summary aggregated across studies is a group mean of a quantity
    whose units differ by tracer and by quantification method.  the registry's `metabolic.*` components
    are per-tissue-element values in declared units; this is not commensurable with them and normalising
    it to a common scale would hide that rather than fix it.
- name: gene_expression
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context, and here the ontology genuinely has no place for it: transcript abundance is not a
    registered component and the six donors behind AHBA are not the population being fitted.'
- name: receptor_density
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context.  see the hansen-receptors card: receptor DENSITY is a tissue composition parameter
    and the registry declares none.  `extracellular.*` are neurotransmitter CONCENTRATIONS, which is a
    different quantity with different units, and binding a receptor map to one of them would be a category
    error dressed as evidence.'
- name: laminar_thickness
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: context.  a per-parcel laminar thickness is anatomy -- geometry of the support -- and the registry
    has no laminar-thickness component; `structural.dendritic_density` is a density, not a depth.
absent:
- per_participant_networks
- edge_uncertainty
- path_geometry
- directionality
- tractography_provenance
use:
- fit
- prior
split:
  group_by:
  - participant
  notes: 'a group consensus: it is held out of nothing and must be trusted for nothing on its own. No
    per-participant network is redistributed here, so it cannot leak an individual into a split -- and
    equally cannot serve as an observation of one.'
