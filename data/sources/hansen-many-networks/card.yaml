id: hansen-many-networks
title: 'Hansen many-networks: ten annotation and connectivity networks on three shared parcellations'
provider: netneurolab (Bratislav Misic lab), McGill University
citation: Hansen et al. 2023, PLOS Biology. Repository netneurolab/hansen_many_networks. Cammoun et al.
  2012 parcellation; Schaefer et al. 2018 parcellations.
urls:
- https://github.com/netneurolab/hansen_many_networks
access: held
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: The repository carries no LICENSE file. Unresolved gates DISTRIBUTION only and never reading,
    loading, computing with or fitting to this evidence; win.licences.release_gate is the one refusal
    and it is called at outward publication and nowhere earlier.
binding: bound
population:
  n: null
frames:
- Lausanne
- fsaverage
- MNI152
streams:
- name: consensus_structural_connectome
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  temporal_support: not a time series; every matrix is a static summary
  spatial_support: group consensus networks on three parcellations held side by side -- Cammoun033 (68
    nodes), Schaefer100, Schaefer400 -- which is a COVER family and not a choice of parcellation
  constrains: []
  notes: "context, and this is the case the schema's own note singles out.  a connectome matrix or an\
    \ annotation network is a TOPOLOGY ASSERTION -- which supports are taken to interact -- produced by\
    \ somebody's reconstruction pipeline.  ARCHITECTURE.md \xA73 makes interaction topologies a separate\
    \ primitive from state, and binding a matrix as `measured` would let one pipeline's tractography or\
    \ one study's correlation contribute a likelihood about tissue.  it enters as a topology and as a\
    \ `prior`, never as evidence about a component."
