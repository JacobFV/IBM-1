# ibm-1 source card. schema: data/schema/source.schema.json
id: llama-3.2
title: Llama 3.2 -- open-weight language model family
provider: Meta AI
citation: Llama 3.2 model family. Referenced by NeuroWorld (PROMPT.md §53.3).
urls:
- https://www.llama.com/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Llama community licence with use restrictions; not an OSI-approved open licence. Terms not verified
    here.
binding: unbound
population:
  n: null
frames:
- token_sequence
- model_layer_stack
streams:
- name: layerwise_representations
  kind: measured
  via: null
  systematic_bias: '§48 and registry/README: TEACHER IS NOT OBSERVATION. This model''s representations
    are a discrepancy-aware forcing CANDIDATE, never automatically a subject likelihood. §29: influence
    starts low and is earned through held-out prediction. §53.3: the required output is NOT one flat embedding.
    A model must expose MULTISCALE, SPATIAL, TEMPORAL and EVENT-STRUCTURED state suitable for interaction
    with SPECIFICALLY ADDRESSED cortical supports. A single pooled vector cannot address a support. §29
    is explicit that abstract-cognition interactions BEGIN AT LOWER AUTHORITY, and a language model''s
    representations are the archetype: they are a candidate account of linguistic structure, produced
    by a system with a different objective, a different substrate and a different developmental history.'
  band_hz:
  - null
  - null
  temporal_support: tokens, which are NOT aligned to time. A token boundary is a tokeniser artifact; aligning
    token-level quantities to a neural time series requires word onsets from elsewhere and introduces
    its own clock relation
  spatial_support: per-token embeddings across many layers, plus a NEXT-TOKEN PROBABILITY DISTRIBUTION
    -- the latter is a genuinely different kind of output from an embedding, and it is what makes SURPRISAL
    available as a stimulus-side variable
- name: token_surprisal
  kind: measured
  via: null
  systematic_bias: 'SURPRISAL is the most directly interpretable quantity here: a scalar per token that
    indexes prediction error under the model''s distribution. It pairs with the provo card''s human cloze
    norms, and the two DISAGREE in known ways -- which makes the disagreement a measurable model discrepancy
    rather than a nuisance.'
  notes: a language model's surprisal is not a human's; the provo cloze norms are the empirical check
  band_hz:
  - null
  - null
- name: forcing_precision
  kind: measured
  via: null
  systematic_bias: '§53.3: the model may represent more detail than a person''s imagery. The LEARNED FORCING
    PRECISION controls how much of that representation affects the modelled brain -- it is a parameter
    to be estimated, not a design constant.'
  band_hz:
  - null
  - null
