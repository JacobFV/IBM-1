# ibm-1 source card. schema: data/schema/source.schema.json
id: allen-human-brain-atlas
title: Allen Human Brain Atlas -- microarray gene expression with spatial sampling
provider: Allen Institute for Brain Science
citation: Hawrylycz et al., An anatomically comprehensive atlas of the adult human brain transcriptome.
  Nature 2012.
urls:
- https://human.brain-map.org/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Allen Institute terms of use; citation required, commercial terms unresolved.
binding: bound
population:
  n: 6
  hierarchy:
  - participant
  - site
  notes: SIX donor brains, and only two sampled in both hemispheres. Every 'human brain transcriptome'
    statement from this source rests on six people, and the spatial samples are irregular.
frames:
- donor_native
- MNI152
- fsaverage
streams:
- name: microarray_expression
  kind: context
  via: null
  observation_chain: dissected tissue block -> RNA extraction -> microarray hybridisation -> normalised
    intensity per probe. The measurement is of a BULK TISSUE SAMPLE, so it mixes every cell type in the
    block in unknown proportion
  confounds:
  - donor post-mortem interval and tissue pH, which affect RNA integrity
  - 'dissection accuracy: the recorded coordinate is the intended sample site'
  - probe cross-hybridisation and batch effects between donors
  - cell-type composition varying between samples, which drives much of the apparent regional expression
    difference
  systematic_bias: Six donors, scattered samples, bulk tissue. It is real measurement and it is thin.
  notes: 'context, and an ONTOLOGY GAP rather than an undecided stream.  transcript abundance, protein
    score and cell-type proportion are not registered components and none of the nearest names fits: `extracellular.*`
    are neurotransmitter concentrations in the interstitium, `structural.*` are densities of synapses,
    dendrites, axons and myelin.  molecular composition constrains WHICH interaction classes are plausible
    where, which is a `prior` over model class, and it is never evidence about a state.  SIX DONORS, roughly
    3,700 scattered tissue samples of a few cubic millimetres each at recorded MRI coordinates.  the native
    support is a POINT CLOUD, not a volume, and bulk expression is a composition-weighted mixture whose
    deconvolution is itself a model.  it is real measurement and it is thin.'
  band_hz:
  - 0.0
  - 0.001
  temporal_support: not a time series
  spatial_support: roughly 3,700 spatially distinct tissue SAMPLES across the six brains, each a few cubic
    millimetres of dissected tissue at a recorded MRI coordinate. The native support is a scattered point
    cloud, NOT a volume -- every published 'expression map' is an interpolation
  constrains: []
- name: sample_coordinates
  kind: context
  via: null
  systematic_bias: §52.6 asks for the raw spatial samples; the coordinates are what make them usable as
    a scattered support rather than as a parcel average
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry, not evidence.  it supplies a support that a materialization is indexed over
    and constrains no ibm component; letting it update biology would turn a reconstruction into a measurement.  the
    coordinates are what make the samples usable as a scattered support rather than as a parcel average,
    which is the part worth keeping.'
- name: regional_expression_prior
  kind: context
  via: null
  systematic_bias: n=6; interpolation across unsampled territory is the dominant uncertainty
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context, and an ONTOLOGY GAP rather than an undecided stream.  transcript abundance, protein
    score and cell-type proportion are not registered components and none of the nearest names fits: `extracellular.*`
    are neurotransmitter concentrations in the interstitium, `structural.*` are densities of synapses,
    dendrites, axons and myelin.  molecular composition constrains WHICH interaction classes are plausible
    where, which is a `prior` over model class, and it is never evidence about a state.  n=6, and interpolation
    across unsampled territory is the dominant uncertainty.'
- name: rnaseq_subset
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context, and an ONTOLOGY GAP rather than an undecided stream.  transcript abundance, protein
    score and cell-type proportion are not registered components and none of the nearest names fits: `extracellular.*`
    are neurotransmitter concentrations in the interstitium, `structural.*` are densities of synapses,
    dendrites, axons and myelin.  molecular composition constrains WHICH interaction classes are plausible
    where, which is a `prior` over model class, and it is never evidence about a state.'
- name: donor_mri
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry.  the anatomical volume the supports are indexed over.  as ds004024''s card
    records, a T1 would genuinely bind to `material.conductivity` and `material.mass_density` once a head
    model exists to put the values into -- but a material value asserted for a conductor nobody can address
    is not evidence, so it stays context until the support bank exists.  six donor brains.'
- name: histology
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry, not evidence.  it supplies a support that a materialization is indexed over
    and constrains no ibm component; letting it update biology would turn a reconstruction into a measurement.  sections
    registered to the donor MRI; provenance for where each sample came from.'
absent:
- population
- cell_type_resolution
- spatial_completeness
- dynamics
- right_hemisphere_in_four_donors
use:
- fit
- prior
forbidden:
- allen-human-brain-atlas/interpolated_expression_volumes -> measured expression at unsampled locations
- allen-human-brain-atlas/* -> individual living participants' state
split:
  group_by:
  - participant
provenance:
  imported_from: win-registry
  card: allen-human-brain-atlas
