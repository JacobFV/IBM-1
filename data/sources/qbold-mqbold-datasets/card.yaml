id: qbold-mqbold-datasets
title: qBOLD and mqBOLD oxygenation datasets
provider: multiple -- quantitative BOLD and multiparametric qBOLD studies
citation: "PROMPT.md \xA752.11, 'qBOLD/mqBOLD data'."
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: "Unresolved. \xA749.2 records that the predecessor's attribution generator tracked each source's\
    \ known bias and licence rather than treating atlas availability as correctness; that practice is\
    \ preserved by leaving this unresolved and counting it."
binding: unbound
population:
  n: null
frames:
- scanner
- subject_native
- MNI152
streams:
- name: oef_and_dbv_maps
  kind: measured
  via: null
  observation_chain: deoxyhaemoglobin in the venous vasculature -> magnetic susceptibility difference
    between vessel and tissue -> a field perturbation whose spatial structure depends on VESSEL GEOMETRY
    AND ORIENTATION -> reversible dephasing R2' -> fitted OEF and blood volume under an ASSUMED VESSEL
    MODEL (usually randomly oriented infinite cylinders)
  confounds:
  - the assumed vessel geometry model, which is the largest single assumption
  - macroscopic field inhomogeneity, which mimics R2' and must be removed
  - haematocrit, assumed
  - the static-dephasing regime assumption, which fails for capillaries where diffusion narrowing matters
  systematic_bias: "THE MODEL HERE IS A VASCULAR GEOMETRY MODEL. qBOLD is the clearest case in the registry\
    \ where \xA716's demand that vascular structure become first-class is not optional: the physiological\
    \ number depends explicitly on assumed vessel radius and orientation distributions, which \xA752.10's\
    \ microvascular sources could supply as measured priors instead."
  notes: randomly-oriented-cylinder assumptions are known to be wrong near the cortical surface and in
    white matter, where vessels are anisotropically oriented
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: quantitative estimates of oxygen extraction fraction and deoxygenated blood volume
    from the reversible transverse relaxation rate R2', which depends on the field perturbation around
    deoxygenated vessels
- name: r2prime
  kind: measured
  via: null
  band_hz:
  - null
  - null
absent:
- measured_vessel_geometry
- haematocrit
- electrophysiology
- standardised_protocol
requires:
- geometry: vascular-products
  severity: degrading
  without_it: 'An oxygenation estimate is about blood in vessels, and its meaning depends on which vessels:
    an OEF from a resolved vein and an OEF inferred from the field perturbation around unresolved capillaries
    are different measurements. Without the vascular product they cannot be told apart.'
  substitute: A voxel-wise map treated as a single compartment, which absorbs the venous bias into the
    tissue estimate.
use:
- calibrate
- fit
forbidden:
- qbold-mqbold-datasets/* -> neural supervision
- qbold-mqbold-datasets/oef_and_dbv_maps -> vessel geometry (circular)
- qbold-mqbold-datasets/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
provenance:
  imported_from: win-registry
  card: qbold-mqbold-datasets
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
origin_kind: class
provenance_note: a CLASS of resource rather than one dataset; the provider field names a literature or
  model family. a single origin url would be a fiction
provenance_traced_from: a peer programme's card for the same corpus, which read the origin off the held
  dataset_description. the ORIGIN is recorded here; the peer is not cited, because a courier is not a
  source
