  systematic_bias: Geometry in this registry arrives in FreeSurfer's binary surfaces, GIfTI, VTK, Gmsh's
    MSH, STL and half a dozen others, and every solver wants a different one. The conversion is where
    per-element data -- orientation, region tags, provenance -- gets silently dropped by a lossy writer,
    and §4a's requirement that derived geometry keep its assumptions is defeated by a format that cannot
    carry them.
  notes: not every format can represent every attribute; a conversion that succeeds may still have lost
    information, and it will not say so
  band_hz:
