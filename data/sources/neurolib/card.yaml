  systematic_bias: '§59 reference 41 and §53.4 name neurolib specifically, WITH the caveat: it gives useful
    whole-brain neural-mass and excitation/inhibition references and RETAINS THE CONVENTIONAL PARCEL-CONNECTOME-BALLOON
    ABSTRACTION THAT B-WIN IS EXPLICITLY GENERALIZING. Its ADEX mean-field is the more valuable half:
    a mean-field derived FROM a spiking model, so its parameters connect to cellular measurements like
    those in allen-cell-types-patchseq.'
  notes: a mean-field derived under adiabatic and homogeneity assumptions inherits them
