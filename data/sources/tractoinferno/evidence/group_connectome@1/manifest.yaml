# what this recipe produced, from which raw source.  committed.
recipe: group_connectome
version: 1
produced_at: '2026-09-04'
from_raw:
  tractoinferno: >-
    284 subjects and 6901 bundle tractograms for the cohort table (trk headers only,
    read by http range request against the urls in the dataset's own
    .openneuro-manifest-1.1.1.json); 30 subjects with all 605 of their bundles read in
    full from the local root, of which 26 have full head coverage and carry every
    between-subject number; 48 subjects (12 per acquisition block, 8 bundles each) for
    the site arm, 36 of them mirrored into the cache from the same urls
checksums: deferred -- the raw root records its own
outputs:
- measured.json
headline:
  n_subjects_connectome: 26
  n_subjects_cohort_table: 284
  parcels: 126
  possible_pairs: 7875
  edges_asserted_by_someone: 4118
  edges_found_by_all_26: 18
  edges_found_by_exactly_one: 770
  mean_edge_reproducibility: 0.3188
  mean_edge_reproducibility_given_the_bundle: 0.3903
  mean_bundle_availability: 0.7359
  between_subject_strength_log_sd: 1.9019
  between_subject_strength_as_a_factor: 6.699
  rho_disagreement_with_group_consensus: 0.0915
  effective_independent_subjects_of_26: 7.91
  effective_independent_subjects_ceiling: 10.93
  group_predicts_held_out_existence_auc: 0.8153
  group_predicts_held_out_strength_r2: 0.2797
  group_leaves_a_factor_of: 7.423
  individual_share_of_log_variance: 0.6592
  between_block_log_sd: 0.5315
  within_block_log_sd: 1.8208
  block_icc: 0.0785
  block_permutation_p: 0.0
