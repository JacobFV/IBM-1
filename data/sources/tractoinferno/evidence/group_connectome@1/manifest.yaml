  loso_r2_from_other_blocks: 0.1899
  registration_residual_median_mm: 7.33
read_it_as: >-
  four things, in order of how much they change what this repository does.

  ONE: two brains differ more than two algorithms do.  the ISMRM phantom put the
  cross-pipeline strength spread at a factor of 3.9; the cross-SUBJECT spread here is
  6.7.  a group connectome does not inherit tier 1's error and add a little, it is
  dominated by a term tier 1 does not have, and the tier-2 widening in
  ibm/topologies/tract_prior.py was log(1.5) where the measurement says log(7.4).

  TWO: a group connectome predicts WHICH edges a subject has (AUC 0.82) and not how
  strong they are (R^2 0.28).  two thirds of a subject's edge-strength variance is
  theirs alone.  a tier-2 result may be reported as a population's connectivity and
  never as this subject's, and 0.28 is the number that says so.

  THREE: a different scanner is NOT as different as a different person.  the
  acquisition block accounts for 8% of the log-strength variance against the
  subject's 92%, and predicting a held-out subject from their own block does no
  better than from the other blocks (R^2 0.189 against 0.190).  the block effect is
  real -- 0.2825 against a permutation null of 0.133 +- 0.028 -- and it is small.
  this is the good news for tier 2 and it is a LOWER bound, because the blocks are
  recovered from the field-of-view signature rather than read off site labels the
  release does not ship, and block A still mixes three cohorts.

  FOUR: 26 subjects are worth 7.9 independent ones and the ceiling is 11 however many
  arrive.  that rho is a LOWER bound for the opposite reason to everything else here:
  the reference is the subjects' own consensus, so an error every subject makes is
  invisible to it -- and all 284 went through ONE pipeline, where the phantom's 0.317
  spanned twenty.  a published connectome over a thousand subjects is worth about
  eleven subjects and about three pipelines, and neither number improves with the
  cohort size.
notes: >-
  see derive/group_connectome.yaml for the recipe and
  scripts/measure_group_connectome.py for why each choice was made -- in particular
  why the site labels are recovered rather than read, why the parcellation is 20 mm
  boxes rather than an atlas, why the registration is 7 parameters rather than a
  fitted warp, and why the phantom's cross-pipeline rho has no counterpart on real
  tissue.  ibm/topologies/tract_prior.py reads measured.json and falls back to these
  figures compiled in when it is absent.
