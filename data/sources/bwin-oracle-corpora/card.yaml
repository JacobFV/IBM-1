id: bwin-oracle-corpora
title: B-WIN synthetic-truth corpora -- versioned, hashed solver output for surrogate fitting
provider: this repository (bwin.oracle_corpus)
citation: Generated by bwin.oracle_corpus; no publication. The physics it samples is cited on the solver
  cards it derives from -- see em, tms, tfus and the vascular chain.
access: priority
licence:
  name: unencumbered -- computed in this repository from closed forms
  redistribution: permitted
  commercial: permitted
  notes: Every byte was computed by this repository's own solvers from analytic expressions. NO CARDED
    SOURCE CONTRIBUTED BYTES, which is why `parents` is absent rather than empty -- an absent field says
    nobody's data is in here, and rule 7 computes licence lineage from contributing sources. The corpora
    are regenerable from the recipe id, the sample count and the seed, so redistribution is a convenience
    rather than a necessity.
binding: unbound
population:
  n: null
frames:
- recipe_local
streams:
- name: em_eeg_lead_field
  kind: measured
  via: null
  systematic_bias: 'A CONCENTRIC conductor, which has an exact scaling symmetry a real head does not:
    rescaling every shell and the dipoles with it multiplies every lead-field entry by 1/alpha^2 and leaves
    the topography identical. A surrogate fitted here therefore cannot learn anything about head size,
    and must not be read as having failed to. See notes/findings/2026-08-16-no-scalp-recording-can-constrain-head-size.md.'
  notes: the analytic series is truncated at n_max = 220 terms; the truncation error is largest for the
    most superficial sources, which is where the series converges slowest
  band_hz:
  - null
  - null
  temporal_support: None. Every corpus is a static map from an input vector to a solver output; the TMS
    recipe carries dI/dt as an input rather than a time axis, and the acoustic recipe is time-harmonic
    at a sampled frequency.
  spatial_support: 'Per recipe, and the recipe IS the geometry: two concentric-sphere conductors (three-shell
    80/85/92 mm and homogeneous 92 mm) sampled at 32 sensors; a figure-of-eight coil over a sphere at
    48 field points; a circular piston sampled along its axis from 5 to 160 mm; and two vessel networks,
    a single 20 mm tube and a 7-edge bifurcation tree whose radii satisfy Murray''s law. There is no head,
    no subject and no voxel grid -- these are analytic domains.'
- name: tms_induced_e_field
  kind: measured
  via: null
  systematic_bias: The coil is discretised into 4 rings of 12 segments per wing. A surrogate fitted to
    this samples the DISCRETISATION as well as the field, and refining the coil changes the truth it was
    fitted against -- which is why the corpus version digests the solver module rather than only the recipe
    parameters.
  band_hz:
  - null
  - null
- name: tfus_axial_pressure
  kind: measured
  via: null
  systematic_bias: Rayleigh-Sommerfeld in a HOMOGENEOUS medium -- water, effectively. It carries no skull,
    so it constrains the free-field focus and says nothing about aberration, which is the hard part of
    transcranial focusing and the reason obj-tfus-subject-skull exists.
  notes: linear and lossless; nonlinearity and absorption both matter at therapeutic pressures and neither
    is present
  band_hz:
  - null
  - null
- name: vascular_flow_and_pressure
  kind: measured
  via: null
  systematic_bias: 'Hagen-Poiseuille: steady, laminar, Newtonian, rigid-walled. Blood is none of those
    in the large vessels, and the corpus is a check on the network solve rather than a model of circulation.'
  notes: no Fahraeus-Lindqvist effect, so effective viscosity is constant across radii spanning 0.38 to
    0.6 mm where in vivo it is not
  band_hz:
  - null
  - null
- name: mr_kspace
  kind: measured
  via: null
  systematic_bias: A TWO-COMPARTMENT DISC PHANTOM OF 1,129 POINT ISOCHROMATS AT 4 mm SPACING. Intravoxel
    dephasing is resolved only to what that lattice resolves, which is why bwin.mr has no T2* parameter
    at all -- the extra decay of a gradient echo emerges from sampling the field below the voxel rather
    than from a fitted constant, so a coarser lattice understates it and the bias is toward too little
    dephasing.
  notes: 'The eight silences bwin.mr.NOT_MODELLED declares: no diffusion, no flow, no chemical shift,
    no B1 inhomogeneity, no eddy currents, no receiver noise, no non-Cartesian sampling, no multi-compartment
    exchange. Each is absent rather than approximated, and a surrogate fitted here inherits every one
    of them.'
  band_hz:
  - null
  - null
absent:
- measured_fields
- subject_anatomy
- biological_variability
use:
- surrogate
forbidden:
- bwin-oracle-corpora/* -> any biological parameter. The corpora contain no biology to identify.
- bwin-oracle-corpora/* -> any conductivity, vessel radius or acoustic property. These are INPUTS to the
  solvers that wrote the corpus; fitting them from it recovers the constant that was assumed.
- bwin-oracle-corpora/* -> role observation, in any evidence entry, ever.
split:
  group_by:
  - geometry
  notes: '`geometry` was added to the vocabulary for this card -- no participant, site, device, session
    or run exists anywhere in a synthetic corpus, and `pipeline` would say the variation is in the code
    when it is in the conductor. See notes/decisions/2026-08-16-geometry-is-a-split-level.md. UPDATED
    2026-08-16: it runs. win.learn.surrogate.Domain now REQUIRES a `geometries` tuple with no default,
    `Accuracy` derives its holdout level from whether measured geometries intersect fitted ones, and a
    query naming an unseen geometry is refused at query time even when every input is inside the fitted
    box. Measured on exactly these two EM corpora, fitting on the homogeneous sphere and holding out the
    three-shell head: held-out-point error 11.9% against held-out-geometry 77.2% at degree 4, and a richer
    basis improves the first while making the second worse. Condition 2 is closed as a CAPABILITY, not
    as an obligation enforced at fit time -- a solver family with one geometry has no second shape to
    hold out. REPRODUCED 2026-08-16 FROM A DERIVED BOX: `bwin.corpus_surrogate` derives the fitting box
    from the manifests rather than declaring it -- half-width source_depth_fraction x min(inner_radius)
    / sqrt(3) = 41.569 mm, the largest cube inside the tightest brain compartment, so the held-out solver
    never refuses a point the fitted one accepted -- and gets 14.0% held-out-point against 80.1% held-out-geometry.
    At the declared +/-40 mm it reproduces 11.86 / 77.24 to three digits. AND THE OTHER THREE FAMILIES
    HAVE NO HELD-OUT GEOMETRY AT ALL. The two vascular recipes are NOT a held-out pair: 1 feature against
    7, 1 output against 7, and two geometry-role arrays of different shapes, so they share no input space,
    no output space and no fixed geometry. TFUS and TMS have one recipe each. Those are reported as ABSENT
    with the reason, never as zero and never as a small number.'
