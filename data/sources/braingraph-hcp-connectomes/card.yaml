# ibm-1 source card. schema: data/schema/source.schema.json
id: braingraph-hcp-connectomes
title: Braingraph.org HCP connectome collection
provider: Budapest Reference Connectome / braingraph.org
citation: Szalkai et al., Parameterizable consensus connectomes from the Human Connectome Project. Brain
  Imaging and Behavior 2017.
urls:
- https://braingraph.org/
access: held   # 1064 subject graphs acquired 2026-09-09; see raw/.location.yaml
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: 'Unresolved, and now that the bytes are held the specific unresolved thing can be named: braingraph.org
    gates the download behind an "I agree to the data use terms of the Human Connectome Project" checkbox and
    states no terms of its own for the DERIVED graphs. So the HCP open-access terms are accepted and apply to
    the scans; what licence the PIT group places on their reconstruction of them is not stated anywhere on the
    site or in the cited papers. That gates DISTRIBUTION only -- Rule 7 -- and reading, computing with and
    fitting to this is never gated. The citation requests in Kerepesi et al. 2017 and Szalkai et al. 2019 are
    recorded above and are honoured.'
binding: bound
population:
  n: null
frames:
- Desikan2006
- Lausanne
- MNI152
streams:
- name: parameterisable_consensus
  kind: context
  via: null
  systematic_bias: 'Exposing the consensus threshold as an explicit parameter is unusually honest: it
    makes visible that the network''s existence depends on a chosen frequency cutoff. Sweeping that parameter
    is a direct measurement of edge-existence uncertainty, which is what §39 wants and what a single fixed
    matrix hides.'
  band_hz:
  - 0.0
  - 0.001
  temporal_support: not a time series -- this is static anatomy
  spatial_support: connectomes from 1,015 HCP participants at five parcellation resolutions, plus a PARAMETERISABLE
    consensus in which the fraction of subjects an edge must appear in is an explicit knob
  constrains: []
  notes: 'context, and the decision is the point.  a set of streamlines or a parcel-by-parcel matrix is an INTERACTION
    TOPOLOGY -- a statement about which state variables may interact (ARCHITECTURE.md §3) -- and a topology
    is a support for interaction, not a measurement of any component.  there is no ibm component whose value
    this stream reports: `structural.fiber_orientation` is what the underlying diffusion volume constrains,
    and the tractogram is an ALGORITHM''S ANSWER computed from it, not a second measurement of it.  binding
    it as `measured` would let one pipeline''s reconstruction contribute a likelihood about tissue, which is
    exactly the double-count the card''s `forbidden` list already refuses.  what makes this stream worth holding
    is that its consensus threshold is an explicit knob: sweeping it traces the existence probability of every
    edge over 1,015 subjects, which is the same quantity `scripts/measure_tract_uncertainty.py` measures against
    a phantom, measured instead across people.  the two disagree about different things and both belong in `edge_support`.'
- name: multi_resolution_connectomes
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context, and the decision is the point.  a set of streamlines or a parcel-by-parcel matrix is an INTERACTION
    TOPOLOGY -- a statement about which state variables may interact (ARCHITECTURE.md §3) -- and a topology
    is a support for interaction, not a measurement of any component.  there is no ibm component whose value
    this stream reports: `structural.fiber_orientation` is what the underlying diffusion volume constrains,
    and the tractogram is an ALGORITHM''S ANSWER computed from it, not a second measurement of it.  binding
    it as `measured` would let one pipeline''s reconstruction contribute a likelihood about tissue, which is
    exactly the double-count the card''s `forbidden` list already refuses.  five parcellation resolutions of
    the same tractograms are five COVERS over one topology, not five measurements.  they feed `tractometric_matrix`,
    which expands a parcel-level matrix onto sites and is deliberately crude about it because a parcel-level
    connectome carries no within-parcel information to be crude about.'
absent:
- provenance
- path_geometry
- directionality
requires:
- geometry: tract-path-products
  severity: blocking
  without_it: A connectome matrix is an adjacency over parcel indices. Without the tract product its edges
    have no path, no length and no supports to terminate on, so it cannot supply a delay, a route or an engineered
    structural commitment -- only a number per pair of labels. STATED AT CARD LEVEL RATHER THAN AGAINST A
    STREAM, because every stream here is context -- a connectome matrix asserts a TOPOLOGY and constrains
    no component, so there is no constraint of theirs for the missing geometry to have nowhere to attach.
    The requirement is nevertheless real and blocking for any materialization that wants to USE these edges,
    which is what it is recorded for.
- geometry: cortical-support-bank
  severity: blocking
  without_it: A parcellation or a surface map is a COVER, not an element of the brain's ontology. Without
    the support bank there is nothing for these labels to be a cover OVER, and using them as if they were
    the supports themselves is precisely the canonical-parcellation commitment the architecture refuses.
use:
- calibrate
- prior
forbidden:
- braingraph-hcp-connectomes/* -> measured-connection claims
- braingraph-hcp-connectomes/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
provenance:
  imported_from: win-registry
  card: braingraph-hcp-connectomes
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
