- name: lsd_versus_placebo_fmri
  kind: measured
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY: the vascular stage is a modelled state,
    not a nuisance to be regressed away. A serotonergic psychedelic is a pharmacological manipulation
    acting through 5-HT2A receptors whose cortical distribution is itself mapped by the receptor atlases
    in this registry -- so the intervention''s spatial target is known independently of the response,
    which is rare'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving a global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  - LSD has direct cardiovascular and cerebrovascular effects that change BOLD without changing neural
    activity
  - head motion increases markedly under the drug and is confounded with condition
  - the participant knows which condition they are in -- blinding fails completely for a psychedelic --
    so expectancy is present in every contrast
  - eyes-closed visual imagery is a task the drug induces, so 'resting state' is not rest
  systematic_bias: Blinding failure is total and unfixable in this design, and the released data are a
    derivative whose processing cannot be varied. Its value is as a pharmacological state-change arm with
    an independently mapped receptor target, not as a clean contrast.
  notes: a derivative release means the preprocessing is fixed and its choices are inherited by every
    number computed from it
