  - null
  temporal_support: unresolved. The PNAS study was fMRI and MEG; whether MEG is in this accession is unresolved
    and must not be assumed
  spatial_support: 'unresolved in detail. The dataset_description declares DatasetType: derivative, so
    WHAT IS DISTRIBUTED IS NOT RAW -- it is processed output, and its preprocessing lineage is a property
