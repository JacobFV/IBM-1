streams:
- name: motor_threshold_as_dose_unit
  kind: measured
  via: null
  systematic_bias: 'MOTOR THRESHOLD IS THE FIELD''S DOSING UNIT AND IT IS A CORTICOSPINAL MEASUREMENT
    AT ONE SITE. Expressing stimulation of prefrontal cortex as ''110 percent of motor threshold'' assumes
    the field-to-effect relationship transfers across cortex, which it does not: scalp-to-cortex distance,
    gyral geometry and local excitability all differ. This is the clearest everyday instance of §52.13''s
    requested-versus-delivered confusion.'
  notes: threshold depends on coil orientation, background muscle state, time of day and attention; it
    is a noisy measurement treated as a constant
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: the relationship between stimulator output, coil-to-cortex distance, individual anatomy
    and the intensity at which a motor evoked potential appears
- name: distance_correction_models
  kind: measured
  via: null
  systematic_bias: published distance-adjustment formulas are empirical fits, and an individualised field
    model supersedes them rather than being calibrated by them
  band_hz:
  - null
  - null
