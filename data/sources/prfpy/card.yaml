title: prfpy -- population receptive field fitting library
provider: Spinoza Centre / VU Amsterdam
citation: 'prfpy: population receptive field fitting in Python.'
urls:
- https://github.com/VU-Cog-Sci/prfpy
access: reference
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
