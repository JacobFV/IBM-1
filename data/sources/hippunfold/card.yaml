binding: unbound
population:
  n: null
frames:
- subject_native
- hippocampal_unfolded_space
streams:
- name: unfolded_coordinate_system
  kind: measured
  via: null
  systematic_bias: THIS IS THE §5 ARGUMENT IMPLEMENTED. HippUnfold replaces a discrete subfield parcellation
    with a continuous intrinsic coordinate system, so a support becomes a region of a coordinate space
    rather than a label -- which is exactly what B-WIN wants everywhere and has, for the hippocampus,
    already been built. It should be read as a design precedent, not only as a tool.
  notes: the unfolding assumes a sheet topology; where the hippocampus deviates (the uncal region, dentate
    infolding) the coordinate system is stretched
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: a CONTINUOUS unfolded coordinate system over the hippocampus rather than discrete subfield
    labels -- the hippocampus is treated as a folded sheet and flattened, so position is given by two
    continuous coordinates
- name: subfield_labels_derived
  kind: measured
  via: null
  systematic_bias: HippUnfold can emit conventional subfield labels from the coordinates, and those are
    a derived convenience view -- the coordinates are the primary product
  band_hz:
  - null
  - null
