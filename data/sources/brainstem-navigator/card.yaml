streams:
- name: brainstem_nucleus_probabilities
  kind: measured
  via: null
  systematic_bias: '7T-derived, small samples, and brainstem nuclei are millimetre-scale structures adjacent
    to large pulsatile arteries and CSF spaces. §51.3 item 26 puts it plainly: B-WIN should not leave
    every noncortical structure as one two-node family, and this is the source that makes the arousal
    and autonomic nuclei addressable at all.'
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: probabilistic labels for dozens of brainstem nuclei from 7T multi-contrast MRI -- arousal,
    autonomic and motor nuclei that whole-brain atlases leave as undifferentiated brainstem
- name: arousal_system_nuclei
  kind: measured
  via: null
  systematic_bias: locus coeruleus, raphe and related nuclei are the anatomical substrate of the neuromodulatory
    terms that would otherwise be a global scalar
  band_hz:
  - null
  - null
