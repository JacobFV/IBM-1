streams:
- name: point_cloud_processing
  kind: measured
  via: null
  systematic_bias: §4's support primitives are closer to an oriented point set than to a mesh, and a point
    cloud WITH NORMALS is exactly an unstructured set of oriented elements. The scanned scene geometry
    in hd-epic and project-aria arrives this way, and so does anything reconstructed by the depth models
    in §53.3.
  notes: estimated normals have a sign ambiguity that propagates directly into any orientation-dependent
    physics
  band_hz:
  - null
  - null
  temporal_support: static; supports RGBD sequences
  spatial_support: POINT CLOUDS as a first-class type, with normals, registration and surface reconstruction
    -- the representation that scanned and reconstructed geometry arrives in, as distinct from an authored
    mesh
