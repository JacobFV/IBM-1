id: libribrain
title: LibriBrain -- deep within-person MEG during audiobook listening
provider: Oxford / LibriBrain benchmark
citation: "LibriBrain: a large within-subject MEG dataset for naturalistic speech (named in PROMPT.md\
  \ \xA751.1 item 10 and \xA752.4)."
urls:
- https://huggingface.co/datasets/pnpl/LibriBrain
- https://huggingface.co/datasets/pnpl/LibriBrain2
- https://arxiv.org/abs/2506.02098
- https://arxiv.org/abs/2506.10165
access: held
licence:
  name: CC-BY-NC-4.0
  redistribution: unresolved
  commercial: prohibited
  notes: 'Stated by the Hugging Face dataset card''s own licence tag. NON-COMMERCIAL, and that is the
    reading that matters: licence lineage is per artifact and computed from contributing sources, so any
    product with a LibriBrain-derived component takes the non-commercial term. It joins the Hansen receptor
    atlas (CC-BY-NC-SA-4.0), the SUIT cerebellar atlases (CC-BY-NC-3.0) and von Economo-Koskinas (CC-BY-NC-SA-4.0)
    as the fourth non-commercial holding this registry knows about. It gates DISTRIBUTION only and never
    reading, loading, computing with or fitting to the data. DUA: none. Recorded as dua_required false
    on the basis of HOW THIS WAS ACTUALLY OBTAINED -- it is held in this store, fetched anonymously over
    plain HTTP by a script in scripts/ that sends no credential and accepts no terms, from a repository
    that serves it without an access request. That is evidence about the acquisition rather than an opinion
    about the deposit''s policy. It says nothing about the LICENCE terms, which are recorded separately
    and still govern distribution; a non-commercial work with no DUA is an ordinary combination.'
binding: bound
population:
  n: 1
  hierarchy:
  - session
  - run
  notes: "Very many hours in ONE participant. \xA751.1 item 10: together with MEG-MASC and MEG-SCANS this\
    \ separates PERSON DEPTH from population breadth, and that separation is the reason to hold all three."
frames:
- meg_device
- head_fiducial
- subject_native
- audiobook_timeline
streams:
- name: meg
  kind: measured
  via:
  - em_generation
  observation_chain: oriented cortical current-source state -> quasi-static magnetic field (primary current
    plus volume-current return) -> pickup-coil geometry, orientation and gradiometer configuration ->
    SQUID flux -> sampled channel
  confounds:
  - environmental magnetic interference and urban noise
  - head motion within and between runs
  - ocular and cardiac fields
  - muscle artifact at high frequency
  - SQUID jumps and sensor drift
  - session-to-session head repositioning within the same person
  systematic_bias: 'One person means one head model: the between-subject variance that dominates MEG group
    analyses is absent, so within-person model discrepancy becomes visible.'
  band_hz:
  - 0.03
  - 330.0
  temporal_support: MEG at its acquisition rate; audiobook chapters as continuous listening blocks across
    many sessions
  spatial_support: whole-head MEG; a single participant's head geometry throughout, which removes between-subject
    forward-model variance entirely
  constrains:
  - electromagnetic.bfield
  notes: 'MEASURED FROM THE HELD RAW FIF 2026-09-05: Elekta, sfreq 1000 Hz, highpass 0.03 Hz, lowpass
    330 Hz, 306 MEG channels, and the sidecar declares DigitizedLandmarks true, DigitizedHeadPoints true
    and ContinuousHeadLocalization true with five HPI coil frequencies.  the band is the acquisition''s
    own passband and not a nyquist guess.  NOTE the serialised derivative alongside it is further processed
    -- the filename records bads+headpos+sss+notch+bp+ds -- so a fit reading the .h5 rather than the .fif
    is working over a NARROWER band than this, and which one a run used is a fact about the answer.  MEG
    constrains `electromagnetic.bfield` directly through `em_generation` and does NOT pass through `device_coupling`:
    unlike a scalp electrode there is no contact interface, which is the whole reason the two modalities''
    `via` chains differ in length.  em_generation is what produces the magnetic field from source currents;
    the previous chain named vascular_flow, which is unrelated.'
  rate_hz: 1000.0
  frame: meg_device
  units: T
- name: held_out_splits
  kind: context
  via: null
  systematic_bias: a within-person held-out split tests generalisation across sessions and material, NOT
    across people; the two claims are different and must not be conflated
  band_hz:
  - null
  - null
  constrains: []
  notes: 'context.  a split definition is a protocol for evaluation, not a measurement -- and here it
    carries a warning worth keeping: a within-person held-out split tests generalisation across SESSIONS
    AND MATERIAL, never across people, and the two claims must not be conflated.  n=1.'
- name: audio_stimuli
  kind: imposed
  via:
  - transduction
  band_hz:
  - 20.0
  - 11025.0
  constrains:
  - device.speaker_pressure
  notes: 'imposed: the audiobook is what the experimenter played, clamped on the display support and conditioned
    on, never sampled.  MEASURED FROM THE HELD FILES 2026-09-05: the stimuli are 16-bit mono PCM WAV at
    22050 Hz, so the ceiling is that file''s nyquist -- not the component''s 20 kHz, which would claim
    content the deposit does not contain.  the floor is 20 Hz because that is where `transduction` reads
    speaker pressure and where a cochlea starts.'
  frame: audiobook_timeline
- name: transcripts
  kind: context
  via: null
  band_hz:
  - null
  - null
  constrains: []
  notes: context.  a transcript is a written record of what was said, which is a description of the stimulus
    rather than a physical variable; the pressure waveform is the imposed stream above and this indexes
    into it.
- name: alignments
  kind: context
  via: null
  band_hz:
  - null
  - null
  constrains: []
  notes: context, and specifically because FORCED ALIGNMENT IS AN ALGORITHM'S OUTPUT.  a word or phoneme
    onset here is where an aligner put it, not when a phoneme occurred, and its error is systematic at
    word boundaries rather than random.  binding it as imposed would hand a model an event time nobody
    measured.
absent:
- population
- fmri
- eeg
- eye_tracking
- vascular
requires:
- geometry: device-geometry
  for_streams:
  - meg
  severity: degrading
  without_it: 'Re-graded from blocking 2026-09-05 ON FILE EVIDENCE read out of the held raw fif: dev_head_t
    is present, 219 digitisation points are stored, hpi_results is populated, and the BIDS sidecar declares
    DigitizedLandmarks true, DigitizedHeadPoints true and ContinuousHeadLocalization true with five HPI
    coil frequencies. So the sensor pose relative to the head is measured continuously, which is the geometry
    this entry said was missing, and a lead field can be built. It stays degrading rather than satisfied
    because no subject MRI is held for this participant: there is a head position but no head MODEL, so
    the conductor the field propagates through is still a template. With n=1 that template error is a
    constant offset on everything this source ever contributes rather than something that averages away.'
  substitute: A template head geometry scaled to the digitised head points. For a single participant that
    is a fixed, unmeasured displacement applied to every estimate this source produces, so it is bias
    and not noise.
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
use:
- evaluate
- fit
forbidden:
- libribrain/* -> population covariance priors
- libribrain/* -> between-participant generalisation claims
split:
  group_by:
  - session
  - stimulus
provenance:
  imported_from: win-registry
  card: libribrain
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
local_root: data/sources/libribrain/raw
provenance_note: moved into this repo from a sibling working directory; the origin above is the source
  of record, not the machine it was staged on
