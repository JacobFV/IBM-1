absent:
- human_data
- spike_times
- subcortical_recordings
- task_behaviour
- released_animal_count
requires:
- geometry: retinal-world-geometry
  for_streams:
  - cellular_resolution_visual_responses
  severity: degrading
  without_it: The stimulus is presented on a screen at a fixed distance from an eye whose position is
    tracked only in part of the sessions. Without the display and eye geometry the visual field coordinate
    of any response is unknown, and retinotopic claims made from screen coordinates carry an uncorrected
    eye-position error.
  substitute: Screen coordinates treated as retinal coordinates under an assumption of fixed gaze, which
    is false during the periods the pupil trace shows movement.
use:
- fit
- prior
forbidden:
- allen-visual-coding-2p/* -> any human state channel without an explicit cross-species mapping
- allen-visual-coding-2p/* -> a commercial artifact under the Allen Terms of Use
- allen-visual-coding-2p/* -> a deconvolved event treated as a measured spike
- allen-visual-coding-2p/* -> a spike-timing comparison with the Neuropixels release
split:
