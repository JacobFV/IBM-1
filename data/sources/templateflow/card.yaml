streams:
- name: versioned_template_identity
  kind: measured
  via: null
  systematic_bias: '''MNI SPACE'' IS NOT ONE SPACE. MNI152NLin2009cAsym and MNI152NLin6Asym differ by
    millimetres, and coordinates reported in one and interpreted in the other are silently wrong -- which
    is exactly the failure the distal-lead-dbs card warns about for stereotactic targeting. §55 asks for
    explicitly versioned templates for this reason, and TemplateFlow is the mechanism.'
  notes: the transforms BETWEEN template variants exist and are themselves registrations with unreported
    residuals
  band_hz:
  - null
  - null
  temporal_support: static
  spatial_support: templates and their associated tissue priors, surfaces and atlases, addressed by an
    EXPLICIT IDENTIFIER AND VERSION -- so 'MNI space' resolves to a specific object rather than to a family
    of incompatible ones
- name: multi_species_and_lifespan_templates
  kind: measured
  via: null
  systematic_bias: infant and non-human templates matter because adult templates are actively wrong for
    the hbcd and cross-species cards
  band_hz:
  - null
  - null
