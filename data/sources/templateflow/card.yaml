streams:
- name: versioned_template_identity
  kind: context
  via: null
  systematic_bias: '''MNI SPACE'' IS NOT ONE SPACE. MNI152NLin2009cAsym and MNI152NLin6Asym differ by
    millimetres, and coordinates reported in one and interpreted in the other are silently wrong -- which
    is exactly the failure the distal-lead-dbs card warns about for stereotactic targeting. §55 asks for
    explicitly versioned templates for this reason, and TemplateFlow is the mechanism.'
  notes: 'context: geometry, not evidence.  it supplies a support that a materialization is indexed over
    and constrains no ibm component; letting it update biology would turn a reconstruction into a measurement.  and
    the point of the card is the VERSIONING: ''MNI space'' is not one space -- MNI152NLin2009cAsym and
    MNI152NLin6Asym differ by millimetres, and coordinates reported in one and read in the other are silently
    wrong.  what this supplies is frame identity, which is machinery for the frame graph and not a value
    of anything.'
  band_hz:
  - 0.0
  - 0.001
  temporal_support: static
  spatial_support: templates and their associated tissue priors, surfaces and atlases, addressed by an
    EXPLICIT IDENTIFIER AND VERSION -- so 'MNI space' resolves to a specific object rather than to a family
    of incompatible ones
  constrains: []
- name: multi_species_and_lifespan_templates
  kind: context
  via: null
  systematic_bias: infant and non-human templates matter because adult templates are actively wrong for
    the hbcd and cross-species cards
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry, not evidence.  it supplies a support that a materialization is indexed over
    and constrains no ibm component; letting it update biology would turn a reconstruction into a measurement.  infant
    and non-human templates matter because an adult template is actively wrong for those cohorts, not
    merely imprecise.  still geometry.'
