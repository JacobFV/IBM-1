id: cerebellar-atlases
title: Diedrichsen lab cerebellar atlas collection (SUIT / Buckner / MDTB / Nettekoven)
provider: Diedrichsen Lab, Western University
citation: Diedrichsen J. et al. (2009) NeuroImage 46:39-46 (probabilistic lobular atlas); Diedrichsen
  J. et al. (2011) NeuroImage 54:1786-1794 (deep nuclei); Buckner R.L. et al. (2011) J Neurophysiol 106:2322-2345;
  King M. et al. (2019) Nat Neurosci 22:1371-1378 (MDTB); Nettekoven C. et al. (2024) Nat Commun (hierarchical
  functional atlas); Diedrichsen J., Zhi D. (2022) A collection of atlases for the human cerebellum, v1.0.
urls:
