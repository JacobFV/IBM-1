# ibm-1 source card. schema: data/schema/source.schema.json
id: aomic
title: AOMIC PIOP1 and PIOP2 (ds002785, ds002790) -- ID1000 has its own card and is held
provider: University of Amsterdam (NILab), distributed via OpenNeuro; group maps on NeuroVault
citation: 'Snoek et al., AOMIC: the Amsterdam Open MRI Collection, a set of multimodal MRI datasets for
  individual difference analyses. Scientific Data 8:85, 2021. doi:10.1038/s41597-021-00870-6.'
urls:
- https://nilab-uva.github.io/AOMIC.github.io/
- https://openneuro.org/datasets/ds002785
- https://openneuro.org/datasets/ds002790
access: priority
licence:
  name: CC0 (verbatim License field in each dataset_description.json)
  redistribution: permitted
  commercial: permitted
  notes: Both dataset_description.json files were read directly over HTTPS on 2026-08-19 and each says
    exactly "CC0". Neither carries a DatasetType field, which is BIDS' definition of RAW -- so both ship
    a raw diffusion form, the same property that made ds003097 worth fetching. No data-use agreement.
binding: bound
population:
  n: 442
  hierarchy:
  - participant
  - run
  notes: 'PIOP1 n=216 and PIOP2 n=226 as stated in the paper, and both reproduce from the deposits'' own
    participants.tsv (217 and 227 lines including the header), read 2026-08-19. The card read n_participants
    1370 across three accessions until then; ID1000''s 928 moved to aomic-id1000 when that deposit was
    held. RAW DWI IS NARROWER THAN THE COHORT: PIOP1 has raw dwi for 211 of its 216 subject directories,
    PIOP2 for 226 of 226. Single 3T Philips site, one session per participant. The two accessions number
    their subjects sub-0001... independently with NO cross-accession key, so an overlapping participant
    between them would be undetectable -- which is a reason not to pool them and not a claim that none
    exists.'
frames:
- scanner
- subject_native
- MNI152
streams:
- name: bold_with_concurrent_physiology
  kind: measured
  via:
  - em_generation
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY: the vascular stage is a modelled state,
    not a nuisance to be regressed away. Respiration and cardiac waveforms were recorded concurrently,
    so the physiological contribution is OBSERVED rather than inferred from the BOLD itself'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving a global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift and between-session hardware change
  - the physiological recordings have their own failure modes -- belt slippage, oximeter dropout -- and
    a missing physio trace is not a flat one
  systematic_bias: 'One site, one scanner, one session: between-site variance is zero by construction
    and therefore unestimable here. That makes it a clean source for within-scanner questions and a bad
    one for generalisation claims.'
  band_hz:
  - 0.0
  - 0.25
  temporal_support: TR-sampled BOLD with CONCURRENT RESPIRATION AND CARDIAC RECORDING at the physiological
    device's own much faster rate. Two clocks per run, and the physiological one is what makes the vascular
    nuisance a measurable state rather than a regressor
  spatial_support: 'T1w structural, single-shell DWI at b=1000 with 32 directions and one b=0 (one run
    per participant), resting and task BOLD. PIOP2 ships a B0 phase-difference FIELDMAP for all 226 subjects;
    PIOP1 ships NO fmap directory at all. NEITHER ships a reverse phase-encode acquisition: PhaseEncodingDirection
    is ''j'' in all 211 PIOP1 and all 226 PIOP2 per-scan _dwi.json files. AND PIOP2''s fieldmap IntendedFor
    names ONLY func/ BOLD runs, in 226 of 226 files -- not one names a dwi target -- so a BIDS-respecting
    pipeline does not unwarp the diffusion data there either.'
  constrains:
  - electromagnetic.bfield
  notes: 'TR-sampled BOLD with CONCURRENT respiration and cardiac recording at the physiological device''s
    own much faster rate -- two clocks per run, and the physiological one is what makes the vascular nuisance
    a MEASURABLE STATE rather than a regressor.  the ceiling is 0.25 Hz, the nyquist of a 2 s TR, which
    is the conservative reading for the PIOP protocols; the bytes are not held, so it is set from the
    protocol rather than from a sidecar and should be tightened when they arrive.  BOLD IS NOT NEURAL
    ACTIVITY, and the four-step chain is what says so: neurovascular coupling, then flow, then tissue
    exchange, then the susceptibility change deoxyhaemoglobin makes -- which is why the component is `electromagnetic.bfield`
    and not a neural one.  the vascular stages are modelled state, not nuisance to be regressed away.  em_generation
    is what produces the magnetic field from source currents; the previous chain named vascular_flow,
    which is unrelated.'
  frame: scanner
- name: population_representative_sample
  kind: context
  via: null
  systematic_bias: PIOP1 and PIOP2 are university students and are NOT population-representative. The
    representative cohort in this collection is ID1000, which is carded and held as aomic-id1000. Pooling
    the three loses that property with no warning.
  band_hz:
  - null
  - null
  constrains: []
  notes: 'context, and it is a WARNING rather than a stream: PIOP1 and PIOP2 are university students and
    are NOT population-representative.  the representative cohort in this collection is ID1000, which
    is carded and held separately as aomic-id1000, and pooling the three loses that property with no warning.  a
    sampling property is not a state.'
- name: dwi
  kind: measured
  via:
    structural.fiber_orientation:
    - tract_propagation
    structural.axonal_density: &id001
    - plasticity
    structural.myelination: *id001
  observation_chain: water displacement over the diffusion time within and around axons and cells -> gradient-direction-dependent
    signal attenuation -> reconstructed q-space or orientation distribution. ORIENTATION EVIDENCE, not
    an observation of a tract THE RAW FORM IS PRESENT in both accessions -- sub-XXXX/dwi/sub-XXXX_dwi.nii.gz
    with its .bval and .bvec, outside any derivatives/ directory -- verified against the bucket 2026-08-19.
    Both also ship derivatives/dwipreproc. A card declaring a dwi stream is not a deposit shipping a raw
    one, and that distinction is what obj-independent-preprocessing-needs-a-deposit-that-ships-raw-dwi
    turns on.
  confounds:
  - eddy-current and susceptibility distortion
  - motion between diffusion directions
  - partial volume of crossing fibres, which no single-tensor model represents
  - the fitting model itself is a choice with its own bias
  - 'susceptibility distortion, which no preprocessing arm can correct here: PIOP1 has no fieldmap and
    PIOP2''s is declared for the BOLD only, and neither has a reverse phase-encode scan'
  band_hz:
  - 0.0
  - 0.001
  constrains:
  - structural.fiber_orientation
  - structural.axonal_density
  - structural.myelination
  notes: 'SINGLE-SHELL at b=1000 with 32 directions and one b=0, one run per participant.  that is a thin
    acquisition: single-shell b=1000 with 32 directions supports a tensor and strains at anything that
    resolves crossing fibres, so the orientation constraint it contributes is weak where fibres cross,
    which is most of the white matter.  ORIENTATION EVIDENCE, and the distinction is the whole binding.  what
    a diffusion volume measures is direction-dependent attenuation of water displacement, which constrains
    LOCAL microstructure -- fibre orientation, axonal density, myelination -- and does NOT observe a tract:
    a tractogram is a reconstruction laid over this field and is context wherever it appears in this corpus.  static
    band because microstructure is a tissue parameter.  the via chain follows the corpus convention set
    by tractoinferno, ds000117 and aomic-id1000: `plasticity` is named because it is the process that
    writes the structural field, though its declared outputs cover density and myelination and NOT `structural.fiber_orientation`,
    which no registered process writes.  per-component chains: this acquisition makes more than one claim
    and the routes differ.  one chain for all of them would let the component whose route is wrong borrow
    the route of the ones that are right.'
  frame: subject_native
- name: t1w
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry.  the anatomical volume the supports are indexed over.  as ds004024''s card
    records, a T1 would genuinely bind to `material.conductivity` and `material.mass_density` once a head
    model exists to put the values into -- but a material value asserted for a conductor nobody can address
    is not evidence, so it stays context until the support bank exists.'
- name: bold_rest
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.25
  constrains: []
  notes: 'context, and a DUPLICATE carried over from the migration: it describes the same bytes as `bold_with_concurrent_physiology`,
    which is where the likelihood is written.  kept so the card still describes the archive it came from,
    bound to nothing so one measurement is not counted twice.  the resting runs are part of the same acquisition
    already bound there.'
- name: bold_task
  kind: measured
  via:
  - em_generation
  band_hz:
  - 0.0
  - 0.25
  constrains:
  - electromagnetic.bfield
  notes: 'separate task runs, so measured rather than a second count of the resting ones.  same clock
    and same caveat about the TR being taken from the protocol rather than a held sidecar.  BOLD IS NOT
    NEURAL ACTIVITY, and the four-step chain is what says so: neurovascular coupling, then flow, then
    tissue exchange, then the susceptibility change deoxyhaemoglobin makes -- which is why the component
    is `electromagnetic.bfield` and not a neural one.  the vascular stages are modelled state, not nuisance
    to be regressed away.  em_generation is what produces the magnetic field from source currents; the
    previous chain named vascular_flow, which is unrelated.'
  frame: scanner
- name: fieldmaps
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry, not evidence.  it supplies a support that a materialization is indexed over
    and constrains no ibm component; letting it update biology would turn a reconstruction into a measurement.  and
    an ASYMMETRY worth recording: PIOP2 ships a B0 phase-difference fieldmap for all 226 subjects and
    PIOP1 ships NO fmap directory at all, and neither ships a reverse phase-encode acquisition.  so EPI
    distortion is correctable for one half of this collection and not the other, which makes any pooled
    spatial claim heterogeneous.'
- name: respiration
  kind: measured
  via:
  - mechanical_propagation
  band_hz:
  - 0.0
  - 2.0
  constrains:
  - mechanical.displacement
  notes: 'a respiration belt, bound as in aomic-id1000 and bbbd: thoracic circumference constrains `mechanical.displacement`
    through `mechanical_propagation`, and what makes that defensible is that the respiratory volume swing
    drives intracranial displacement through the closed-box coupling the process describes.  band to 2
    Hz: respiration is 0.1-0.5 Hz and nothing physiological is up at the device''s sampling rate.'
- name: cardiac
  kind: measured
  via:
    blood.volume:
    - vascular_flow
    blood.oxygenation:
    - tissue_exchange
  band_hz:
  - 0.0
  - 0.5
  constrains:
  - blood.volume
  - blood.oxygenation
  notes: 'pulse oximetry, bound as in aomic-id1000: the systemic volume and oxygenation pulse through
    `vascular_flow`, capped where those components are declared meaningful.  separate bytes from `respiration`,
    so the two are not one measurement counted twice.  per-component chains: this acquisition makes more
    than one claim and the routes differ.  one chain for all of them would let the component whose route
    is wrong borrow the route of the ones that are right.'
- name: events
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context.  this is a DESIGN FACTOR -- a label naming which condition a block belonged to -- not
    a physical variable.  the same reading as eegmmidb''s `task_annotations`: it indexes the imposed stimulus
    rather than constraining any state, so it binds to nothing and that is correct, not missing.'
- name: demographics
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: context.  a phenotype, a demographic field, a questionnaire score or a genotype is a property
    of a PERSON rather than a value of any state variable at any time.  the registry has no component
    for any of them and should not acquire one; they belong in `split` and in covariates, not in a likelihood.
- name: psychometrics
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: context.  a phenotype, a demographic field, a questionnaire score or a genotype is a property
    of a PERSON rather than a value of any state variable at any time.  the registry has no component
    for any of them and should not acquire one; they belong in `split` and in covariates, not in a likelihood.
- name: fmriprep_derivatives
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context.  this is a PIPELINE OUTPUT, not a measurement: it is what one algorithm returned when
    it was run on the bytes above.  ARCHITECTURE.md''s rule that a derived quantity carries its algorithm
    forever applies -- binding it as measured would let one reconstruction contribute a likelihood about
    tissue, which is the same argument that makes a tractogram context.'
absent:
- clinical_populations
- eeg
- fieldmap_intended_for_dwi
- intervention
- meg
- reverse_phase_encode_dwi
- second_session
- second_site
requires:
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
- geometry: tract-path-products
  for_streams: []
  severity: degrading
  without_it: 'A diffusion volume is a field of orientations attached to no pathway. Re-graded to degrading
    and unscoped 2026-09-05 on the entry''s own logic, which already said the source ''can constrain local
    microstructure but no interaction between supports'': local microstructure is exactly what the `dwi`
    stream binds -- `structural.fiber_orientation`, `structural.axonal_density` and `structural.myelination`
    -- so the missing product does not stand between that stream and its components. What it blocks is
    any claim of the form ''this tract transmits between these two supports'', and no stream in this card
    makes one. This is the same reading ds000117, tractoinferno and aomic-id1000 already carry.'
use:
- fit
- prior
forbidden:
- aomic/* -> a population-representative claim (PIOP1 and PIOP2 are students; ID1000 is the representative
  cohort and is a different card)
- 'aomic/* -> a between-site or between-scanner claim (one site, one scanner, one session: that variance
  is zero by construction and therefore unestimable here)'
- aomic/dwi -> crossing-fibre orientation (single-shell b=1000, 32 directions)
- aomic/* -> a pooled spatial claim across PIOP1 and PIOP2 without recording that only PIOP2 has fieldmaps
- aomic/bold_rest -> independent evidence from aomic/bold_with_concurrent_physiology
split:
  group_by:
  - participant
  - run
provenance:
  imported_from: win-registry
  card: aomic
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
