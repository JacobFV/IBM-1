streams:
- name: bold_motor_somatosensory
  kind: measured
  via: null
  observation_chain: "neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin\
    \ concentration change -> T2*/T2' change -> gradient-echo k-space acquisition -> reconstruction ->\
    \ voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY (PROMPT.md \xA717): the vascular stage\
    \ is a modelled state, not a nuisance to be regressed away"
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  - age-related differences in neurovascular coupling, which change the BOLD response independently of
    neural activity -- the single most important confound in any lifespan BOLD study
  systematic_bias: "\xA717 is directly load-bearing here: an age difference in BOLD amplitude is ambiguous\
    \ between a neural and a vascular explanation, and only an explicit vascular stage can separate them."
  notes: without a vascular calibration (breath-hold, hypercapnia or ASL) the neural and vascular contributions
    to an age effect are not identifiable
  band_hz:
  - null
  - null
  temporal_support: TR seconds; blocked or event-related motor and somatosensory tasks
  spatial_support: standard BOLD resolution; details unresolved pending file-level audit
