id: kymata-soto
title: Kymata SOTO -- MEG/EEG transform mapping of the language processing hierarchy
provider: Kymata Atlas, MRC Cognition and Brain Sciences Unit
citation: Kymata Atlas SOTO dataset (named in PROMPT.md §52.4).
urls:
- https://kymata.org/
access: watch
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved; the Kymata Atlas distributes derived transform maps whose terms differ from the underlying
    recordings.
binding: unbound
population:
  n: null
  hierarchy:
  - participant
  - session
  notes: n unresolved. The distinctive product is a mapping from candidate computational TRANSFORMS to
    cortical locations and latencies.
frames:
- meg_device
- eeg_cap
- fsaverage
- source_space
streams:
- name: meg_eeg
  kind: measured
  via: null
  observation_chain: oriented cortical current-source state -> quasi-static magnetic field (primary current
    plus volume-current return) -> pickup-coil geometry, orientation and gradiometer configuration ->
    SQUID flux -> sampled channel
  confounds:
  - environmental magnetic interference and urban noise
  - head motion within and between runs
  - ocular and cardiac fields
  - muscle artifact at high frequency
  - SQUID jumps and sensor drift
  - 'ocular: blink and saccade corneo-retinal potentials'
  - 'cardiac: ECG contamination and pulse artifact'
  - 'muscle: temporalis, frontalis and neck EMG'
  - electrode impedance drift, motion and bridging
  - line noise and amplifier drift
  - reference-electrode activity, which is never inactive
  systematic_bias: Authority low pending verification of release and access.
  band_hz:
  - null
  - null
  temporal_support: MEG/EEG at kHz; latencies reported in milliseconds relative to stimulus
  spatial_support: source-space vertices with an explicit latency axis
- name: transform_expression_maps
  kind: measured
  via: null
  systematic_bias: These maps say 'a model of transform T correlates with source activity here at latency
    L'. That is an ASSOCIATION between a hypothesised computation and a source estimate, and it inherits
    the inverse solution's uncertainty entirely. §8's warning that an inverse solution is not ground truth
    applies with full force.
  band_hz:
  - null
  - null
