frames:
- subject_native
- simulation_grid
- transducer_frame
streams:
- name: subject_specific_transcranial_pipeline
  kind: measured
  via: null
  systematic_bias: §59 reference 42 and §54.2 single it out because it EXPLICITLY MODELS SKULL-INDUCED
    ACOUSTIC DISTORTION AND THERMAL EXPOSURE FROM SUBJECT IMAGING. That is the whole delivered-field computation
    §52.13 requires, packaged. Its ZTE/UTE-MRI-to-acoustic-property path means a radiation-free pipeline
    is possible and adds a derivation step whose error is measurable only where paired CT exists.
  notes: the CT-Hounsfield-to-speed-of-sound relation is empirical with real scatter, and the MRI substitute
    adds a second empirical mapping on top
  band_hz:
  - null
  - null
  temporal_support: acoustic simulation over the pulse; thermal integration over the sonication
  spatial_support: an end-to-end pipeline from an individual's SKULL IMAGING to a predicted acoustic and
    thermal field at a targeted brain location, including the transducer's own geometry
- name: targeting_workflow
  kind: measured
  via: null
  systematic_bias: transducer pose relative to individual anatomy is the boundary condition the whole
    computation rests on; see the mr-arfi-displacement-data card for the only in-vivo check on whether
    the predicted focus is the actual one
  band_hz:
  - null
  - null
