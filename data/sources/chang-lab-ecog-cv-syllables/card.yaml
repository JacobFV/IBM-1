# ibm-1 source card. schema: data/schema/source.schema.json
id: chang-lab-ecog-cv-syllables
title: Human ECoG speaking consonant-vowel syllables (Bouchard and Chang)
provider: UCSF (Chang lab) and LBNL (Bouchard), curated for CRCNS and hosted on figshare
citation: 'Bouchard & Chang, Human ECoG speaking consonant-vowel syllables. figshare collection doi:10.6084/m9.figshare.c.4617263.v4,
  2019. Primary: Bouchard et al., Functional organization of human sensorimotor cortex for speech articulation.
  Nature 495:327-332, 2013.'
urls:
- https://figshare.com/collections/Human_ECoG_speaking_consonant-vowel_syllables/4617263
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: COLLECTION-LEVEL LICENCE UNRESOLVED. Individual file records carry MIT -- verified on one article
    record -- which is an unusual and probably unintended licence for human recordings, and it must be
    checked PER FILE rather than assumed for the collection. A code licence applied to data is a strong
    signal that the licence field was filled in without thought, and the safe reading is that the terms
    are not established.
binding: bound
population:
  n: 3
  hierarchy:
  - participant
  - run
  notes: Subjects EC2, EC9 and GP31, distributed as block-level files (EC2_B1 through B76, EC9_B39 through
    B63). Exact block totals unresolved.
frames:
- grid_index
- subject_native
streams:
- name: high_density_ecog_during_syllable_production
  kind: measured
  via:
  - em_generation
  - em_coupling
  - device_coupling
  observation_chain: local post-synaptic and spiking activity within a few millimetres of a contact ->
    extracellular potential -> potential difference against a reference contact whose own activity is
    in every number -> amplifier and filter -> sampled microvolts. No skull and no inverse problem. High-density
    grids over ventral sensorimotor cortex during overt syllable production; the articulatory output is
    described by hand annotation because the microphone signal was removed
  confounds:
  - the reference contact's own activity
  - the epileptogenic zone and interictal discharges, present by definition in a clinical cohort
  - anti-epileptic medication, often being tapered during monitoring
  - electrode placement follows a surgical hypothesis, so coverage is not a sample of the brain
  - 'hospital environment: sleep, arousal and drug state uncontrolled'
  - articulatory muscle artefact time-locked to production
  - auditory feedback of the participant's own voice
  - the hand annotation is an annotator's judgement of syllable boundaries, with no independent acoustic
    check available in the release
  - 'three participants: any organisation reported is a within-subject observation replicated three times,
    not a population result'
  systematic_bias: 'THE MICROPHONE SIGNAL WAS REMOVED FOR PRIVACY COMPLIANCE. There is therefore NO ACOUSTIC
    GROUND TRUTH: the boundary variable that would close the production loop is absent, and every alignment
    rests on hand marks. That is a censoring decision with a stated reason, and it is exactly the kind
    of absence that must not be read as ''the acoustics were not informative''.'
  band_hz:
  - 0.0
  - 200.0
  temporal_support: 'one file per continuous recording block, with hand-marked syllable onset, consonant-vowel
    transition and offset. THE ANNOTATION IS THE ONLY TIMEBASE FOR THE SPEECH: there is no acoustic signal
    to align against'
  spatial_support: 256-channel HIGH-DENSITY subdural grids over sensorimotor cortex -- the electrode pitch
    that resolves articulator somatotopy, which a standard clinical grid does not
  constrains:
  - device.contact_potential
  notes: '256-channel HIGH-DENSITY subdural grids over sensorimotor cortex -- the electrode pitch that
    resolves articulator somatotopy, which a standard clinical grid does not.  the acquisition rate is
    not stated in the record and the bytes are not held, so 200 Hz is a conservative ceiling to be re-read
    from the deposit.  the support is `implanted_array`, not `sensor_array`: a contact sees current sources
    within millimetres over a short conduction path, with NO SKULL AND NO SCALP in the way, which is the
    spatially local electrical evidence scalp EEG cannot supply.  the reference contact''s own activity
    is in every number.  and COVERAGE IS CLINICALLY DICTATED and differs completely between patients,
    so treating it as a random sample of cortex overstates what it constrains and a group-level map from
    it is an aggregation over incompatible supports.  THE DECISIVE ABSENCE: THE MICROPHONE SIGNAL WAS
    REMOVED FOR PRIVACY COMPLIANCE, so there is no acoustic ground truth at all -- the boundary variable
    that would close the production loop is gone, and every alignment rests on hand marks.  that is a
    censoring decision with a stated reason, which is better than a silent one, and it is still the thing
    that limits what this source can support.'
  frame: electrode_native
  support: implanted_array
  units: V
- name: ecog_256_channel
  kind: context
  via: null
  band_hz:
  - 0.0
  - 200.0
  constrains: []
  notes: 'context, and a DUPLICATE carried over from the migration: it describes the same bytes as `high_density_ecog_during_syllable_production`,
    which is where the likelihood is written.  kept so the card still describes the archive it came from,
    bound to nothing so one measurement is not counted twice.'
- name: syllable_annotations
  kind: context
  via: null
  band_hz:
  - null
  - null
  constrains: []
  notes: 'context, and here it is forced rather than chosen: hand-marked syllable onset, consonant-vowel
    transition and offset ARE THE ONLY TIMEBASE FOR THE SPEECH, because the acoustic signal was removed.  a
    hand mark is a human annotation with an unmeasured residual, and there is nothing left to check it
    against.  it would be `imposed` if the experimenter had set it and `measured` if a microphone had
    recorded it; it is neither.'
- name: rest_baseline
  kind: measured
  via:
  - em_generation
  - em_coupling
  - device_coupling
  band_hz:
  - 0.0
  - 200.0
  constrains:
  - device.contact_potential
  notes: separate baseline blocks from the production runs, so measured rather than a second count of
    them -- the eegmmidb `eeg_64ch` / `baseline_runs` case.  it is the floor any production claim must
    clear.
  frame: electrode_native
  support: implanted_array
  units: V
absent:
- audio
- acoustic_ground_truth
- individual_anatomy
requires:
- geometry: device-geometry
  severity: blocking
  without_it: A contact's position IS its spatial support. Until the localisation is carried into a device-geometry
    object -- contact extent, pose in a named frame and the tissue interface, not just a label -- each
    channel is an index and nothing measured here can be attached to a cortical location.
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
use:
- fit
forbidden:
- chang-lab-ecog-cv-syllables/* -> any acoustic claim or acoustic alignment (the microphone signal was
  removed for privacy compliance)
- chang-lab-ecog-cv-syllables/ecog_256_channel -> independent evidence from high_density_ecog_during_syllable_production
- chang-lab-ecog-cv-syllables/* -> a population claim (n=3)
split:
