streams:
- name: morphologically_detailed_simulation
  kind: measured
  via: null
  systematic_bias: THE BRIDGE FROM CELLULAR CURRENTS TO MEASURABLE FIELDS. NEURON computes transmembrane
    current distributed over a real morphology, which is exactly what generates an extracellular potential
    and hence an LFP, an ECoG signal and ultimately an EEG. §14 wants electromagnetism as internal physical
    state, and this is where the source term in that physics comes from -- oriented current dipoles produced
    by dendritic geometry, which is why obj-gsplat requires orientation to be carried.
  notes: a reconstructed morphology from neuromorpho is truncated and shrunken; channel densities are
    fitted to a small number of recordings
  band_hz:
  - null
  - null
  temporal_support: adaptive or fixed timestep, sub-millisecond
  spatial_support: MULTI-COMPARTMENT neurons with real morphology and distributed channel densities; the
    cable equation solved along dendrites, with LFP calculable from transmembrane currents
- name: lfp_forward_calculation
  kind: measured
  via: null
  systematic_bias: the line-source and point-source LFP approximations implemented here are the microscopic
    end of the same forward problem SimNIBS and OpenMEEG solve at the macroscopic end; a consistent implementation
    must agree at the boundary
  band_hz:
  - null
  - null
