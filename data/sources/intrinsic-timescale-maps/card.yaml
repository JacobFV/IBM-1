id: intrinsic-timescale-maps
title: Intrinsic neural timescale maps
provider: multiple -- Murray, Watanabe, Golesorkhi and successors
citation: "Murray et al., A hierarchy of intrinsic timescales across primate cortex. Nature Neuroscience\
  \ 2014; PROMPT.md \xA752.9."
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: "Unresolved. \xA749.2 records that the predecessor's attribution generator tracked each source's\
    \ known bias and licence rather than treating atlas availability as correctness; that practice is\
    \ preserved by leaving this unresolved and counting it."
binding: unbound
population:
  n: null
frames:
- MNI152
- fsaverage
- electrode_native
streams:
- name: autocorrelation_timescale
  kind: measured
  via: null
  systematic_bias: "THE MODALITY DETERMINES THE NUMBER. An intrinsic timescale from BOLD (seconds) and\
    \ one from spiking (tens of milliseconds) are different quantities with the same name, and \xA752.9's\
    \ requirement to retain modality is not a formality here -- it is the difference between two orders\
    \ of magnitude."
  notes: autocorrelation decay is a summary of a process, not the process; two very different dynamical
    systems can share it
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: cortical maps of the autocorrelation decay time of spontaneous activity, computed from
    resting fMRI, MEG or intracranial recordings depending on the study
- name: timescale_hierarchy
  kind: measured
  via: null
  systematic_bias: the hierarchy is reproducible across modalities even where the absolute values are
    not, which makes the ORDERING the transferable claim
  band_hz:
  - null
  - null
absent:
- cross_modality_commensurability
- individual_maps
- mechanism
requires:
- geometry: cortical-support-bank
  severity: blocking
  without_it: A parcellation or a surface map is a COVER, not an element of the brain's ontology. Without
    the support bank there is nothing for these labels to be a cover OVER, and using them as if they were
    the supports themselves is precisely the canonical-parcellation commitment the architecture refuses.
use:
- calibrate
- prior
forbidden:
- intrinsic-timescale-maps/* -> observation-role likelihoods
- intrinsic-timescale-maps/* -> cross-modality quantitative comparison
- intrinsic-timescale-maps/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
provenance:
  imported_from: win-registry
  card: intrinsic-timescale-maps
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
origin_kind: class
provenance_note: a CLASS of resource rather than one dataset; the provider field names a literature or
  model family. a single origin url would be a fiction
provenance_traced_from: a peer programme's card for the same corpus, which read the origin off the held
  dataset_description. the ORIGIN is recorded here; the peer is not cited, because a courier is not a
  source
