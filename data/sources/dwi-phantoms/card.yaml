id: dwi-phantoms
title: Diffusion MRI physical phantoms
provider: multiple -- Fibrecup, HARDI phantoms, NIST diffusion phantoms and successors
citation: "PROMPT.md \xA752.8, 'DWI phantoms'; \xA752.12, 'NIST/ADNI phantoms'."
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: "Unresolved. \xA749.2 records that the predecessor's attribution generator tracked each source's\
    \ known bias and licence rather than treating atlas availability as correctness; that practice is\
    \ preserved by leaving this unresolved and counting it."
binding: unbound
population:
  n: null
frames:
- phantom_native
- scanner
streams:
- name: known_geometry_phantoms
  kind: measured
  via: null
  systematic_bias: 'A PHYSICAL phantom differs from a simulated one in exactly the way that matters: it
    carries real eddy currents, real gradient nonlinearity and real noise, with a known answer. That combination
    is unavailable from either simulation or biological tissue, and it is what separates an acquisition-physics
    error from a tractography error.'
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: PHYSICAL objects with known fibre geometry (textile or capillary bundles) or known
    diffusivity (temperature-controlled liquids), scanned on real scanners with real artifacts
- name: known_diffusivity_phantoms
  kind: measured
  via: null
  systematic_bias: 'isotropic diffusivity standards at controlled temperature are a scanner CALIBRATION
    object: they measure the instrument, not the sample'
  band_hz:
  - null
  - null
absent:
- biological_realism
- cellular_structure
- population
use:
- calibrate
- surrogate
forbidden:
- dwi-phantoms/* -> biological interpretation claims
- dwi-phantoms/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
provenance:
  imported_from: win-registry
  card: dwi-phantoms
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
origin_kind: class
provenance_note: a CLASS of resource rather than one dataset; the provider field names a literature or
  model family. a single origin url would be a fiction
provenance_traced_from: a peer programme's card for the same corpus, which read the origin off the held
  dataset_description. the ORIGIN is recorded here; the peer is not cited, because a courier is not a
  source
