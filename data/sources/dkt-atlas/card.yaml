# ibm-1 source card. schema: data/schema/source.schema.json
id: dkt-atlas
title: Desikan-Killiany-Tourville cortical parcellation (DKT and DKT40)
provider: Mindboggle / FreeSurfer, shipped inside each recon-all subject directory
citation: Klein & Tourville, 101 labeled brain images and a consistent human cortical labeling protocol.
  Frontiers in Neuroscience 2012.
urls:
- https://mindboggle.info/
- https://surfer.nmr.mgh.harvard.edu/fswiki/CorticalParcellation
access: held
licence:
  name: FreeSurfer Software License
  redistribution: unresolved
  commercial: permitted
  notes: 'Unresolved. Rule 7 gates DISTRIBUTION only; reading, computing with and fitting to this is never
    gated. LICENCE LINEAGE, NOT A LOOKUP: this reached us inside a FreeSurfer subject directory (bundled
    in turn by an MNE sample dataset or a nilearn cache), so the terms under which WE received it are
    the FreeSurfer Software License. READ, not recalled -- the licence text was fetched: it PERMITS COMMERCIAL
    USE (''any commercialization of the Software is at the sole risk of the party ... engaged in such
    commercialization''), requires that the licence terms and all attributions and copyright notices be
    preserved in any copy, and EXPLICITLY DISCLAIMS COPYLEFT -- contributors warrant their code ''does
    not contain any code that requires or prescribes an open source license for derivative works''. No
    registration or DUA is mentioned; accepting the licence is the only condition of download. This was
    very nearly recorded as commercial_use prohibited from memory, which would have WRONGLY BLOCKED a
    legitimate release. Residual question this does NOT settle: the atlas itself originates outside the
    FreeSurfer project and its authors'' own terms may be broader or narrower. That matters only for a
    copy obtained from the originating project; the copy we hold came through FreeSurfer and carries FreeSurfer''s
    terms.'
binding: unbound
population:
  n: null
frames:
- subject_surface_ras
streams:
- name: surface_parcellation
  kind: measured
  via: null
  systematic_bias: 'A DELIBERATE REVISION of desikan2006 rather than an independent parcellation: boundaries
    that Desikan''s protocol left to the rater were given explicit rules and some regions were removed.
    So it is highly correlated with desikan2006 and the two must never be treated as independent evidence
    about a boundary. Where they DISAGREE is the informative part, and it is concentrated exactly at the
    boundaries the revision was written to fix.'
  band_hz:
  - null
  - null
  temporal_support: not a time series -- static anatomy
  spatial_support: 31 gyral regions per hemisphere on an individual subject's surface -- a REVISION of
    Desikan-Killiany with more consistent boundary rules and several regions dropped
absent:
- per_vertex_confidence
- subcortex
- the_regions_the_revision_dropped
requires:
- geometry: cortical-support-bank
  severity: blocking
  without_it: Per-vertex labels are meaningless without the subject's surface. Written directly on the
    individual, so no spherical transfer and no registration residual.
use:
- prior
forbidden:
- dkt-atlas/surface_parcellation -> independent confirmation of a desikan2006 boundary
- dkt-atlas/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: a labelling protocol applied per subject; held out of nothing. Klein and Tourville's 101 brains
    are not ours.
provenance:
  imported_from: win-registry
  card: dkt-atlas
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
