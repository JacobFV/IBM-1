  systematic_bias: A THIRD independent Bloch implementation, and one that models motion and flow -- which
    matters because a moving object during acquisition is the general case (see the ocmr and speech-rt-mri
    cards). Three independent simulators of the same physics is what makes simulator discrepancy (§39's
    `simulator_discrepancy` component) measurable rather than assumed small.
  band_hz:
  - null
  - null
  temporal_support: the sequence timeline, with the spin object allowed to MOVE during it
  spatial_support: Bloch simulation with MOTION and FLOW support over a spin object, reading Pulseq sequences
    and writing MRD
- name: pulseq_and_mrd_interoperability
  kind: measured
  via: null
  systematic_bias: 'Pulseq in, MRD out: the simulator sits inside the same contract as the scanner, which
    is what makes the comparison well-posed'
