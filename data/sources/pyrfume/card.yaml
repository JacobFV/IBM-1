  systematic_bias: AN ODOUR RATING IS A REPORT. §52.16 says so explicitly. It is a verbal judgement about
    a percept, mediated by the rater's vocabulary and by the scale offered, and it is several inferential
    steps from any olfactory neural state.
  notes: rating scales, vocabularies and dilution conventions differ between the constituent studies,
    and harmonisation cannot remove that
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: curated, harmonised olfactory PSYCHOPHYSICS -- perceptual ratings, discrimination and
    detection data -- linked to molecular structure, drawn from dozens of historical studies
- name: molecular_descriptors
  kind: measured
  via: null
  systematic_bias: the structure-to-percept mapping in olfaction is famously unpredictable -- unlike vision
    and audition, there is no known low-dimensional physical axis (wavelength, frequency) along which
    the stimulus space is organised. That absence is a real scientific fact about the modality and it
    means an 'olfactory stimulus space' cannot be constructed the way a retinal or cochlear one can
  band_hz:
  - null
  - null
- name: detection_thresholds
  kind: measured
  via: null
  systematic_bias: thresholds vary over orders of magnitude between individuals, and specific anosmias
    are common; a population threshold is not a person's
  band_hz:
  - null
  - null
