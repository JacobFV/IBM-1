# ibm-1 source card. schema: data/schema/source.schema.json
id: uk-biobank-imaging
title: UK Biobank Brain Imaging
provider: UK Biobank
citation: Miller et al., Multimodal population brain imaging in the UK Biobank prospective epidemiological
  study. Nature Neuroscience 2016.
urls:
- https://www.ukbiobank.ac.uk/
access: restricted
licence:
  name: unresolved
  redistribution: prohibited
  commercial: unresolved
  notes: Application, approved research purpose and a material transfer agreement. Bytes are non-redistributable;
    commercial terms and SPDX unresolved.
binding: unbound
population:
  n: 100000
  hierarchy:
  - participant
  - site
  - session
  notes: 'The healthy-volunteer selection bias is documented and is a systematic bias, not noise: this
    cohort is not the general population.'
frames:
- scanner
- subject_native
- fsaverage
- MNI152
- wrist_device
streams:
- name: t1w
  kind: measured
  via: null
  observation_chain: tissue proton density and T1 -> sequence-specific contrast -> k-space acquisition
    -> reconstruction -> voxel intensity; intensity is not a tissue parameter until an explicit relaxometry
    model is applied
  confounds:
  - B1+ transmit inhomogeneity
  - B0 off-resonance
  - the fitted signal model's own misspecification
  - motion between the volumes that enter one fit
  systematic_bias: Three scanners at three sites; site effects are large relative to many effects of interest.
  band_hz:
  - null
  - null
  temporal_support: TR 0.735 s BOLD; accelerometry at 100 Hz over one week; longitudinal repeat imaging
    in a subset
  spatial_support: 1 mm structural; 2 mm diffusion; 2.4 mm BOLD; three-site harmonised protocol
- name: swi
  kind: measured
  via: null
  observation_chain: tissue magnetic susceptibility -> field perturbation -> phase accrual over TE ->
    phase unwrapping, background-field removal and an ill-posed dipole inversion -> susceptibility map.
    The inversion is regularised and its regularisation is a choice
  confounds:
  - B1+ transmit inhomogeneity
  - B0 off-resonance
  - the fitted signal model's own misspecification
  - motion between the volumes that enter one fit
  - venous vs. iron ambiguity in susceptibility contrast
  systematic_bias: SWI/QSM sees veins and iron together; separating them is a modelling problem, not a
    threshold.
  band_hz:
  - null
  - null
- name: dwi
  kind: measured
  via: null
  observation_chain: water displacement over the diffusion time within and around axons and cells -> gradient-direction-dependent
    signal attenuation -> reconstructed q-space or orientation distribution; ORIENTATION EVIDENCE, not
    an observation of a tract
  confounds:
  - eddy-current and susceptibility distortion
  - motion between diffusion directions
  - partial volume of crossing fibres, which no single-tensor model represents
  - the fitting model itself (DTI vs. CSD vs. NODDI) is a choice with its own bias
  band_hz:
  - null
  - null
- name: accelerometry
  kind: imposed
  via: null
  systematic_bias: 'wrist-worn: a proxy for whole-body movement, not a measurement of it'
  band_hz:
  - null
  - null
- name: population_covariance
  kind: measured
  via: null
  systematic_bias: healthy-volunteer selection
  band_hz:
  - null
  - null
- name: t2flair
  kind: measured
  via: null
  band_hz:
  - null
  - null
- name: bold_rest
  kind: measured
