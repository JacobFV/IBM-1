streams:
- name: pet_fdg
  kind: measured
  via: null
  observation_chain: glucose transport and hexokinase phosphorylation -> 18F-FDG trapping -> positron
    emission and annihilation -> coincidence detection -> attenuation and scatter correction -> reconstruction
    -> activity concentration -> kinetic model of the metabolic rate
  confounds:
  - partial-volume effect from atrophy, which mimics hypometabolism
  - reference-region choice determining every SUVR number
  - blood glucose at scan time
  systematic_bias: Atrophy-driven partial volume is the single largest systematic bias in ageing FDG-PET.
  band_hz:
  - null
  - null
  temporal_support: longitudinal sessions years apart; PET frames on their own dynamic timeline
  spatial_support: 1 mm structural; PET at its own reconstruction resolution
- name: asl_perfusion
  kind: measured
  via: null
  observation_chain: arterial blood water magnetically labelled proximally -> transit through the arterial
    tree -> exchange into tissue -> label decay at T1 of blood -> control-label subtraction -> perfusion-weighted
    signal -> kinetic-model CBF
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  - prolonged arterial transit in vascular disease
  band_hz:
  - null
  - null
- name: pathology_group
  kind: measured
  via: null
  systematic_bias: a mechanism that predicts identically in Alzheimer and control participants has not
    learned anything about the mechanism it claims
