absent:
- clinical_populations
- eeg
- eye_tracking
- fieldmap
- intervention
- meg
- per_scan_dwi_sidecar
- provider_derivatives
- reverse_phase_encode_dwi
- second_session
- second_site
- second_vendor
requires:
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid the provider happened to ship.
- geometry: tract-path-products
  for_streams:
  - dwi_raw
  - dwi_repeat_acquisitions
  severity: blocking
  without_it: A diffusion volume is a field of orientations attached to no pathway. Until the tract product
    exists there is no engineered claim of the form 'this tract transmits between these two supports',
    so this source can constrain local microstructure but no interaction between supports.
use:
- fit
- prior
forbidden:
- aomic-id1000/* -> a between-site, between-vendor or between-session generalisation claim
- aomic-id1000/* -> a missing physiological trace treated as a flat one
- aomic-id1000/dwi_raw -> a susceptibility-corrected pipeline claim, in either arm; there is nothing to
  estimate the field from
- aomic-id1000/dwi_repeat_acquisitions -> a between-session or between-scanner reliability claim
- aomic-id1000/* -> pooling with PIOP1 or PIOP2, which destroys the population-representative property
  and mixes three acquisition protocols with no key that could detect an overlapping participant
split:
  group_by:
  - participant
  - run
  notes: 'Run must ALSO be grouped for anything measuring pipeline disagreement: the three DWI runs are
    re-acquisitions of one scheme on one brain, so two runs of the same person on opposite sides of a
    split leak that person''s anatomy across it. The stimulus is one film shown to everyone, so any BOLD
    analysis leaks through the stimulus axis under a perfect participant split; group_by does not list
    ''stimulus'' because there is only one, which makes the leak total rather than partial and unfixable
    by grouping.'
provenance:
  imported_from: win-registry
  card: aomic-id1000
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
