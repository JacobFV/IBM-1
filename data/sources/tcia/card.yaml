streams:
- name: ct_and_pet_with_physical_units
  kind: measured
  via: null
  observation_chain: X-ray attenuation -> reconstruction -> Hounsfield units referenced to water and air,
    which is a CALIBRATED scale; and for PET, radiotracer concentration -> coincidence detection -> attenuation-corrected
    reconstruction -> Bq/ml. Both are quantitative in a way MR intensity is not
  confounds:
  - reconstruction kernel changes CT texture and apparent density
  - PET attenuation correction depends on a CT that may be misregistered by breathing
  - SUV normalisation depends on injected dose, uptake time and body composition, all recorded with varying
    care
  - scanner and protocol vary enormously across 200+ collections
  systematic_bias: 'TCIA''s relevance here is head-and-neck and brain CT: skull geometry with CALIBRATED
    DENSITY is exactly what an acoustic or electromagnetic forward model needs, and the oncology framing
    is incidental to that use.'
  band_hz:
  - null
  - null
  temporal_support: longitudinal treatment-response series in several collections; dynamic contrast-enhanced
    and perfusion series carry a fast within-acquisition clock
  spatial_support: CT, MR, PET, digital histopathology, ultrasound and mammography, plus computational
    and physical phantoms; humans, mice and canines
- name: skull_and_head_ct_for_forward_models
  kind: measured
  via: null
  systematic_bias: Mapping Hounsfield units to acoustic speed and density, or to electrical conductivity,
    uses a published empirical relation whose scatter is large and which is routinely applied without
    its uncertainty.
