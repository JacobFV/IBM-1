# ibm-1 source card. schema: data/schema/source.schema.json
id: brainlm
title: BrainLM -- foundation model for brain activity recordings
provider: Yale University and collaborators
citation: 'Ortega Caro et al., BrainLM: A foundation model for brain activity recordings. ICLR 2024.'
urls:
- https://github.com/vandijklab/BrainLM
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Model weights, code and training data commonly carry THREE different licences, and a permissive
    code licence says nothing about the weights. Unresolved.
binding: unbound
population:
  n: null
frames:
- AAL
- Schaefer2018
- common_tr_grid
streams:
- name: masked_autoencoding_objective
  kind: measured
  via: null
  systematic_bias: '§48 and registry/README: TEACHER IS NOT OBSERVATION. This model''s representations
    are a discrepancy-aware forcing CANDIDATE, never automatically a subject likelihood. §29: influence
    starts low and is earned through held-out prediction. A MASKED RECONSTRUCTION objective produces a
    RECONSTRUCTION-SUFFICIENT state, which §35 distinguishes sharply from a transition-sufficient one:
    a representation that can fill in a masked interval need not be able to roll forward. This model is
    the clearest instance in §53.1''s list of the distinction B-WIN is built around.'
  notes: reconstruction and prediction are different objectives with different sufficient statistics
  band_hz:
  - null
  - null
  temporal_support: TR-gridded
  spatial_support: parcellated resting and task fMRI time series, masked-autoencoder style
- name: scaling_and_transfer_results
  kind: measured
  via: null
  systematic_bias: fine-tuning transfer to clinical prediction tasks is a downstream-utility claim, not
    a claim about the representation's mechanistic content
  band_hz:
  - null
  - null
absent:
- native_geometry
- native_clocks
- uncertainty
- causal_protocol
requires:
- geometry: cortical-support-bank
  severity: blocking
  without_it: A parcellation or a surface map is a COVER, not an element of the brain's ontology. Without
    the support bank there is nothing for these labels to be a cover OVER, and using them as if they were
    the supports themselves is precisely the canonical-parcellation commitment the architecture refuses.
use:
- distil
- evaluate
forbidden:
- brainlm/* -> observation-role likelihoods
- brainlm/* -> B-WIN's state ontology or support definitions
split:
  group_by:
  - participant
  - stimulus
provenance:
  imported_from: win-registry
  card: brainlm
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
distillation:
  reported_accuracy:
    metric: unresolved
    value: null
    on_streams:
    - masked_autoencoding_objective
    - scaling_and_transfer_results
    source: not yet extracted from the paper
    verified: false
  precision_model:
    form: unresolved
    ood_inflation_prior: unset -- must be a prior, not a constant
    error_rank: unresolved -- a teacher's residuals covary across everything it writes
    notes: distilled values enter as evidence and must carry calibrated precision; see ARCHITECTURE.md,
      distillation precision
    correlated_fraction: null
    effective_constraints: null
