  systematic_bias: WATERTIGHTNESS IS A PRECONDITION FOR VOLUME MESHING, and a surface that is not watertight
    cannot be tetrahedralised -- which is where a head model for DUNEuro or a vessel model for SimVascular
    fails. Detecting and repairing that is the unglamorous step between a cortical surface and a finite-element
    head model.
  notes: mesh repair CHANGES the geometry to make it valid, and the change is a derivation step that must
    be recorded
