# ibm-1 source card. schema: data/schema/source.schema.json
id: audio-spectrotemporal-encoders
title: Audio spectrotemporal and speech encoder family
provider: multiple -- HuBERT, WavLM, Whisper encoders, spectrotemporal filter banks
citation: PROMPT.md §53.3, 'audio spectrotemporal and speech encoders'.
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Model weights, code and training data commonly carry THREE different licences, and a permissive
    code licence says nothing about the weights. Unresolved.
binding: unbound
population:
  n: null
frames:
- audio_waveform
- frequency_axis
- model_layer_stack
streams:
- name: spectrotemporal_representations
  kind: measured
  via: null
  systematic_bias: '§48 and registry/README: TEACHER IS NOT OBSERVATION. This model''s representations
    are a discrepancy-aware forcing CANDIDATE, never automatically a subject likelihood. §29: influence
    starts low and is earned through held-out prediction. §53.3: the required output is NOT one flat embedding.
    A model must expose MULTISCALE, SPATIAL, TEMPORAL and EVENT-STRUCTURED state suitable for interaction
    with SPECIFICALLY ADDRESSED cortical supports. A single pooled vector cannot address a support. Authority
    slightly higher than the language side because the frequency axis is PHYSICAL and maps onto measured
    tonotopy (see the tonotopy-maps card, and note that the human tonotopic layout is itself contested).
    Classical spectrotemporal modulation filter banks are a strong non-learned baseline here and §46 requires
    them to be beaten rather than ignored.'
  notes: a learned speech encoder's representations are shaped by its recognition objective; a spectrotemporal
    filter bank's are shaped by an explicit hypothesis about auditory processing, and the two fail differently
  band_hz:
  - null
  - null
  temporal_support: frame rates of 10-25 ms typically; the modulation-rate axis in spectrotemporal models
    is a second temporal scale
  spatial_support: a FREQUENCY axis alongside time, which is a physical axis with a direct cortical counterpart
    in tonotopy -- unlike a language model's token index, an audio model's frequency dimension corresponds
    to something anatomical
- name: forcing_precision
  kind: measured
  via: null
  systematic_bias: '§53.3: the model may represent more detail than a person''s imagery. The LEARNED FORCING
    PRECISION controls how much of that representation affects the modelled brain -- it is a parameter
    to be estimated, not a design constant.'
  band_hz:
  - null
  - null
absent:
- binaural_and_spatial_structure
- cochlear_model
- uncertainty
