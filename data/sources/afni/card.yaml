streams:
- name: physiological_noise_regression
  kind: measured
  via: null
  systematic_bias: AFNI's RETROICOR/RVT implementation is a reference for cardiac and respiratory contributions
    to BOLD. In WIN these are MODELLED STATES, not nuisance to be regressed away; the value of the reference
    is that it quantifies how large the physiological term is, not that it removes it.
  band_hz:
  - null
  - null
  temporal_support: TR-sampled functional series; slice-timing is an explicit per-slice offset rather
    than an assumption, which is the acquisition-clock fact most pipelines lose
  spatial_support: voxel grids in the input's own space; surface support via SUMA
- name: slice_timing_and_alignment
  kind: measured
  via: null
  systematic_bias: Slice acquisition order is a real sub-TR clock structure that a volume-level TR representation
    destroys.
  band_hz:
  - null
  - null
