streams:
- name: ecog
  kind: measured
  via: null
  observation_chain: current sources within millimetres of the contact -> local volume conduction over
    a short path -> contact surface area, impedance and referencing scheme -> sampled voltage; spatial
    support is the contact neighbourhood, not a parcel
  confounds:
  - 'clinical pathology at the electrode: this is a patient population, not a healthy one'
  - medication state and post-implant recovery
  - referencing scheme (common average vs. bipolar) reshaping the apparent field
  - epileptiform activity contaminating putative task responses
  - dura and CSF between the grid and cortex, which the contact geometry model must include
  systematic_bias: ECoG over visual cortex measures the SAME quantity a retinotopy fMRI infers, at millisecond
    resolution and millimetre support. Disagreement between the two is a direct test of the BOLD observation
    model rather than of the retinotopy.
  notes: grid contacts sample the cortical surface at fixed spacing regardless of where the functional
    boundaries are
  band_hz:
  - null
  - null
  temporal_support: ECoG at kHz sampling; controlled stimulus events
  spatial_support: subdural grid contacts over visual cortex, individually localised; the contact spacing
    sets the spatial support and it is millimetres
