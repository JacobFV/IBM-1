id: meg-masc
title: MEG-MASC -- MEG during naturalistic story listening over the MASC corpus
provider: NYU Abu Dhabi / Meta AI
citation: 'Gwilliams et al., MEG-MASC: a high-quality magneto-encephalography dataset for evaluating natural
  speech processing. Scientific Data 2023.'
urls:
- https://osf.io/ag3kj/
- https://osf.io/h2tzn/
- https://osf.io/u5327/
- https://osf.io/dr4wy/
- https://www.nature.com/articles/s41597-023-02752-5
- https://github.com/kingjr/meg-masc
access: held
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved. The MASC corpus texts and the recorded narration have separate terms.
binding: bound
population:
  n: 27
  hierarchy:
  - participant
  - session
  - run
  notes: 27 participants, two sessions each, ~2 h of listening per participant over four short stories.
    Population breadth rather than per-person depth.
frames:
- meg_device
- head_fiducial
- subject_native
- story_timeline
streams:
- name: meg_208ch
  kind: measured
  via:
  - em_generation
  observation_chain: oriented cortical current-source state -> quasi-static magnetic field (primary current
    plus volume-current return) -> pickup-coil geometry, orientation and gradiometer configuration ->
    SQUID flux -> sampled channel
  confounds:
  - environmental magnetic interference and urban noise
  - head motion within and between runs
  - ocular and cardiac fields
  - muscle artifact at high frequency
  - SQUID jumps and sensor drift
  - speech-envelope-locked responses that are not separable from linguistic responses without an explicit
    acoustic model
  systematic_bias: The acoustic and the linguistic explanation of the same MEG response are collinear
    in natural speech; separating them requires modelling the acoustic stage rather than regressing it
    out.
  notes: 'MEASURED FROM THE HELD SIDECARS 2026-09-05: KIT/Yokogawa, SamplingFrequency 1000 Hz, SoftwareFilters
    n/a, 208 MEG channels plus 16 references, DigitizedLandmarks true.  the system is DC-coupled so the
    floor is zero; the ceiling is set at 200 Hz rather than the 500 Hz nyquist because these are AXIAL
    GRADIOMETERS in an unshielded-by-modern-standards environment and nothing above the gamma band survives
    at a usable signal-to-noise here -- that is a judgement, and it is the only one in this stream.  `em_generation`
    alone: a pickup coil has no contact interface, so the chain is shorter than a scalp electrode''s.  THE
    HARD PART OF THIS SOURCE is not the band: the acoustic and the linguistic explanation of the same
    response are collinear in natural speech, and separating them requires modelling the acoustic stage
    rather than regressing it out.  em_generation is what produces the magnetic field from source currents;
    the previous chain named vascular_flow, which is unrelated.'
  band_hz:
  - 0.0
  - 200.0
  temporal_support: MEG at 1000 Hz; audio at 22.05 kHz; forced-aligned phoneme and word onsets at millisecond
    resolution -- the PHONEME clock and the MEG clock are the pairing that matters
  spatial_support: 208-channel axial gradiometer KIT system; head position from marker coils; individual
    anatomy where available
  constrains:
  - electromagnetic.bfield
  rate_hz: 1000.0
  frame: meg_device
  units: T
- name: word_and_phoneme_alignments
  kind: context
  via: null
  systematic_bias: FORCED ALIGNMENT is an algorithm's output, not a measurement of when a phoneme occurred;
    its error is systematic at word boundaries
  band_hz:
  - null
  - null
  constrains: []
  notes: 'context, and this is a CORRECTION: the migration marked it `imposed`, and it is not.  an imposed
    stream is state the experimenter set; a forced alignment is where an algorithm put a phoneme boundary
    given the audio and the transcript.  its error is systematic at word boundaries, and binding it as
    imposed would let a model condition on event times nobody measured.  the thing the experimenter actually
    set is the WAVEFORM, which is `audio_stimuli`.'
- name: audio_stimuli
  kind: imposed
  via:
  - transduction
  band_hz:
  - 20.0
  - 11025.0
  constrains:
  - device.speaker_pressure
  notes: 'imposed: four short stories played to every participant, clamped on the display support and
    conditioned on.  ceiling is the 22.05 kHz stimulus files'' own nyquist; floor is where `transduction`
    reads speaker pressure.  the PHONEME clock and the MEG clock are the pairing that makes this dataset
    worth holding, and the phoneme clock is the derived one.'
  frame: story_timeline
- name: story_transcripts
  kind: context
  via: null
  band_hz:
  - null
  - null
  constrains: []
  notes: 'context: a description of the stimulus, not the stimulus.  the pressure waveform above is what
    was physically delivered.'
- name: head_position
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry, not evidence.  it supplies a support that a materialization is indexed over
    and constrains no ibm component; letting it update biology would turn a reconstruction into a measurement.  MEASURED
    ON DISK 2026-09-05: _markers.mrk per run plus acq-ELP and acq-HSP _headshape.pos and a _coordsystem.json
    per session.  marker-coil positions locate the head in the dewar; that is what makes the lead field
    computable and it is not evidence about a brain.  head localisation here is at the START of a run
    rather than continuous (ContinuousHeadLocalization false), so within-run drift is unmeasured.'
- name: behaviour
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: context.  a behavioural score, rating or questionnaire response is a report ABOUT a state, produced
    by a person rather than by a process the model represents, and often minutes later.  no registered
    component is a score, and treating one as a measurement would let a self-report update tissue state
    directly.
absent:
- fmri
- eeg
- eye_tracking
- vascular
- visual_stimulus
requires:
- geometry: device-geometry
  for_streams:
  - meg_208ch
  severity: degrading
  without_it: 'Re-graded from blocking 2026-09-05 ON FILE EVIDENCE: every session carries *_task-*_markers.mrk,
    *_acq-ELP_headshape.pos, *_acq-HSP_headshape.pos and a _coordsystem.json, and the sidecar declares
    DigitizedLandmarks true. Marker coils plus a digitised head shape fix the sensor pose relative to
    the head, so a lead field is computable and a sensor-space result can be attributed. Two reasons it
    is degrading rather than satisfied. ContinuousHeadLocalization is false, so the head is localised
    at the start of a run and any drift within it is unmeasured. And a `structural/` tree of T1s is held
    but it does not cover every participant, so the forward model uses individual anatomy for some and
    a template for others -- which one applies per participant must be recorded rather than averaged over,
    and `forbidden` now says so.'
  substitute: 'A template head model warped to the digitised head points, for the participants with no
    structural scan. That makes the source-estimate error heterogeneous ACROSS the cohort, which is worse
    than uniformly biased: a group contrast can then be driven by which participants had an MRI.'
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
use:
- fit
forbidden:
- meg-masc/* -> a group result that pools participants with and without individual anatomy without recording
  which is which
- meg-masc/word_and_phoneme_alignments -> measured phoneme onsets (forced alignment is an algorithm's
  output with systematic boundary error)
- meg-masc/meg_208ch -> a linguistic effect separated from an acoustic one without an explicit acoustic
  model (the two are collinear in natural speech)
split:
  group_by:
  - participant
  - stimulus
  - session
  notes: the same four stories across all participants
provenance:
  imported_from: win-registry
  card: meg-masc
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
local_root: data/sources/meg-masc/raw
provenance_note: moved into this repo from a sibling working directory; the origin above is the source
  of record, not the machine it was staged on
