streams:
- name: quantitative_t1
  kind: measured
  via: null
  observation_chain: tissue longitudinal relaxation -> MP2RAGE's two inversion-time readouts -> a ratio
    image designed to cancel receive-field and proton-density modulation -> a T1 map IN MILLISECONDS.
    This is one of the few MR measurements in this registry with a physical unit rather than an arbitrary
    intensity, which is what makes cross-site comparison meaningful at all
  confounds:
  - B1+ transmit inhomogeneity, which biases T1 spatially and is not fully removed by the MP2RAGE ratio
  - iron and myelin both shorten T1 and are not separable by T1 alone
  - motion between the two inversion readouts corrupts the ratio
  - the T1 value depends on field strength, so a 3T map is not a 7T map
  band_hz:
  - null
  - null
  temporal_support: ds000221 has four 15.5-minute resting runs per participant; LEMON records cardiovascular
    measures CONTINUOUSLY DURING the resting fMRI, and the EEG is a separate session at its own rate with
    no hardware relation to the scanner clock
  spatial_support: MP2RAGE quantitative T1 alongside T1w, T2w, FLAIR, DWI, fieldmaps, SWI/QSM and resting
    BOLD, plus a 62-channel resting EEG in LEMON
- name: resting_eeg_and_resting_bold_same_participants
  kind: measured
  via: null
  observation_chain: 'post-synaptic currents in aligned pyramidal populations -> volume conduction to
    scalp -> electrode potential -> amplifier -> microvolts; and separately the BOLD chain in a different
    session. SAME PEOPLE, DIFFERENT SESSIONS: this is NOT simultaneous, and treating a between-session
    EEG-BOLD relation as a within-episode one is the error the distinction exists to prevent'
  confounds:
  - ocular, muscle and cardiac artefact in the EEG
  - the reference choice
  - state differs between the EEG and MRI sessions -- time of day, arousal, caffeine -- and nothing measures
    the difference
  - the usual BOLD nuisances
  band_hz:
  - null
  - null
- name: continuous_cardiovascular_during_rest
  kind: measured
  via: null
  observation_chain: cardiac ejection -> arterial pressure wave -> peripheral device transduction -> continuous
    waveform, recorded during the resting scan
  confounds:
  - cuff or finger-device artefact and calibration drift
  - posture and the supine scanner position change baseline pressure
  - the device's own filter delays the waveform relative to the cardiac event
  systematic_bias: 'Continuous cardiovascular recording DURING resting fMRI is uncommon and is directly
    what obj-vascular-metabolic-state needs: it makes the vascular term an observed state rather than
    a regressor to be discarded.'
  band_hz:
  - null
  - null
