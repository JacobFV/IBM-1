streams:
- name: graded_propofol_bold
  kind: measured
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY: the vascular stage is a modelled state,
    not a nuisance to be regressed away. Under propofol the vascular stage itself changes: the drug is
    a cerebral vasodilator and depresses metabolism, so BOLD amplitude falls for reasons that are not
    a fall in neural activity. This dataset is therefore as much a neurovascular-coupling manipulation
    as a consciousness one'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving a global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  - propofol's direct vasodilatory and metabolic effects, which change the coupling itself
  - respiratory depression changing arterial CO2, which is the single largest non-neural driver of global
    BOLD
  - the effect-site concentration is a pharmacokinetic MODEL output, not a measurement
  - movement decreases with sedation, so motion confound is correlated with the condition of interest
  systematic_bias: 'The MENTAL-IMAGERY TASK is the point: a participant who cannot respond behaviourally
    may still produce a task-appropriate BOLD response, which dissociates responsiveness from the state
    the model is supposed to represent. That dissociation is a control that could fail and is why the
    dataset is worth more than a resting-state sedation study.'
  band_hz:
  - null
  - null
  temporal_support: two 10-minute resting runs and four task runs across graded propofol levels. The DRUG
    clock -- a target-controlled infusion stepped by 0.4 ug/ml every 5 minutes to loss of behavioural
    responsiveness -- runs at minutes while the BOLD clock runs at seconds, and the two are related by
    the pump's pharmacokinetic model rather than by a hardware trigger
  spatial_support: whole-brain EPI plus T1w structural
