# ibm-1 source card. schema: data/schema/source.schema.json
id: acoustic-closed-forms
title: 'O''Neil, Rayleigh and the layered-fluid transfer matrix: exact acoustic solutions'
provider: the analytic acoustics literature
citation: O'Neil, Theory of focusing radiators. Journal of the Acoustical Society of America 1949; Rayleigh,
  The Theory of Sound, on the field of a circular piston; Brekhovskikh, Waves in Layered Media, for the
  transfer-matrix solution of a fluid stack; Pennes, Analysis of tissue and arterial blood temperatures
  in the resting human forearm. Journal of Applied Physiology 1948; Sapareto and Dewey, Thermal dose determination
  in cancer therapy. IJROBP 1984, for CEM43.
urls:
- https://doi.org/10.1121/1.1906542
access: reference
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Published mathematics rather than a distributed artifact. Unresolved because no file was acquired;
    nothing here is redistributed.
binding: unbound
population:
  n: null
frames:
