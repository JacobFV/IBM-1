streams:
- name: federated_availability_query
  kind: measured
  via: null
  systematic_bias: ANSWERS THE QUESTION 'WHO HAS DATA MATCHING THIS DESCRIPTION' WITHOUT MOVING THE DATA,
    which is the only tractable approach for the restricted cards in this registry -- UKB, ABCD, ADNI,
    TUH, RAM and the clinical archives all prohibit redistribution. Availability is metadata; access is
    still governed per source.
  notes: harmonised phenotypic terms across institutions require a mapping that loses institution-specific
    meaning
  band_hz:
  - null
  - null
  temporal_support: not a time series
  spatial_support: 'a FEDERATED query layer: participant-level attributes are queried across institutions
    without the data leaving them, returning counts and availability rather than records'
- name: availability_versus_access
  kind: measured
  via: null
  systematic_bias: knowing a dataset exists and being permitted to use it are different, and a discovery
    layer makes it easy to conflate them -- registry/README's discovery-is-not-admission rule applies
  band_hz:
  - null
  - null
