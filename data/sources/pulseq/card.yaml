  systematic_bias: §19 asks B-WIN to eventually model actual MRI acquisition physics, and §56.6 asks for
    sequence timelines with RF and gradient events as constructed objects. Pulseq is that object, already
    standardised and already executable on real hardware -- which means a simulated sequence and a scanned
    sequence can be THE SAME OBJECT, and the simulator's discrepancy becomes measurable rather than theoretical.
  band_hz:
  - null
  - null
  temporal_support: 'the SEQUENCE TIMELINE at microsecond resolution: exactly the temporal object §56.6
    calls the sequence timeline with its RF and gradient events'
  spatial_support: a sequence is an explicit, timed LIST OF RF, GRADIENT AND ADC EVENTS -- the sequence
    itself as data rather than as vendor source code
- name: hardware_executability
  kind: measured
  via: null
  systematic_bias: the same file drives a simulator and a scanner, which closes the loop between simulated
    and measured acquisition physics
