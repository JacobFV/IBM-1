frames:
- scalp montage
streams:
- name: tms_eeg_four_sites
  kind: measured
  via: null
  observation_chain: A TMS pulse induces an E-field in cortex; the evoked current flow produces a scalp
    potential through the head's volume conductor, measured differentially against a reference by the
    EEG amplifier. The recorded waveform is that neural response SUMMED WITH the amplifier's recovery
    from the pulse artifact, cranial muscle activation, and the evoked response to the click and the scalp
    sensation -- which is why this deposit carries a control site at all.
  confounds:
  - auditory evoked potential from the coil click
  - somatosensory evoked potential from scalp stimulation
  - cranial and facial muscle activation
  - amplifier saturation and recovery artifact
  - eye movement and blink
  band_hz:
  - null
  - null
  temporal_support: continuous EEG with TMS pulse events
  spatial_support: scalp EEG electrodes; TMS delivered at four sites
- name: shoulder_control_condition
  kind: measured
  via: null
  observation_chain: The same EEG measurement with the coil discharging over the SHOULDER rather than
    the head, so the click and a somatosensory input are delivered while no E-field reaches cortex. What
    it records is the sum of the peripheral responses alone.
  confounds:
  - residual cortical activation from a distant field
  - differences in click loudness or scalp contact between the control and the cortical sites
  - subject knowledge of which condition is running
  band_hz:
  - null
  - null
