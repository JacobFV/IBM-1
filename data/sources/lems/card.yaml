  systematic_bias: 'LEMS separates WHAT A COMPONENT IS (a type with dimensioned state and update rules)
    from WHAT IT MEANS BIOLOGICALLY, and lets new component types be defined without changing the simulator.
    That is structurally what §6''s interaction primitive needs: a general algebra of typed, dimensioned,
    composable dynamical objects. Worth reading as a design precedent for obj-win-formalism, not merely
    as a file format.'
  notes: LEMS assumes continuous-time dynamics over dimensioned states; §32's event systems, lookups and
    discrete algorithms do not fit it
