streams:
- name: simulator_independent_model_description
  kind: measured
  via: null
  systematic_bias: THE SAME MODEL RUN ON DIFFERENT SIMULATORS is what makes numerical discrepancy measurable
    -- §39's `numerical` uncertainty component made operational. NeuroML exists precisely so that a model
    is not defined by the code that runs it, which is the same separation §55 wants between a source format
    and the internal ontology.
  notes: declarative expressiveness is bounded; models outside NeuroML's component set cannot be described
    in it
  band_hz:
  - null
  - null
  temporal_support: no clock of its own; the description is simulator-independent and the timestep belongs
    to whatever runs it
  spatial_support: a DECLARATIVE description of neurons, channels, synapses and networks -- morphology,
    biophysics and connectivity as data rather than as simulator code
- name: unit_annotated_declarations
  kind: measured
  via: null
  systematic_bias: declared units on every quantity, like CellML; §57's native-units requirement has existing
    machinery here
  band_hz:
  - null
  - null
