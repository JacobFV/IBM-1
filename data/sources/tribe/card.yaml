# ibm-1 source card. schema: data/schema/source.schema.json
id: tribe
title: TRIBE -- trimodal brain encoder for naturalistic stimuli
provider: Meta AI and collaborators
citation: TRIBE, arXiv:2507.22229. Identified 2026-08-17 from NeuroWorld's bibliography rather than by
  a name search; the method and what was ruled out are in notes/literature/tribe.md.
urls:
- https://arxiv.org/abs/2507.22229
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Model weights, code and training data commonly carry THREE different licences, and a permissive
    code licence says nothing about the weights. Unresolved.
binding: unbound
population:
  n: null
frames:
- fsaverage
- common_tr_grid
streams:
- name: trimodal_encoding
  kind: measured
  via: null
  systematic_bias: '§48 and registry/README: TEACHER IS NOT OBSERVATION. This model''s representations
    are a discrepancy-aware forcing CANDIDATE, never automatically a subject likelihood. §29: influence
    starts low and is earned through held-out prediction. Its trimodal design is the architectural point:
    video, audio and text features combined into one predictor. §30''s warning applies directly -- a weakly
    weighted modality dies in a shared trunk, and run 4 of the predecessor demonstrated strong gradients
    through a shared trunk destroying a weak modality''s representation entirely while the loss went down.
    Whether TRIBE''s fusion has that failure is a modality-ablation question and is exactly what §53.1
    says to extract.'
  band_hz:
  - null
  - null
  temporal_support: TR-gridded
  spatial_support: parcellated fMRI responses predicted from video, audio and text features
- name: modality_ablation_results
  kind: measured
  via: null
  systematic_bias: ablation is the only way to find a modality that is nominally present and contributing
    nothing
  band_hz:
  - null
  - null
absent:
- native_geometry
- native_clocks
- uncertainty
- causal_protocol_verification
requires:
- geometry: cortical-support-bank
  severity: blocking
  without_it: A parcellation or a surface map is a COVER, not an element of the brain's ontology. Without
    the support bank there is nothing for these labels to be a cover OVER, and using them as if they were
    the supports themselves is precisely the canonical-parcellation commitment the architecture refuses.
use:
- distil
- evaluate
forbidden:
- tribe/* -> observation-role likelihoods
- tribe/* -> B-WIN's state ontology or support definitions
split:
  group_by:
  - participant
  - stimulus
provenance:
  imported_from: win-registry
  card: tribe
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
distillation:
  reported_accuracy:
    metric: unresolved
    value: null
    on_streams:
    - trimodal_encoding
    - modality_ablation_results
    source: not yet extracted from the paper
    verified: false
  precision_model:
    form: unresolved
    ood_inflation_prior: unset -- must be a prior, not a constant
    error_rank: unresolved -- a teacher's residuals covary across everything it writes
    notes: distilled values enter as evidence and must carry calibrated precision; see ARCHITECTURE.md,
      distillation precision
    correlated_fraction: null
