# ibm-1 source card. schema: data/schema/source.schema.json
id: things-eeg2
title: THINGS-EEG2 -- large image/EEG pairing over the THINGS concept space
provider: THINGS initiative
citation: Gifford et al., A large and rich EEG dataset for modeling human visual object recognition. NeuroImage
  2022.
urls:
- https://osf.io/3jk45/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: 'EXPLICITLY UNRESOLVED. §51.1 item 4: the predecessor correctly left this unresolved rather than
    inferring permission from the open-access paper, and that judgement is preserved here. Resolving this
    licence is a precondition for ingestion, not a formality.'
binding: bound
population:
  n: 10
  hierarchy:
  - participant
  - session
  - run
  notes: 10 participants, 16,740 training images and 200 test images with many repetitions -- the repetitions
    are what make a noise ceiling available.
frames:
- eeg_cap
- display
streams:
- name: eeg_64ch
  kind: measured
  via:
  - em_generation
  - em_coupling
  - device_coupling
  observation_chain: oriented cortical current-source state -> quasi-static volume conduction through
    brain, CSF, skull and scalp -> electrode contact geometry and impedance -> reference montage -> amplified,
    filtered, sampled voltage
  confounds:
  - 'ocular: blink and saccade corneo-retinal potentials'
  - 'cardiac: ECG contamination and pulse artifact'
  - 'muscle: temporalis, frontalis and neck EMG'
  - electrode impedance drift, motion and bridging
  - line noise and amplifier drift
  - reference-electrode activity, which is never inactive
  - RSVP overlap between consecutive images
  systematic_bias: '§51.1 item 4: this is the STATIC-IMAGE CONTROL for the naturalistic claim. If a naturalistic
    world-model interaction explains nothing here that a static encoder does not, the naturalistic claim
    is weaker than it looks.'
  band_hz:
  - 0.0
  - 100.0
  temporal_support: EEG at 1000 Hz; 100 ms image presentation at 10 Hz RSVP
  spatial_support: 64-channel scalp EEG
  constrains:
  - device.contact_potential
  notes: 'EEG at 1000 Hz on a 64-channel scalp montage, with 100 ms image presentations in a 10 Hz RSVP
    stream.  the ceiling is 100 Hz rather than the 500 Hz nyquist, the same judgement erp-core carries:
    the visual evoked response this exists for lives well below it and the band above is dominated by
    muscle in a scalp montage.  WHAT IT IS FOR: this is the STATIC-IMAGE CONTROL for any naturalistic
    claim -- if a naturalistic world-model interaction explains nothing here that a static encoder does
    not, the naturalistic claim is weaker than it looks.'
  rate_hz: 1000.0
  frame: eeg_cap
  support: sensor_array
  units: V
- name: test_set_repetitions
  kind: context
  via: null
  systematic_bias: the noise ceiling from repetitions is the floor every number here must be quoted against
  band_hz:
  - 0.0
  - 100.0
  constrains: []
  notes: context.  the repeated presentations of the test images give a per-channel NOISE CEILING, which
    is the floor every number here must be quoted against.  a reliability estimate is an uncertainty budget
    computed from `eeg_64ch`, so binding it would count those repetitions twice.
- name: stimulus_images
  kind: imposed
  via:
  - transduction
  band_hz:
  - 0.0
  - 10.0
  constrains:
  - device.display_luminance
  notes: 'imposed: THINGS object photographs at 100 ms each in a 10 Hz RSVP stream, clamped on the display
    support.  the ceiling is the presentation rate, which is the fastest thing the stimulus timeline records;
    the monitor''s own refresh is not recorded here.'
  frame: display
- name: behaviour
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: context.  a behavioural score, rating or questionnaire response is a report ABOUT a state, produced
    by a person rather than by a process the model represents, and often minutes later.  no registered
    component is a score, and treating one as a measurement would let a self-report update tissue state
    directly.  the orthogonal target-detection task is also the only compliance evidence that the participant
    was looking.
absent:
- fmri
- meg
- eye_tracking
- individual_anatomy
- vascular
- video
requires:
- geometry: device-geometry
  for_streams:
  - eeg_64ch
  severity: degrading
  without_it: A scalp voltage is a function of where the electrode sat. Without per-participant electrode
    positions carried as a device-geometry object there is no lead field for this montage, so nothing
    recorded here can be attributed to a cortical support -- only channel-space statistics remain.
  substitute: A nominal 10-20/10-10 template montage. It displaces every electrode in a head-size-dependent,
    spatially correlated way, so the resulting source-estimate error is systematic and structured rather
    than random, and it must be carried as uncertainty in every number derived from it.
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
- geometry: retinal-world-geometry
  for_streams:
  - stimulus_images
  severity: degrading
  without_it: 'Re-graded from blocking 2026-09-05, on the argument this corpus now applies uniformly.
    The photograph is clamped as `device.display_luminance` on the DISPLAY support, which is defined whether
    or not the screen-to-retina map is -- an imposed stream naming what was on the monitor is well posed
    without it. What remains unavailable is everything after the screen: nothing here may be attributed
    to `transduction.photoreceptor`, to an eccentricity, or to a retinotopic support. No gaze was recorded,
    and at 10 Hz RSVP with central fixation the assumption that the image fell on the fovea is usually
    right and is still an assumption.'
use:
- evaluate
- fit
forbidden:
- things-eeg2/stimulus_images -> retinal input (no display geometry and no gaze are recorded; central
  fixation is assumed, not measured)
- things-eeg2/* -> a decoding number quoted without the repetition noise ceiling
split:
  group_by:
  - participant
  - stimulus
provenance:
  imported_from: win-registry
  card: things-eeg2
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
