streams:
- name: single_units
  kind: measured
  via: null
  observation_chain: transmembrane currents of neurons near the microwire -> extracellular field -> high-pass
    filtering -> threshold detection -> spike sorting into putative units -> spike train; the sorting
    step is an inference, not a measurement
  confounds:
  - 'clinical pathology at the electrode: this is a patient population, not a healthy one'
  - medication state and post-implant recovery
  - referencing scheme (common average vs. bipolar) reshaping the apparent field
  - epileptiform activity contaminating putative task responses
  - 'spike sorting is an inference: unit identity, stability and isolation quality are all estimates'
  - the recorded units are a yield-biased sample of large, active neurons
  systematic_bias: '§51.1 item 8: this anchors the relation between microscopic/event state, local fields
    and larger-scale observations -- the only source in the registry that spans all three at once.'
  notes: the mapping from sorted units to a mesoscopic state variable is exactly the model discrepancy
    B-WIN needs to estimate rather than assume
  band_hz:
  - null
  - null
  temporal_support: spikes at 30 kHz sampling before sorting; LFP at kHz; BOLD at TR seconds; movie at
    its frame rate
  spatial_support: 'Behnke-Fried microwires within depth macroelectrodes: the microwire support is tens
    of microns, the macrocontact support is millimetres, and the BOLD voxel is millimetres -- THREE spatial
    scales in one dataset'
- name: lfp
  kind: measured
  via: null
  observation_chain: current sources within millimetres of the contact -> local volume conduction over
    a short path -> contact surface area, impedance and referencing scheme -> sampled voltage; spatial
    support is the contact neighbourhood, not a parcel
  confounds:
  - 'clinical pathology at the electrode: this is a patient population, not a healthy one'
  - medication state and post-implant recovery
  - referencing scheme (common average vs. bipolar) reshaping the apparent field
  - epileptiform activity contaminating putative task responses
  band_hz:
  - null
  - null
- name: bold_movie
  kind: measured
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY (PROMPT.md §17): the vascular stage is a
    modelled state, not a nuisance to be regressed away'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  band_hz:
  - null
  - null
