id: bci-competition-datasets
title: BCI Competition II/III/IV datasets
provider: Berlin BCI group / Graz BCI Lab / Wadsworth Center and collaborators
citation: Tangermann et al., Review of the BCI Competition IV. Frontiers in Neuroscience 2012; Blankertz
  et al., The BCI competition III. IEEE Transactions on Neural Systems and Rehabilitation Engineering
  2006.
urls:
- https://www.bbci.de/competition/iv/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Per-dataset terms set by the contributing laboratory; not read. Several require a registration
    and an agreement to cite.
binding: unbound
population:
  n: null
  hierarchy:
  - participant
  - session
  - run
  - device
  notes: Each competition dataset has its own small cohort; n left null.
frames:
- channel_label
- 10_20_nominal_positions
streams:
- name: motor_imagery_and_erp_eeg
  kind: measured
  via: null
  observation_chain: post-synaptic currents in spatially aligned pyramidal populations -> volume conduction
    through brain, CSF, skull and scalp -> potential difference between a scalp electrode and a reference
    -> amplifier gain, filtering and group delay -> sampled integer
  confounds:
  - ocular and blink artefact
  - muscle (EMG) contamination, broadband and strongest at temporal sites
  - cardiac field and pulse artefact
  - electrode impedance drift and movement artefact
  - the reference choice, which is itself a montage operator and not a property of the brain
  - line noise and its harmonics
  - in motor-imagery paradigms, actual muscle activity is the standard confound and EMG is not always
    recorded
  - the cue itself produces a visually evoked response time-locked to the class label
  systematic_bias: These datasets are so heavily benchmarked that published accuracies are an overfitted
    literature, not a floor. Their use here is as a well-characterised BASELINE with a known chance level
    and known published controls -- which is exactly what a number needs to be a result.
  band_hz:
  - null
  - null
  temporal_support: 100 Hz to 1000 Hz depending on the dataset; several are distributed already downsampled
    and filtered, which is a derived view and not the native clock
  spatial_support: scalp montages from 22 to 118 channels depending on the dataset, plus one ECoG grid
    dataset
- name: published_benchmark_baselines
  kind: measured
  via: null
  systematic_bias: the competition's own held-out test labels are the only part that was not available
    to the methods that report on it
  band_hz:
  - null
  - null
