# ibm-1 source card. schema: data/schema/source.schema.json
id: netneuro-lausanne-sc
title: NetNeuroTools Lausanne structural connectomes
provider: Network Neuroscience Lab / Misic lab
citation: Distributed with netneurotools; Cammoun et al. 2012 parcellation.
urls:
- https://netneurolab.github.io/netneurotools/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved. §49.2 records that the predecessor's attribution generator tracked each source's
    known bias and licence rather than treating atlas availability as correctness; that practice is preserved
    by leaving this unresolved and counting it.
binding: unbound
population:
  n: null
frames:
- Lausanne
- fsaverage
streams:
- name: independently_processed_connectome
  kind: measured
  via: null
  systematic_bias: '§49.2 notes the predecessor held SEVERAL independently processed structural connectomes.
    That redundancy is the point: agreement between independently processed connectomes of the same parcellation
    is evidence, disagreement is a pipeline-uncertainty measurement, and neither is available from a single
    matrix.'
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: an independently processed Lausanne-parcellated structural connectome distributed with
    the netneurotools package
absent:
- provenance
- path_geometry
- directionality
- uncertainty
requires:
- geometry: tract-path-products
  severity: blocking
  without_it: A connectome matrix is an adjacency over parcel indices. Without the tract product its edges
    have no path, no length and no supports to terminate on, so it cannot supply a delay, a route or an
    engineered structural commitment -- only a number per pair of labels.
- geometry: cortical-support-bank
  severity: blocking
  without_it: A parcellation or a surface map is a COVER, not an element of the brain's ontology. Without
    the support bank there is nothing for these labels to be a cover OVER, and using them as if they were
    the supports themselves is precisely the canonical-parcellation commitment the architecture refuses.
use:
- calibrate
- prior
forbidden:
- netneuro-lausanne-sc/* -> measured-connection claims
- netneuro-lausanne-sc/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
provenance:
  imported_from: win-registry
  card: netneuro-lausanne-sc
