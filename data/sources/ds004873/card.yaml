requires:
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
- geometry: mr-acquisition-objects
  for_streams:
  - cmro2
  - cbf
  - oef
  - multi_parameter_joint_fit
  severity: blocking
  without_it: A quantitative parameter map is a FITTED field, and its value depends on the sequence, the
    timing and the field maps that produced it. Without the acquisition object those are not carried,
    and the number is a fit output rather than a measurement of tissue.
- geometry: vascular-products
  for_streams:
  - cmro2
  - oef
  severity: degrading
  without_it: 'An oxygenation estimate is about blood in vessels, and its meaning depends on which vessels:
    an OEF from a resolved vein and an OEF inferred from the field perturbation around unresolved capillaries
    are different measurements. Without the vascular product they cannot be told apart.'
  substitute: A voxel-wise map treated as a single compartment, which absorbs the venous bias into the
    tissue estimate.
use:
- calibrate
- fit
forbidden:
- ds004873/* -> cortical current-source dynamics
- ds004873/cmro2 -> a measured quantity (it is derived under a calibration model)
