# ibm-1 source card. schema: data/schema/source.schema.json
id: enigma-hcp-structural-connectome
title: ENIGMA-HCP group structural connectome
provider: ENIGMA Consortium / ENIGMA Toolbox
citation: Distributed with the ENIGMA Toolbox; derived from HCP diffusion data.
urls:
- https://enigma-toolbox.readthedocs.io/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved. §49.2 records that the predecessor's attribution generator tracked each source's
    known bias and licence rather than treating atlas availability as correctness; that practice is preserved
    by leaving this unresolved and counting it.
binding: bound
population:
  n: null
frames:
- Desikan2006
- Schaefer2018
streams:
- name: group_connectome_matrix
  kind: context
  via: null
  systematic_bias: A GROUP AVERAGE OF A TRACTOGRAPHY OUTPUT projected onto a parcellation, distributed
    without its seeding, response function or thresholds. It fails §52.8's provenance requirement on every
    count, and it is nevertheless one of the most reused objects in network neuroscience. Registered so
    that its reuse is a recorded choice.
  notes: 'context, and the decision is the point.  a set of streamlines or a parcel-by-parcel matrix is an INTERACTION
    TOPOLOGY -- a statement about which state variables may interact (ARCHITECTURE.md §3) -- and a topology
    is a support for interaction, not a measurement of any component.  there is no ibm component whose value
    this stream reports: `structural.fiber_orientation` is what the underlying diffusion volume constrains,
    and the tractogram is an ALGORITHM''S ANSWER computed from it, not a second measurement of it.  binding
    it as `measured` would let one pipeline''s reconstruction contribute a likelihood about tissue, which is
    exactly the double-count the card''s `forbidden` list already refuses.  and this one is a GROUP AVERAGE
    of a tractography output, distributed with no seeding, no response function and no thresholds -- so it is
    one pipeline''s answer with the evidence of how it was produced discarded.  it is nevertheless one of the
    most reused objects in network neuroscience, which is why it is registered: so that reusing it is a recorded
    choice with `use: prior` attached rather than an unexamined default.'
  band_hz:
  - 0.0
  - 0.001
  temporal_support: not a time series -- this is static anatomy
  spatial_support: a group-averaged structural connectivity matrix over Desikan and Schaefer parcellations,
    derived from HCP diffusion tractography
  constrains: []
absent:
- provenance
- path_geometry
- individual_matrices
- directionality
- uncertainty
requires:
- geometry: tract-path-products
  severity: blocking
  without_it: A connectome matrix is an adjacency over parcel indices. Without the tract product its edges
    have no path, no length and no supports to terminate on, so it cannot supply a delay, a route or an
    engineered structural commitment -- only a number per pair of labels.
- geometry: cortical-support-bank
  severity: blocking
  without_it: A parcellation or a surface map is a COVER, not an element of the brain's ontology. Without
    the support bank there is nothing for these labels to be a cover OVER, and using them as if they were
    the supports themselves is precisely the canonical-parcellation commitment the architecture refuses.
use:
- calibrate
- prior
forbidden:
- enigma-hcp-structural-connectome/* -> measured-connection claims
- enigma-hcp-structural-connectome/* -> the interactome's structural commitments
- enigma-hcp-structural-connectome/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
provenance:
  imported_from: win-registry
  card: enigma-hcp-structural-connectome
  imported_at: '2026-09-04'
