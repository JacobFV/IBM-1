streams:
- name: optimised_atlas_labels
  kind: context
  via: null
  systematic_bias: Same method, different prior. The pair (ashs, ashs-oap) is a usable estimate of how
    much of a subfield segmentation is driven by the atlas rather than by the image -- which is a model-class
    uncertainty component in §39's sense and is measurable here rather than assumed.
  band_hz:
  - 0.0
  - 0.001
  temporal_support: not a time series -- this is static anatomy
  spatial_support: an optimised atlas package for ASHS built to improve subfield segmentation performance;
    the SAME method with a different and better-curated atlas set
  constrains: []
  notes: 'context, and it is a decision.  a parcellation, an annotation or a label set is a COVER over
    a carrier (ARCHITECTURE.md §2): it says which points a name collects, not what value any ibm component
    takes at them.  no registered component is a region label.  it reaches a materialization as a support
    index and as a `prior`, never as a likelihood.  and the pair (ashs, ashs-oap) is worth holding for
    a reason that is not the labels: SAME METHOD, DIFFERENT PRIOR, so the difference between their outputs
    estimates how much of a hippocampal subfield segmentation is driven by the atlas rather than by the
    image.  that is a model-class uncertainty measurement, and it is about the method, not about a brain.'
