# ibm-1 source card. schema: data/schema/source.schema.json
id: ds004024
title: ds004024 — bifocal TMS-EEG ccPAS
provider: OpenNeuro
access: held
licence:
  name: CC0-1.0
  redistribution: permitted
  commercial: permitted
  notes: 'Read from the held dataset_description.json, which states "License": "CC0". CC0-1.0 is a public-domain
    dedication: nothing this source contributes inherits a redistribution, attribution or share-alike
    constraint. Consent scope is a separate question the file does not answer.'
binding: bound
population:
  n: 13
  hierarchy:
  - participant
  - session
  - run
  notes: 13 participants have a directory, electrodes and events. EEG RECORDINGS ARE HELD FOR 2 OF THEM
    (sub-CON001 and sub-CON006, 14 recordings, 1.46 h measured from the BrainVision headers). The other
    11 have sidecars, events and electrode positions and no signal. n_participants stays 13 because that
    is the cohort the events and montages describe; the EEG stream carries its own n_participants of 2,
    and they are different numbers on purpose.
frames:
- eeg_cap
- subject_native_ras
- tms_coil
streams:
- name: eeg
  kind: measured
  via:
  - em_generation
  - em_coupling
  - device_coupling
  observation_chain: cortical current-source state -> volume conduction -> electrodes, with a large TMS-induced
    artifact at pulse onset
  confounds:
  - TMS pulse artifact and amplifier recovery
  - auditory evoked response to the coil click
  - somatosensory evoked response to the scalp twitch
  - muscle (facial/temporalis) response to direct stimulation
  - ocular
  - cardiac
  systematic_bias: A TEP that is largely auditory and somatosensory is a real measurement of the wrong
    thing. Co-stimulation models are ENABLED BY DEFAULT for any prediction from this source (obj-tms-field);
    disabling them is an explicit ablation.
  notes: 'MEASURED FROM THE HELD BYTES: SamplingFrequency 20000.0 Hz and SoftwareFilters n/a in the BrainVision
    sidecar, 64 EEG plus 2 EOG, 1 ECG and 2 EMG channels.  the band is the full nyquist and that is not generosity
    -- an unfiltered 20 kHz recording is the only way the TMS pulse artifact and the amplifier''s recovery are
    separable from the response at all, and a card that declared 0.1-100 Hz here would be throwing away the
    thing that makes this deposit worth holding.  bound for 2 of the 13 participants; the other 11 have montages
    and events and no signal.'
  band_hz:
  - 0.0
  - 10000.0
  temporal_support: EEG at amplifier rate; TMS pulses as discrete events
  spatial_support: scalp EEG montage; T1 volumes
  constrains:
  - device.contact_potential
  rate_hz: 20000.0
  frame: eeg_cap
  support: sensor_array
  units: V
- name: fmri
  kind: context
  via: null
  band_hz:
  - null
  - null
  constrains: []
  notes: 'DECLARED IN `absent`: no functional volumes are held under this root.  the entry survives from the
    migration and is kept so the absence is visible in the stream list as well as in `absent` -- a materializer
    reading streams alone would otherwise not see it.  it constrains nothing because there is nothing here,
    which is a gap the card has decided to state rather than a binding nobody got to.'
- name: dwi
  kind: context
  via: null
  band_hz:
  - null
  - null
  constrains: []
  notes: 'DECLARED IN `absent`: no diffusion volumes are held under this root.  same decision as `fmri` above.'
- name: t1w
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry.  UNLIKE the other cards here this T1 would genuinely bind to `material.conductivity`
    and `material.mass_density` through `structural_mri`, because this source does have an electromagnetic modality
    and a lead field is what its EEG needs.  it stays context anyway, and the reason is the blocking `device-geometry`
    requirement: with no digitised electrode positions and no coil pose there is no head model to put the material
    values into, so binding them would assert conductivity for a conductor nobody can address.  revisit this
    when the support bank exists.'
- name: coil_pose
  kind: context
  via: null
  band_hz:
  - null
  - null
  constrains: []
  notes: 'DECLARED IN `absent`: no neuronavigation record is held.  this is the single most consequential absence
    in the card -- without the coil pose the induced field has no location, which is why `device-geometry` is
    a BLOCKING requirement here and why `pulse_timing` above cannot be `imposed`.'
- name: pulse_timing
  kind: context
  via: null
  band_hz:
  - 0.0
  - 10000.0
  constrains: []
  notes: context, and this is the card's hardest call.  the trigger times mark a real intervention, so `imposed`
    is the obvious reading -- but an imposed stream is CONDITIONED ON, and what a materialization would condition
    on is the delivered field, which this deposit does not record.  `forbidden` already refuses delivered-field
    parameters here.  binding these marks to `device.coil_current` would hand the model a waveform and an amplitude
    nobody measured, dressed as a boundary condition; the times are an index into the recording and nothing
    more until the coil pose and winding exist.
absent:
- fmri
- dwi
- coil_pose
- sham
requires:
- geometry: device-geometry
  severity: blocking
  without_it: 'Two device geometries are needed at once and neither can be defaulted: the electrode positions
    that define the lead field, and the coil winding and pose that determine the induced field. Without
    both, the pulse is a machine setting and the response is a channel-space waveform, with nothing connecting
    them at any cortical location.'
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
- geometry: tract-path-products
  severity: blocking
  without_it: A diffusion volume is a field of orientations attached to no pathway. Until the tract product
    exists there is no engineered claim of the form 'this tract transmits between these two supports',
    so this source can constrain local microstructure but no interaction between supports.
use:
- calibrate
- fit
forbidden:
- ds004024/* -> vascular state
- ds004024/* -> delivered-field parameters (the evidence is not held)
split:
  group_by:
  - participant
  - session
provenance:
  imported_from: win-registry
  card: ds004024
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
