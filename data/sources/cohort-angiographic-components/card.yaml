id: cohort-angiographic-components
title: Angiographic components of UKB, HCP, ADNI and clinical archives
provider: multiple -- see the uk-biobank-imaging, hcp-young-adult and adni cards
citation: "PROMPT.md \xA752.10, 'angiographic components of UKB, HCP, ADNI, and clinical archives where\
  \ governance allows'."
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: "Unresolved. \xA749.2 records that the predecessor's attribution generator tracked each source's\
    \ known bias and licence rather than treating atlas availability as correctness; that practice is\
    \ preserved by leaving this unresolved and counting it."
binding: unbound
population:
  n: null
frames:
- scanner
- subject_native
- MNI152
streams:
- name: cohort_vascular_sequences
  kind: measured
  via: null
  systematic_bias: "These streams already exist inside cohorts we are carding for other reasons, which\
    \ makes them the cheapest large-n vascular evidence available -- AND each one inherits its parent\
    \ cohort's governance, so 'where governance allows' in \xA752.10 is a real constraint and not a formality.\
    \ Lineage must be computed per parent cohort."
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: the vascular-sensitive sequences already inside the large cohorts -- UK Biobank SWI,
    StudyForrest angiography, clinical archive TOF -- reachable under each cohort's own governance
absent:
- dedicated_angiographic_protocols
- capillary_scale
- uniform_acquisition
requires:
- geometry: vascular-products
  severity: blocking
  without_it: An angiographic volume is an image of a lumen, not a vessel. Without the vascular product
    -- a resolved graph carrying radius, topology and territory -- there is no vessel for this evidence
    to constrain and no way to say which cortical support any of it supplies.
use:
- calibrate
- prior
forbidden:
- cohort-angiographic-components/* -> use outside the parent cohort's governance
- cohort-angiographic-components/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
provenance:
  imported_from: win-registry
  card: cohort-angiographic-components
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
origin_kind: class
provenance_note: a CLASS of resource rather than one dataset; the provider field names a literature or
  model family. a single origin url would be a fiction
provenance_traced_from: a peer programme's card for the same corpus, which read the origin off the held
  dataset_description. the ORIGIN is recorded here; the peer is not cited, because a courier is not a
  source
