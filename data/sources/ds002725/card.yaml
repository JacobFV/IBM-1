# ibm-1 source card. schema: data/schema/source.schema.json
id: ds002725
title: ds002725 -- simultaneous EEG-fMRI during affective music listening
provider: OpenNeuro ds002725 / NEMAR on002725
citation: A dataset recording joint EEG-fMRI during affective music listening. NEMAR on002725.
urls:
- https://nemar.org/dataset/on002725
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved. Music stimuli carry third-party rights separate from the neural data.
binding: unbound
population:
  n: 21
  hierarchy:
  - participant
  - session
  - run
  notes: 'Simultaneous EEG-fMRI: the two are genuinely concurrent, which is what makes this different
    from the MOUS-style separate-arm designs.'
frames:
- eeg_cap
- scanner
- subject_native
- MNI152
streams:
- name: eeg
  kind: measured
  via: null
  observation_chain: oriented cortical current-source state -> quasi-static volume conduction through
    brain, CSF, skull and scalp -> electrode contact geometry and impedance -> reference montage -> amplified,
    filtered, sampled voltage
  confounds:
  - 'ocular: blink and saccade corneo-retinal potentials'
  - 'cardiac: ECG contamination and pulse artifact'
  - 'muscle: temporalis, frontalis and neck EMG'
  - electrode impedance drift, motion and bridging
  - line noise and amplifier drift
  - reference-electrode activity, which is never inactive
  - gradient-switching artifact in the concurrently recorded EEG
  - ballistocardiogram artifact from pulse-driven electrode motion in B0
  - helium-pump and cryo-cooler artifact
  - increased participant motion in the bore
  systematic_bias: 'In-bore EEG: the gradient and ballistocardiogram artifacts are ORDERS OF MAGNITUDE
    larger than the neural signal, and their removal is a modelling stage whose residual belongs in the
    observation model rather than in a preprocessing footnote.'
  notes: artifact-subtraction residual is correlated with the BOLD acquisition itself, so it is not independent
    noise with respect to the joint model
  band_hz:
  - null
  - null
  temporal_support: EEG at 5 kHz (needed to resolve and subtract the gradient artifact); BOLD at TR ~2
    s; music pieces of tens of seconds
  spatial_support: MR-compatible EEG cap inside the bore; 3 mm BOLD
- name: bold
  kind: measured
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY (PROMPT.md §17): the vascular stage is a
    modelled state, not a nuisance to be regressed away'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  systematic_bias: 'Simultaneity is the point: fast and slow observations of the same episode.'
  band_hz:
  - null
  - null
- name: music_stimuli
  kind: imposed
  via: null
  systematic_bias: 'music, not speech: spectrotemporal structure without linguistic structure, which makes
    it a useful dissociation stimulus'
  band_hz:
  - null
  - null
- name: affect_ratings
  kind: imposed
  via: null
  systematic_bias: '§52.16: an affect label is not a limbic-state observation'
  band_hz:
  - null
  - null
- name: t1w
  kind: measured
  via: null
  band_hz:
  - null
  - null
- name: ecg
  kind: measured
  via: null
  band_hz:
  - null
  - null
absent:
- meg
- ieeg
- eye_tracking
- vascular_geometry
- individual_electrode_digitisation
requires:
- geometry: device-geometry
  for_streams:
  - eeg
  severity: degrading
  without_it: A scalp voltage is a function of where the electrode sat. Without per-participant electrode
    positions carried as a device-geometry object there is no lead field for this montage, so nothing
    recorded here can be attributed to a cortical support -- only channel-space statistics remain.
  substitute: A nominal 10-20/10-10 template montage. It displaces every electrode in a head-size-dependent,
    spatially correlated way, so the resulting source-estimate error is systematic and structured rather
    than random, and it must be carried as uncertainty in every number derived from it.
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
use:
- fit
forbidden:
- ds002725/affect_ratings -> limbic state observation
- ds002725/* -> vascular geometry
split:
  group_by:
  - participant
  - stimulus
provenance:
  imported_from: win-registry
  card: ds002725
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
