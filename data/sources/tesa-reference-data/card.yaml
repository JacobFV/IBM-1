  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved.
binding: unbound
population:
  n: null
  hierarchy:
  - participant
  - run
  notes: Example datasets accompanying the TESA toolbox. n unresolved; the value is the reference PIPELINE
    and its documented artifact taxonomy.
frames:
- eeg_cap
- coil_frame
- head
streams:
- name: artifact_taxonomy
  kind: measured
  via: null
  systematic_bias: §54.1 lists TESA among the EEG-fMRI and TMS artifact references. Its contribution is
    a NAMED TAXONOMY of TMS-EEG artifacts with worked examples, which is what turns 'clean the data' into
    a set of specific physical processes each of which can be modelled rather than removed.
  band_hz:
  - null
  - null
  temporal_support: EEG at kHz with pulses as events
  spatial_support: scalp EEG during TMS
- name: reference_processed_outputs
  kind: measured
  via: null
  systematic_bias: reference outputs are one pipeline's answer and must not become the definition of the
    correct answer
  band_hz:
  - null
  - null
- name: tms_eeg
  kind: measured
  via: null
  band_hz:
  - null
  - null
- name: artifact_component_examples
  kind: measured
  via: null
