streams:
- name: typed_internal_schema
  kind: measured
  via: null
  systematic_bias: NWB's electrode table carries POSITION, GROUP, IMPEDANCE and DEVICE per contact, and
    its time series carry per-series rates. §57's requirements -- native units, native spatial support,
    native temporal support, device metadata -- have more of a home here than in any other standard in
    this section, which is why §51.5 points at DANDI for invasive electrophysiology.
  notes: a rich schema permits rich metadata and does not require it; most files use a fraction of it
  band_hz:
  - null
  - null
  temporal_support: EVERY TIME SERIES CARRIES ITS OWN TIMESTAMPS OR RATE, and multiple series with different
    rates coexist in one file with a shared session start time. That is much closer to §33's native-clock
    requirement than BIDS's per-run seconds
  spatial_support: 'a SINGLE-FILE HDF5 container with a typed internal schema: devices, electrode groups,
    electrodes with POSITIONS, and time series that carry their own sampling rate and unit conversion.
    The structure is inside the file rather than in the path'
- name: extensibility
  kind: measured
  via: null
  systematic_bias: neurodata extensions let new types be declared, which is how a standard survives new
    instruments -- and unregistered extensions are how it fragments
  band_hz:
  - null
  - null
