streams:
- name: directed_weighted_connectivity
  kind: measured
  via: null
  systematic_bias: MEASURED DIRECTION AND MEASURED WEIGHT over five orders of magnitude, from tracer transport.
    Diffusion tractography can produce neither. §38's structural/effective/functional distinction needs
    a reference case where the structural answer is actually known, and in a primate this is it. It is
    macaque, and the cross-species step is an assumption to be carded wherever it is used.
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: a weighted, DIRECTED interareal connectivity matrix from retrograde tracer injections
    in macaque, with a consistently sampled 29x91 subgraph in which every possible connection was actually
    looked for
- name: edge_completeness
  kind: measured
  via: null
  systematic_bias: The consistently sampled subgraph is the rare case where ABSENCE OF A CONNECTION IS
    EVIDENCE OF ABSENCE, because every pair was examined. Everywhere else in the registry, missing is
    not zero; here, within that subgraph, a zero is a measurement -- and that makes it a uniquely valuable
    negative-evidence source.
  band_hz:
  - null
  - null
- name: weight_distance_relationship
  kind: measured
  via: null
  systematic_bias: the exponential distance rule derived from these weights is a candidate structural
    prior for human interactomes, transferred across species
  band_hz:
  - null
  - null
