streams:
- name: bold_movie
  kind: measured
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY (PROMPT.md §17): the vascular stage is a
    modelled state, not a nuisance to be regressed away'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  - 7T B1 inhomogeneity and temporal-lobe dropout
  systematic_bias: '184 participants on the same clips: the population breadth that cNeuroMod''s depth
    lacks.'
  band_hz:
  - null
  - null
  temporal_support: TR 1 s; four movie runs of concatenated independent clips -- clip boundaries are hard
    discontinuities in the world trajectory and must not be smoothed over
  spatial_support: 1.6 mm 7T BOLD; individual surfaces; grayordinate CIFTI
- name: stimulus_clips
  kind: imposed
  via: null
  systematic_bias: short independent clips, repeated across participants; one clip is repeated across
    all four runs as a designed test-retest condition
  band_hz:
  - null
  - null
