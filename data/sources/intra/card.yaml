frames:
- mesh_native
streams:
- name: vessel_meshes
  kind: measured
  via: null
  observation_chain: reconstructed 3D vessel SURFACE derived from clinical angiography by segmentation
    and meshing, distributed without the parent volume. What is measured is upstream and not supplied;
    what is distributed is a surface with an unrecorded reconstruction pipeline
  confounds:
  - the segmentation and meshing pipeline is not distributed, so its bias is unknown
  - mesh smoothing during reconstruction alters local curvature systematically
  - clinical population
  systematic_bias: '§4a applies squarely: this is DERIVED GEOMETRY presented as data. It is useful and
    it must never be treated as a measured surface.'
  notes: no access to the parent imaging means the derivation cannot be audited or redone
  band_hz:
  - null
  - null
  temporal_support: not a time series
  spatial_support: triangle MESHES of reconstructed vessel surfaces with per-vertex annotation. There
    is no imaging volume here, so the segmentation that produced the mesh is not inspectable
- name: vessel_segment_geometry
  kind: measured
  via: null
  systematic_bias: 1,909 individually labelled vessel segments are a usable prior over branch geometry,
