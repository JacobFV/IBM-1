streams:
- name: cfd_solutions
  kind: measured
  via: null
  systematic_bias: '§51.2 item 17 is explicit: use STRICTLY as vascular solver/surrogate supervision and
    RARE-GEOMETRY STRESS TESTING. The CFD solution is ground truth for the equations that were solved,
    under the boundary conditions that were imposed -- and the boundary conditions are the modelling assumption,
    not a measurement. It is truth about a simulation.'
  notes: the Navier-Stokes solution is exact for the assumed rigid walls, Newtonian blood and imposed
    inlet waveform; real vessels are compliant and blood is not Newtonian at small calibre
  band_hz:
  - null
  - null
  temporal_support: CFD time steps within a cardiac cycle -- a SIMULATED clock, not an acquisition clock
  spatial_support: generated vessel geometries with computational fluid dynamics solutions on them; the
    flow field is defined everywhere in the lumen, which no measurement achieves
- name: rare_geometries
  kind: measured
  via: null
  systematic_bias: synthetic geometries can cover configurations no clinical cohort contains, which is
    exactly what a stress test needs and exactly why the results do not transfer as prevalence
