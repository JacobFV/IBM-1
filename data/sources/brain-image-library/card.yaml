id: brain-image-library
title: Brain Image Library (BIL)
provider: Pittsburgh Supercomputing Center and the University of Pittsburgh Center for Biological Imaging
citation: 'Kenney et al., The Brain Image Library: a community-contributed microscopy resource for neuroscientists.
  Scientific Data 11:1212, 2024. doi:10.1038/s41597-024-03761-8. RRID SCR_017272.'
urls:
- https://www.brainimagelibrary.org
access: reference
licence:
  name: CC-BY-SA-4.0
  redistribution: unresolved
  commercial: permitted
  notes: 'The official citation page states Creative Commons Attribution-ShareAlike 4.0 International.
    NOTE A CONFLICT: the re3data registry entry says CC BY 4.0. The provider''s own page is taken as authoritative
    and the disagreement is recorded rather than silently resolved. SHARE-ALIKE IS LOAD-BEARING: anything
    derived from BIL data inherits it. Restricted datasets and uploads need registration under BICCN terms,
    which are unresolved.'
binding: unbound
population:
  n: null
frames:
- specimen_native
- ccf_registered_where_provided
streams:
- name: whole_brain_light_microscopy
  kind: measured
  via: null
  systematic_bias: Single-neuron morphologies at whole-brain scale are the strongest available prior on
    what an anatomical interaction path can physically be. They are almost entirely mouse, and the mouse-to-human
    step is not a scaling factor.
  notes: clearing and sectioning deform tissue; reconstructions are traced, and tracing is an algorithm
    plus a human
  band_hz:
  - null
  - null
  temporal_support: none; fixed-tissue anatomy
  spatial_support: whole-brain volumetric light microscopy -- confocal, serial two-photon tomography and
    fMOST -- plus neuron and cell morphology reconstructions
