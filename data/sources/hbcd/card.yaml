streams:
- name: t1w
  kind: measured
  via: null
  observation_chain: tissue proton density and T1 -> sequence-specific contrast -> k-space acquisition
    -> reconstruction -> voxel intensity; intensity is not a tissue parameter until an explicit relaxometry
    model is applied
  confounds:
  - B1+ transmit inhomogeneity
  - B0 off-resonance
  - the fitted signal model's own misspecification
  - motion between the volumes that enter one fit
  - myelination-driven contrast inversion over the first year, which every adult segmentation tool gets
    wrong
  systematic_bias: Adult tissue-segmentation priors are actively wrong here.
  band_hz:
  - null
  - null
  temporal_support: unresolved -- protocol is age-banded and still releasing
  spatial_support: infant-optimised structural, diffusion and BOLD; multi-site
- name: eeg
  kind: measured
  via: null
  observation_chain: oriented cortical current-source state -> quasi-static volume conduction through
    brain, CSF, skull and scalp -> electrode contact geometry and impedance -> reference montage -> amplified,
    filtered, sampled voltage
  confounds:
  - 'ocular: blink and saccade corneo-retinal potentials'
  - 'cardiac: ECG contamination and pulse artifact'
  - 'muscle: temporalis, frontalis and neck EMG'
  - electrode impedance drift, motion and bridging
  - line noise and amplifier drift
  - reference-electrode activity, which is never inactive
  - fontanelle and unfused skull sutures make adult skull conductivity assumptions invalid
  systematic_bias: Infant skull conductivity differs by roughly an order of magnitude from adult; a forward
    model using adult conductivity is not approximately right, it is wrong.
  band_hz:
  - null
  - null
