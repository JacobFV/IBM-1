  systematic_bias: 'CROSS-SPECIES. Its use is the same as markov2014''s: a species-general statement about
    how tractography relates to tracer-verified connectivity, never an assertion about a human edge. The
    marmoset''s lissencephalic cortex removes the gyral bias that dominates human tractography error,
    which makes it a WEAKER model of the human failure mode, not a stronger one.'
  notes: anterograde tracer measures projections from an injection site; it does not measure synaptic
    weight and it is directed where tractography is not
