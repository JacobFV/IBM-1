requires:
- geometry: device-geometry
  for_streams:
  - meg
  severity: degrading
  without_it: 'The MEG forward model is dominated by sensor pose relative to the head. Re-graded to degrading
    2026-09-05 on the card''s own record rather than on disk (the bytes are not held): the release states
    head position measured by HPI COILS, and `head_position` is that measurement, so the pose is available
    and a lead field is computable. Degrading rather than satisfied because no individual anatomy is recorded
    on this card, so the conductor the field propagates through is a template even though its pose is
    measured -- and because coil integration-point geometry is a property of the unnamed vendor''s sensor
    model rather than of this deposit. Verify both against the sidecars when the bytes arrive.'
  substitute: A template head scaled to the HPI positions. The pose is then measured and the conductor
    is not, which is bias, not noise.
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
