streams:
- name: meg
  kind: measured
  via:
  - em_generation
  observation_chain: oriented cortical current-source state -> quasi-static magnetic field (primary current
    plus volume-current return) -> pickup-coil geometry, orientation and gradiometer configuration ->
    SQUID flux -> sampled channel
  confounds:
  - environmental magnetic interference and urban noise
  - head motion within and between runs
  - ocular and cardiac fields
  - muscle artifact at high frequency
  - SQUID jumps and sensor drift
  systematic_bias: Millisecond-scale evidence on the SAME world trajectory that ds000113 samples at TR
    2 s. This pairing is the value; simultaneity is not available and is not claimed.
  band_hz:
  - 0.0
  - 200.0
  temporal_support: MEG at its acquisition rate (kHz-scale); the audio-movie timeline as the world clock
  spatial_support: whole-head MEG array; head position measured by HPI coils
  constrains:
  - electromagnetic.bfield
  notes: 'whole-head MEG at kHz-scale with HEAD POSITION MEASURED BY HPI COILS, over the audio-movie timeline.  the
    exact rate is not in the record and the bytes are not held, so 200 Hz is the corpus''s conservative
    MEG ceiling and must be re-read from the deposit.  THE VALUE IS THE PAIRING: millisecond-scale evidence
    on the SAME world trajectory that studyforrest-ds000113 samples at TR 2 s.  SIMULTANEITY IS NOT AVAILABLE
    AND IS NOT CLAIMED -- these are different sessions and different people, so the film is a shared stimulus
    timeline and not a shared episode.  em_generation is what produces the magnetic field from source
    currents; the previous chain named vascular_flow, which is unrelated.'
  frame: meg_device
  units: T
- name: audio_movie_stimulus
  kind: imposed
  via:
  - transduction
  systematic_bias: 'audio-description track: the linguistic content differs from the audio-visual arm''s'
  band_hz:
  - 20.0
  - 8000.0
  constrains:
  - device.speaker_pressure
  notes: 'imposed: the audio-description track of Forrest Gump, clamped on the display support.  NOTE
    THE LINGUISTIC CONTENT DIFFERS from the audio-visual arm''s -- the description narrates what the visual
    arm shows -- so the two arms share a timeline and not a stimulus.  conservative audio ceiling; the
    file rate is not in the record.'
  frame: display
- name: head_position
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry, not evidence.  it supplies a support that a materialization is indexed over
    and constrains no ibm component; letting it update biology would turn a reconstruction into a measurement.  HPI
    coil measurements locating the head in the dewar, which is what makes the lead field computable.'
