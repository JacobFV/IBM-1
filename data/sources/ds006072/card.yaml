binding: unbound
population:
  n: 7
  hierarchy:
  - participant
  - session
  notes: 7 participants, 4 returning for a replication protocol 6-12 months later. A DEEP, NOT WIDE design.
    participants.tsv is absent from the S3 root, so the count comes from the descriptor rather than from
    the archive itself.
frames:
- scanner
- subject_native
- MNI152
streams:
- name: multi_echo_psilocybin_bold
  kind: measured
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY: the vascular stage is a modelled state,
    not a nuisance to be regressed away. Multi-echo acquisition gives the T2* decay across echoes, so
    the BOLD-weighted component is separable from signal that does not depend on echo time -- the closest
    thing available to measuring the vascular stage rather than assuming it'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving a global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  - psilocybin's own cardiovascular effects, partly addressable by the multi-echo separation and the concurrent
    physiology
  - head motion increases under the drug and is confounded with condition
  - blinding fails for the participant even against an active control
  - with n=7 the between-participant variance component is essentially unestimable
  systematic_bias: 'An ACTIVE CONTROL (methylphenidate 40 mg against psilocybin 25 mg, crossover) plus
    a replication protocol months later is a much stronger design than a placebo contrast: methylphenidate
    produces arousal and cardiovascular change without the serotonergic action, so a difference that survives
    it is not merely a difference in being drugged.'
  band_hz:
  - null
  - null
  temporal_support: many sessions per participant across the drug day and across months, with CONCURRENT
    pulse oximetry and respiratory belt at the device's own faster rate
  spatial_support: 'MULTI-ECHO resting and task fMRI, T1 and T2 structural, and DBSI diffusion. Multi-echo
    matters here: it separates BOLD-like from non-BOLD-like signal by echo-time dependence, which is a
    physics-based handle on exactly the drug-induced vascular confound that ruins single-echo pharmacological
    fMRI'
- name: active_control_and_replication_arm
  kind: measured
  via: null
  systematic_bias: the methylphenidate arm and the 6-12 month replication are two controls that could
    have failed, which is what a result needs and what most pharmacological imaging lacks
