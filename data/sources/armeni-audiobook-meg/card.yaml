streams:
- name: long_form_narrative_meg
  kind: measured
  via: null
  observation_chain: post-synaptic currents in spatially aligned pyramidal populations, predominantly
    tangential sources in sulcal walls -> magnetic field outside the head, only weakly distorted by skull
    conductivity -> SQUID pickup coil flux -> gradiometer or magnetometer channel -> sampled tesla. The
    forward problem is better conditioned than EEG's; the inverse problem is still ill-posed and a source
    estimate remains uncertain evidence entering through an observation model, never a label
  confounds:
  - environmental magnetic interference and whatever rejection method was applied
  - head position within the helmet, which differs between and within sessions and is the dominant forward-model
    error
  - cardiac magnetic field and ocular artefact
  - MEG-MRI coregistration error
  - SQUID sensor noise and channel dropout
  - the head cast removes head-position variance but fixes any coregistration error that exists at casting
    time for all ten sessions -- a constant bias replacing a varying one
  - attention and drowsiness over a one-hour continuous listening session are uncontrolled and drift systematically
  - acoustic envelope, word frequency and syntactic structure are all correlated in natural speech, so
    an effect attributed to one is not separated from the others by the design
  systematic_bias: TEN HOURS PER PARTICIPANT IS THE POINT. Almost every language-neuroscience corpus trades
    depth for n; this one does the opposite, which is what makes within-subject encoding models identifiable
    and makes the n=3 a feature rather than a limitation. Nothing here supports a population claim.
  band_hz:
  - null
  - null
  temporal_support: MEG at 1200 Hz, Eyelink 1000 eye tracking at 1000 Hz, and the audiobook waveform,
    over ten roughly one-hour sessions per participant. THREE NATIVE CLOCKS with word and phoneme onsets
    forced-aligned to the audio -- and a forced alignment is a FITTED clock relation with real residual
    error, not a hardware trigger
  spatial_support: '275-channel CTF axial gradiometer MEG with INDIVIDUAL HEAD CASTS, plus a structural
    3T MRI. Head casts are the reason this dataset is unusual: head position -- normally the dominant
    forward-model error and a drifting one -- is held fixed across ten sessions'
- name: held_out_session_prediction
  kind: measured
  via: null
  systematic_bias: Ten sessions on the same person permit a leave-one-session-out test, which separates
    a model that has learned the participant from one that has learned the session.
  band_hz:
  - null
  - null
