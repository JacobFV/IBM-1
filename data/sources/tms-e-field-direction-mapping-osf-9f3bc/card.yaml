  notes: 'THE SOURCES DISAGREE and neither is authoritative over the other: the OSF node holds 10 subject
    folders under validation_MEP (sub-01..sub-10), while the paper abstract describes fourteen subjects.
    n is left null rather than picking one. The node has an EMPTY description, no tags and no wiki, so
