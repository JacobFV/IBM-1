streams:
- name: ultrastrong_gradient_diffusion
  kind: measured
  via: null
  observation_chain: water displacement over the diffusion time within and around axons -> attenuation
    at b-values only reachable with 300 mT/m gradients -> compartment-model fit yielding restricted fraction
    and apparent axon diameter. ORIENTATION AND MICROSTRUCTURE EVIDENCE, and the microstructure numbers
    are MODEL OUTPUTS whose identifiability is exactly what the strong gradients buy
  confounds:
  - eddy currents, which are far larger at 300 mT/m than on a clinical system
  - peripheral nerve stimulation limits shaping the achievable waveforms
  - gradient nonlinearity, which biases b-values spatially across the field of view
  - the compartment model itself -- AxCaliber and CHARMED assume geometries that are not verified in the
    tissue being measured
  band_hz:
  - null
  - null
  temporal_support: MEG at its own sampling rate against MRI volumes with their own TRs, on different
    days and different machines. There is NO hardware clock relation between the MEG session and the MRI
    sessions; only the anatomy relates them
  spatial_support: '3T Connectom with ULTRA-STRONG 300 mT/m gradients, a separate 3T Prisma, and a 7T
    system, plus a 275-channel MEG and a TMS session. The 300 mT/m gradients are the point: they reach
    diffusion weightings that make axon-diameter and restricted-compartment models identifiable where
    a clinical scanner cannot'
- name: meg_with_same_subject_structure
  kind: measured
  via: null
  observation_chain: post-synaptic currents in aligned pyramidal populations -> magnetic field outside
    the head, negligibly distorted by skull conductivity -> SQUID sensor flux -> sampled tesla. The subject's
    own MRI is available, so the forward model is subject-specific rather than templated
  confounds:
  - environmental magnetic interference and its rejection method
  - head position within the helmet, which differs between subjects and within a session
  - MEG-MRI coregistration error, which is the dominant forward-model error and whose scripts live in
    a SEPARATE repository from the DOI snapshot
  - cardiac and ocular fields
  band_hz:
  - null
  - null
- name: multi_field_multi_device_same_subject
  kind: measured
  via: null
  systematic_bias: The same head measured on 3T Connectom, 3T Prisma, 7T and MEG is a direct handle on
    between-device variance, which every multi-site study estimates and almost none measures within-subject.
  band_hz:
  - null
  - null
