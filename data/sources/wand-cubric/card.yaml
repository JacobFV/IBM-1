citation: 'McNabb, Driver, Hyde, ... Singh, Jones. WAND: A multi-modal dataset integrating advanced MRI,
  MEG, and TMS for multi-scale brain analysis. Scientific Data 2025, doi:10.1038/s41597-024-04154-7. Dataset
  doi:10.12751/g-node.5mv3bf.'
