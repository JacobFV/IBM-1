requires:
- geometry: device-geometry
  for_streams:
  - meg_with_same_subject_structure
  severity: blocking
  without_it: The MEG forward model is dominated by sensor pose relative to the head. Without coil integration-point
    geometry and the measured head position there is no lead field at all, and a sensor-space result cannot
    be attributed to any cortical location.
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
- geometry: tract-path-products
  for_streams:
  - ultrastrong_gradient_diffusion
  severity: blocking
  without_it: A diffusion volume is a field of orientations attached to no pathway. Until the tract product
    exists there is no engineered claim of the form 'this tract transmits between these two supports',
    so this source can constrain local microstructure but no interaction between supports.
- geometry: mr-acquisition-objects
  severity: blocking
  without_it: A quantitative parameter map is a FITTED field, and its value depends on the sequence, the
    timing and the field maps that produced it. Without the acquisition object those are not carried,
    and the number is a fit output rather than a measurement of tissue.
use:
