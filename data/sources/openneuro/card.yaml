id: openneuro
title: OpenNeuro -- BIDS-native open neuroimaging archive
provider: Stanford Center for Reproducible Neuroscience
citation: Markiewicz et al., The OpenNeuro resource for sharing of neuroscience data. eLife 2021.
urls:
