  systematic_bias: THE BRIDGE BETWEEN A DIETARY RECORD AND A METABOLIC INPUT. A food diary is a list of
    names; this is what turns it into grams of glucose, and glucose is the brain's substrate. Composition
    varies with cultivar, season, preparation and portion estimation, so the conversion adds error at
    every step -- but without it the dietary records in myconnectome, nhanes and studentlife cannot enter
    a metabolic model at all.
  notes: branded and calculated entries are derived from label declarations rather than assayed, and the
    two are mixed in the database
