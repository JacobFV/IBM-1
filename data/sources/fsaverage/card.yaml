# ibm-1 source card. schema: data/schema/source.schema.json
id: fsaverage
title: fsaverage -- FreeSurfer population-average surface template
provider: Martinos Center / FreeSurfer
citation: Fischl et al., High-resolution intersubject averaging and a coordinate system for the cortical
  surface. Human Brain Mapping 1999.
urls:
- https://surfer.nmr.mgh.harvard.edu/
access: held
licence:
  name: FreeSurfer Software License
  redistribution: unresolved
  commercial: permitted
  notes: 'Unresolved. §49.2 records that the predecessor''s attribution generator tracked each source''s
    known bias and licence rather than treating atlas availability as correctness; that practice is preserved
    by leaving this unresolved and counting it. LICENCE LINEAGE, NOT A LOOKUP: this reached us inside
    a FreeSurfer subject directory (bundled in turn by an MNE sample dataset or a nilearn cache), so the
    terms under which WE received it are the FreeSurfer Software License. READ, not recalled -- the licence
    text was fetched: it PERMITS COMMERCIAL USE (''any commercialization of the Software is at the sole
    risk of the party ... engaged in such commercialization''), requires that the licence terms and all
    attributions and copyright notices be preserved in any copy, and EXPLICITLY DISCLAIMS COPYLEFT --
    contributors warrant their code ''does not contain any code that requires or prescribes an open source
    license for derivative works''. No registration or DUA is mentioned; accepting the licence is the
    only condition of download. This was very nearly recorded as commercial_use prohibited from memory,
    which would have WRONGLY BLOCKED a legitimate release.'
binding: unbound
population:
  n: null
frames:
- fsaverage
- fsaverage5
- fsaverage6
- subject_native_surface
streams:
- name: spherical_registration_target
  kind: measured
  via: null
  systematic_bias: 'fsaverage is the hub node of the cortical coordinate-frame graph in practice: most
    surface data in the registry can reach most other surface data only through it. That makes its registration
    residual a shared, systematic error affecting nearly every cross-source surface comparison, and it
    is almost never propagated.'
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: an average of 40 subjects' surfaces with a spherical coordinate system; the standard
    target for surface-based registration and the reason cross-study surface comparison is possible
- name: downsampled_variants
  kind: measured
  via: null
  systematic_bias: fsaverage5 and fsaverage6 are decimated meshes; moving data between resolutions is
    resampling and loses spatial detail irreversibly
  band_hz:
  - null
  - null
absent:
- individual_folding
- registration_residual_distribution
- subcortex
use:
- calibrate
- prior
forbidden:
- fsaverage/* -> individual cortical geometry
- fsaverage/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
provenance:
  imported_from: win-registry
  card: fsaverage
  imported_at: '2026-09-04'
