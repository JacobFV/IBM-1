# ibm-1 source card. schema: data/schema/source.schema.json
id: spoken-coco
title: SpokenCOCO -- spoken captions for COCO images
provider: MIT CSAIL
citation: Hsu et al., Text-Free Image-to-Speech Synthesis Using Learned Segmental Units. ACL 2021.
urls:
- https://groups.csail.mit.edu/sls/downloads/placesaudio/
access: priority
licence:
  name: unresolved
