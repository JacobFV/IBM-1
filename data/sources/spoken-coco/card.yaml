  commercial: unresolved
  notes: Audio recordings and COCO images have separate terms; both unresolved here.
binding: unbound
population:
  n: null
  hierarchy:
  - participant
  - session
  notes: Crowdworker speakers reading captions aloud; speaker identity is a grouping level and is often
    ignored, which leaks speaker identity into every split.
frames:
- microphone_uncontrolled
- image_plane
streams:
- name: spoken_captions
  kind: imposed
  via: null
