  band_hz:
  - null
  - null
  temporal_support: audio at 16 kHz; one utterance per caption, no continuous timeline
  spatial_support: 'crowdsourced recording conditions: uncontrolled microphones and rooms'
- name: coco_image_pairing
  kind: imposed
  via: null
  systematic_bias: COCO images are shared with NSD and BOLD5000, so this is a cross-dataset stimulus leakage
    channel
  band_hz:
  - null
  - null
- name: text_captions
  kind: measured
  via: null
  band_hz:
  - null
  - null
- name: coco_image_ids
  kind: measured
  via: null
  band_hz:
  - null
  - null
- name: forced_alignments
  kind: measured
  via: null
  band_hz:
  - null
  - null
absent:
- any_neural_measurement
- speaker_demographics
- room_acoustics
use:
- fit
forbidden:
- spoken-coco/* -> any cortical state directly
split:
