# ibm-1 source card. schema: data/schema/source.schema.json
id: broderick-natural-speech-eeg
title: Broderick et al. natural speech EEG (narrative listening, five experiments)
provider: Trinity College Dublin / University of Rochester (Lalor lab), deposited on Dryad
citation: Broderick, Anderson, Di Liberto, Crosse, Lalor. Electrophysiological correlates of semantic
  dissimilarity reflect the comprehension of natural, narrative speech. Current Biology 28(5):803-809,
  2018. doi:10.1016/j.cub.2018.01.080. Data doi:10.5061/dryad.070jc.
urls:
- https://doi.org/10.5061/dryad.070jc
access: priority
licence:
  name: CC0-1.0
  redistribution: permitted
  commercial: permitted
  notes: CC0-1.0 from the Dryad record's licence field. Dryad imposes CC0 as a condition of deposit. The
    audiobook stimulus is separately copyrighted and is not covered by the waiver.
binding: bound
population:
  n: 19
  hierarchy:
  - participant
  - run
  notes: 13 male. Figures are for the Natural Speech experiment specifically, verified from a peer-reviewed
    secondary description rather than the Dryad abstract. The deposit holds FIVE experiments and 'Natural
    Speech' is one 3.46 GB zip of it, not the whole thing -- quoting the deposit size for the experiment
    would overstate it fourfold.
frames:
- channel_label
streams:
- name: eeg_to_continuous_natural_speech
  kind: measured
  via:
  - em_generation
  - em_coupling
  - device_coupling
  observation_chain: post-synaptic currents in spatially aligned pyramidal populations -> volume conduction
    through brain, CSF, skull and scalp -> potential difference between an electrode and a reference ->
    amplifier gain, filtering and group delay -> sampled voltage
  confounds:
  - ocular and blink artefact
  - muscle (EMG) contamination
  - cardiac field and pulse artefact
  - electrode impedance drift and movement artefact
  - the reference choice, which is a montage operator and not a property of the brain
  - line noise and its harmonics
  - acoustic envelope, phoneme identity, word frequency and semantic content are all correlated in natural
    speech, so an effect at one level is not separated from the others without an explicit nested-model
    comparison
  - attention over an hour of listening drifts and is not measured
  - the semantic-dissimilarity regressor is computed from a word-embedding model, which is a TEACHER representation
    and not a measurement of anything the listener did
  systematic_bias: 'This is the reference corpus for the separate-linguistic-levels requirement in obj-materialization-audio-language:
    it exists precisely to ask which level of the linguistic hierarchy the EEG tracks, and its own result
    rests on a model-derived regressor whose status as teacher rather than observation is the distinction
    this registry enforces.'
  band_hz:
  - 0.5
  - 32.0
  temporal_support: about 60 minutes of continuous listening per participant to The Old Man and the Sea.
    Sampling rate unresolved from the record. Word onsets are FORCE-ALIGNED, a fitted clock relation with
    residual error, against a continuous acoustic stream
  spatial_support: 128-channel scalp EEG
  constrains:
  - device.contact_potential
  notes: 'about 60 minutes of continuous listening per participant to The Old Man and the Sea, on a 128-channel
    scalp montage.  THE SAMPLING RATE IS UNRESOLVED FROM THE RECORD and the bytes are not held, so the
    band declared here is not a nyquist: it is the band the published analyses of this corpus actually
    operate in -- a low-frequency envelope-tracking band -- and it must be re-read from the sidecars when
    the bytes arrive.  declaring a rate nobody checked would be the failure this field exists to prevent.  the
    word onsets it is analysed against are FORCE-ALIGNED, a fitted clock relation with residual error,
    and the corpus''s own result rests on a model-derived regressor.'
  frame: eeg_cap
  support: sensor_array
  units: V
- name: reverse_speech_and_noise_controls
  kind: context
  via: null
  systematic_bias: 'REVERSED SPEECH IS A CONTROL THAT CAN FAIL: it preserves the acoustic envelope and
    destroys comprehension, so an effect that survives reversal is acoustic and not linguistic. Cocktail-party
    and speech-in-noise arms add attention and degradation manipulations. Shipping the controls in the
    same deposit as the effect is what makes this corpus worth more than its size.'
  band_hz:
  - null
  - null
  constrains: []
  notes: 'context.  this is a DESIGN FACTOR -- a label naming which condition a block belonged to -- not
    a physical variable.  the same reading as eegmmidb''s `task_annotations`: it indexes the imposed stimulus
    rather than constraining any state, so it binds to nothing and that is correct, not missing.  and
    it is the best kind: REVERSED SPEECH IS A CONTROL THAT CAN FAIL.  it preserves the acoustic envelope
    and destroys comprehension, so an effect surviving reversal is acoustic and not linguistic.  the cocktail-party
    and speech-in-noise arms add attention and degradation manipulations.  this names which runs belong
    to which arm; the recordings themselves are the four `eeg_*` streams below.'
- name: eeg_128ch_natural_speech
  kind: context
  via: null
  band_hz:
  - 0.5
  - 32.0
  constrains: []
  notes: 'context, and a DUPLICATE carried over from the migration: it describes the same bytes as `eeg_to_continuous_natural_speech`,
    which is where the likelihood is written.  kept so the card still describes the archive it came from,
    bound to nothing so one measurement is not counted twice.'
- name: eeg_reverse_speech
  kind: measured
  via:
  - em_generation
  - em_coupling
  - device_coupling
  band_hz:
  - 0.5
  - 32.0
  constrains:
  - device.contact_potential
  notes: 'the reversed-speech control arm: SEPARATE RUNS from the natural-speech listening, so this is
    measured rather than a second count of it -- the eegmmidb `eeg_64ch` / `baseline_runs` case.  same
    montage and same unresolved rate caveat as the natural-speech stream.'
  frame: eeg_cap
  support: sensor_array
  units: V
- name: eeg_cocktail_party
  kind: measured
  via:
  - em_generation
  - em_coupling
  - device_coupling
  band_hz:
  - 0.5
  - 32.0
  constrains:
  - device.contact_potential
  notes: 'the attended/unattended two-talker arm: again separate runs, so measured.  same montage and
    same rate caveat.'
  frame: eeg_cap
  support: sensor_array
  units: V
- name: eeg_speech_in_noise
  kind: measured
  via:
  - em_generation
  - em_coupling
  - device_coupling
  band_hz:
  - 0.5
  - 32.0
  constrains:
  - device.contact_potential
  notes: 'the degraded-speech arm: separate runs, so measured.  same montage and rate caveat.'
  frame: eeg_cap
  support: sensor_array
  units: V
- name: eeg_n400
  kind: measured
  via:
  - em_generation
  - em_coupling
  - device_coupling
  band_hz:
  - 0.5
  - 32.0
  constrains:
  - device.contact_potential
  notes: the semantic-violation arm, a fifth set of runs.  same montage and rate caveat.
  frame: eeg_cap
  support: sensor_array
  units: V
absent:
- mri
- digitised_electrode_positions
- meg
- fmri
- comprehension_probes_per_trial
- sampling_rate_in_the_record
requires:
- geometry: device-geometry
  for_streams:
  - eeg_to_continuous_natural_speech
  severity: degrading
  without_it: A scalp voltage is a function of where the electrode sat. Without per-participant electrode
    positions carried as a device-geometry object there is no lead field for this montage, so nothing
    recorded here can be attributed to a cortical support -- only channel-space statistics remain.
  substitute: A nominal 10-20/10-10 template montage. It displaces every electrode in a head-size-dependent,
    spatially correlated way, so the resulting source-estimate error is systematic and structured rather
    than random, and it must be carried as uncertainty in every number derived from it.
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
use:
- evaluate
- fit
forbidden:
- broderick-natural-speech-eeg/eeg_128ch_natural_speech -> independent evidence from eeg_to_continuous_natural_speech
  (same recordings)
- broderick-natural-speech-eeg/* -> a linguistic effect that has not cleared the reversed-speech control
  (reversal preserves the envelope and destroys comprehension)
- broderick-natural-speech-eeg/* -> a band above 32 Hz until the acquisition rate and filters are read
  from the deposit (the record does not state them)
split:
  group_by:
  - participant
  - stimulus
  notes: One audiobook shared by every participant; a participant-only split leaks through it.
provenance:
  imported_from: win-registry
  card: broderick-natural-speech-eeg
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
