id: hansen-lausanne-sc
title: Hansen structural connectome in the Lausanne parcellation
provider: Misic lab / Network Neuroscience Lab
citation: Distributed with Hansen et al. and netneurotools; Lausanne parcellation from Cammoun et al.
  2012.
urls:
- https://github.com/netneurolab
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved. §49.2 records that the predecessor's attribution generator tracked each source's
    known bias and licence rather than treating atlas availability as correctness; that practice is preserved
    by leaving this unresolved and counting it.
binding: unbound
population:
  n: null
frames:
- Lausanne
- fsaverage
streams:
- name: consensus_connectome
  kind: measured
  via: null
  systematic_bias: 'The SAME underlying diffusion data as hansen-schaefer-sc, expressed in a DIFFERENT
    parcellation. Holding both is worth more than holding either: the difference between them is a direct
    measurement of how much a connectome result is a property of the parcellation rather than of the brain,
    which is §11''s argument made numerical.'
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: a group consensus structural connectome on the multi-scale Lausanne parcellation
absent:
- provenance
- path_geometry
- directionality
- uncertainty
requires:
- geometry: tract-path-products
  severity: blocking
  without_it: A connectome matrix is an adjacency over parcel indices. Without the tract product its edges
    have no path, no length and no supports to terminate on, so it cannot supply a delay, a route or an
    engineered structural commitment -- only a number per pair of labels.
- geometry: cortical-support-bank
  severity: blocking
  without_it: A parcellation or a surface map is a COVER, not an element of the brain's ontology. Without
    the support bank there is nothing for these labels to be a cover OVER, and using them as if they were
    the supports themselves is precisely the canonical-parcellation commitment the architecture refuses.
use:
- calibrate
- prior
forbidden:
- hansen-lausanne-sc/* -> measured-connection claims
- hansen-lausanne-sc/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
