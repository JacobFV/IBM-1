- MNI152
streams:
- name: meg_rest
  kind: measured
  via: null
  observation_chain: oriented cortical current-source state -> quasi-static magnetic field (primary current
    plus volume-current return) -> pickup-coil geometry, orientation and gradiometer configuration ->
    SQUID flux -> sampled channel
  confounds:
  - environmental magnetic interference and urban noise
  - head motion within and between runs
  - ocular and cardiac fields
  - muscle artifact at high frequency
  - SQUID jumps and sensor drift
  systematic_bias: Head position within the dewar varies between participants and is part of the forward
    model, not a nuisance to be ignored.
  notes: the MEG forward model uses this participant's MRI from a DIFFERENT session; the coregistration
    residual is a real uncertainty component
  band_hz:
  - null
  - null
  temporal_support: MEG at 1 kHz; MRI volumes at their own TR. MEG and MRI are SEPARATE sessions -- not
    simultaneous, and the card must not imply otherwise
  spatial_support: 306-channel Elekta/MEGIN MEG array plus 70-channel EEG; 1 mm structural MRI
