id: cam-can
title: Cambridge Centre for Ageing and Neuroscience (Cam-CAN)
provider: University of Cambridge
citation: Shafto et al., The Cambridge Centre for Ageing and Neuroscience (Cam-CAN) study protocol. BMC
  Neurology 2014; Taylor et al., NeuroImage 2017.
