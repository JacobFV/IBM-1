id: bwin-000-synthetic-scaffold
title: The bWIN-000 synthetic scaffold -- generated by this repository, not measured from anyone
provider: this repository
citation: None. bwin.release.build() generates it. There is no participant, no scanner and no recording.
access: reference
licence:
  name: not applicable -- no third-party material
  redistribution: permitted
  commercial: permitted
  notes: Deliberately permissive and deliberately RESOLVED. A synthetic scaffold contributes no third-party
    material, so it must not poison the licence of anything downstream -- but it must also never be mistakable
    for evidence, which is what the negative_control role and the title are for. This card exists so bwin.release.write()
    has a real lineage to run the release gate over instead of a special case for 'empty'.
binding: unbound
population:
  n: 0
  notes: Nobody. A spherical head of 21 electrodes and N synthetic cortical splats, every one labelled
    synthetic in its own material dict.
frames:
- bwin-spherical-head
streams:
- name: synthetic_eeg
  kind: measured
  via: null
  systematic_bias: Total, and by construction. The evidence is synthesised by the same forward model that
    then fits it, so recovering the planted number means the arithmetic inverts and nothing more. It is
    a scaffold for checking that the chain composes, and it is evidence about no brain.
  notes: 'Not applicable: there is no quantity this is a discrepant estimate of.'
  band_hz:
  - null
  - null
  temporal_support: a simulated millisecond clock
  spatial_support: 'a spherical scaffold: cortical splats on a sphere and a 10-20 montage on another'
absent:
- everything real
use:
- control
forbidden:
- bwin-000-synthetic-scaffold/* -> any claim about a brain
- bwin-000-synthetic-scaffold/* -> any parameter of any mechanism intended for real evidence
- bwin-000-synthetic-scaffold/synthetic_eeg -> observation-role likelihoods over real recordings
split:
  group_by:
  - participant
  notes: There are no participants to group. If this ever appears on either side of a real split, something
    upstream is wrong -- it is a scaffold, not evidence.
provenance:
  imported_from: win-registry
  card: bwin-000-synthetic-scaffold
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
origin_kind: authored
provenance_note: 'synthesized by a peer programme on this machine, not obtained from an external provider.
  credited as authorship: the artefact exists because that programme produced it'
provenance_traced_from: a peer programme's card for the same corpus, which read the origin off the held
  dataset_description. the ORIGIN is recorded here; the peer is not cited, because a courier is not a
  source
