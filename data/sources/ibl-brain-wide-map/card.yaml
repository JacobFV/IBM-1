absent:
- human_data
- bilateral_coverage
- multiple_tasks
- connectome_for_the_same_animals
- documented_lfp_dataset_type
requires:
- geometry: device-geometry
  for_streams:
  - brain_wide_spiking_during_a_standardised_task
  - histology_registered_probe_tracks
  severity: blocking
  without_it: 'A penetrating array samples along its own geometry: site pitch, shank trajectory and insertion
    depth decide which tissue each channel sees. Without that geometry the channel index carries no spatial
    claim and the recording cannot be placed against any support.'
- geometry: retinal-world-geometry
  severity: degrading
  without_it: The stimulus is presented on a screen at a fixed distance from an eye whose position is
    tracked only in part of the sessions. Without the display and eye geometry the visual field coordinate
    of any response is unknown, and retinotopic claims made from screen coordinates carry an uncorrected
    eye-position error.
  substitute: Screen coordinates treated as retinal coordinates under an assumption of fixed gaze, which
    is false during the periods the pupil trace shows movement.
use:
- evaluate
- fit
- prior
forbidden:
- ibl-brain-wide-map/* -> any human state channel without an explicit cross-species mapping
- ibl-brain-wide-map/* -> a region label treated as measured rather than reconstructed
- ibl-brain-wide-map/* -> a task-general claim from one task
split:
  group_by:
  - participant
  - site
  - session
  - device
  notes: Laboratory is a first-class split axis here; a within-laboratory split reports a number the dataset
    was built to show does not generalise.
