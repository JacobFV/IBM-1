  systematic_bias: TRAINED TO REPRODUCE FREESURFER'S OUTPUT, which means it inherits FreeSurfer's biases
    by construction AND may fail differently on anatomy unlike its training distribution. Agreement with
    FreeSurfer is therefore not independent validation -- it is the training objective. Where they DISAGREE
    is the informative case, because at least one is wrong and the disagreement is measurable.
  notes: a network trained on one distribution of anatomy and scanners degrades silently outside it, whereas
    FreeSurfer's classical pipeline fails loudly
  band_hz:
