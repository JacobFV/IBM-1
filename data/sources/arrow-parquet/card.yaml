# ibm-1 source card. schema: data/schema/source.schema.json
id: arrow-parquet
title: Apache Arrow and Parquet -- columnar in-memory and on-disk tables
provider: Apache Software Foundation
citation: Apache Arrow and Apache Parquet specifications. PROMPT.md §55, 'Arrow/Parquet for source indices
  and event tables'.
urls:
- https://arrow.apache.org/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved pending inspection of the distributed licence file. Code licence and bundled-data
    licence frequently differ and must be resolved separately.
binding: unbound
population:
  n: null
frames:
- tabular_schema
streams:
- name: typed_columnar_tables
  kind: measured
  via: null
  systematic_bias: §55's use is SOURCE INDICES AND EVENT TABLES. The registry's own products -- a file-level
    inventory per card for registry-audit, an event table across datasets, a streamline attribute table
    -- are all tabular and all large enough that a typed columnar format with predicate pushdown is the
    right shape rather than a nicety.
  notes: a schema constrains types and not meaning; a column typed float64 named 'onset' says nothing
    about which clock
  band_hz:
  - null
  - null
  temporal_support: no time semantics of its own; a timestamp column is typed and has a declared unit
    and time zone, which is more than a CSV can say
  spatial_support: TABLES with a declared schema, stored columnwise with per-block statistics so a predicate
    can skip blocks without reading them
- name: zero_copy_interchange
  kind: measured
  via: null
  systematic_bias: Arrow's in-memory format crosses language boundaries without serialisation, which matters
    for a repository with a Python substrate and a TypeScript surface
  band_hz:
  - null
  - null
absent:
- semantic_validation
- provenance
use:
- calibrate
forbidden:
- arrow-parquet/* -> runtime dependency in a WIN query
split:
  group_by:
  - participant
