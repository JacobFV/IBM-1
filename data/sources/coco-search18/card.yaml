frames:
- eye
- display
- image_plane
streams:
- name: fixation_sequences
  kind: imposed
  via: null
  systematic_bias: 'GOAL-CONDITIONED gaze: the same image produces different scanpaths under different
    search targets. That is direct behavioural evidence for §26''s interaction-strength claim -- the top-down
    term changes where the retina is pointed'
  band_hz:
  - null
  - null
  temporal_support: eye tracker at 1000 Hz reduced to fixation events; trials are discrete
  spatial_support: desktop eye tracker, chin rest, documented viewing distance
- name: target_category
