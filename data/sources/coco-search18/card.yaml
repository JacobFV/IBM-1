id: coco-search18
title: COCO-Search18 -- goal-directed visual search fixation dataset
provider: Stony Brook University
citation: Chen et al., COCO-Search18 fixation dataset for predicting goal-directed attention control.
  Scientific Reports 2021.
urls:
- https://sites.google.com/view/cocosearch/
access: priority
licence:
