# ibm-1 source card. schema: data/schema/source.schema.json
id: physiological-etco2-recordings
title: Physiological recordings of end-tidal CO2, respiration, pulse and blood pressure
provider: multiple -- concurrent physiological monitoring in imaging studies
citation: PROMPT.md §52.11, 'physiological recordings of end-tidal CO2, respiration, pulse, and blood
  pressure'.
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved. §49.2 records that the predecessor's attribution generator tracked each source's
    known bias and licence rather than treating atlas availability as correctness; that practice is preserved
    by leaving this unresolved and counting it.
binding: unbound
population:
  n: null
frames:
- torso
- finger
- airway
- arm_cuff
- scanner
streams:
- name: end_tidal_co2
  kind: measured
  via: null
  systematic_bias: 'Spontaneous arterial CO2 fluctuation drives a large, brain-wide BOLD signal that has
    NOTHING to do with neural activity. §17''s argument applies at rest as well as under task: without
    a CO2 recording that variance is either regressed away blindly or attributed to the brain, and both
    are wrong.'
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: the physiological channels recorded alongside imaging; each has its own sensor and
    its own body-surface location, and none of them is at the brain
- name: respiration_and_pulse
  kind: measured
  via: null
  systematic_bias: respiratory and cardiac cycles alias into the BOLD sampling at typical TRs; the recordings
    make the aliased components MODELLABLE rather than a noise floor -- and §25's point applies, that
    the same physical event participates in several interactions with different roles
  band_hz:
  - null
  - null
- name: blood_pressure
  kind: measured
  via: null
  systematic_bias: cerebral autoregulation makes flow relatively insensitive to pressure within a range
    and very sensitive outside it; a single cuff reading does not locate the person in that range
  band_hz:
  - null
  - null
absent:
- measurement_at_the_brain
- arterial_blood_gas
- continuous_blood_pressure_in_most_studies
use:
- calibrate
- fit
forbidden:
- physiological-etco2-recordings/* -> neural state directly
- physiological-etco2-recordings/end_tidal_co2 -> arterial CO2 without a gradient model
- physiological-etco2-recordings/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
provenance:
  imported_from: win-registry
  card: physiological-etco2-recordings
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
