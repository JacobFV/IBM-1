# ibm-1 source card. schema: data/schema/source.schema.json
id: healthy-brain-network
title: Child Mind Institute Healthy Brain Network (HBN)
provider: Child Mind Institute
citation: Alexander et al., An open resource for transdiagnostic research in pediatric mental health and
  learning disorders. Scientific Data 2017.
urls:
- http://fcon_1000.projects.nitrc.org/indi/cmi_healthy_brain_network/
access: restricted
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Data usage agreement required; minors with psychiatric diagnoses.
binding: unbound
population:
  n: 10000
  hierarchy:
  - participant
  - site
  - session
  notes: Deliberately NOT a healthy sample despite the name -- it is a help-seeking, transdiagnostic cohort.
    Using it as a normative prior is a category error.
frames:
- eeg_cap
- display
- scanner
- subject_native
- MNI152
streams:
- name: eeg_128ch
  kind: measured
  via: null
  observation_chain: oriented cortical current-source state -> quasi-static volume conduction through
    brain, CSF, skull and scalp -> electrode contact geometry and impedance -> reference montage -> amplified,
    filtered, sampled voltage
  confounds:
  - 'ocular: blink and saccade corneo-retinal potentials'
  - 'cardiac: ECG contamination and pulse artifact'
  - 'muscle: temporalis, frontalis and neck EMG'
  - electrode impedance drift, motion and bridging
  - line noise and amplifier drift
  - reference-electrode activity, which is never inactive
  - developmental skull thickness and conductivity change with age
  - high motion in a paediatric clinical sample
  systematic_bias: Electrode positions are cap-template unless digitised; that is a stated assumption,
    not a default.
  band_hz:
  - null
  - null
  temporal_support: EEG at 500 Hz; naturalistic video and resting paradigms
  spatial_support: 128-channel high-density EEG; 1 mm structural; multi-site
- name: bold_movie
  kind: measured
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY (PROMPT.md §17): the vascular stage is a
    modelled state, not a nuisance to be regressed away'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  band_hz:
  - null
  - null
- name: phenotyping
  kind: measured
  via: null
  systematic_bias: clinical labels here are dimensional research assessments, not diagnoses of record
  band_hz:
  - null
  - null
- name: eye_tracking
  kind: measured
  via: null
  band_hz:
  - null
  - null
- name: t1w
  kind: measured
  via: null
  band_hz:
