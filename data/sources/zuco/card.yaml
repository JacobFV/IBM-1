# ibm-1 source card. schema: data/schema/source.schema.json
id: zuco
title: ZuCo -- simultaneous EEG and eye tracking during natural reading
provider: ETH Zurich
citation: Hollenstein et al., ZuCo, a simultaneous EEG and eye-tracking resource for natural sentence
  reading. Scientific Data 2018; ZuCo 2.0, LREC 2020.
urls:
- https://osf.io/q3zws/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Unresolved. Sentence materials come from published corpora with their own terms.
binding: unbound
population:
  n: 30
  hierarchy:
  - participant
  - session
  - run
  notes: 12 participants in ZuCo 1.0, 18 in 2.0. Natural reading and task-specific reading arms; the two
    are different cognitive regimes.
frames:
- eeg_cap
- eye
- display
- text_layout
streams:
- name: eeg_128ch
  kind: measured
  via: null
  observation_chain: oriented cortical current-source state -> quasi-static volume conduction through
    brain, CSF, skull and scalp -> electrode contact geometry and impedance -> reference montage -> amplified,
    filtered, sampled voltage
  confounds:
  - 'ocular: blink and saccade corneo-retinal potentials'
  - 'cardiac: ECG contamination and pulse artifact'
  - 'muscle: temporalis, frontalis and neck EMG'
  - electrode impedance drift, motion and bridging
  - line noise and amplifier drift
  - reference-electrode activity, which is never inactive
  - saccade-related potentials that are LARGE relative to the fixation-related response and are not separable
    by filtering
  - overlap between responses to successive fixations at natural reading rates
  systematic_bias: Self-paced reading means the stimulus onset is generated by the participant's own eye
    movement. That is a genuine closed loop and also the reason the ocular artifact is correlated with
    the signal of interest rather than independent of it.
  notes: fixation-related potentials require an overlap-correction model; which one is used changes the
    result
  band_hz:
  - null
  - null
  temporal_support: EEG at 500 Hz; eye tracker at 500 Hz; the WORD is the natural unit and its onset is
    defined by the reader's own fixation, not by the experimenter
  spatial_support: 128-channel EEG with an EyeLink tracker; text rendered at a documented font size and
    viewing distance
- name: eye_tracking
  kind: imposed
  via: null
  band_hz:
  - null
  - null
- name: sentence_materials
  kind: imposed
  via: null
  band_hz:
  - null
  - null
- name: relation_annotations
  kind: imposed
  via: null
  band_hz:
  - null
  - null
- name: fixation_related_potentials
  kind: measured
  via: null
  band_hz:
  - null
  - null
- name: sentiment_labels
  kind: measured
  via: null
  band_hz:
  - null
  - null
absent:
- fmri
- meg
- individual_anatomy
- audio
requires:
- geometry: device-geometry
  for_streams:
  - eeg_128ch
  severity: degrading
  without_it: A scalp voltage is a function of where the electrode sat. Without per-participant electrode
    positions carried as a device-geometry object there is no lead field for this montage, so nothing
    recorded here can be attributed to a cortical support -- only channel-space statistics remain.
  substitute: A nominal 10-20/10-10 template montage. It displaces every electrode in a head-size-dependent,
    spatially correlated way, so the resulting source-estimate error is systematic and structured rather
    than random, and it must be carried as uncertainty in every number derived from it.
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
- geometry: retinal-world-geometry
  for_streams:
  - eye_tracking
  severity: blocking
  without_it: A screen-coordinate gaze trace is not retinal input. Without the per-episode display, eye
    and gaze geometry there is no map from what was on the screen to what fell on the retina, and treating
    the stimulus as the input is exactly the modelling error retinalisation exists to prevent.
use:
- fit
forbidden:
- zuco/* -> subject-specific head geometry
- zuco/relation_annotations -> observation-role likelihoods
split:
  group_by:
  - participant
  - stimulus
  notes: sentences recur across participants
provenance:
  imported_from: win-registry
  card: zuco
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
