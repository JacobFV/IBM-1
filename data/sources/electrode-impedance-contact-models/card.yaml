streams:
- name: interface_impedance_models
  kind: measured
  via: null
  systematic_bias: "The electrode-skin interface is a FREQUENCY-DEPENDENT, DRIFTING, NONLINEAR element\
    \ sitting between the head and every EEG or tES number. \xA756.4 asks for EEG electrode contact geometry\
    \ AND IMPEDANCE SUPPORT as a constructed object, and this is the physics that object encodes -- for\
    \ both directions, since the same interface carries recording and stimulation."
  notes: impedance drifts over a session as gel dries and skin hydrates; a single start-of-session impedance
    check does not characterise it
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: 'the electrical behaviour of the electrode-gel-skin interface: frequency-dependent
    impedance, polarisation, drift and contact area effects'
- name: contact_area_effects
  kind: measured
  via: null
  systematic_bias: current density at the scalp is current divided by contact area, so electrode size
    determines both comfort and the field's entry pattern
  band_hz:
  - null
  - null
