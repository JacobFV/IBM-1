streams:
- name: spatial_anchoring_model
  kind: measured
  via: null
  systematic_bias: '§55 singles openMINDS out because IT CAN DESCRIBE DATASETS, MODELS, WORKFLOWS AND
    SPATIAL ANCHORING RATHER THAN ONLY FILE LAYOUT -- which is the gap every other standard in this section
    leaves. SANDS is the closest existing vocabulary to §3''s fully qualified state address: it says which
    space, by what transformation, relative to what structure. Adopting its terms is cheaper than inventing
    an incompatible set, and §55''s opening instruction is exactly that.'
  notes: SANDS describes the anchoring; it does not carry the transformation's residual, which obj-uncertainty-ledger
    still has to supply
  band_hz:
  - null
  - null
  temporal_support: openMINDS describes workflows and their execution as typed entities, so a derivation's
    sequence is representable
  spatial_support: SANDS describes HOW a data structure IS ANCHORED IN SPACE -- the coordinate space,
    the transformation used, the target anatomical entity and the relationship type -- as structured metadata
    rather than as an implicit convention
- name: workflow_and_model_description
  kind: measured
  via: null
  systematic_bias: describing a WORKFLOW and its inputs as typed entities is what makes derivation lineage
    machine-readable, which is what §49.4's lineage machinery and obj-licence-lineage need
  band_hz:
  - null
  - null
- name: persistent_identifiers
  kind: measured
  via: null
  systematic_bias: a persistent identifier per entity is the precondition for a lineage graph that survives
    a file being moved
  band_hz:
  - null
  - null
