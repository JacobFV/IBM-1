streams:
- name: regulatory_and_expression_atlases_in_psychiatric_cohorts
  kind: measured
  via: null
  systematic_bias: The molecular substrate that determines which interaction classes exist in a region,
    in cohorts defined by psychiatric diagnosis. Post-mortem, so it describes end-state tissue and cannot
    separate cause from consequence from treatment. Medication history, agonal state, post-mortem interval
    and cause of death all differ systematically between diagnostic groups and all affect the molecular
    measurements.
  notes: a diagnosis is a clinical category, not a biological one, and the case-control contrast inherits
    that
  band_hz:
  - null
  - null
  temporal_support: none for the assays; developmental stage and age at death are the only ordering variables
  spatial_support: human post-mortem brain tissue and organoids across multiple regions, plus spatial
    transcriptomics where available. Most assays are DISSOCIATED and carry no spatial coordinates at all
- name: chromatin_contact_maps
  kind: measured
  via: null
  systematic_bias: Hi-C contact frequency is a population-average over cells and over conformational states;
    a contact is a statistical tendency, not a wire.
