binding: unbound
population:
  n: null
frames:
- subject_native
streams:
- name: constrained_spherical_deconvolution
  kind: measured
  via: null
  systematic_bias: CSD estimates a fibre orientation distribution using a RESPONSE FUNCTION estimated
    from the data. §52.8 requires that response function to travel with any output, and it almost never
    does. Two CSD results with different response functions are not comparable.
  band_hz:
  - null
  - null
  temporal_support: not a time series
  spatial_support: operates in the parent DWI's voxel grid and emits streamlines in that subject's space
- name: sift_and_sift2
  kind: measured
  via: null
  systematic_bias: 'SIFT reweights streamlines so the tractogram is consistent with the diffusion signal.
    That is a genuine improvement and it is also a MODEL: the weights are inferred, not measured, and
    they change every downstream count'
  band_hz:
  - null
  - null
- name: tractography_algorithms
  kind: measured
  via: null
  systematic_bias: §52.8 names MRtrix as a derived-evidence generator. B-WIN's own path products are validated
    against it and against the ISMRM phantom; they do not call it at query time
  band_hz:
  - null
  - null
