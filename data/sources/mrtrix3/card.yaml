id: mrtrix3
title: MRtrix3 -- diffusion MRI processing and tractography
provider: Brain Research Institute Melbourne / MRtrix3 developers
citation: 'Tournier et al., MRtrix3: A fast, flexible and open software framework for medical image processing
  and visualisation. NeuroImage 2019.'
urls:
