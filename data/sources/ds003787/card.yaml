# ibm-1 source card. schema: data/schema/source.schema.json
id: ds003787
title: OpenNeuro ds003787 -- NYU Retinotopy Dataset (3T pRF mapping)
provider: OpenNeuro; New York University (Winawer and Carrasco labs)
citation: Himmelberg, Kurzawski, Benson, Pelli, Carrasco, Winawer. Cross-dataset reproducibility of human
  retinotopic maps. Dataset doi:10.18112/openneuro.ds003787.v1.0.0.
urls:
- https://openneuro.org/datasets/ds003787
access: held
licence:
  name: CC0-1.0
  redistribution: permitted
  commercial: permitted
  notes: 'RESOLVED 2026-08-16 FROM THE HELD BYTES: dataset_description.json states License ''CC0''. That
    file was ABSENT until today -- see the note below -- so this card carried an unresolved licence for
    a deposit that states its own, purely because the acquisition filter dropped it. DUA: none. Recorded
    as dua_required false on the basis of HOW THIS WAS ACTUALLY OBTAINED -- it is held in this store,
    fetched anonymously over plain HTTP by a script in scripts/ that sends no credential and accepts no
    terms, from a repository that serves it without an access request. That is evidence about the acquisition
    rather than an opinion about the deposit''s policy. It says nothing about the LICENCE terms, which
    are recorded separately and still govern distribution; a non-commercial work with no DUA is an ordinary
    combination.'
binding: bound
population:
  n: 44
  hierarchy:
  - participant
  - session
  notes: 44 sub-wlsubj directories matching 44 rows in participants.tsv. The derivatives tree contains
    two additional non-human 'subjects' -- a group average and a median solution -- which are DERIVED
    products and must not be counted as participants.
frames:
- scanner
- subject_native
- fsnative
- fsaverage
- visual_field_polar
streams:
- name: population_receptive_field_estimates
  kind: context
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY: the vascular stage is a modelled state,
    not a nuisance to be regressed away. The pRF parameters are then obtained by FITTING a receptive-field
    model to the response of each vertex against the known stimulus aperture sequence. THE PARAMETERS
    ARE MODEL OUTPUTS: a pRF size is a property of the fitted model, and it absorbs BOLD spatial blur,
    vascular point spread and eye movement along with any neural receptive-field extent'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving a global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  - eye movements enlarge and displace the estimated pRF and are not recorded in this release
  - the vascular point-spread function sets a floor on estimable pRF size that is not neural
  - the pRF model form (Gaussian, difference-of-Gaussians, compressive nonlinearity) changes the estimates
    and is a choice
  - attention shifts the pRF centre, a well-documented effect, and attention is not controlled here
  systematic_bias: 44 participants with per-vertex pRF parameters on their own surfaces is the population
    sample that a PROBABILISTIC retinal-to-cortical mapping needs. A single atlas label lookup is what
    this replaces.
  band_hz:
  - 0.0
  - 0.001
  temporal_support: TR-sampled BOLD during rotating-wedge and expanding-ring stimulus sweeps; the stimulus
    apertures are shipped, so the forward stimulus timeline is recoverable
  spatial_support: 3T whole-brain EPI analysed on the SUBJECT'S OWN SURFACE (fsnative) as well as fsaverage,
    with pRF parameters estimated per vertex and V1/V2/V3/hV4 ROIs drawn on those surfaces. The retinotopic
    map is a coordinate system in the VISUAL FIELD attached to cortical locations -- which is the mapping
    obj-retinotopic-mapping needs, and it is estimated, never measured
  constrains: []
  notes: context, and this is the tractogram argument in another modality.  a pRF parameter -- a centre,
    a size, a gain -- is what one receptive-field model returned when it was fitted to a BOLD time course.  it
    is an INVERSE SOLUTION, and binding it as measured would let one pipeline's fit contribute a likelihood
    about cortical state, which is exactly what mne-sample's card refuses for a `.stc` and what tractoinferno's
    refuses for a tractogram.  it enters through an observation model or as a `prior` over the retinotopic
    mapping, never as evidence about a component.
- name: cross_dataset_reproducibility
  kind: context
  via: null
  systematic_bias: The dataset exists to be compared against the HCP 7T retinotopy release. Two independent
    measurements of the same quantity in different people on different scanners is the only way to separate
    estimation error from individual variation, and it is exactly the overlap-reconciliation case.
  band_hz:
  - null
  - null
  constrains: []
  notes: context.  this names a COMPARISON the deposit was built to support -- the same quantity measured
    in different people on a different scanner, against the HCP 7T release -- which is a protocol for
    separating estimation error from individual variation.  a protocol is not a measurement and constrains
    nothing.
- name: bold_retinotopy
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.25
  constrains: []
  notes: 'context, and the reason is that THE BYTES ARE NOT HERE.  CHECKED 2026-09-05: the held tree under
    this root contains CHANGES, dataset_description.json, participants.tsv/json, README and a `derivatives/`
    directory and NOTHING ELSE -- there are no sub-* directories and no raw functional volumes at all,
    1.4 GiB in total.  what is held is the pRF fits, the ROIs, the Bayesian maps and the stimulus apertures,
    i.e. the outputs, not the BOLD they were computed from.  same decision as ds004024''s `fmri` and `dwi`
    entries: the stream is kept so the absence is visible in the stream list and not only in `absent`,
    and it constrains nothing because there is nothing here to constrain with.'
- name: t1w
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context, and the reason is that THE BYTES ARE NOT HERE.  no anatomical volumes are held under
    this root either; only derivatives.  same decision as ds004024''s `fmri` and `dwi` entries: the stream
    is kept so the absence is visible in the stream list and not only in `absent`, and it constrains nothing
    because there is nothing here to constrain with.'
- name: freesurfer_surfaces
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context, and the reason is that THE BYTES ARE NOT HERE.  the surfaces the pRF parameters are
    written on are referenced by the derivatives but the subject reconstructions themselves are not in
    the held tree.  same decision as ds004024''s `fmri` and `dwi` entries: the stream is kept so the absence
    is visible in the stream list and not only in `absent`, and it constrains nothing because there is
    nothing here to constrain with.'
- name: fmriprep_derivatives
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context.  this is a PIPELINE OUTPUT, not a measurement: it is what one algorithm returned when
    it was run on the bytes above.  ARCHITECTURE.md''s rule that a derived quantity carries its algorithm
    forever applies -- binding it as measured would let one reconstruction contribute a likelihood about
    tissue, which is the same argument that makes a tractogram context.'
- name: vistasoft_prf_parameters
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context.  this is a PIPELINE OUTPUT, not a measurement: it is what one algorithm returned when
    it was run on the bytes above.  ARCHITECTURE.md''s rule that a derived quantity carries its algorithm
    forever applies -- binding it as measured would let one reconstruction contribute a likelihood about
    tissue, which is the same argument that makes a tractogram context.  and specifically a SECOND pRF
    solution over the same acquisition, held beside the Bayesian one so that two pipelines'' disagreement
    is visible rather than hidden behind whichever ran last.'
- name: visual_area_rois
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: context.  V1/V2/V3/hV4 boundaries drawn on a surface are a COVER -- which vertices a name collects
    -- and they were drawn by hand from the pRF fits above, so they inherit that fit's algorithm.  no
    registered component is an area label.
- name: bayesian_inferred_maps
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context.  this is a PIPELINE OUTPUT, not a measurement: it is what one algorithm returned when
    it was run on the bytes above.  ARCHITECTURE.md''s rule that a derived quantity carries its algorithm
    forever applies -- binding it as measured would let one reconstruction contribute a likelihood about
    tissue, which is the same argument that makes a tractogram context.  a Bayesian retinotopic map combines
    the measured fits with an atlas PRIOR, so it is further from the data than the vistasoft solution
    rather than closer to it, and the prior''s contribution is not separable in the shipped product.'
- name: stimulus_apertures
  kind: imposed
  via:
  - transduction
  band_hz:
  - 0.0
  - 1.0
  constrains:
  - device.display_luminance
  notes: 'imposed, and it is the one stream here that is genuinely a clamped physical variable: the rotating-wedge
    and expanding-ring apertures ARE what the display showed, and they are shipped, so the forward stimulus
    timeline is recoverable rather than inferred.  the band is the analysis sampling of the aperture sequence
    and NOT the monitor''s frame rate: what is held is one binary mask per volume, so nothing faster than
    the volume clock is recorded here even though the display ran far faster.'
  frame: visual_field_polar
absent:
- bold
- t1w
- freesurfer_reconstruction
- raw_acquisition
requires:
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
- geometry: retinal-world-geometry
  severity: blocking
  without_it: The stimulus was presented on a screen at a particular size and distance, and the participant
    saw a gaze-dependent projection of it rather than the frames themselves. Without the display geometry
    there is no visual-angle axis here at all, so the stimulus stream cannot enter a retinotopically addressed
    path.
use:
- calibrate
- fit
forbidden:
- ds003787/* -> measured cortical state (only fitted parameters are held, not the BOLD)
- ds003787/population_receptive_field_estimates -> a likelihood about cortical state (a pRF parameter
  is an inverse solution and enters only through an observation model)
- ds003787/bayesian_inferred_maps -> independent evidence from ds003787/vistasoft_prf_parameters (same
  acquisition, and the Bayesian map adds an atlas prior on top of it)
split:
  group_by:
  - participant
  - session
provenance:
  imported_from: win-registry
  card: ds003787
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
