streams:
- name: population_receptive_field_estimates
  kind: measured
  via: null
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY: the vascular stage is a modelled state,
    not a nuisance to be regressed away. The pRF parameters are then obtained by FITTING a receptive-field
    model to the response of each vertex against the known stimulus aperture sequence. THE PARAMETERS
    ARE MODEL OUTPUTS: a pRF size is a property of the fitted model, and it absorbs BOLD spatial blur,
    vascular point spread and eye movement along with any neural receptive-field extent'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving a global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  - eye movements enlarge and displace the estimated pRF and are not recorded in this release
  - the vascular point-spread function sets a floor on estimable pRF size that is not neural
  - the pRF model form (Gaussian, difference-of-Gaussians, compressive nonlinearity) changes the estimates
    and is a choice
  - attention shifts the pRF centre, a well-documented effect, and attention is not controlled here
  systematic_bias: 44 participants with per-vertex pRF parameters on their own surfaces is the population
    sample that a PROBABILISTIC retinal-to-cortical mapping needs. A single atlas label lookup is what
    this replaces.
  band_hz:
  - null
  - null
  temporal_support: TR-sampled BOLD during rotating-wedge and expanding-ring stimulus sweeps; the stimulus
    apertures are shipped, so the forward stimulus timeline is recoverable
  spatial_support: 3T whole-brain EPI analysed on the SUBJECT'S OWN SURFACE (fsnative) as well as fsaverage,
    with pRF parameters estimated per vertex and V1/V2/V3/hV4 ROIs drawn on those surfaces. The retinotopic
    map is a coordinate system in the VISUAL FIELD attached to cortical locations -- which is the mapping
    obj-retinotopic-mapping needs, and it is estimated, never measured
- name: cross_dataset_reproducibility
  kind: measured
  via: null
  systematic_bias: The dataset exists to be compared against the HCP 7T retinotopy release. Two independent
    measurements of the same quantity in different people on different scanners is the only way to separate
    estimation error from individual variation, and it is exactly the overlap-reconciliation case.
