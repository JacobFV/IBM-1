id: mr-arfi-displacement-data
title: MR-ARFI and focal displacement measurements
provider: multiple -- MR acoustic radiation force imaging studies
citation: "PROMPT.md \xA752.13, 'MR-ARFI and focal-displacement data'."
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: "Unresolved. \xA749.2 records that the predecessor's attribution generator tracked each source's\
    \ known bias and licence rather than treating atlas availability as correctness; that practice is\
    \ preserved by leaving this unresolved and counting it."
binding: unbound
population:
  n: null
frames:
- scanner
- subject_native
- transducer_frame
streams:
- name: in_situ_focal_localisation
  kind: measured
  via: null
  systematic_bias: "THE ONLY IN-VIVO MEASUREMENT OF WHERE A TRANSCRANIAL ULTRASOUND FOCUS ACTUALLY LANDS.\
    \ Everything else in the tFUS section computes it. \xA752.13's demand that delivered field be distinguished\
    \ from requested settings has, in MR-ARFI, its one available answer -- and the answer is a position,\
    \ not a pressure."
  notes: displacement is proportional to radiation force, which depends on intensity AND on local tissue
    stiffness and absorption; converting displacement to pressure requires assumptions that make it a
    good localiser and a poor dosimeter
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: micron-scale tissue displacement produced by the acoustic radiation force at the ultrasound
    focus, imaged by a motion-encoded MR sequence -- an IN-VIVO, IN-SITU localisation of where the beam
    actually went
- name: simulation_validation
  kind: measured
  via: null
  systematic_bias: "published comparisons between MR-ARFI-measured and simulated focal positions are the\
    \ empirical error bar on skull-aberration correction, and \xA746 requires exactly that kind of control"
  band_hz:
  - null
  - null
absent:
- pressure_quantification
- public_datasets
- low_intensity_applicability
requires:
- geometry: device-geometry
  for_streams:
  - in_situ_focal_localisation
  severity: blocking
  without_it: The acoustic focus is a millimetre-scale volume whose position depends on transducer element
    geometry, the drive phase and amplitude mapping, and the pose of the transducer against the skull.
    Without the device product the target is a nominal coordinate and the intended and delivered foci
    are not distinguishable.
use:
- calibrate
- evaluate
forbidden:
- mr-arfi-displacement-data/* -> pressure or dose claims without a displacement-to-pressure model
- mr-arfi-displacement-data/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
provenance:
  imported_from: win-registry
  card: mr-arfi-displacement-data
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
origin_kind: class
provenance_note: a CLASS of resource rather than one dataset; the provider field names a literature or
  model family. a single origin url would be a fiction
provenance_traced_from: a peer programme's card for the same corpus, which read the origin off the held
  dataset_description. the ORIGIN is recorded here; the peer is not cited, because a courier is not a
  source
