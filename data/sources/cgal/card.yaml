streams:
- name: exact_geometric_predicates
  kind: measured
  via: null
  systematic_bias: §11's support-overlap operators and §56.1's overlap operators between every admitted
    cover are BOOLEAN AND INTERSECTION operations on geometry, and floating-point predicates fail on degenerate
    configurations in ways that produce invalid results rather than inaccurate ones. Exact predicates
    are the difference between an overlap operator that works and one that occasionally produces a non-manifold
    output.
  notes: exactness costs performance, and the exact/filtered kernel choice is a real trade
  band_hz:
  - null
  - null
  temporal_support: static
  spatial_support: 'computational geometry with EXACT PREDICATES: orientation and intersection tests that
    are provably correct rather than floating-point approximate, which is what prevents the topological
    failures that break mesh algorithms'
- name: 3d_mesh_generation_from_images
  kind: measured
  via: null
  systematic_bias: CGAL's image-to-mesh pipeline produces multi-domain meshes directly from labelled volumes,
    which is the head-model construction path
  band_hz:
  - null
  - null
