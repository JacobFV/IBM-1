# ibm-1 source card. schema: data/schema/source.schema.json
id: destrieux2010
title: Destrieux sulco-gyral cortical parcellation
provider: Martinos Center / FreeSurfer
citation: Destrieux et al., Automatic parcellation of human cortical gyri and sulci using standard anatomical
  nomenclature. NeuroImage 2010.
urls:
- https://surfer.nmr.mgh.harvard.edu/
access: held
licence:
  name: FreeSurfer Software License
  redistribution: unresolved
  commercial: permitted
  notes: 'Unresolved. §49.2 records that the predecessor''s attribution generator tracked each source''s
    known bias and licence rather than treating atlas availability as correctness; that practice is preserved
    by leaving this unresolved and counting it. LICENCE LINEAGE, NOT A LOOKUP: this reached us inside
    a FreeSurfer subject directory (bundled in turn by an MNE sample dataset or a nilearn cache), so the
    terms under which WE received it are the FreeSurfer Software License. READ, not recalled -- the licence
    text was fetched: it PERMITS COMMERCIAL USE (''any commercialization of the Software is at the sole
    risk of the party ... engaged in such commercialization''), requires that the licence terms and all
    attributions and copyright notices be preserved in any copy, and EXPLICITLY DISCLAIMS COPYLEFT --
    contributors warrant their code ''does not contain any code that requires or prescribes an open source
    license for derivative works''. No registration or DUA is mentioned; accepting the licence is the
    only condition of download. This was very nearly recorded as commercial_use prohibited from memory,
    which would have WRONGLY BLOCKED a legitimate release. Residual question this does NOT settle: the
    atlas itself originates outside the FreeSurfer project and its authors'' own terms may be broader
    or narrower. That matters only for a copy obtained from the originating project; the copy we hold
    came through FreeSurfer and carries FreeSurfer''s terms.'
binding: bound
population:
  n: null
frames:
- fsaverage
- subject_native_surface
streams:
- name: sulcogyral_labels
  kind: context
  via: null
  systematic_bias: separating sulcal fundus from gyral crown is genuinely useful because cortical thickness,
    curvature and vascular supply all differ systematically between them -- which matters for §16's vascular
    geometry and for the EEG forward model's dipole orientations, since sulcal and gyral dipoles point
    in different directions
  band_hz:
  - 0.0
  - 0.001
  temporal_support: not a time series -- this is static anatomy
  spatial_support: 74 regions per hemisphere separating sulcal from gyral cortex on individual FreeSurfer
    surfaces
  constrains: []
  notes: 'context, and it is a decision rather than a gap.  a parcellation, an annotation or a label set
    is a COVER over a carrier (ARCHITECTURE.md §2): it says which points a name collects, not what value
    any ibm component takes at them.  no registered component is a region label, and inventing one would
    make a naming convention into biology.  it reaches a materialization as a support index and as a `prior`,
    never as a likelihood.  separating sulcal fundus from gyral crown matters for dipole orientation and
    for vascular supply, but what is shipped is still a label per vertex.'
absent:
- areal_correspondence
- individual_uncertainty
requires:
- geometry: cortical-support-bank
  severity: blocking
  without_it: A parcellation or a surface map is a COVER, not an element of the brain's ontology. Without
    the support bank there is nothing for these labels to be a cover OVER, and using them as if they were
    the supports themselves is precisely the canonical-parcellation commitment the architecture refuses.
use:
- calibrate
- prior
forbidden:
- destrieux2010/sulcogyral_labels -> areal or functional claims
- destrieux2010/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
provenance:
  imported_from: win-registry
  card: destrieux2010
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
