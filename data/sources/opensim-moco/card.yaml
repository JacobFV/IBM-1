streams:
- name: optimal_control_solutions
  kind: measured
  via: null
  systematic_bias: THE ANSWER IS A FUNCTION OF THE COST FUNCTION. Moco produces the muscle excitations
    that are optimal under a chosen objective -- minimum effort, minimum fatigue, minimum jerk -- and
    different objectives give different answers for the same movement. That makes it a HYPOTHESIS GENERATOR
    about motor control, not a measurement of it, and it is directly useful as an equal-capacity alternative
    in §46's sense.
  notes: whether the nervous system optimises anything, and what, is the open question the method presupposes
    an answer to
  band_hz:
  - null
  - null
  temporal_support: a trajectory over a specified time horizon, discretised by collocation
  spatial_support: 'solves optimal control problems over an OpenSim model: given a goal and a cost, find
    the muscle excitations that produce a movement'
- name: tracking_and_prediction_modes
  kind: measured
  via: null
  systematic_bias: tracking a measured movement and predicting an unmeasured one are different problems;
    success at the first does not imply the second, which is the same teacher-forced-versus-free-rollout
    distinction §53.1 draws for brain models
