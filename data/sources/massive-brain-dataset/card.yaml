  - null
absent:
- population_sample
- functional_mri
- eeg
- meg
- physiology
- licence
- data_doi
requires:
- geometry: tract-path-products
  for_streams:
  - exhaustively_sampled_q_space
  severity: blocking
  without_it: A diffusion volume is a field of orientations attached to no pathway. Until the tract product
    exists there is no engineered claim of the form 'this tract transmits between these two supports',
    so this source can constrain local microstructure but no interaction between supports.
use:
- calibrate
- fit
forbidden:
- massive-brain-dataset/* -> an artifact, until the terms are resolved with the provider
- massive-brain-dataset/* -> the article's CC BY-NC terms recorded as the data's licence
- massive-brain-dataset/* -> any population-level claim
split:
  group_by:
  - session
  notes: 'n=1: sessions are the only grouping level, and a within-session split measures nothing.'
provenance:
  imported_from: win-registry
  card: massive-brain-dataset
  imported_at: '2026-09-04'
