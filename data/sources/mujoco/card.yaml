streams:
- name: contact_rich_dynamics
  kind: measured
  via: null
  systematic_bias: '§52.14 names MuJoCo for CONTACT-RICH ARTICULATED DYNAMICS and SYSTEM-IDENTIFICATION
    FIXTURES. Its contact model is a SOFT-CONSTRAINT APPROXIMATION chosen for numerical tractability,
    not a model of real contact mechanics -- friction and impact are regularised in ways that make the
    simulation stable and physically approximate. §1''s rule holds: it is an offline oracle, not a runtime
    dependency.'
  notes: the contact solver's regularisation parameters change the dynamics; a policy or model fitted
    in MuJoCo inherits them
  band_hz:
  - null
  - null
  temporal_support: fixed simulation timestep; the integrator's step is a NUMERICAL parameter, not a physical
    clock
  spatial_support: rigid-body dynamics with a soft-constraint contact model over an articulated skeleton;
    the spatial support is the body's link geometry and its contact surfaces
- name: system_identification_fixtures
  kind: measured
  via: null
  systematic_bias: a simulator with known ground-truth parameters is a fixture on which a system-identification
    method can be shown to recover them -- a control that can actually fail
  band_hz:
  - null
  - null
