streams:
- name: phantom_scans
  kind: measured
  via: null
  systematic_bias: The ADNI geometric phantom is a genuine gradient-nonlinearity and scaling calibration
    object across many scanners -- arguably the most reusable single stream in ADNI for B-WIN's MR acquisition
    objects (§52.12).
  band_hz:
  - null
  - null
  temporal_support: longitudinal over years; PET on its own dynamic frame timeline
  spatial_support: 1 mm MPRAGE; phase-specific diffusion and perfusion; the ADNI geometric phantom is
    scanned alongside participants
- name: pet_fdg
  kind: measured
  via: null
  observation_chain: glucose transport and hexokinase phosphorylation -> 18F-FDG trapping -> positron
    emission and annihilation -> coincidence detection -> attenuation and scatter correction -> reconstruction
    -> activity concentration -> kinetic model of the metabolic rate
  confounds:
  - atrophy-driven partial volume
  - reference-region choice
  - tracer batch and uptake period
  band_hz:
  - null
  - null
- name: t1w
  kind: measured
  via: null
  observation_chain: tissue proton density and T1 -> sequence-specific contrast -> k-space acquisition
    -> reconstruction -> voxel intensity; intensity is not a tissue parameter until an explicit relaxometry
    model is applied
  confounds:
  - B1+ transmit inhomogeneity
  - B0 off-resonance
  - the fitted signal model's own misspecification
  - motion between the volumes that enter one fit
  - scanner and phase differences across ADNI-1/GO/2/3/4
  systematic_bias: protocol drift across phases is large; ADNI is a family of studies
  band_hz:
  - null
  - null
