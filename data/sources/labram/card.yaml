# ibm-1 source card. schema: data/schema/source.schema.json
id: labram
title: LaBraM -- Large Brain Model for EEG
provider: Shanghai Jiao Tong University and collaborators
citation: Jiang et al., Large Brain Model for Learning Generic Representations with Tremendous EEG Data
  in BCI. ICLR 2024.
urls:
- https://github.com/935963004/LaBraM
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Model weights, code and training data commonly carry THREE different licences, and a permissive
    code licence says nothing about the weights. Unresolved.
binding: unbound
population:
  n: null
frames:
- eeg_cap
streams:
- name: neural_tokenisation
  kind: measured
  via: null
  systematic_bias: '§48 and registry/README: TEACHER IS NOT OBSERVATION. This model''s representations
    are a discrepancy-aware forcing CANDIDATE, never automatically a subject likelihood. §29: influence
    starts low and is earned through held-out prediction. §53.2: the test is NOT leaderboard accuracy.
    It is whether a representation survives new montages, devices, subjects, tasks and physically different
    observation supports WITHOUT SILENTLY LEARNING CHANNEL IDENTITY AS ANATOMY. DISCRETISING EEG into
    a learned codebook is a strong commitment: the codebook is fitted to the training corpus''s montages
    and amplitudes, so a physically different observation support produces tokens the model has never
    seen. That is the failure mode §53.2 names, made concrete.'
  notes: a vector-quantised bottleneck discards exactly the amplitude and waveform detail that distinguishes
    one generator from another
  band_hz:
  - null
  - null
  temporal_support: resampled to a fixed rate before tokenisation -- the resampling is a derived view
    and the native rate is discarded
  spatial_support: EEG channel-time patches tokenised by a learned vector-quantised codebook, then modelled
    with masked prediction over tokens
- name: multi_dataset_pretraining
  kind: measured
  via: null
  systematic_bias: pretraining on many datasets improves benchmark numbers; whether it improves PHYSICAL
    generality is the separate and harder question
  band_hz:
  - null
  - null
absent:
- electrode_geometry
- forward_model
- native_sampling_rate
- uncertainty
requires:
- geometry: device-geometry
  severity: degrading
  without_it: This model's channel axis is a set of names, not a set of positions -- the channel-identity
    problem exactly. Its representation can be computed without any geometry, but relating it to a cortical
    support, or transferring it to a montage it was not trained on, requires the electrode or sensor geometry
    that the name stands in for.
  substitute: Channel-name matching, which silently asserts that two electrodes sharing a label sat in
    the same place on two different heads.
use:
- distil
- evaluate
forbidden:
- labram/* -> observation-role likelihoods
- labram/* -> B-WIN's state ontology or support definitions
split:
  group_by:
  - participant
  - stimulus
provenance:
  imported_from: win-registry
  card: labram
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
distillation:
  reported_accuracy:
    metric: auc
    value: 0.9022
    on_benchmark: TUAB (Temple University Hospital Abnormal EEG Corpus), binary abnormal-vs-normal detection;
      LaBraM-Base, 5.8M parameters
    on_streams:
    - neural_tokenisation
    - multi_dataset_pretraining
    source: 'Jiang et al., ''Large Brain Model for Learning Generic Representations with Tremendous EEG Data in
      BCI'', ICLR 2024 (arXiv:2405.18765), Table 1 ''The results of different methods on TUAB'', row LaBraM-Base:
      AUROC 0.9022 +/- 0.0009, Balanced Accuracy 0.8140 +/- 0.0019, AUC-PR 0.8965 +/- 0.0016. Read from https://ar5iv.labs.arxiv.org/html/2405.18765
      and re-fetched independently. The same row is reproduced as Table 9 of the EEGPT NeurIPS 2024 proceedings
      paper, which is a second party printing the same figure. LaBraM-Large (46M) and LaBraM-Huge (369M) reach
      0.9127 and 0.9162; the Base row is recorded because it is the released checkpoint most likely to be the
      teacher actually run.'
    verified: true
  precision_model:
    form: residual_variance
    ood_inflation_prior: 'lognormal on the variance inflation factor, median 2x, spread 3x, provenance WEAK. the
      figure above was measured on TUAB, a Temple University Hospital clinical corpus; the distribution this teacher
      would be used over is not that one, and how much worse it gets there is itself unknown, so this is a prior
      and not a constant. NOTE FOR READERS: TeacherPrecision.from_card currently reads ANY non-empty string in
      this field as exactly lognormal(median 2, spread 3, WEAK) -- the prose is not parsed. that coercion is deliberate
      and conservative, but it means this text documents intent rather than driving arithmetic.'
    error_rank: 1
    notes: 'METRIC-TO-r2 CONVERSION, written out because an AUROC is not an r2 and coercing one into the other
      is the exact error this block exists to prevent. put a gaussian latent decision variable behind the benchmark''s
      binary label with equal variances under both classes. then auc = Phi(d''/sqrt2) gives d'' = 1.8303, and
      the squared point-biserial correlation between that latent variable and a balanced binary label is r2 =
      d''^2/(d''^2+4) = 0.4558. CROSS-CHECK: the same table''s balanced accuracy 0.8140 through bac = Phi(d''/2)
      gives d'' = 1.7855 and r2 = 0.4435, differing by 0.0123. two independent readings of the same row agreeing
      to that tolerance is the only available evidence that the latent-gaussian model behind the conversion is
      not badly wrong. ibm.runtime.fuse.variance_explained performs it; the card stores the published figure and
      never the derived r2, so the derivation stays auditable. WHAT r2 = 0.4558 IS NOT: it is the fraction of
      the variance of the BENCHMARK''S LATENT LABEL that this teacher explains. ''is this whole EEG recording
      abnormal'' is a coarse summary of a whole recording; what a teacher is asked to infill here is a field value
      on a support. the teacher explains at most this much of the label and an unknown, strictly smaller fraction
      of any state variable, so 0.4558 is an UPPER BOUND and the precision it implies is an over-estimate. the
      ood_inflation prior is what carries that gap and it is deliberately weak for that reason. correlated_fraction
      and error_rank are NOT reported by this paper, and no paper in this set reports either -- the quantity has
      no place in a benchmark table. so what is declared here is a prior with a stated basis, which is the correct
      answer, and not a point estimate, which would be a fabricated one. BASIS: the schema''s own instruction
      is that an unmeasured sharing fraction must be treated as high rather than as zero, and 0.8 is the value
      ibm.runtime.fuse.TeacherPrecision defaults to, so 0.8 is what is declared. TWO WARNINGS attach to it. (1)
      it is very likely too high for this model class: BENDR is the one teacher in data/sources whose weights
      are held, and measuring its induced error directly (scripts/measure_bendr_error_correlation.py) gives 0.03
      to 0.07, an order of magnitude below this. (2) THERE IS NO SAFE DIRECTION TO ROUND IN. raising rho is conservative
      only about structure the values share -- a global gain, a cortex-wide offset -- where the effective constraint
      count falls toward 1/rho. it is ANTI-conservative about differences between values, because splitting the
      residual leaves a smaller independent part and the conditional precision rises as 1/(1-rho); part 2 of scripts/verify_distillation_precision.py
      prints both columns. this number therefore has to be measured before this teacher writes anything that matters,
      not defaulted. error_rank is 1, and deliberately so. rank 1 is the minimum honest value -- a teacher has
      at least a global bias -- and it is also the ONLY rank at which correlated_fraction means what this schema
      says it means. ibm.runtime.fuse._shared_error_basis builds q discrete cosine modes normalised by row, so
      above rank 1 the implied correlation between two residuals decays with their separation and is identically
      zero between the first and last index: that models a correlation LENGTH, not a fraction shared across everything
      the teacher writes. the consequence is large and runs against intuition -- at rho 0.9 over 10^4 values the
      effective constraint count is 1.1 at rank 1 and 889 at rank 4 -- so a card declaring a higher rank would
      be quietly handing this teacher hundreds of times more influence. see the rank caveat table in scripts/verify_distillation_precision.py.
      DERIVED FIGURE: effective_constraints below is n / ((1 - rho) + n rho) with rho = 0.8 and n = 10000 (ARCHITECTURE.md''s
      reference figure of 10^4 values) = 1.25. It is derived, not declared: change rho or the rank and it changes.
      Reproduce it with ibm.runtime.fuse.Evidence.effective_constraints, or with part 2 of scripts/verify_distillation_precision.py,
      which checks the closed form against a dense matrix inverse.'
    correlated_fraction: 0.8
    effective_constraints: 1.25
