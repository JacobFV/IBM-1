citation: 'Glick, Gajawelli, Sun, Badami, Saggar, Etkin. Concurrent single-pulse (sp) TMS/fMRI to reveal
  the causal connectome in healthy and patient populations. bioRxiv 2024, doi:10.1101/2024.09.25.614833.
  Dataset doi:10.18112/openneuro.ds005498.v2.0.0. Ethics: Stanford IRB-31244.'
