streams:
- name: concurrent_tms_bold
  kind: measured
  via: null
  observation_chain: coil current -> induced electric field (computed, not measured, and here not computed
    at all) -> cortical activation at and downstream of the target -> neurovascular coupling -> BOLD change
    -> EPI volume. The remote BOLD response to a local pulse is the closest thing to a causal, directed,
    whole-brain measurement that exists non-invasively in humans
  confounds:
  - the coil and its leads distort B0 and the RF field, producing signal dropout that is co-localised
    with the target -- the artefact is exactly where the effect should be
  - the click and scalp sensation drive auditory and somatosensory cortex on every pulse
  - the muscle twitch, where present, drives somatosensory and motor cortex
  - head motion time-locked to the pulse
  - vascular reactivity differences between participants change the BOLD amplitude without changing the
    neural response
  systematic_bias: 152 participants with concurrent TMS/fMRI is a large perturbational corpus by any standard,
    and the causal direction it supplies is what obj-structural-effective-functional needs to separate
    effective from functional connectivity rather than assuming the separation.
  notes: no sham arm and no auditory-masking arm, so the transcranial and peripheral routes are not separable
    within the dataset
  band_hz:
  - null
  - null
  temporal_support: TR-sampled BOLD interleaved with TMS pulses. The pulse-to-volume timing is the critical
    clock and it exists ONLY in a single root-level task-stim_events.tsv shared across every subject,
    not per run
  spatial_support: whole-brain EPI with the TMS coil inside the bore; the stimulation TARGET is encoded
    as a coordinate triple inside the task label string (task-stim46x26x38), which is the only record
    of where the coil was pointed
