# ibm-1 source card. schema: data/schema/source.schema.json
id: nki-rockland
title: NKI-Rockland Sample (enhanced)
provider: Nathan Kline Institute / INDI
citation: 'Nooner et al., The NKI-Rockland Sample: a model for accelerating the pace of discovery science
  in psychiatry. Frontiers in Neuroscience 2012.'
urls:
- http://fcon_1000.projects.nitrc.org/indi/enhanced/
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: Data usage agreement; phenotypic data access is tiered.
binding: bound
population:
  n: 1000
  hierarchy:
  - participant
  - session
  notes: Parent cohort of NM000254/NATVIEW, which is carded separately.
frames:
- scanner
- subject_native
- fsaverage
- MNI152
streams:
- name: bold_rest_multi_tr
  kind: measured
  via:
  - em_generation
  observation_chain: 'neural activity -> neurovascular coupling -> coupled CBF/CBV/CMRO2 change -> deoxyhaemoglobin
    concentration change -> T2*/T2'' change -> gradient-echo k-space acquisition -> reconstruction ->
    voxel intensity time course. BOLD IS NOT NEURAL ACTIVITY (PROMPT.md §17): the vascular stage is a
    modelled state, not a nuisance to be regressed away'
  confounds:
  - head motion and its spin-history effects
  - respiratory and cardiac aliasing into the TR
  - arterial CO2 fluctuation driving global vascular signal independent of neural activity
  - draining-vein displacement of the signal downstream of the active tissue
  - susceptibility dropout and geometric distortion
  - scanner drift
  systematic_bias: The multi-TR design is a direct handle on what sampling rate destroys -- relevant to
    §33's native-clock argument and to obj-clock-graph.
  band_hz:
  - 0.0
  - 0.5
  temporal_support: multiple BOLD protocols with TR 0.645 s, 1.4 s and 2.5 s in the same participants
    -- a genuinely useful sampling-rate manipulation
  spatial_support: 1 mm structural; multiband BOLD at several TRs; 64-direction diffusion
  constrains:
  - electromagnetic.bfield
  notes: 'THE STREAM THAT MAKES THIS CARD WORTH HOLDING: multiple BOLD protocols at TR 0.645 s, 1.4 s
    and 2.5 s IN THE SAME PARTICIPANTS, which is a designed sampling-rate manipulation and a direct handle
    on what a sampling rate destroys.  the ceiling is 0.5 Hz -- the fastest protocol''s nyquist is 0.775
    Hz but that is where `bold_formation` stops writing and where the haemodynamic response has anything
    left -- and the SLOWEST protocol reaches only 0.2 Hz, so a fit must carry the per-protocol band rather
    than this envelope.  BOLD IS NOT NEURAL ACTIVITY, and the four-step chain is what says so: neurovascular
    coupling, then flow, then tissue exchange, then the susceptibility change deoxyhaemoglobin makes --
    which is why the component is `electromagnetic.bfield` and not a neural one.  the vascular stages
    are modelled state, not nuisance to be regressed away.  em_generation is what produces the magnetic
    field from source currents; the previous chain named vascular_flow, which is unrelated.'
  frame: scanner
- name: dwi
  kind: measured
  via:
    structural.fiber_orientation:
    - tract_propagation
    structural.axonal_density: &id001
    - plasticity
    structural.myelination: *id001
  observation_chain: water displacement over the diffusion time within and around axons and cells -> gradient-direction-dependent
    signal attenuation -> reconstructed q-space or orientation distribution; ORIENTATION EVIDENCE, not
    an observation of a tract
  confounds:
  - eddy-current and susceptibility distortion
  - motion between diffusion directions
  - partial volume of crossing fibres, which no single-tensor model represents
  - the fitting model itself (DTI vs. CSD vs. NODDI) is a choice with its own bias
  band_hz:
  - 0.0
  - 0.001
  constrains:
  - structural.fiber_orientation
  - structural.axonal_density
  - structural.myelination
  notes: '64 directions.  ORIENTATION EVIDENCE, and the distinction is the whole binding.  what a diffusion
    volume measures is direction-dependent attenuation of water displacement, which constrains LOCAL microstructure
    -- fibre orientation, axonal density, myelination -- and does NOT observe a tract: a tractogram is
    a reconstruction laid over this field and is context wherever it appears in this corpus.  static band
    because microstructure is a tissue parameter.  the via chain follows the corpus convention set by
    tractoinferno, ds000117 and aomic-id1000: `plasticity` is named because it is the process that writes
    the structural field, though its declared outputs cover density and myelination and NOT `structural.fiber_orientation`,
    which no registered process writes.  per-component chains: this acquisition makes more than one claim
    and the routes differ.  one chain for all of them would let the component whose route is wrong borrow
    the route of the ones that are right.'
  frame: subject_native
- name: lifespan_age
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: context.  a phenotype, a demographic field, a questionnaire score or a genotype is a property
    of a PERSON rather than a value of any state variable at any time.  the registry has no component
    for any of them and should not acquire one; they belong in `split` and in covariates, not in a likelihood.  age
    is the design axis of this sample and it is a property of a person, not a state; it belongs in `split`
    and in covariates.
- name: t1w
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context: geometry.  the anatomical volume the supports are indexed over.  as ds004024''s card
    records, a T1 would genuinely bind to `material.conductivity` and `material.mass_density` once a head
    model exists to put the values into -- but a material value asserted for a conductor nobody can address
    is not evidence, so it stays context until the support bank exists.  1 mm.'
- name: bold_rest
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: 'context, and a DUPLICATE carried over from the migration: it describes the same bytes as `bold_rest_multi_tr`,
    which is where the likelihood is written.  kept so the card still describes the archive it came from,
    bound to nothing so one measurement is not counted twice.'
- name: bold_task
  kind: measured
  via:
  - em_generation
  band_hz:
  - 0.0
  - 0.5
  constrains:
  - electromagnetic.bfield
  notes: 'separate runs from the resting protocols, so both are measured rather than one counting the
    other twice.  same per-protocol band caveat as `bold_rest_multi_tr`.  BOLD IS NOT NEURAL ACTIVITY,
    and the four-step chain is what says so: neurovascular coupling, then flow, then tissue exchange,
    then the susceptibility change deoxyhaemoglobin makes -- which is why the component is `electromagnetic.bfield`
    and not a neural one.  the vascular stages are modelled state, not nuisance to be regressed away.  em_generation
    is what produces the magnetic field from source currents; the previous chain named vascular_flow,
    which is unrelated.'
  frame: scanner
- name: asl_perfusion
  kind: measured
  via:
  - neurovascular_coupling
  - vascular_flow
  band_hz:
  - 0.0
  - 0.02
  constrains:
  - blood.flow
  notes: 'arterial spin labelling measures cerebral blood flow directly rather than through a susceptibility
    contrast, which is why it binds `blood.flow` and not `electromagnetic.bfield`.  the band follows ds004873''s
    CBF stream: a perfusion estimate is a label-control difference averaged over many pairs, so it carries
    a slow effective sampling rate, not the volume clock.'
- name: physiology
  kind: measured
  via:
    blood.volume:
    - vascular_flow
    blood.oxygenation:
    - tissue_exchange
  band_hz:
  - 0.0
  - 0.5
  constrains:
  - blood.volume
  - blood.oxygenation
  notes: 'concurrent cardiac and respiratory recording.  the PULSE trace is what is bound, to the systemic
    blood volume and oxygenation it constrains, capped at the 0.5 Hz where those components are declared
    meaningful -- the aomic-id1000 binding for the same sensor.  the respiratory channel rides in the
    same file and is not separately bound, because one stream cannot name two chains.  per-component chains:
    this acquisition makes more than one claim and the routes differ.  one chain for all of them would
    let the component whose route is wrong borrow the route of the ones that are right.'
- name: phenotyping
  kind: context
  via: null
  band_hz:
  - 0.0
  - 0.001
  constrains: []
  notes: context.  a phenotype, a demographic field, a questionnaire score or a genotype is a property
    of a PERSON rather than a value of any state variable at any time.  the registry has no component
    for any of them and should not acquire one; they belong in `split` and in covariates, not in a likelihood.  the
    deep phenotyping is the second reason this sample exists and it is entirely person-level.
absent:
- meg
- ieeg
- pet
- angiography
- intervention
requires:
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
    Until the support bank exists there is no oriented, laminar support with an extent for the constraint
    to attach to, and the evidence can only be held in whatever grid or parcellation the provider happened
    to ship.
- geometry: tract-path-products
  for_streams: []
  severity: degrading
  without_it: 'A diffusion volume is a field of orientations attached to no pathway. Re-graded to degrading
    and unscoped 2026-09-05 on the entry''s own logic, which already said the source ''can constrain local
    microstructure but no interaction between supports'': local microstructure is exactly what the `dwi`
    stream binds -- `structural.fiber_orientation`, `structural.axonal_density` and `structural.myelination`
    -- so the missing product does not stand between that stream and its components. What it blocks is
    any claim of the form ''this tract transmits between these two supports'', and no stream in this card
    makes one. This is the same reading ds000117, tractoinferno and aomic-id1000 already carry.'
- geometry: vascular-products
  severity: degrading
  without_it: A perfusion or reactivity map is a voxel field with no vessel attached. It can be used as
    a voxel-wise measurement, but attributing it to a supplying artery, a draining vein or a microvascular
    compartment -- which is what makes it evidence about the vascular state rather than about the image
    -- requires the vascular product.
  substitute: Voxel-wise use with no vessel attribution, which cannot separate an arterial transit effect
    from a tissue perfusion change.
use:
- fit
- prior
forbidden:
- nki-rockland/dwi -> a measured connection (orientation evidence is not a tract)
- nki-rockland/bold_rest_multi_tr -> a single band for all three protocols (TR 0.645, 1.4 and 2.5 s reach
  0.5, 0.36 and 0.2 Hz respectively; the per-protocol band must travel with a run)
- nki-rockland/asl_perfusion -> independent evidence from the BOLD streams about the same haemodynamic
  episode when the two were acquired in one session
split:
  group_by:
  - participant
  - session
provenance:
  imported_from: win-registry
  card: nki-rockland
  imported_at: '2026-09-04'
  index: data/index/win/cards.jsonl
