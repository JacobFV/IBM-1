streams:
- name: controlled_event_vocabulary
  kind: measured
  via: null
  systematic_bias: CROSS-DATASET COMPARISON OF EVENTS IS OTHERWISE IMPOSSIBLE. One dataset's 'stimulus_onset'
    and another's 'trial_start' may or may not be the same thing, and no amount of loading code can tell.
    HED makes the question answerable, which is what §52.5's instruction to discover datasets by EVENT
    SEMANTICS rather than by sample count actually requires.
  notes: a controlled vocabulary encodes a taxonomy of what kinds of events there are, and that taxonomy
    is a commitment
  band_hz:
  - null
  - null
  temporal_support: attaches to event onsets in the host format's time base
  spatial_support: events annotated with a HIERARCHICAL CONTROLLED VOCABULARY -- a visual stimulus, its
    properties, the participant's response and the experimental role, each tagged from a shared schema
    rather than described in a free-text column
- name: nemar_integration
  kind: measured
  via: null
  systematic_bias: NEMAR exposes HED annotations, which is how the two connect in practice
  band_hz:
  - null
  - null
