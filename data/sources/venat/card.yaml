streams:
- name: venous_probability_atlas
  kind: measured
  via: null
  observation_chain: tissue magnetic susceptibility -> field perturbation -> phase accrual over TE ->
    phase unwrapping, background-field removal and an ill-posed dipole inversion -> susceptibility map.
    The inversion is regularised and its regularisation is a choice
  confounds:
  - QSM contrast for veins depends on DEOXYHAEMOGLOBIN concentration, so a vein's visibility depends on
    its oxygenation -- the measurement is confounded with the physiological state it would be used to
    constrain
  - the dipole inversion is ill-posed and regularised; vessel diameter estimates inherit the regularisation's
    smoothing
  - iron-rich grey matter structures also produce positive susceptibility and are confusable with veins
  - partial volume at sub-voxel calibre inflates apparent diameter
  systematic_bias: 'THE source for venous geometry, and the reason it matters is §17: BOLD signal is displaced
    downstream into draining veins, so the venous tree''s geometry is the spatial transfer function between
    neural activity and where the BOLD signal appears.'
  notes: QSM-derived diameter is a regularised estimate, not a measured lumen
  band_hz:
  - null
  - null
  temporal_support: not a time series
  spatial_support: 7T quantitative susceptibility mapping at sub-millimetre resolution, with vessel location,
    DIAMETER and CURVATURE -- geometric attributes, not only a mask
- name: vessel_diameter_and_curvature
  kind: measured
  via: null
  systematic_bias: 'S56.3 asks for ORIENTED TUBE representations with radius and length, and diameter
    and curvature are exactly those parameters. NOTHING MEASURED IS HELD. This entry previously said they
    were ''supplied as measurement rather than assumption''; the only file held is the partial-volume
    map, and every radius bwin.geometry.venous derives from it is a function of a THRESHOLD somebody chose
    -- measured across four thresholds, the largest vessel''s radius runs 2.91 to 4.85 mm, and laminar
    resistance goes as r^-4, so the two ends disagree by roughly eightfold on any flow either could support.
    Authority lowered from high to medium to match: a reconstructed calibre with a free parameter in it
    is not a measured one.'
  band_hz:
  - null
  - null
- name: venous_bias_prior
  kind: measured
  via: null
  systematic_bias: a population venous atlas is a prior over WHERE BOLD IS DISPLACED, which is directly
    actionable in the observation model rather than only descriptive
