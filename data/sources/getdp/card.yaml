  systematic_bias: 'GENERAL rather than bioelectromagnetics-specific, which is precisely its value: EEG
    forward modelling, tES field computation and magnetostatics are the SAME class of problem with different
    coefficients and boundary conditions, and a declarative solver makes that shared structure explicit
    rather than reimplementing it three times. §15''s requirement to keep distinct magnetic mechanisms
    distinct is easier to satisfy when the formulations are written out rather than hidden.'
  notes: generality costs the domain-specific validation the specialised solvers have
