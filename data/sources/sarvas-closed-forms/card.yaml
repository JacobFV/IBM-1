  systematic_bias: 'Sarvas''s result is exact and carries a physically decisive consequence: IN A SPHERICAL
    CONDUCTOR, A RADIAL DIPOLE PRODUCES NO EXTERNAL MAGNETIC FIELD. MEG is therefore blind to radial sources
    in the spherical approximation, which is not a numerical artifact but a symmetry -- and it is why
    MEG and EEG are complementary rather than redundant (§15). Any MEG forward implementation that does
    not reproduce this is wrong.'
  notes: the real head is not spherical, so radial sources are not exactly silent; the residual is small
    and is a geometry effect
  band_hz:
  - null
  - null
  temporal_support: quasi-static
  spatial_support: 'exact analytic expressions: Sarvas gives the magnetic field of a current dipole in
    a spherical conductor; Heller and van Hulsteyn give the induced field from an external coil in a sphere'
- name: heller_van_hulsteyn_tms_field
  kind: measured
  via: null
  systematic_bias: the exact induced field from a coil over a sphere, and the corresponding result that
    the induced field has NO RADIAL COMPONENT at the sphere's surface. §49.4 records that the predecessor's
    internal analytic TMS solvers already implement this class of solution -- it is the seed §54 says
    to internalise from
