streams:
- name: eeg_64ch
  kind: measured
  via: null
  observation_chain: oriented cortical current-source state -> volume conduction through an individualised
    head model -> electrode contact geometry -> reference -> sampled voltage
  confounds:
  - 'ocular: blink and saccade potentials via the EOG-coupled channel'
  - 'cardiac: ECG contamination and pulse artifact'
  - 'muscle: temporalis and neck EMG'
  - electrode impedance drift and motion
  - line noise
  - the documented 16 Hz instrument contamination -- a named, known nuisance, and it belongs here rather
    than in a preprocessing footnote
  systematic_bias: Montage geometry is population-template unless per-participant digitisation exists;
    a template montage is a CHOICE with uncertainty, never a default (obj-device-geometry).
  notes: head model discrepancy vs. the true individual geometry
  band_hz:
  - null
  - null
  temporal_support: EEG/ECG/EOG at high electrophysiological rates; eye tracker at 500 Hz; video at its
    own frame rate; quizzes as discrete events minutes later.
  spatial_support: '64-channel scalp EEG montage; screen-coordinate gaze; head position. Electrode positions
    per participant: unresolved -- see notes, this gates the observation model.'
- name: gaze
  kind: imposed
  via: null
  systematic_bias: calibration drift within session; screen-coordinate to visual-angle conversion depends
    on display geometry
  band_hz:
  - null
  - null
- name: blinks
  kind: measured
  via: null
  observation_chain: eyelid closure -> (a) retinal input gating and (b) corneo-retinal dipole rotation
    appearing in scalp EEG
  confounds:
  - detector false positives
  - partial blinks below detection threshold
  notes: the SAME physical event participates in two interactions with different roles -- §25's argument
    for an interaction network rather than modality heads, and this stream is the cleanest instance of
    it
  band_hz:
  - null
  - null
- name: ecg
  kind: measured
  via: null
  observation_chain: cardiac electrical activity -> torso volume conduction -> scalp; simultaneously an
    autonomic-brain interaction
  confounds:
  - electrode motion
  - respiration-coupled baseline drift
  band_hz:
  - null
  - null
- name: video_stimulus
  kind: imposed
  via: null
  systematic_bias: the participant sees a gaze-dependent projection of this, not this -- treating the
