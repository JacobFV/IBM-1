  hierarchy:
  - participant
  - session
  - run
  notes: ~110 h of aligned naturalistic data. Attention manipulation (attentive vs. distracted by silent
    serial subtraction), intentional vs. incidental learning, and a monetary-incentive / question-preview
    intervention.
