  systematic_bias: "Clinical populations where the motor system is DAMAGED, which makes them informative\
    \ about what the intact system contributes -- a lesion is an intervention nobody chose -- and simultaneously\
    \ makes them unusable as a healthy prior. \xA752.16's rule that dose, physiology, expression, report\
    \ and behaviour are separate variables applies: a clinical score is a report, not a motor state."
  band_hz:
  - null
  - null
  temporal_support: not a time series -- this is static anatomy
  spatial_support: surface or intramuscular EMG with kinematics in clinical populations -- stroke, spinal
    cord injury, movement disorders -- during rehabilitation tasks
- name: abnormal_muscle_synergies
  kind: measured
  via: null
  systematic_bias: post-stroke synergies constrain what a motor control model must be able to produce
    when parts of the descending pathway are removed
  band_hz:
  - null
  - null
