# ibm-1 source card. schema: data/schema/source.schema.json
id: tms-pulsewise-coil-displacement
title: Pulsewise coil displacement, cortical |E| and MEP (GWDG pcd repository)
provider: Max Planck Institute for Human Cognitive and Brain Sciences, GWDG GitLab project tms-localization/papers/pcd
citation: Numssen, Martin, Williams, Hartwigsen, Knosche. Quantification of subject motion during TMS
  via pulsewise coil displacement, 2023 -- JOURNAL AND DOI ARE PLACEHOLDERS IN THE SOURCE README. The
  underlying E-field and MEP values are from Numssen et al., NeuroImage 2021, doi:10.1016/j.neuroimage.2021.118654.
urls:
- https://gitlab.gwdg.de/tms-localization/papers/pcd
- https://doi.org/10.1016/j.neuroimage.2021.118654
access: watch
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: The GitLab project API returns no licence field and there is no LICENSE blob. Project visibility
    is public; visibility is not a licence. Raw-file and blob URLs redirect to a GWDG login, so only the
    API paths are anonymously readable.
binding: unbound
population:
  n: null
  hierarchy:
  - participant
  notes: The column `sub` identifies participants and the documentation states about 1,000 pulses per
    subject; the participant count is NOT stated in the repository and is left null rather than counted
    from a secondary source.
frames:
- displacement_magnitude_only
streams:
- name: e_field_to_mep_dose_response
  kind: measured
  via: null
  observation_chain: 'coil current -> induced electric field in the head, whose magnitude and direction
    at the cortical target are NOT measured but computed from a head model -> depolarisation of some unknown
    mixture of interneurons and corticospinal cells -> descending volley -> spinal motoneuron pool, whose
    excitability is a separate uncontrolled state -> muscle fibre action potentials -> surface EMG ->
    rectified peak-to-peak amplitude. FOUR DISTINCT THINGS get conflated here: the requested machine setting,
    the delivered physical field, peripheral co-stimulation, and the candidate neural response'
  confounds:
  - spinal motoneuron excitability, which varies over minutes and is never measured
  - background voluntary EMG, which multiplies MEP amplitude and is often only loosely controlled
  - coil-to-scalp distance and scalp/skull thickness, which change the delivered field without changing
    the machine setting
  - 'peripheral co-stimulation: the click, the scalp sensation and the twitch itself are salient sensory
    events with their own evoked responses'
  - the head model used to compute the field is derived geometry with its own error, and its output is
    routinely reported as if measured
  - attention, arousal and time of day
  - coil displacement is confounded with time-in-session, because subjects drift progressively
  systematic_bias: Several thousand per-pulse (|E|, MEP) pairs is a genuinely large dose-response sample,
    and the |E| axis is SIMULATED -- so a model fitted to it is fitted to another model's output, and
    inherits that model's error as if it were measurement noise.
  notes: the E values are reused from the 2021 paper and were not recomputed here
  band_hz:
  - null
  - null
  temporal_support: one row per pulse; no continuous clock
  spatial_support: one cortical target (the FDI muscle representation). The pose information has been
    COLLAPSED to a single displacement magnitude, which discards direction entirely -- the thing gp-tms-hsh
    retains
