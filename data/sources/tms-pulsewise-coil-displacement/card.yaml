requires:
- geometry: device-geometry
  severity: blocking
  without_it: The delivered quantity is an induced electric field throughout the head, set by the coil's
    winding geometry and its pose relative to the anatomy. Without the device product the stimulation
    is recorded as a machine setting rather than as a dose at any cortical location, and the four stages
    of an intervention collapse into one.
- geometry: literature-derived-geometry
  severity: blocking
  without_it: 'The spatial arrangement this source depends on is described in its paper and figures rather
    than distributed with the data: the navigation frame, the target definition or the pose convention
    is not in the repository. It has to be reconstructed from the publication, as a derived product that
    says so, before any number here can be placed.'
use:
- fit
