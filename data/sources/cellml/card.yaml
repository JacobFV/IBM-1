streams:
- name: mandatory_unit_annotation
  kind: measured
  via: null
  systematic_bias: 'CellML makes units MANDATORY and checkable, and makes component interfaces explicit.
    §57 requires native units on every source card for the same reason: a quantity without its units is
    not a measurement, and a model without unit checking will eventually add a millivolt to a millisecond.
    The machinery exists and is worth adopting rather than reinventing.'
  notes: CellML's component model is continuous-dynamics-shaped, like LEMS's, and §32 requires accommodating
    event systems, lookups and discrete algorithms too
  band_hz:
  - null
  - null
  temporal_support: declares dynamics, not a timestep
  spatial_support: hierarchical, unit-annotated mathematical models with explicit component interfaces;
    components connect through declared variable mappings rather than through shared globals
- name: hierarchical_composition
  kind: measured
  via: null
  systematic_bias: explicit interfaces between nested components is the property obj-module-interfaces
    needs and is easy to lose
