  systematic_bias: A UNIFORM INTERFACE OVER NON-UNIFORM OBJECTS. Convenient access to a mouse atlas and
    a human atlas through one API makes it easy to write code that treats them as interchangeable, which
    they are not. §52.7 lists it for cross-species atlas access and that is its correct scope.
  band_hz:
