streams:
- name: meg
  kind: measured
  via:
  - em_generation
  observation_chain: oriented cortical current-source state -> quasi-static magnetic field (primary current
    plus volume-current return) -> pickup-coil geometry, orientation and gradiometer configuration ->
    SQUID flux -> sampled channel
  confounds:
  - environmental magnetic interference and urban noise
  - head motion within and between runs
  - ocular and cardiac fields
  - muscle artifact at high frequency
  - SQUID jumps and sensor drift
  systematic_bias: Authority medium pending verification of the release.
  band_hz:
  - 0.0
  - 200.0
  temporal_support: MEG at kHz sampling; graded stimulus conditions as blocks
  spatial_support: whole-head MEG; details unresolved
  constrains:
  - electromagnetic.bfield
  notes: 'whole-head MEG at kHz sampling; ARRAY DETAILS ARE UNRESOLVED IN THE RECORD and the bytes are
    not held, so the 200 Hz ceiling is the conservative one this corpus uses for MEG rather than a nyquist
    read from a sidecar, and the vendor, channel count and gradiometer configuration must all be read
    from the release before this source is fitted.  `em_generation` alone: a pickup coil has no contact
    interface.  em_generation is what produces the magnetic field from source currents; the previous chain
    named vascular_flow, which is unrelated.'
  frame: meg_device
  units: T
- name: graded_audio_conditions
  kind: imposed
  via:
  - transduction
  systematic_bias: 'A graded acoustic/linguistic ladder is the audio analogue of BBBD''s attention manipulation:
    it varies interaction strength by design (§26), which is what makes a forcing-precision parameter
    identifiable rather than merely fitted'
  band_hz:
  - 20.0
  - 8000.0
  constrains:
  - device.speaker_pressure
  notes: 'imposed, and the reason to hold the card: a GRADED acoustic and linguistic ladder is the audio
    analogue of bbbd''s attention manipulation -- it varies interaction strength BY DESIGN, which is what
    makes a forcing-precision parameter identifiable rather than merely fitted.  clamped on the display
    support.  the ceiling is a conservative speech bandwidth because the stimulus sampling rate is not
    in the record.'
  frame: display
- name: transcripts
  kind: context
  via: null
  band_hz:
  - null
  - null
  constrains: []
  notes: 'context: a written record of the spoken material, which indexes the stimulus rather than being
    it.'
