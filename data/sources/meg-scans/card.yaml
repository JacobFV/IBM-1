requires:
- geometry: device-geometry
  for_streams:
  - meg
  severity: blocking
  without_it: 'The MEG forward model is dominated by sensor pose relative to the head. KEPT BLOCKING,
    and here the reason is stronger than ''the bytes are not held'': the card''s own spatial_support reads
    ''whole-head MEG; details unresolved'', so the ARRAY ITSELF is not identified -- vendor, channel count
    and gradiometer configuration are all unknown, and those determine the lead field before any head
    position does. This is the one MEG card in the corpus where re-grading would be a guess about which
    instrument was used.'
  substitute: None. The instrument is not identified.
- geometry: cortical-support-bank
  severity: blocking
  without_it: This source constrains cortical state, and a cortical state has a fully qualified address.
