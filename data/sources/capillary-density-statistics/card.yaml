id: capillary-density-statistics
title: Statistical capillary-density and vessel-orientation sources
provider: multiple -- stereological and morphometric literature
citation: "PROMPT.md \xA752.10, 'statistical capillary-density and vessel-orientation sources'."
access: priority
licence:
  name: unresolved
  redistribution: unresolved
  commercial: unresolved
  notes: "Unresolved. \xA749.2 records that the predecessor's attribution generator tracked each source's\
    \ known bias and licence rather than treating atlas availability as correctness; that practice is\
    \ preserved by leaving this unresolved and counting it."
binding: unbound
population:
  n: null
frames:
- cortical_layer
- region_label
streams:
- name: published_density_statistics
  kind: measured
  via: null
  systematic_bias: "This is the \xA756.7 case in its purest form: the scientific content is a TABLE OF\
    \ NUMBERS in a paper, with no image and no mesh, and \xA74a's rule that 'the absence of a pre-existing\
    \ 3D asset is an ingestion problem, not a reason to throw away the scientific information' applies\
    \ exactly. Stereological estimates carry real methodological spread between studies and are usually\
    \ quoted without it."
  band_hz:
  - 0.0
  - 0.001
  temporal_support: not a time series -- this is static anatomy
  spatial_support: 'published NUMBERS rather than images: stereological estimates of capillary density,
    intercapillary distance and orientation distributions by cortical layer and region'
  notes: 'NOT HELD, and searched for on 2026-09-05 rather than assumed unavailable.  this card names a
    CLASS of published tables and not an artifact: the stereological literature on human cortical capillary
    density sits behind publisher paywalls and is distributed as prose and figures rather than as data,
    and no open machine-readable table of density by cortical layer was found.  transcribing numbers out
    of a paper into this repository would produce a file that looks like evidence and has no provenance
    anyone can check, which is worse than the gap.

    the gap is partly filled from the other direction.  `microscopy-microvascular-networks` measures exactly
    these quantities -- capillary length density by cortical depth, intercapillary distance, wall surface
    density -- directly from complete reconstructions, and data/sources/microscopy-microvascular-networks/evidence/microvasculature@1/
    holds them with their between-animal spread.  what remains missing is therefore not the QUANTITY but
    the SPECIES, and consequently the one thing this card was supposed to supply and cannot: an independent
    HUMAN number against which the cross-species transfer could be checked.'
- name: layer_wise_density_variation
  kind: measured
  via: null
  systematic_bias: "capillary density varies systematically by cortical layer, which means the neurovascular\
    \ coupling that BOLD depends on is laminar -- directly relevant to \xA717"
  band_hz:
  - null
  - null
absent:
- bytes_here
- spatial_maps
- individual_variation
- in_vivo_measurement
- inter_study_agreement
use:
- calibrate
- prior
forbidden:
- capillary-density-statistics/* -> spatially resolved measured geometry
- capillary-density-statistics/* -> observation-role likelihoods
split:
  group_by:
  - participant
  notes: 'a template or atlas: it is held out of nothing and must be trusted for nothing on its own'
